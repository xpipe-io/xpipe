recentSearchesDescriptionTypes=<loại>, ví dụ: "$CONTENT$"
recentSearchesDescriptionState=<state>, ví dụ: "$CONTENT$"
recentSearchesDescriptionJoin=<s1>, <s2> được nối với nhau bằng dấu phẩy
recentQuickConnections=Các kết nối nhanh gần đây
recentQuickConnectionsDescription=Kết nối nhanh qua chuỗi ký tự
recentUrls=Các URL gần đây
recentUrlsDescription=Kết nối nhanh qua URL
editContainerUnitFile=Chỉnh sửa tệp đơn vị container
clipboardNoticeTitle=Mật khẩu đã được sao chép
clipboardNoticeContent=Vì ứng dụng mục tiêu không hỗ trợ việc nhập mật khẩu trực tiếp, nên mật khẩu của cậu đã được sao chép vào khay nhớ tạm để cậu dán vào. Trong tương lai, thao tác này sẽ được thực hiện tự động. Cậu có thể thấy biểu tượng khay nhớ tạm ở góc dưới bên phải màn hình.
sftpNoticeTitle=Chuyển file dung lượng lớn
sftpNoticeContent=Các tệp mà cậu đang cố chuyển có dung lượng khá lớn. Phiên hiện tại đang sử dụng SSH thô, nên tốc độ truyền tải chưa được tối ưu nhất. Nếu cần tăng tốc độ truyền tải, cậu có thể thử mở một phiên SFTP đến hệ thống thông qua menu chuột phải trong trình duyệt tệp.
hideVaultEntryNames=Ẩn tên các mục trong Git Vault
hideVaultEntryNamesDescription=Loại bỏ tất cả tên kết nối và các thông tin khác khỏi các tệp README và thông điệp commit khi tính năng git sync được bật. Tùy chọn này giúp ngăn chặn việc ai đó có thể nhìn thấu cấu trúc của nội dung trong kho dữ liệu được mã hóa.
disableHardwareAcceleration=Tắt tính năng tăng tốc phần cứng
disableHardwareAccelerationDescription=Tính năng này sẽ vô hiệu hóa việc sử dụng card đồ họa để hiển thị và chỉ dùng quy trình hiển thị bằng phần mềm thôi.\n\nĐiều này sẽ làm giảm hiệu suất đáng kể, nhưng có thể là cách duy nhất để hiển thị nếu gặp vấn đề với trình điều khiển card đồ họa.
disableRdpWindowsSecurityWarning=Tắt cảnh báo bảo mật RDP
disableRdpWindowsSecurityWarningDescription=Đừng hiển thị cảnh báo mới của Windows về các tệp .rdp chưa được ký mỗi khi khởi chạy một phiên mới.\n\nThao tác này sẽ thay đổi khóa đăng ký để đưa máy khách RDP của Windows trở lại cách hoạt động cũ. Hành động này sẽ hiển thị cửa sổ bật lên yêu cầu quyền quản trị viên.
rdpWindowsSecurityWarningDialogTitle=Các cảnh báo bảo mật RDP
rdpWindowsSecurityWarningDialogContent=Kể từ phiên bản Windows 26200, Windows sẽ luôn hiển thị cảnh báo khi một tệp RDP không được ký được khởi chạy, bất kể nội dung của tệp đó là gì.\n\nCậu có thể tắt cảnh báo này trong menu cài đặt.
openSettings=Mở cài đặt
openSettingsDescription=Chuyển đến mục cài đặt tương ứng
toggleSizeLock=Bật/tắt khóa kích thước
useExternalNetcatForProxies=Sử dụng tệp thực thi netcat được cài đặt bên ngoài cho các máy chủ proxy
useExternalNetcatForProxiesDescription=Nếu có thể, hãy dùng tệp thực thi netcat đã cài đặt trên máy để làm proxy cho các kết nối SSH thay vì dùng tính năng proxy có sẵn. Để làm được điều này, cậu cần cài đặt ncat trên Windows và nc trên các hệ điều hành khác.
networkProxy.displayName=Proxy HTTP/SOCKS
networkProxy.displayDescription=Cấu hình máy chủ proxy HTTP/SOCKS để dùng làm cổng kết nối
networkProxyType=Loại proxy
networkProxyTypeDescription=Giao thức của máy chủ proxy
networkProxyHost=Máy chủ
networkProxyHostDescription=Máy chủ mà máy chủ proxy đang chạy trên đó
networkProxyPort=Cổng
networkProxyPortDescription=Cổng mà máy chủ proxy đang lắng nghe
networkProxyUsername=Tên người dùng
networkProxyUsernameDescription=Tên người dùng để đăng nhập vào máy chủ proxy nếu cần xác thực
networkProxyPassword=Mật khẩu
networkProxyPasswordDescription=Mật khẩu để đăng nhập vào máy chủ proxy nếu cần xác thực
httpProxy=Proxy HTTP
httpProxyDescription=Proxy sẽ được sử dụng cho mọi loại yêu cầu HTTP do XPipe và các công cụ bên ngoài khác gửi đi.\n\nNếu proxy giải mã lưu lượng TLS, cậu sẽ được nhắc thêm bất kỳ chứng chỉ tùy chỉnh nào vào kho chứng chỉ nội bộ của XPipe ngay khi kết nối được thiết lập. Cậu có thể nhấn nút kiểm tra để xác minh kết nối.
httpProxyConfiguration=Cấu hình proxy HTTP
addProxy=Thêm proxy ...
httpProxyError=Cấu hình cài đặt proxy HTTP
httpProxyErrorDescription=Thêm thông tin xác thực proxy HTTP trong menu cài đặt
systemDefault=Mặc định của hệ thống
hardwareSecurityKey=Khóa bảo mật phần cứng (PKCS#11)
macOsKeychain=keychain trên macOS
customLibrary=Thư viện tùy chỉnh
unsyncedIdentityTitle=ID chưa được đồng bộ
unsyncedIdentityContent=Kết nối này được đánh dấu để đồng bộ trên nhiều hệ thống, nhưng danh tính mà cậu đã chọn chỉ có hiệu lực cục bộ. Điều này sẽ dẫn đến việc thiếu danh tính trên các hệ thống khác.\n\nCậu có thể chuyển đổi danh tính cục bộ này thành danh tính đồng bộ, hoặc chuyển đổi nó thành danh tính đa năng để chuyển đổi giữa nhiều danh tính cục bộ trên mỗi hệ thống được đồng bộ.
rdpDock=Ghim cửa sổ
rdpDockDescription=Nếu bật tính năng này, bất kỳ cửa sổ RDP nào đang mở sẽ được gắn vào cửa sổ máy tính từ xa có tab tích hợp sẵn.
reloadSizes=Kết nối lại để thay đổi kích thước
