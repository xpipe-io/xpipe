onePasswordManagerAccount=Ghi đè tài khoản
onePasswordManagerAccountDescription=Địa chỉ email hoặc ID người dùng cụ thể của tài khoản 1Password cần sử dụng trong trường hợp có nhiều tài khoản đã được đăng ký. Nếu không thiết lập, hệ thống sẽ tự động chọn tài khoản đầu tiên có sẵn.
hashicorpVaultAddress=Địa chỉ kho
hashicorpVaultAddressDescription=URL để truy cập cụm máy chủ của cậu tại
hashicorpVaultNamespace=Không gian tên Vault
hashicorpVaultNamespaceDescription=Không gian tên cần dùng khi truy cập kho dữ liệu. Nếu để trống, thông tin về không gian tên sẽ không được truyền đi.
hashicorpVaultSignerMount=Gắn công cụ quản lý khóa bí mật SSH
hashicorpVaultSignerMountDescription=Ghi đè đường dẫn mặc định nơi mô-đun bí mật SSH được gắn vào
hashicorpVaultAuthType=Xác thực Vault
hashicorpVaultAuthTypeDescription=Cách xác thực để truy cập kho dữ liệu. Tớ khuyên cậu nên dùng cài đặt mặc định là xác thực qua CLI của kho dữ liệu, nhất là khi cậu dùng các phương thức xác thực không được liệt kê rõ ràng ở đây.
hashicorpVaultAuthAppRole=AppRole
hashicorpVaultAuthToken=Token
hashicorpVaultAuthExisting=Sử dụng CLI của Vault
hashicorpVaultRoleId=RoleID
hashicorpVaultRoleIdDescription=UUID của AppRole
hashicorpVaultSecretId=SecretID
hashicorpVaultSecretIdDescription=Bí mật khớp của AppRole
hashicorpVaultToken=Token
hashicorpVaultTokenDescription=Mã xác thực cần sử dụng
hashicorpVaultMapping=Cài đặt mặc định cho phím
hashicorpVaultMappingDescription=Về cơ bản, kho dữ liệu này có thể lưu trữ bất kỳ dữ liệu mã hóa nào dưới dạng các mục khóa-giá trị, vì vậy cậu sẽ phải định nghĩa một bản ánh xạ để XPipe có thể tìm thấy các mục riêng lẻ như tên người dùng, mật khẩu và khóa SSH dựa trên các khóa đó. Bản ánh xạ mặc định có thể được ghi đè bởi từng tài khoản khi cần thiết.
passwordManagerUsernameMapping=Tên người dùng
passwordManagerPasswordMapping=Mật khẩu
passwordManagerPrivateKeyMapping=Khóa riêng SSH
passwordManagerPublicKeyMapping=Khóa công khai SSH
recentSearches=Các tìm kiếm gần đây
recentSearchesDescription=Bộ lọc các thuộc tính kết nối
