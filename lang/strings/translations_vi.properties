iconSources=Nguồn hình ảnh biểu tượng
iconSourcesDescription=Tớ có thể thêm các nguồn biểu tượng của riêng mình vào đây. XPipe sẽ tự động nhận diện các tệp .svg tại vị trí đã thêm và đưa chúng vào bộ biểu tượng có sẵn.\n\nCả thư mục cục bộ lẫn kho lưu trữ git từ xa đều được hỗ trợ làm vị trí lưu trữ biểu tượng.
