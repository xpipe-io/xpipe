limitedTouchscreenModeDescription=Khi dùng ứng dụng này trên các giao diện màn hình cảm ứng đặc biệt hơn, như màn hình điện thoại chẳng hạn, một số menu có thể không hoạt động đúng cách. Khi bật tùy chọn này, cách thực hiện menu sẽ sử dụng các chức năng hạn chế hơn để xử lý các sự kiện chuột/cảm ứng được gửi thưa thớt.
