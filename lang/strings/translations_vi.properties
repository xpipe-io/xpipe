clearUserDataContent=Thao tác này sẽ xóa toàn bộ dữ liệu người dùng cục bộ của xpipe và khởi động lại ứng dụng. Nếu cậu quan tâm đến các kết nối của mình, hãy nhớ đồng bộ hóa chúng với kho lưu trữ Git trước nhé.
