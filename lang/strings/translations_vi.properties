multiIdentity.displayDescription=Chọn từ nhiều danh tính khác nhau để kết nối với hệ thống
multiIdentityList=Danh sách nhận dạng
multiIdentityListDescription=Danh sách các danh tính để chuyển đổi giữa các tài khoản
