apiKey=Khóa API
apiKeyDescription=Khóa API dùng để xác thực các yêu cầu API của daemon XPipe. Để biết thêm thông tin về cách xác thực, hãy xem tài liệu API chung nhé.
disableApiAuthentication=Tắt xác thực API
disableApiAuthenticationDescription=Tính năng này sẽ vô hiệu hóa tất cả các phương thức xác thực bắt buộc để đảm bảo mọi yêu cầu chưa được xác thực đều được xử lý.\n\nChỉ nên tắt tính năng xác thực khi đang phát triển ứng dụng thôi nhé.
api=API
storeIntroImportContent=Cậu đã dùng XPipe trên hệ thống khác rồi à? Hãy đồng bộ các kết nối hiện có của cậu trên nhiều hệ thống thông qua một kho lưu trữ git từ xa nhé. Nếu chưa thiết lập xong, cậu cũng có thể đồng bộ lại bất cứ lúc nào sau này.
storeIntroImportButton=Kết nối đồng bộ...
storeIntroImportHeader=Nhập kết nối
showNonRunningChildren=Hiển thị các hệ thống không đang hoạt động
httpApi=API HTTP
isOnlySupportedLimit=chỉ được hỗ trợ với giấy phép chuyên nghiệp khi có hơn $COUNT$ kết nối
areOnlySupportedLimit=chỉ được hỗ trợ với giấy phép chuyên nghiệp khi có hơn $COUNT$ kết nối
enabled=Đã bật
copyId=Sao chép ID API
requireDoubleClickForConnections=Yêu cầu nhấp đúp để kết nối
requireDoubleClickForConnectionsDescription=Nếu tính năng này được bật, cậu sẽ phải nhấp đúp vào các kết nối để khởi chạy chúng. Tính năng này rất hữu ích nếu cậu đã quen với việc nhấp đúp vào các mục.
clearTransferDescription=Hủy chọn
selectTab=Chọn tab
closeTab=Đóng tab
closeOtherTabs=Đóng các tab khác đi nhé
closeAllTabs=Đóng tất cả các tab
closeLeftTabs=Đóng các tab ở bên trái
closeRightTabs=Đóng các tab ở bên phải
addSerial=Nối tiếp ...
connect=Kết nối
quickConnect=Kết nối nhanh
workspaces=Không gian làm việc
manageWorkspaces=Quản lý không gian làm việc
addWorkspace=Thêm không gian làm việc ...
addWorkspaceDescription=Mở hộp thoại tạo không gian làm việc mới
workspaceManagement=Quản lý không gian làm việc
workspaceManagementDescription=Các không gian làm việc là những cấu hình riêng biệt để chạy XPipe. Mỗi không gian làm việc đều có một thư mục dữ liệu, nơi lưu trữ tất cả dữ liệu tại máy. Điều này bao gồm dữ liệu kết nối, cài đặt và nhiều thứ khác nữa.\n\nNếu cậu sử dụng tính năng đồng bộ hóa, cậu cũng có thể chọn đồng bộ hóa từng không gian làm việc với một kho lưu trữ Git khác nhau.
workspaceName=Tên không gian làm việc
workspaceNameDescription=Tên hiển thị của không gian làm việc
workspacePath=Đường dẫn đến không gian làm việc
workspacePathDescription=Vị trí của thư mục dữ liệu không gian làm việc
workspaceCreationAlertTitle=Tạo không gian làm việc
developerForceSshTty=Buộc sử dụng SSH TTY
developerForceSshTtyDescription=Hãy thiết lập sao cho tất cả các kết nối SSH đều phân bổ một pty để kiểm tra xem hệ thống có hỗ trợ stderr và pty hay không.
developerDisableSshTunnelGateways=Tắt tính năng tạo đường hầm qua cổng SSH
developerDisableSshTunnelGatewaysDescription=Đừng dùng các phiên kết nối đường hầm cho các cổng mà hãy kết nối trực tiếp với hệ thống nhé.
ttyWarning=Kết nối này đã ép buộc phân bổ một pty/tty và không cung cấp luồng stderr riêng biệt.\n\nĐiều này có thể dẫn đến một số vấn đề.\n\nNếu có thể, cậu hãy thử xem xét cách để lệnh kết nối không phân bổ pty nhé.
xshellSetup=Cài đặt Xshell
termiusSetup=Cài đặt Termius
tryPtbDescription=Hãy thử nghiệm các tính năng mới ngay từ sớm trong các bản dựng dành cho nhà phát triển của XPipe
confirmVaultUnencryptTitle=Xác nhận giải mã kho dữ liệu
confirmVaultUnencryptContent=Cậu có thực sự muốn tắt tính năng mã hóa nâng cao cho kho dữ liệu không? Thao tác này sẽ loại bỏ lớp mã hóa bổ sung cho dữ liệu được lưu trữ và sẽ ghi đè lên dữ liệu hiện có.
enableHttpApi=Kích hoạt API HTTP
enableHttpApiDescription=Kích hoạt API, cho phép các chương trình bên ngoài gọi daemon XPipe để thực hiện các thao tác với các kết nối được quản lý của cậu.
chooseCustomIcon=Chọn biểu tượng tùy chỉnh
gitVault=Git vault
fileBrowser=Trình duyệt tệp
confirmAllDeletions=Xác nhận tất cả các thao tác xóa
confirmAllDeletionsDescription=Có hiển thị hộp thoại xác nhận cho tất cả các thao tác xóa hay không. Theo mặc định, chỉ các thư mục mới yêu cầu xác nhận.
yesterday=Hôm qua
green=Màu xanh lá
yellow=Màu vàng
blue=Màu xanh
red=Màu đỏ
cyan=Màu lục lam
purple=Màu tím
asktextAlertTitle=Lời nhắc
fileWriteSudoTitle=Viết tệp bằng lệnh sudo
fileWriteSudoContent=Tệp mà cậu đang cố ghi không cấp quyền ghi cho tài khoản của cậu. Cậu có muốn ghi tệp này với tư cách root bằng sudo không? Thao tác này sẽ tự động nâng quyền lên root bằng thông tin đăng nhập hiện có hoặc thông qua lời nhắc.
dontAllowTerminalRestart=Không cho phép khởi động lại thiết bị đầu cuối
dontAllowTerminalRestartDescription=Theo mặc định, các phiên terminal có thể được khởi động lại sau khi kết thúc ngay từ bên trong terminal. Để cho phép điều này, XPipe sẽ chấp nhận các yêu cầu bên ngoài từ terminal nhằm khởi động lại phiên\n\nXPipe không kiểm soát được terminal cũng như nguồn gốc của lệnh gọi này, nên các ứng dụng cục bộ độc hại cũng có thể lợi dụng tính năng này để thiết lập kết nối qua XPipe. Tắt tính năng này sẽ ngăn chặn tình huống trên.
openDocumentation=Mở tài liệu
openDocumentationDescription=Hãy ghé trang tài liệu XPipe để tìm hiểu thêm về vấn đề này
renameAll=Đổi tên tất cả
logging=Ghi nhật ký
enableTerminalLogging=Bật tính năng ghi nhật ký thiết bị đầu cuối
enableTerminalLoggingDescription=Tính năng này cho phép ghi nhật ký phía máy khách cho tất cả các phiên làm việc trên terminal. Tất cả các dữ liệu đầu vào và đầu ra của phiên làm việc trên terminal đều được ghi vào tệp nhật ký phiên. Lưu ý rằng bất kỳ thông tin nhạy cảm nào như lời nhắc nhập mật khẩu sẽ không được ghi lại.
terminalLoggingDirectory=Nhật ký phiên làm việc trên thiết bị đầu cuối
terminalLoggingDirectoryDescription=Tất cả các bản ghi đều được lưu trữ trong thư mục dữ liệu XPipe trên hệ thống cục bộ của cậu.
openSessionLogs=Mở nhật ký phiên làm việc
sessionLogging=Ghi nhật ký thiết bị đầu cuối
sessionActive=Hiện có một phiên làm việc nền đang chạy cho kết nối này.\n\nĐể dừng phiên này theo cách thủ công, hãy nhấp vào biểu tượng trạng thái.
skipValidation=Bỏ qua xác thực
scriptsIntroHeader=Giới thiệu về các tập lệnh
scriptsIntroContent=Cậu có thể chạy các tập lệnh khi khởi động shell, trong trình duyệt tệp và theo yêu cầu. Cậu có thể tự tạo các tập lệnh ngay trong XPipe hoặc nhập các tập lệnh có sẵn từ hệ thống cục bộ hoặc từ một kho lưu trữ git từ xa.
scriptsIntroBottomHeader=Sử dụng tập lệnh
scriptsIntroBottomContent=Có rất nhiều mẫu kịch bản để cậu bắt đầu. Cậu có thể nhấp vào nút chỉnh sửa của từng kịch bản để xem cách chúng được triển khai. Trước tiên, các kịch bản phải được bật mới có thể chạy và hiển thị trong menu; mỗi kịch bản đều có một nút bật/tắt dành cho việc này.
scriptsIntroBottomButton=Bắt đầu nào
scriptSourcesIntroHeader=Nguồn mã
scriptSourcesIntroContent=Cậu có thể thêm các nguồn tập lệnh tùy chỉnh để truy cập ngay vào toàn bộ bộ sưu tập các tập lệnh shell. Cả nguồn cục bộ lẫn kho git từ xa đều được hỗ trợ làm nguồn. Tất cả các tập lệnh được phát hiện từ nguồn sẽ tự động có sẵn.
scriptSourcesIntroButton=Thêm nguồn ...
checkForSecurityUpdates=Kiểm tra các bản cập nhật bảo mật
checkForSecurityUpdatesDescription=XPipe có thể kiểm tra các bản cập nhật bảo mật tiềm năng một cách riêng biệt so với các bản cập nhật tính năng thông thường. Khi tính năng này được bật, ít nhất các bản cập nhật bảo mật quan trọng sẽ được đề xuất cài đặt ngay cả khi tính năng kiểm tra cập nhật thông thường bị tắt.\n\nViệc tắt cài đặt này sẽ khiến ứng dụng không thực hiện bất kỳ yêu cầu phiên bản bên ngoài nào, và cậu sẽ không nhận được thông báo về bất kỳ bản cập nhật bảo mật nào.
clickToDock=Nhấp để gắn thiết bị đầu cuối
terminalStarting=Đang chờ khởi động thiết bị đầu cuối...
pinTab=Tab Ghim
unpinTab=Bỏ ghim tab
pinned=Đã ghim
enableConnectionHubTerminalDocking=Ghim cửa sổ terminal vào trung tâm kết nối
enableConnectionHubTerminalDockingDescription=Cậu có thể ghim các cửa sổ terminal vào cửa sổ ứng dụng XPipe trong trung tâm kết nối để mô phỏng một terminal tích hợp một phần. Sau đó, các cửa sổ terminal sẽ được XPipe quản lý để luôn vừa vặn với khu vực ghim.
enableFileBrowserTerminalDocking=Bật tính năng gắn trình duyệt tệp vào thanh công cụ
enableFileBrowserTerminalDockingDescription=Cậu có thể ghim các cửa sổ terminal vào cửa sổ ứng dụng XPipe trong trình duyệt tệp để mô phỏng một terminal tích hợp một phần. Sau đó, các cửa sổ terminal sẽ được XPipe quản lý để luôn vừa vặn với thanh ghim.
downloadsDirectory=Thư mục tải xuống tùy chỉnh
downloadsDirectoryDescription=Thư mục tùy chỉnh để lưu các tệp đã tải xuống khi nhấp vào nút "Chuyển đến thư mục Tải xuống". Theo mặc định, XPipe sẽ sử dụng thư mục Tải xuống của người dùng.
pinLocalMachineOnStartup=Ghim tab "Máy tính cục bộ" khi khởi động
pinLocalMachineOnStartupDescription=Tự động mở tab máy tính cục bộ và ghim tab đó lại. Tính năng này rất hữu ích nếu cậu thường xuyên sử dụng trình duyệt tệp chia đôi với cả máy tính cục bộ và hệ thống tệp từ xa đang mở.
terminalErrorDescription=Lỗi này rất nghiêm trọng và XPipe không thể tiếp tục hoạt động nếu không khắc phục được.
groupName=Tên nhóm
chmodPermissions=Quyền truy cập mới
editFilesWithDoubleClick=Chỉnh sửa tệp bằng cách nhấp đúp
editFilesWithDoubleClickDescription=Khi tính năng này được bật, việc nhấp đúp vào các tệp sẽ mở trực tiếp chúng trong trình soạn thảo văn bản của cậu thay vì hiển thị menu ngữ cảnh.
censorMode=Chế độ kiểm duyệt
censorModeDescription=Sẽ làm mờ bất kỳ thông tin nào như tên máy chủ, tên người dùng, tên kết nối và các thông tin khác.\n\nTính năng này rất hữu ích nếu cậu định chụp màn hình hoặc chia sẻ màn hình XPipe mà không muốn để lộ bất kỳ thông tin nào.
addIdentity=Thông tin nhận dạng ...
identities=Thông tin nhận dạng
addMacro=Hành động ...
identitiesIntroHeader=Về danh tính
identitiesIntroContent=Nếu cậu đang tái sử dụng các tổ hợp tên người dùng, mật khẩu và khóa phổ biến, việc tạo các danh tính có thể tái sử dụng sẽ rất hữu ích. Điều này giúp cậu dễ dàng truy cập chúng khi thêm các kết nối mới.
identitiesIntroBottomHeader=Chia sẻ danh tính
identitiesIntroBottomContent=Cậu có thể thêm thông tin nhận dạng tại máy hoặc đồng bộ chúng lên kho lưu trữ Git khi tính năng này được bật. Điều này cho phép chia sẻ có chọn lọc thông tin nhận dạng giữa nhiều hệ thống và với các thành viên khác trong nhóm.
identitiesIntroBottomButton=Cài đặt đồng bộ
identitiesIntroButton=Tạo danh tính
userName=Tên người dùng
vaultAuth=Mật mã hóa kho mặc định
userAuth=Mật khẩu cá nhân của người dùng
roleAuth=Kiểm soát truy cập dựa trên vai trò
team=Nhóm
teamSettings=Cài đặt nhóm
teamVaults=Kho lưu trữ của nhóm
vaultTypeNameDefault=Kho mặc định
vaultTypeNamePersonal=Kho lưu trữ cá nhân
vaultTypeNameTeam=Kho dữ liệu của nhóm
teamVaultsDescription=Kho dữ liệu nhóm cho phép nhiều người dùng và vai trò truy cập an toàn vào một kho dữ liệu chung. Cậu có thể cấu hình các kết nối và danh tính để chia sẻ cho tất cả người dùng hoặc chỉ dành riêng cho từng người dùng và vai trò cụ thể bằng cách mã hóa chúng bằng khóa riêng của họ. Các người dùng khác trong kho dữ liệu sẽ không thể truy cập các kết nối và thông tin xác thực cá nhân cũng như dựa trên vai trò nếu họ không có quyền truy cập vào khóa đó.
vaultTypeContentDefault=Hiện tại cậu đang dùng một kho dữ liệu mặc định, chưa có người dùng cũng như chưa thiết lập cụm mật khẩu tùy chỉnh. Các thông tin bí mật được mã hóa bằng khóa kho dữ liệu cục bộ.\n\nCậu có thể nâng cấp lên kho dữ liệu cá nhân bằng cách tạo tài khoản người dùng cho kho dữ liệu. Điều này cho phép cậu mã hóa các thông tin bí mật trong kho bằng mật khẩu cá nhân của riêng mình, mà cậu phải nhập mỗi lần đăng nhập để mở khóa kho dữ liệu.
vaultTypeContentPersonal=Hiện tại cậu đang dùng một kho lưu trữ cá nhân cho tài khoản của mình. Các thông tin bí mật được mã hóa bằng mật khẩu cá nhân của cậu.
vaultTypeContentTeam=Hiện tại cậu đang dùng một kho dữ liệu nhóm, cho phép nhiều người dùng truy cập an toàn vào một kho dữ liệu chung. Cậu có thể cấu hình các kết nối và danh tính để chia sẻ cho tất cả người dùng hoặc chỉ dành riêng cho tài khoản cá nhân hoặc vai trò của cậu bằng cách mã hóa chúng bằng khóa cá nhân hoặc khóa vai trò của cậu. Các người dùng khác trong kho dữ liệu sẽ không thể truy cập các kết nối và danh tính cá nhân cũng như dựa trên vai trò của cậu nếu họ không có quyền truy cập vào khóa đó.
roleManagement=Quản lý vai trò
roleManagementEmpty=Quản lý vai trò
roleManagementDescription=Quản lý các vai trò kho dữ liệu hiện có hoặc tạo vai trò mới. Mỗi vai trò kho dữ liệu đều có khóa bí mật riêng, được dùng để mã hóa các kết nối và danh tính – những thông tin này chỉ dành riêng cho vai trò đó mà thôi, không ai khác được tiếp cận.
roleManagementEmptyDescription=Quản lý các vai trò kho dữ liệu hiện có hoặc tạo vai trò mới. Mỗi vai trò kho dữ liệu đều có khóa bí mật riêng, được dùng để mã hóa các kết nối và danh tính mà chỉ vai trò đó mới được truy cập, còn những vai trò khác thì không.\n\nTài khoản dựa trên vai trò cho nhóm được hỗ trợ trong gói chuyên nghiệp.
userManagement=Quản lý người dùng
userManagementEmpty=Quản lý người dùng
userManagementDescription=Quản lý tài khoản kho dữ liệu hiện có của cậu hoặc tạo một tài khoản mới. Mỗi tài khoản kho dữ liệu đều có mật khẩu riêng, được dùng để mã hóa kết nối và xác thực danh tính.
userManagementEmptyDescription=Quản lý tài khoản Vault hiện có của cậu hoặc tạo một tài khoản mới. Mỗi tài khoản Vault đều có mật khẩu riêng để mã hóa kết nối và danh tính. Hãy tạo một tài khoản cho chính mình để có thể mã hóa kết nối và danh tính bằng khóa cá nhân của cậu.
userIntroHeader=Quản lý người dùng
userIntroContent=Hãy tạo tài khoản người dùng đầu tiên cho chính mình để bắt đầu nhé. Điều này giúp cậu có thể khóa không gian làm việc này bằng mật khẩu.
addReusableIdentity=Thêm danh tính có thể tái sử dụng
users=Người dùng
syncVault=Đồng bộ hóa kho dữ liệu
syncVaultDescription=Để đồng bộ hóa kho dữ liệu của cậu trên nhiều hệ thống, hãy bật tính năng đồng bộ hóa git cho kho dữ liệu này nhé.
enableGitSync=Bật tính năng đồng bộ hóa git
browseVault=Dữ liệu trong kho
browseVaultDescription=Cậu có thể tự mình xem thư mục vault trong trình quản lý tệp của máy. Lưu ý là không nên chỉnh sửa từ bên ngoài vì điều này có thể gây ra nhiều vấn đề khác nhau.
browseVaultButton=Duyệt kho dữ liệu
vaultUsers=Người dùng Vault
createHeapDump=Tạo bản sao bộ nhớ heap
createHeapDumpDescription=Xuất nội dung bộ nhớ ra tệp để khắc phục sự cố liên quan đến việc sử dụng bộ nhớ
initializingApp=Đang tải các kết nối
checkingLicense=Kiểm tra giấy phép
loadingGit=Đồng bộ hóa với kho git
loadingGpg=Khởi động daemon GnuPG cho git
loadingSettings=Đang tải cài đặt
loadingConnections=Đang tải các kết nối
unlockingVault=Mở khóa kho
loadingUserInterface=Đang tải giao diện người dùng
ptbNotice=Thông báo về bản thử nghiệm công khai
userDeletionTitle=Xóa người dùng
userDeletionContent=Cậu có muốn xóa người dùng kho này không? Thao tác này sẽ mã hóa lại toàn bộ dữ liệu bằng khóa kho mặc định. Quá trình này sẽ mất một lúc đấy.
roleDeletionTitle=Xóa vai trò
roleDeletionContent=Cậu có muốn xóa vai trò kho an toàn này không? Thao tác này sẽ mã hóa lại tất cả các danh tính và thông tin bí mật kết nối sử dụng vai trò này. Bất kỳ mục nào trước đây chỉ vai trò này mới truy cập được sẽ trở nên khả dụng cho tất cả các vai trò. Quá trình này sẽ mất một chút thời gian.
