rdpClient=Ứng dụng khách RDP
rdpClientDescription=Chương trình khách RDP cần gọi khi thiết lập kết nối RDP.\n\nLưu ý rằng các chương trình khách khác nhau sẽ có mức độ khả năng và tích hợp khác nhau. Một số chương trình khách không hỗ trợ tự động điền mật khẩu, nên cậu vẫn phải nhập mật khẩu khi khởi chạy.
localShell=Vỏ lệnh cục bộ
themeDescription=Chủ đề hiển thị mà cậu thích.
dontAutomaticallyStartVmSshServer=Đừng tự động khởi động máy chủ SSH cho các máy ảo khi cần thiết
dontAutomaticallyStartVmSshServerDescription=Mọi kết nối shell đến máy ảo (VM) đang chạy trên hypervisor đều được thực hiện qua SSH. XPipe có thể tự động khởi động máy chủ SSH đã cài đặt khi cần thiết. Nếu cậu không muốn điều này vì lý do bảo mật, thì chỉ cần tắt tính năng này bằng tùy chọn này là được.
confirmGitShareTitle=Đồng bộ hóa Git
confirmGitShareContent=Cậu có muốn thêm tệp đã chọn vào kho lưu trữ Git Vault của mình không? Thao tác này sẽ sao chép một phiên bản được mã hóa của tệp vào Git Vault và ghi lại các thay đổi của cậu. Sau đó, cậu sẽ có thể truy cập tệp này trên tất cả các máy tính để bàn đã đồng bộ hóa.
gitShareFileTooltip=Thêm tệp vào thư mục dữ liệu của git vault để tệp đó được đồng bộ hóa tự động.\n\nTính năng này chỉ có thể sử dụng khi git vault đã được bật trong phần cài đặt.
performanceMode=Chế độ hiệu suất
performanceModeDescription=Tắt tất cả các hiệu ứng hình ảnh không cần thiết để cải thiện hiệu suất ứng dụng.
dontAcceptNewHostKeys=Đừng tự động chấp nhận các khóa máy chủ SSH mới
dontAcceptNewHostKeysDescription=Theo mặc định, XPipe sẽ tự động chấp nhận các khóa máy chủ từ những hệ thống mà client SSH của cậu chưa lưu sẵn bất kỳ khóa máy chủ nào. Tuy nhiên, nếu có bất kỳ khóa máy chủ nào đã biết bị thay đổi, nó sẽ từ chối kết nối trừ khi cậu chấp nhận khóa mới.\n\nViệc tắt tính năng này cho phép cậu kiểm tra tất cả các khóa máy chủ, ngay cả khi ban đầu không có xung đột nào xảy ra.
uiScale=Tỷ lệ giao diện người dùng
uiScaleDescription=Một giá trị tỷ lệ tùy chỉnh mà cậu có thể thiết lập độc lập với tỷ lệ hiển thị chung của hệ thống. Các giá trị được tính bằng phần trăm, ví dụ: giá trị 150 sẽ dẫn đến tỷ lệ giao diện người dùng là 150%.
editorProgram=Chương trình soạn thảo
editorProgramDescription=Trình soạn thảo văn bản mặc định dùng để chỉnh sửa mọi loại dữ liệu văn bản.
windowOpacity=Độ mờ của cửa sổ
windowOpacityDescription=Thay đổi độ mờ của cửa sổ để theo dõi những gì đang diễn ra ở nền.
useSystemFont=Dùng phông chữ mặc định của hệ thống
openDataDir=Thư mục dữ liệu Vault
openDataDirButton=Thư mục dữ liệu mở
openDataDirDescription=Nếu cậu muốn đồng bộ thêm các tệp khác, chẳng hạn như khóa SSH, giữa các hệ thống với kho lưu trữ Git của mình, cậu có thể đặt chúng vào thư mục dữ liệu lưu trữ. Đường dẫn của bất kỳ tệp nào được tham chiếu ở đó sẽ tự động được điều chỉnh trên mọi hệ thống được đồng bộ.
updates=Cập nhật
selectAll=Chọn tất cả
advanced=Nâng cao
thirdParty=Thông báo về mã nguồn mở
eulaDescription=Hãy đọc Thỏa thuận Cấp phép Người dùng Cuối (EULA) cho ứng dụng XPipe
thirdPartyDescription=Xem các giấy phép mã nguồn mở của các thư viện bên thứ ba
enableGitStorage=Bật tính năng đồng bộ hóa
gitSync=Đồng bộ hóa Git
enableGitStorageDescription=Khi bật tính năng này, XPipe sẽ khởi tạo một kho lưu trữ git cho kho dữ liệu cục bộ và ghi lại mọi thay đổi vào đó. Lưu ý là tính năng này yêu cầu phải cài đặt git và có thể làm chậm các thao tác tải và lưu.\n\nBất kỳ danh mục nào cần đồng bộ đều phải được đánh dấu rõ ràng là đã đồng bộ.
storageGitRemote=URL đồng bộ từ xa
storageGitRemoteDescription=Khi được bật, XPipe sẽ tự động kéo (pull) mọi thay đổi khi tải và đẩy (push) mọi thay đổi lên kho lưu trữ từ xa khi lưu.\n\nĐiều này cho phép cậu chia sẻ kho lưu trữ của mình giữa nhiều bản cài đặt XPipe khác nhau. Tính năng này hỗ trợ các URL HTTP và SSH, cũng như các thư mục cục bộ.
vault=Kho
vaultAccess=Truy cập kho dữ liệu
workspaceLockDescription=Cho phép đặt mật khẩu tùy chỉnh để mã hóa mọi thông tin nhạy cảm được lưu trữ trong XPipe.\n\nĐiều này giúp tăng cường bảo mật vì nó tạo thêm một lớp mã hóa cho thông tin nhạy cảm của cậu. Sau đó, cậu sẽ được yêu cầu nhập mật khẩu khi XPipe khởi động.
useSystemFontDescription=Cho phép cậu chọn dùng phông chữ mặc định của hệ thống hay phông chữ Inter đi kèm với XPipe.
windowOptions=Tùy chọn cửa sổ
saveWindowLocation=Lưu vị trí cửa sổ
saveWindowLocationDescription=Tùy chọn này quyết định xem tọa độ cửa sổ có nên được lưu lại và khôi phục lại khi khởi động lại hay không.
startupShutdown=Khởi động / Tắt máy
showChildrenConnectionsInParentCategory=Hiển thị các danh mục con trong danh mục cha
showChildrenConnectionsInParentCategoryDescription=Liệu có nên hiển thị tất cả các kết nối nằm trong các danh mục con khi một danh mục cha cụ thể được chọn hay không.\n\nNếu tùy chọn này bị tắt, các danh mục sẽ hoạt động giống như các thư mục truyền thống, chỉ hiển thị nội dung trực tiếp của chúng mà không bao gồm các thư mục con.
condenseConnectionDisplay=Hiển thị kết nối cô đọng
condenseConnectionDisplayDescription=Hãy thiết kế sao cho mỗi kết nối cấp cao nhất chiếm ít không gian dọc hơn để danh sách kết nối được gọn gàng hơn.
openConnectionSearchWindowOnConnectionCreation=Mở cửa sổ tìm kiếm kết nối khi tạo kết nối
openConnectionSearchWindowOnConnectionCreationDescription=Có tự động mở cửa sổ tìm kiếm các kết nối con khả dụng khi thêm một kết nối shell mới hay không.
system=Hệ thống
application=Ứng dụng
storage=Lưu trữ
runOnStartup=Chạy khi khởi động
closeBehaviour=Hành vi khi thoát
closeBehaviourDescription=Điều khiển cách XPipe sẽ xử lý khi đóng cửa sổ chính.
language=Ngôn ngữ
languageDescription=Ngôn ngữ hiển thị sẽ được sử dụng. Các bản dịch được cải thiện nhờ sự đóng góp của cộng đồng. Cậu có thể góp phần vào công việc dịch thuật bằng cách gửi các bản sửa lỗi dịch thuật trên GitHub.
lightTheme=Chủ đề sáng
darkTheme=Chủ đề tối
exit=Thoát khỏi XPipe
continueInBackground=Tiếp tục chạy ngầm
minimizeToTray=Thu nhỏ xuống khay hệ thống
closeBehaviourAlertTitle=Cài đặt hành vi đóng
closeBehaviourAlertTitleHeader=Chọn hành động sẽ diễn ra khi đóng cửa sổ. Mọi kết nối đang hoạt động sẽ bị ngắt khi ứng dụng được tắt.
startupBehaviour=Hành vi khi khởi động
startupBehaviourDescription=Điều khiển hành vi mặc định của ứng dụng máy tính để bàn khi XPipe được khởi động.
clearCachesAlertTitle=Xóa bộ nhớ đệm
clearCachesAlertContent=Cậu có muốn xóa toàn bộ bộ nhớ đệm của XPipe không? Thao tác này sẽ xóa toàn bộ dữ liệu bộ nhớ đệm được lưu trữ nhằm cải thiện trải nghiệm người dùng.
startGui=Khởi động GUI
startInTray=Khởi động từ khay hệ thống
startInBackground=Khởi động ở chế độ nền
clearCaches=Xóa bộ nhớ đệm...
clearCachesDescription=Xóa toàn bộ dữ liệu bộ nhớ đệm
cancel=Hủy
notAnAbsolutePath=Không phải là đường dẫn tuyệt đối
notADirectory=Không phải là thư mục
notAnEmptyDirectory=Không phải là thư mục trống
automaticallyCheckForUpdates=Kiểm tra cập nhật
automaticallyCheckForUpdatesDescription=Khi bật tính năng này, thông tin về bản phát hành mới sẽ tự động được tải về sau một thời gian khi XPipe đang chạy. Cậu vẫn phải xác nhận rõ ràng việc cài đặt bất kỳ bản cập nhật nào.
developerMode=Chế độ nhà phát triển
developerModeDescription=Khi bật tính năng này, cậu sẽ có thể truy cập vào nhiều tùy chọn bổ sung hữu ích cho việc phát triển.
editor=Trình soạn thảo
custom=Tùy chỉnh
passwordManager=Trình quản lý mật khẩu
externalPasswordManager=Trình quản lý mật khẩu bên ngoài
passwordManagerDescription=Trình quản lý mật khẩu được cài đặt cục bộ để tích hợp.\n\nNếu cậu đã cài đặt trình quản lý mật khẩu, cậu có thể cấu hình XPipe để lấy các thông tin bí mật từ đó, nhờ vậy XPipe sẽ không phải tự quản lý các thông tin này.
passwordManagerTest=Thử nghiệm trình quản lý mật khẩu
passwordManagerTestDescription=Kiểm tra xem tính năng tích hợp trình quản lý mật khẩu có hoạt động đúng không nhé. Nhớ dùng đúng định dạng mã định danh để tham chiếu đến một mục trong trình quản lý mật khẩu.
preferTerminalTabs=Tớ thích mở tab mới hơn
preferTerminalTabsDescription=Tùy chọn này quyết định liệu XPipe có cố gắng mở các tab mới trong trình terminal mà cậu đã chọn thay vì mở cửa sổ mới hay không. Không phải trình terminal nào cũng hỗ trợ tab đâu nhé.
customRdpClientCommand=Lệnh tùy chỉnh
customRdpClientCommandDescription=Lệnh cần thực thi để khởi động trình khách RDP tùy chỉnh.\n\nChuỗi giữ chỗ $FILE sẽ được thay thế bằng tên tệp .rdp tuyệt đối được đặt trong dấu ngoặc kép khi lệnh được gọi. Nhớ đặt đường dẫn đến tệp thực thi trong dấu ngoặc kép nếu đường dẫn đó có chứa khoảng trắng nhé.
customEditorCommand=Lệnh tùy chỉnh trong trình soạn thảo
customEditorCommandDescription=Lệnh cần thực thi để khởi động trình soạn thảo tùy chỉnh.\n\nChuỗi giữ chỗ $FILE sẽ được thay thế bằng tên tệp tuyệt đối được đặt trong dấu ngoặc kép khi lệnh được gọi. Nhớ đặt đường dẫn đến tệp thực thi của trình soạn thảo trong dấu ngoặc kép nếu đường dẫn đó có chứa khoảng trắng nhé.
encryptAllVaultData=Mã hóa toàn bộ dữ liệu trong kho
encryptAllVaultDataDescription=Khi bật tính năng này, mọi phần của dữ liệu kết nối kho dữ liệu sẽ được mã hóa bằng khóa mã hóa kho dữ liệu của cậu, thay vì chỉ mã hóa các thông tin bí mật bên trong dữ liệu đó. Điều này bổ sung thêm một lớp bảo mật cho các tham số khác như tên người dùng, tên máy chủ, v.v., vốn không được mã hóa theo mặc định trong kho dữ liệu.\n\nTùy chọn này sẽ khiến lịch sử và bản so sánh (diff) của kho Git trở nên vô dụng vì cậu sẽ không thể xem được các thay đổi ban đầu nữa, mà chỉ thấy các thay đổi dưới dạng nhị phân thôi.
vaultSecurity=Bảo mật kho dữ liệu
developerDisableUpdateVersionCheck=Tắt tính năng kiểm tra phiên bản cập nhật
developerDisableUpdateVersionCheckDescription=Tùy chọn này quyết định liệu trình kiểm tra cập nhật có bỏ qua số phiên bản khi tìm kiếm bản cập nhật hay không.
shellCommandTest=Kiểm tra lệnh Shell
shellCommandTestDescription=Chạy một lệnh trong phiên shell được XPipe sử dụng nội bộ.
terminal=Thiết bị đầu cuối
terminalType=Trình giả lập thiết bị đầu cuối
terminalConfiguration=Cấu hình thiết bị đầu cuối
terminalCustomization=Tùy chỉnh thiết bị đầu cuối
editorConfiguration=Cài đặt trình soạn thảo
defaultApplication=Ứng dụng mặc định
initialSetup=Cài đặt ban đầu
terminalTypeDescription=Terminal mặc định được dùng để mở kết nối shell.\n\nMức độ hỗ trợ các tính năng khác nhau tùy theo từng terminal, và mỗi loại đều được đánh dấu là "được khuyến nghị" hoặc "không được khuyến nghị". Trải nghiệm của cậu sẽ tốt nhất khi dùng một terminal được khuyến nghị.
customTerminalCommand=Lệnh terminal tùy chỉnh
customTerminalCommandDescription=Lệnh cần thực thi để mở terminal tùy chỉnh với một lệnh cụ thể.\n\nXPipe sẽ tạo một tập lệnh shell khởi chạy tạm thời để terminal của cậu thực thi. Chuỗi giữ chỗ $CMD trong lệnh mà cậu cung cấp sẽ được thay thế bằng tập lệnh khởi chạy thực tế khi được gọi. Nhớ đặt dấu ngoặc kép cho đường dẫn đến tệp thực thi terminal nếu đường dẫn đó có chứa khoảng trắng nhé.
clearTerminalOnInit=Xóa màn hình khi khởi động
clearTerminalOnInitDescription=Khi được bật, XPipe sẽ chạy lệnh clear sau khi một phiên terminal mới được khởi chạy để xóa mọi kết quả hiển thị không cần thiết xuất hiện trong quá trình khởi động phiên terminal đó.
dontCachePasswords=Đừng lưu mật khẩu được yêu cầu vào bộ nhớ đệm
dontCachePasswordsDescription=Tùy chọn này quyết định liệu XPipe có lưu trữ mật khẩu đã được yêu cầu vào bộ nhớ đệm nội bộ hay không, để cậu không phải nhập lại chúng trong phiên làm việc hiện tại.\n\nNếu tính năng này bị tắt, cậu sẽ phải nhập lại thông tin đăng nhập mỗi khi hệ thống yêu cầu.
denyTempScriptCreation=Từ chối tạo tập lệnh tạm thời
denyTempScriptCreationDescription=Để thực hiện một số chức năng của mình, XPipe đôi khi sẽ tạo các tập lệnh shell tạm thời trên hệ thống đích nhằm giúp việc thực thi các lệnh đơn giản trở nên dễ dàng hơn. Những tập lệnh này không chứa bất kỳ thông tin nhạy cảm nào và chỉ được tạo ra cho mục đích triển khai thôi.\n\nNếu tắt tính năng này, XPipe sẽ không tạo bất kỳ tệp tạm thời nào trên hệ thống từ xa. Tùy chọn này rất hữu ích trong các môi trường bảo mật cao, nơi mọi thay đổi trên hệ thống tệp đều bị giám sát. Nếu tắt tính năng này, một số chức năng, ví dụ như môi trường shell và tập lệnh, sẽ không hoạt động như mong muốn.
disableCertutilUse=Tắt tính năng certutil trên Windows
useLocalFallbackShell=Sử dụng shell dự phòng cục bộ
useLocalFallbackShellDescription=Chuyển sang dùng một shell cục bộ khác để xử lý các thao tác cục bộ. Trên Windows thì đó là PowerShell, còn trên các hệ thống khác thì là Bourne shell.\n\nTùy chọn này có thể được dùng trong trường hợp shell cục bộ mặc định thông thường bị tắt hoặc gặp sự cố ở mức độ nào đó. Tuy nhiên, một số tính năng có thể không hoạt động như mong đợi khi tùy chọn này được bật.
disableCertutilUseDescription=Do một số hạn chế và lỗi trong cmd.exe, các tập lệnh shell tạm thời được tạo bằng certutil thông qua việc sử dụng nó để giải mã đầu vào base64, vì cmd.exe sẽ gặp sự cố khi gặp đầu vào không phải ASCII. XPipe cũng có thể dùng PowerShell cho việc này nhưng sẽ chậm hơn.\n\nTính năng này sẽ vô hiệu hóa mọi việc sử dụng certutil trên hệ thống Windows để thực hiện một số chức năng và thay vào đó sẽ chuyển sang dùng PowerShell. Điều này có thể làm hài lòng một số phần mềm diệt virus vì một số trong số chúng chặn việc sử dụng certutil.
