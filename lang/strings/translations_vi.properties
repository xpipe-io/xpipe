mcpAdditionalContextDescription=Các hướng dẫn bổ sung cần truyền cho client MCP. Dùng cái này để điều khiển hành vi của agent và cung cấp thêm bối cảnh cho cấu hình riêng của cậu.
mcpAdditionalContextSample=- Đừng tự động khởi động lại bất kỳ dịch vụ hay daemon nào mà chưa xác nhận trước\n- Khi cấu hình giao diện mạng, luôn dùng 192.168.1.1/24 làm cổng mạng
