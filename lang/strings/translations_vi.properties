iconSourceDeletionContent=Cậu có muốn xóa nguồn biểu tượng này cùng tất cả các biểu tượng liên quan đến nó không?
refreshIcons=Biểu tượng làm mới
refreshIconsDescription=Tải về, hiển thị và lưu vào bộ nhớ đệm tất cả hơn 1000 biểu tượng có sẵn từ các nguồn bên ngoài dưới dạng tệp .png. Quá trình này sẽ mất một lúc đấy...
refreshIconsIntro=Tải xuống các biểu tượng
refreshIconsIntroDescription=Tại đây, cậu có thể thiết lập các biểu tượng tùy chỉnh cho các kết nối của mình. Trước tiên, cậu cần tải xuống bộ biểu tượng mặc định. Cậu cũng có thể cấu hình các nguồn biểu tượng tùy chỉnh trong menu cài đặt.
vaultUserLegacy=Người dùng Vault (Chế độ tương thích cũ giới hạn)
upgradeInstructions=Hướng dẫn nâng cấp
externalActionTitle=Yêu cầu thực hiện hành động bên ngoài
externalActionContent=Có yêu cầu thực hiện một hành động từ bên ngoài. Cậu có muốn cho phép khởi chạy các hành động từ bên ngoài XPipe không?
noScriptStateAvailable=Làm mới để kiểm tra tính tương thích của tập lệnh ...
documentationDescription=Cậu hãy xem tài liệu hướng dẫn nhé
customEditorCommandInTerminal=Chạy lệnh tùy chỉnh trong terminal
customEditorCommandInTerminalDescription=Nếu trình soạn thảo của cậu chạy trên nền tảng terminal, cậu có thể bật tùy chọn này để tự động mở terminal và chạy lệnh trong phiên terminal thay thế.\n\nCậu có thể dùng tùy chọn này cho các trình soạn thảo như vi, vim, nvim và những trình soạn thảo khác.
disableHttpsTlsCheck=Tắt tính năng xác minh chứng chỉ yêu cầu HTTPS
disableHttpsTlsCheckDescription=Nếu tổ chức của cậu đang giải mã lưu lượng HTTPS trong tường lửa bằng tính năng chặn SSL, thì mọi yêu cầu HTTP sẽ không thành công trừ khi các chứng chỉ đó được tin cậy. Cậu có thể bật tùy chọn này và tắt tính năng xác thực chứng chỉ TLS để thử nghiệm nếu có vấn đề gì đó không hoạt động như mong đợi với các chứng chỉ tùy chỉnh.
noProxy=Không dùng proxy
noProxyDescription=Không sử dụng máy chủ proxy cho các địa chỉ trùng khớp với các giá trị sau đây
connectionsSelected=$NUMBER$ các kết nối đã chọn
addConnections=Thêm kết nối
browseDirectory=Duyệt thư mục
openTerminal=Mở terminal
documentation=Tài liệu hướng dẫn
report=Báo lỗi
keePassXcNotAssociated=Liên kết KeePassXC
keePassXcNotAssociatedDescription=XPipe hiện chưa được liên kết với cơ sở dữ liệu KeePassXC cục bộ của cậu. Nhấp vào bên dưới để thực hiện thao tác một lần nhằm liên kết XPipe với cơ sở dữ liệu KeePassXC, từ đó XPipe có thể truy vấn mật khẩu.
keePassXcAssociateMore=Kết nối thêm các cơ sở dữ liệu
keePassXcAssociateMoreDescription=Cậu có thể kết nối với nhiều cơ sở dữ liệu KeePassXC cùng lúc
keePassXcAssociated=Các liên kết KeePassXC
keePassXcAssociatedDescription=XPipe được kết nối với các cơ sở dữ liệu KeePassXC cục bộ sau đây:
keePassXcNotAssociatedButton=Cơ sở dữ liệu liên kết
identifier=Mã định danh
passwordManagerMapping=Gán phím tùy chỉnh
passwordManagerMappingDescription=Dữ liệu JSON có thể lưu trữ bất kỳ mục khóa-giá trị nào, nên cậu sẽ phải định nghĩa một bản ánh xạ để XPipe có thể tìm thấy các mục riêng lẻ như tên người dùng, mật khẩu và khóa SSH dựa trên các khóa đó. Bản ánh xạ mặc định có thể được ghi đè bởi từng tài khoản khi cần thiết.
passwordManagerCommand=Lệnh tùy chỉnh
passwordManagerCommandDescription=Lệnh tùy chỉnh cần thực thi để lấy mật khẩu. Chuỗi giữ chỗ $KEY sẽ được thay thế bằng khóa mật khẩu được đặt trong dấu ngoặc kép khi lệnh được gọi. Lệnh này sẽ gọi CLI của trình quản lý mật khẩu của cậu để in mật khẩu thô hoặc thông tin đăng nhập dưới dạng json ra stdout.
chooseTemplate=Chọn mẫu
keePassXcPlaceholder=URL mục KeePassXC
terminalEnvironment=Môi trường terminal
terminalEnvironmentDescription=Nếu cậu muốn tận dụng các tính năng của môi trường WSL dựa trên Linux cục bộ để tùy chỉnh terminal, cậu có thể dùng nó làm môi trường terminal.\n\nTất cả các lệnh khởi động terminal tùy chỉnh và cấu hình bộ ghép kênh terminal sau đó sẽ được chạy trong bản phân phối WSL này.
terminalInitScript=Tập lệnh khởi động thiết bị đầu cuối
terminalInitScriptDescription=Các lệnh cần chạy trong môi trường terminal trước khi kết nối được thiết lập. Cậu có thể dùng mục này để cấu hình môi trường terminal ngay khi khởi động.
terminalMultiplexer=Bộ ghép kênh đầu cuối
terminalMultiplexerDescription=Bộ ghép kênh đầu cuối dùng thay thế cho các tab trong terminal. Tính năng này sẽ thay thế một số đặc tính xử lý của terminal, ví dụ như cách xử lý tab, bằng chức năng của bộ ghép kênh.\n\nYêu cầu phải cài đặt tệp thực thi của bộ ghép kênh tương ứng trên hệ thống.
terminalMultiplexerWindowsDescription=Bộ ghép kênh đầu cuối dùng thay thế cho các tab trong terminal. Tính năng này sẽ thay thế một số đặc tính xử lý của terminal, ví dụ như cách xử lý tab, bằng chức năng của bộ ghép kênh.\n\nYêu cầu phải sử dụng môi trường terminal WSL trên Windows và cài đặt tệp thực thi bộ ghép kênh vào hệ thống WSL.
terminalAlwaysPauseOnExit=Luôn tạm dừng khi thoát
terminalAlwaysPauseOnExitDescription=Khi tính năng này được bật, mỗi khi thoát khỏi phiên terminal, cậu sẽ luôn được hỏi xem muốn khởi động lại hay đóng phiên đó. Nếu tắt tính năng này, XPipe sẽ chỉ hiển thị thông báo đó khi kết nối bị lỗi và phiên kết thúc với thông báo lỗi.
querying=Đang truy vấn...
queryFailed=Truy vấn không trả về bất kỳ thông tin bí mật nào có thể sử dụng được
retrievedPassword=Đã thu được: $PASSWORD$
refreshOpenpubkey=Làm mới danh tính openpubkey
refreshOpenpubkeyDescription=Chạy lệnh opkssh refresh để khôi phục tính hợp lệ cho danh tính openpubkey
all=Tất cả
terminalPrompt=Dòng lệnh trên terminal
terminalPromptDescription=Công cụ nhắc lệnh terminal dùng cho các terminal từ xa của cậu. Việc bật tính năng nhắc lệnh terminal sẽ tự động cài đặt và cấu hình công cụ nhắc lệnh trên hệ thống đích khi mở phiên terminal.\n\nTính năng này sẽ không thay đổi bất kỳ cấu hình dòng nhắc lệnh hay tệp cấu hình nào hiện có trên hệ thống. Điều này sẽ làm tăng thời gian tải terminal lần đầu tiên trong khi dòng nhắc lệnh đang được thiết lập trên hệ thống từ xa. Terminal của cậu có thể cần thêm phông chữ để hiển thị dòng nhắc lệnh một cách chính xác.
terminalPromptConfiguration=Cài đặt dòng lệnh trên terminal
terminalPromptConfig=Tệp cấu hình
terminalPromptConfigDescription=Tệp cấu hình tùy chỉnh để áp dụng cho dòng lệnh. Cấu hình này sẽ tự động được thiết lập trên hệ thống đích khi terminal được khởi tạo và được dùng làm cấu hình dòng lệnh mặc định.\n\nNếu cậu muốn dùng tệp cấu hình mặc định có sẵn trên từng hệ thống, cậu có thể để trống trường này.
passwordManagerKey=Nhập thông tin đăng nhập
passwordManagerKeyDescription=Mã định danh của mục thông tin đăng nhập trong trình quản lý mật khẩu
passwordManagerAgent=Trình quản lý mật khẩu
passwordManagerInPlaceKey=Trình quản lý mật khẩu
passwordManagerInPlaceKeyKey=Mã định danh của trình quản lý mật khẩu dành cho mục khóa SSH
dockerComposeProject.displayName=Dự án Docker Compose
dockerComposeProject.displayDescription=Gộp các container của một dự án Compose lại với nhau
sshVerboseOutput=Bật chế độ hiển thị chi tiết của SSH
sshVerboseOutputDescription=Tính năng này sẽ hiển thị rất nhiều thông tin gỡ lỗi khi kết nối qua SSH. Rất hữu ích để khắc phục các sự cố liên quan đến kết nối SSH.
dontUseGateway=Đừng dùng cổng kết nối
dontUseGatewayDescription=Đừng dùng máy chủ hypervisor làm cổng kết nối mà hãy kết nối trực tiếp với địa chỉ IP
categoryColor=Màu danh mục
categoryColorDescription=Màu mặc định dùng cho các kết nối trong danh mục này
categorySync=Đồng bộ với kho lưu trữ Git
categorySyncDescription=Tự động đồng bộ tất cả các kết nối với kho lưu trữ Git. Mọi thay đổi cục bộ đối với các kết nối sẽ được đẩy lên máy chủ từ xa.
categorySyncSpecial=Đồng bộ với kho lưu trữ Git\n(Không thể cấu hình cho danh mục đặc biệt "$NAME$")
categoryDontAllowScripts=Tắt tất cả các tùy chỉnh
categoryDontAllowScriptsDescription=Hãy tắt chức năng thực thi lệnh và các thao tác khác trên các hệ thống thuộc danh mục này để ngăn chặn mọi thay đổi. Việc này sẽ vô hiệu hóa toàn bộ chức năng kịch bản, các lệnh trong môi trường shell, lời nhắc lệnh và nhiều tính năng khác nữa.
categoryConfirmAllModifications=Xác nhận tất cả các thay đổi
categoryConfirmAllModificationsDescription=Hãy xác nhận trước bất kỳ thay đổi nào đối với kết nối hoặc hệ thống tệp. Điều này có thể giúp tránh các thao tác vô tình trên các hệ thống quan trọng.
categoryDefaultIdentity=Thông tin nhận dạng mặc định
categoryDefaultIdentityDescription=Nếu cậu thường xuyên dùng một danh tính nhất định trên nhiều hệ thống thuộc danh mục này, thì việc thiết lập danh tính mặc định sẽ giúp cậu chọn sẵn danh tính đó khi tạo kết nối mới.
categoryDefaultGateway=Cổng mặc định
categoryDefaultGatewayDescription=Nếu không có cổng nào khác được chỉ định cho một kết nối, hãy dùng hệ thống cổng được chỉ định cho tất cả các kết nối trong danh mục này làm mặc định.
categoryConfigTitle=$NAME$ cấu hình
configure=Cấu hình
addConnection=Thêm kết nối
noCompatibleConnection=Không tìm thấy kết nối tương thích
noCompatibleIdentity=Không tìm thấy danh tính nào tương thích
newCategory=Danh mục mới
dockerComposeRestricted=Dự án compose này bị giới hạn bởi $NAME$ và không thể chỉnh sửa từ bên ngoài được. Tớ hãy truy cập $NAME$ để quản lý dự án compose này nhé.
restricted=Hạn chế
disableSshPinCaching=Tắt tính năng lưu trữ mã PIN SSH
disableSshPinCachingDescription=XPipe sẽ tự động lưu vào bộ nhớ đệm bất kỳ mã PIN nào đã được nhập cho một khóa khi cậu sử dụng hình thức xác thực dựa trên phần cứng.\n\nNếu tắt tính năng này, cậu sẽ phải nhập lại mã PIN mỗi khi cố gắng kết nối.
gitSyncPull=Kéo xuống để đồng bộ các thay đổi từ git từ xa
enpassVaultFile=Tệp Vault
enpassVaultFileDescription=Tệp kho Enpass cục bộ.
flat=Phẳng
recursive=Đệ quy
rdpAllowListBlocked=Ứng dụng RemoteApp đã chọn không có trong danh sách cho phép RDP của máy chủ nên không thể khởi chạy được.
passworkServerUrl=URL máy chủ
passworkServerUrlDescription=URL của máy chủ quản lý mật khẩu
passworkAccessToken=Mã thông báo truy cập API
