gitPasswordDescription=Mật khẩu hoặc mã thông báo truy cập cá nhân dùng để xác thực. Việc cậu cần dùng mật khẩu hay mã thông báo truy cập cá nhân sẽ tùy thuộc vào nhà cung cấp git remote. Cài đặt này sẽ ghi đè lên bất kỳ thông tin đăng nhập mặc định nào đã được cấu hình sẵn cho client git CLI cục bộ của cậu.
