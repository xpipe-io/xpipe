passwordManagerKeyStrategyDescription=Cách lấy các khóa SSH được lưu trong trình quản lý mật khẩu. Khi tính năng này bị tắt, sẽ không thể lấy được bất kỳ khóa nào. Khi đã cấu hình trình quản lý khóa SSH, trình này phải được khởi động đúng cách trong trình quản lý mật khẩu.
