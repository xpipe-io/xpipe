startupBehaviour=Gedrag bij het opstarten
startupBehaviourDescription=Bepaalt hoe de desktop-app zich standaard gedraagt als XPipe wordt gestart.
clearCachesAlertTitle=Cache leegmaken
clearCachesAlertContent=Wil je alle XPipe-caches leegmaken? Hiermee worden alle cachegegevens verwijderd die zijn opgeslagen om de gebruikerservaring te verbeteren.
startGui=Start GUI
