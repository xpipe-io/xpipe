enableConnectionHubTerminalDocking=Het aansluiten van een hub-terminal inschakelen
enableConnectionHubTerminalDockingDescription=Je kunt terminalvensters aan het XPipe-venster in de verbindingshub vastzetten om een soort geïntegreerde terminal te simuleren. De terminalvensters worden dan door XPipe zo beheerd dat ze altijd in het dock passen.
enableFileBrowserTerminalDocking=Bestandsbrowser aan terminal koppelen inschakelen
enableFileBrowserTerminalDockingDescription=Je kunt terminalvensters aan het XPipe-venster in de bestandsbrowser vastzetten om een soort geïntegreerde terminal te simuleren. De terminalvensters worden dan door XPipe zo beheerd dat ze altijd in het dock passen.
downloadsDirectory=Aangepaste map voor downloads
downloadsDirectoryDescription=De map die je zelf kiest om gedownloade bestanden in op te slaan als je op de knop 'Verplaatsen naar downloads' klikt. Standaard gebruikt XPipe je eigen downloadmap.
pinLocalMachineOnStartup=Het tabblad 'Lokale computer' vastzetten bij het opstarten
pinLocalMachineOnStartupDescription=Open automatisch een tabblad voor de lokale computer en zet dit vast. Dit is handig als je vaak een gesplitste bestandsbrowser gebruikt waarbij zowel de lokale computer als het externe bestandssysteem openstaan.
terminalErrorDescription=Deze fout is ernstig en XPipe kan niet verdergaan zonder deze op te lossen.
