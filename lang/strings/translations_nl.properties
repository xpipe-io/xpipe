dontAutomaticallyStartVmSshServer=Start de SSH-server niet automatisch voor VM's wanneer dat nodig is
dontAutomaticallyStartVmSshServerDescription=Elke shell-verbinding met een VM die in een hypervisor draait, verloopt via SSH. XPipe kan de geïnstalleerde SSH-server automatisch starten wanneer dat nodig is. Als je dit om veiligheidsredenen niet wilt, kun je dit gedrag gewoon uitschakelen met deze optie.
confirmGitShareTitle=Git sync
confirmGitShareContent=Wil je het geselecteerde bestand toevoegen aan je Git Vault-repository? Hiermee wordt een versleutelde versie van het bestand naar je Git Vault gekopieerd en worden je wijzigingen vastgelegd. Je hebt het bestand dan op alle gesynchroniseerde desktops beschikbaar.
gitShareFileTooltip=Voeg het bestand toe aan de git vault-gegevensmap, zodat het automatisch wordt gesynchroniseerd.\n\nDeze actie kun je alleen gebruiken als git vault is ingeschakeld in de instellingen.
performanceMode=Prestatiemodus
performanceModeDescription=Schakelt alle visuele effecten uit die niet nodig zijn, om de prestaties van de app te verbeteren.
dontAcceptNewHostKeys=Accepteer nieuwe SSH-hostsleutels niet automatisch
dontAcceptNewHostKeysDescription=XPipe accepteert standaard automatisch host-sleutels van systemen waar je SSH-client nog geen bekende host-sleutel heeft opgeslagen. Als er echter een bekende host-sleutel is gewijzigd, weigert het programma verbinding te maken, tenzij je de nieuwe sleutel accepteert.\n\nDoor dit gedrag uit te schakelen, kun je alle host-sleutels controleren, zelfs als er in eerste instantie geen conflict is.
uiScale=UI-schaal
uiScaleDescription=Een aangepaste schaalwaarde die je los van de systeemwijde weergaveschaal kunt instellen. De waarden worden in procenten weergegeven, dus een waarde van bijvoorbeeld 150 zorgt voor een UI-schaal van 150%.
editorProgram=Editorprogramma
editorProgramDescription=De standaardteksteditor die je gebruikt bij het bewerken van alle soorten tekstgegevens.
windowOpacity=Doorzichtigheid van het venster
windowOpacityDescription=Past de doorzichtigheid van het venster aan, zodat je kunt zien wat er op de achtergrond gebeurt.
useSystemFont=Gebruik het systeemlettertype
openDataDir=Gegevensmap van de kluis
openDataDirButton=Open gegevensmap
openDataDirDescription=Als je extra bestanden, zoals SSH-sleutels, tussen systemen wilt synchroniseren via je Git-repository, kun je ze in de map ‘storage data’ zetten. De bestands paden van alle bestanden waarnaar daar wordt verwezen, worden automatisch aangepast op elk gesynchroniseerd systeem.
updates=Updates
selectAll=Alles selecteren
advanced=Geavanceerd
thirdParty=Open source-vermeldingen
eulaDescription=Lees de licentieovereenkomst voor eindgebruikers van de XPipe-app
thirdPartyDescription=Bekijk de open-source-licenties van bibliotheken van derden
enableGitStorage=Synchronisatie inschakelen
gitSync=Git sync
enableGitStorageDescription=Als deze optie is ingeschakeld, maakt XPipe een Git-repository aan voor de lokale kluis en worden alle wijzigingen daarin opgeslagen. Let op: hiervoor moet Git geïnstalleerd zijn en het kan het laden en opslaan wat vertragen.\n\nAlle categorieën die gesynchroniseerd moeten worden, moeten expliciet als ‘gesynchroniseerd’ worden gemarkeerd.
storageGitRemote=URL voor synchronisatie op afstand
storageGitRemoteDescription=Als je dit instelt, haalt XPipe automatisch alle wijzigingen op bij het laden en stuurt het alle wijzigingen naar de externe repository bij het opslaan.\n\nZo kun je je kluis delen tussen meerdere XPipe-installaties. Het ondersteunt HTTP- en SSH-URL’s, plus lokale mappen.
vault=Vault
vaultAccess=Toegang tot de kluis
workspaceLockDescription=Hiermee stel je een eigen wachtwoord in om alle gevoelige gegevens die in XPipe zijn opgeslagen te versleutelen.\n\nDit zorgt voor meer veiligheid, omdat het een extra versleutelingslaag biedt voor je opgeslagen gevoelige gegevens. Je wordt dan gevraagd om het wachtwoord in te voeren wanneer XPipe opstart.
useSystemFontDescription=Bepaalt of je het standaardlettertype van je systeem gebruikt of het Inter-lettertype, dat bij XPipe wordt meegeleverd.
windowOptions=Vensteropties
saveWindowLocation=Locatie van het opslagvenster
saveWindowLocationDescription=Bepaalt of de venstercoördinaten bij het opnieuw opstarten moeten worden opgeslagen en hersteld.
startupShutdown=Opstarten / Afsluiten
showChildrenConnectionsInParentCategory=Toon subcategorieën in de bovenliggende categorie
showChildrenConnectionsInParentCategoryDescription=Of je alle verbindingen in subcategorieën wilt weergeven wanneer een bepaalde bovenliggende categorie is geselecteerd.\n\nAls je dit uitschakelt, werken de categorieën meer als klassieke mappen die alleen hun directe inhoud laten zien, zonder submappen mee te nemen.
condenseConnectionDisplay=Beknopte weergave van verbindingen
condenseConnectionDisplayDescription=Zorg ervoor dat elke verbinding op het hoogste niveau minder verticale ruimte inneemt, zodat de lijst met verbindingen compacter wordt.
openConnectionSearchWindowOnConnectionCreation=Open het venster voor het zoeken naar verbindingen bij het aanmaken van een verbinding
openConnectionSearchWindowOnConnectionCreationDescription=Of het venster om naar beschikbare subverbindingen te zoeken automatisch moet worden geopend wanneer je een nieuwe shell-verbinding toevoegt.
