developerDisableSshTunnelGatewaysDescription=Gebruik geen tunnelsessies voor gateways, maar maak in plaats daarvan rechtstreeks verbinding met het systeem.
ttyWarning=De verbinding heeft met kracht een pty/tty toegewezen en biedt geen aparte stderr-stream.\n\nDit kan tot een paar problemen leiden.\n\nProbeer, als het kan, ervoor te zorgen dat het verbindingscommando geen pty toewijst.
