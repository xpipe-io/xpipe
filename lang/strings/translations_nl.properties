httpProxyDescription=De proxy die je moet gebruiken voor alle soorten HTTP-verzoeken die door XPipe en andere externe tools worden verzonden.\n\nAls de proxy TLS-verkeer ontsleutelt, wordt je gevraagd om eventuele aangepaste certificaten toe te voegen aan de interne certificaatopslag van XPipe zodra er verbinding is gemaakt. Je kunt de testknop gebruiken om te controleren of de verbinding werkt.
