workspaceManagementDescription=Werkruimten zijn afzonderlijke configuraties voor het draaien van XPipe. Elke werkruimte heeft een gegevensmap waarin alle gegevens lokaal worden opgeslagen. Dit omvat onder andere verbindingsgegevens en instellingen.\n\nAls je de synchronisatiefunctie gebruikt, kun je er ook voor kiezen om elke werkruimte met een andere Git-repository te synchroniseren.
