sftpNoticeTitle=Overdracht van grote bestanden
sftpNoticeContent=De bestanden die je probeert over te zetten zijn behoorlijk groot. De huidige sessie is gebaseerd op raw SSH, wat je niet de best mogelijke overdrachtssnelheid biedt. Als je de overdrachtssnelheid wilt verhogen, kun je in het rechtsklikmenu van de bestandsbrowser kijken of je een SFTP-sessie met het systeem kunt openen.
hideVaultEntryNames=De namen van Git Vault-items verbergen
hideVaultEntryNamesDescription=Verwijdert alle verbindingsnamen en andere informatie uit alle README's en commitberichten wanneer git sync is ingeschakeld. Deze optie voorkomt dat je inzicht krijgt in de structuur van de inhoud van de versleutelde kluis.
disableHardwareAcceleration=Hardwareversnelling uitschakelen
disableHardwareAccelerationDescription=Schakelt het gebruik van de grafische kaart voor het weergeven uit en maakt alleen gebruik van een software-renderingpijplijn.\n\nDit zorgt voor een flinke prestatievermindering, maar kan de enige manier zijn om beelden weer te geven als er problemen zijn met een grafische kaartdriver.
disableRdpWindowsSecurityWarning=RDP-beveiligingswaarschuwing uitschakelen
disableRdpWindowsSecurityWarningDescription=Laat de nieuwe Windows-waarschuwing over niet-ondertekende .rdp-bestanden niet zien wanneer je een nieuwe sessie start.\n\nHiermee pas je de registersleutel aan om de Windows RDP-client terug te zetten naar het oude gedrag. Bij deze actie verschijnt er een pop-upvenster waarin je om beheerdersrechten wordt gevraagd.
rdpWindowsSecurityWarningDialogTitle=RDP-beveiligingswaarschuwingen
rdpWindowsSecurityWarningDialogContent=Vanaf Windows-build 26200 geeft Windows nu altijd een waarschuwing weer wanneer een niet-ondertekend RDP-bestand wordt gestart, ongeacht de inhoud ervan.\n\nJe kunt deze waarschuwing uitschakelen in het instellingenmenu.
