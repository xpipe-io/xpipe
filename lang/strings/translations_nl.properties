identitiesIntroHeader=Over identiteiten
identitiesIntroContent=Als je veelvoorkomende combinaties van gebruikersnamen, wachtwoorden en sleutels hergebruikt, kan het handig zijn om herbruikbare identiteiten aan te maken. Zo kun je ze snel terugvinden wanneer je nieuwe verbindingen toevoegt.
identitiesIntroBottomHeader=Identiteiten delen
identitiesIntroBottomContent=Je kunt identiteiten lokaal toevoegen of ze ook synchroniseren in de Git-repository als deze functie is ingeschakeld. Zo kun je identiteiten selectief delen tussen meerdere systemen en met andere teamleden.
