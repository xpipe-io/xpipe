fileWriteSudoTitle=Sudo-bestand schrijven
fileWriteSudoContent=Het bestand dat je probeert te bewerken, geeft je geen schrijfrechten. Wil je dit bestand als root bewerken met sudo? Hiermee krijg je automatisch root-rechten, hetzij met je bestaande inloggegevens, hetzij via een prompt.
dontAllowTerminalRestart=Laat het opnieuw opstarten van de terminal niet toe
dontAllowTerminalRestartDescription=Standaard kun je terminalsessies vanuit de terminal opnieuw starten nadat ze zijn afgesloten. Om dit mogelijk te maken, accepteert XPipe deze externe verzoeken van de terminal om de sessie opnieuw te starten\n\nXPipe heeft geen controle over de terminal en waar dit verzoek vandaan komt, dus kwaadaardige lokale apps kunnen deze functie ook gebruiken om verbindingen via XPipe tot stand te brengen. Door deze functie uit te schakelen, voorkom je dit scenario.
