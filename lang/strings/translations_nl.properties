openDocumentationDescription=Ga naar de XPipe-documentatiepagina voor dit probleem
renameAll=Alles hernoemen
logging=Logboekregistratie
enableTerminalLogging=Terminallogging inschakelen
enableTerminalLoggingDescription=Schakelt logboekregistratie aan de clientzijde in voor alle terminalsessies. Alle invoer en uitvoer van de terminalsessie wordt opgeslagen in een sessielogbestand. Let op: gevoelige informatie, zoals wachtwoordvragen, wordt niet geregistreerd.
terminalLoggingDirectory=Logbestanden van terminalsessies
terminalLoggingDirectoryDescription=Alle logbestanden worden opgeslagen in de XPipe-gegevensmap op je lokale systeem.
openSessionLogs=Sessielogboeken openen
sessionLogging=Terminal-logboekregistratie
sessionActive=Er loopt een achtergrondsessie voor deze verbinding.\n\nOm deze sessie handmatig te stoppen, klik je op de statusindicator.
skipValidation=Validatie overslaan
scriptsIntroHeader=Over scripts
scriptsIntroContent=Je kunt scripts uitvoeren bij het opstarten van de shell, in de bestandsbrowser en op verzoek. Je kunt zelf scripts maken binnen XPipe of bestaande scripts importeren vanaf je lokale systeem of vanuit een externe Git-repository.
scriptsIntroBottomHeader=Scripts gebruiken
scriptsIntroBottomContent=Er zijn allerlei voorbeeldscripts om mee te beginnen. Je kunt op de bewerkknop van de afzonderlijke scripts klikken om te zien hoe ze zijn geïmplementeerd. Scripts moeten eerst worden ingeschakeld om te kunnen draaien en in de menu’s te verschijnen; daarvoor zit er bij elk script een schakelaar.
scriptsIntroBottomButton=Aan de slag
scriptSourcesIntroHeader=Scriptbronnen
scriptSourcesIntroContent=Je kunt aangepaste scriptbronnen toevoegen om direct toegang te krijgen tot een hele verzameling shell-scripts. Zowel lokale bronnen als externe Git-repositories worden als bronnen ondersteund. Alle scripts die uit de bron worden gedetecteerd, worden automatisch beschikbaar.
scriptSourcesIntroButton=Bron toevoegen ...
checkForSecurityUpdates=Controleer of er beveiligingsupdates zijn
checkForSecurityUpdatesDescription=XPipe kan apart van de normale functie-updates controleren of er mogelijke beveiligingsupdates zijn. Als deze optie is ingeschakeld, worden in ieder geval belangrijke beveiligingsupdates aanbevolen voor installatie, zelfs als de normale updatecontrole is uitgeschakeld.\n\nAls je deze instelling uitschakelt, wordt er geen externe versie-aanvraag uitgevoerd en krijg je geen meldingen over beveiligingsupdates.
