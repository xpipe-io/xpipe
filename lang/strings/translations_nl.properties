automaticallyCheckForUpdates=Kijk of er updates zijn
automaticallyCheckForUpdatesDescription=Als deze optie is ingeschakeld, wordt er na een tijdje automatisch nieuwe release-informatie opgehaald terwijl XPipe draait. Je moet de installatie van updates nog steeds expliciet bevestigen.
developerMode=Ontwikkelaarsmodus
developerModeDescription=Als je dit inschakelt, krijg je toegang tot allerlei extra opties die handig zijn bij het ontwikkelen.
editor=Editor
custom=Aangepast
passwordManager=Wachtwoordbeheerder
externalPasswordManager=Externe wachtwoordbeheerder
passwordManagerDescription=De lokaal geïnstalleerde wachtwoordbeheerder waarmee je XPipe wilt integreren.\n\nAls je een wachtwoordbeheerder hebt geïnstalleerd, kun je XPipe zo instellen dat het je wachtwoorden daaruit ophaalt, zodat XPipe de wachtwoorden niet zelf hoeft te beheren.
passwordManagerTest=Test wachtwoordbeheerder
passwordManagerTestDescription=Controleer of de integratie met de wachtwoordbeheerder goed werkt. Zorg ervoor dat je het juiste identificatieformaat gebruikt om naar een item in de wachtwoordbeheerder te verwijzen.
preferTerminalTabs=Ik open liever nieuwe tabbladen
preferTerminalTabsDescription=Bepaalt of XPipe probeert nieuwe tabbladen te openen in de door jou gekozen terminal in plaats van nieuwe vensters. Niet elke terminal ondersteunt tabbladen.
customRdpClientCommand=Aangepaste opdracht
customRdpClientCommandDescription=Het commando dat je moet uitvoeren om de aangepaste RDP-client te starten.\n\nDe plaatshouder $FILE wordt bij het aanroepen vervangen door de absolute .rdp-bestandsnaam tussen aanhalingstekens. Vergeet niet je uitvoerbare pad tussen aanhalingstekens te zetten als het spaties bevat.
customEditorCommand=Aangepaste bewerkingsopdracht
customEditorCommandDescription=Het commando dat je moet uitvoeren om de aangepaste editor te starten.\n\nDe plaatshouder $FILE wordt bij het aanroepen vervangen door de absolute bestandsnaam tussen aanhalingstekens. Vergeet niet het pad naar het uitvoerbare bestand van je editor tussen aanhalingstekens te zetten als het spaties bevat.
encryptAllVaultData=Versleutel alle gegevens in de kluis
encryptAllVaultDataDescription=Als deze optie is ingeschakeld, wordt elk onderdeel van de vault-verbindingsgegevens versleuteld met je gebruikerssleutel voor de vault, in plaats van alleen de geheimen binnen die gegevens. Dit voegt een extra beveiligingslaag toe voor andere parameters zoals gebruikersnamen, hostnamen, enz., die standaard niet in de vault worden versleuteld.\n\nDeze optie maakt je Git-vaultgeschiedenis en -diffs onbruikbaar, omdat je de oorspronkelijke wijzigingen niet meer kunt zien, maar alleen binaire wijzigingen.
vaultSecurity=Beveiliging van de kluis
developerDisableUpdateVersionCheck=Controle op updateversie uitschakelen
developerDisableUpdateVersionCheckDescription=Bepaalt of de updatechecker het versienummer negeert bij het zoeken naar een update.
shellCommandTest=Test van Shell-opdrachten
shellCommandTestDescription=Voer een commando uit in de shell-sessie die intern door XPipe wordt gebruikt.
terminal=Terminal
terminalType=Terminalemulator
terminalConfiguration=Terminalconfiguratie
terminalCustomization=Terminal aanpassen
editorConfiguration=Configuratie van de editor
defaultApplication=Standaardtoepassing
initialSetup=Eerste installatie
terminalTypeDescription=De standaardterminal die wordt gebruikt voor het openen van shell-verbindingen.\n\nDe mate waarin functies worden ondersteund, verschilt per terminal, en elke terminal is gemarkeerd als 'aanbevolen' of 'niet aanbevolen'. Je hebt de beste gebruikerservaring als je een aanbevolen terminal gebruikt.
customTerminalCommand=Aangepaste terminalopdracht
customTerminalCommandDescription=Het commando dat je moet uitvoeren om de aangepaste terminal met een bepaald commando te openen.\n\nXPipe maakt een tijdelijk shell-script aan dat je terminal kan uitvoeren. De plaatshouder $CMD in het commando dat je opgeeft, wordt bij het uitvoeren vervangen door het daadwerkelijke start-script. Vergeet niet het pad naar je terminal-uitvoerbaar bestand tussen aanhalingstekens te zetten als het spaties bevat.
clearTerminalOnInit=Terminal leegmaken bij het opstarten
clearTerminalOnInitDescription=Als deze optie is ingeschakeld, voert XPipe een 'clear'-commando uit nadat een nieuwe terminalsessie is gestart, om alle overbodige uitvoer te verwijderen die tijdens het opstarten van de terminalsessie is weergegeven.
dontCachePasswords=Sla opgegeven wachtwoorden niet op in de cache
dontCachePasswordsDescription=Bepaalt of opgevraagde wachtwoorden intern door XPipe in de cache moeten worden opgeslagen, zodat je ze tijdens de huidige sessie niet opnieuw hoeft in te voeren.\n\nAls deze functie is uitgeschakeld, moet je de opgevraagde inloggegevens elke keer opnieuw invoeren wanneer het systeem daarom vraagt.
denyTempScriptCreation=Het aanmaken van tijdelijke scripts weigeren
denyTempScriptCreationDescription=Om bepaalde functies te kunnen uitvoeren, maakt XPipe soms tijdelijke shell-scripts aan op een doelsysteem, zodat je makkelijk simpele commando’s kunt uitvoeren. Deze bevatten geen gevoelige informatie en worden alleen aangemaakt voor implementatiedoeleinden.\n\nAls je dit uitschakelt, maakt XPipe geen tijdelijke bestanden aan op een systeem op afstand. Deze optie is handig in omgevingen met strenge beveiliging, waar elke wijziging in het bestandssysteem wordt gecontroleerd. Als je dit uitschakelt, werken sommige functies, zoals shell-omgevingen en scripts, niet zoals de bedoeling is.
disableCertutilUse=Schakel het gebruik van certutil uit op Windows
useLocalFallbackShell=Gebruik de lokale fallback-shell
useLocalFallbackShellDescription=Schakel over naar een andere lokale shell om lokale bewerkingen uit te voeren. Dit is PowerShell op Windows en de Bourne-shell op andere systemen.\n\nDeze optie kun je gebruiken als de normale lokale standaard-shell is uitgeschakeld of niet helemaal goed werkt. Sommige functies werken misschien niet helemaal zoals verwacht als deze optie is ingeschakeld.
disableCertutilUseDescription=Vanwege een aantal tekortkomingen en bugs in cmd.exe worden er tijdelijke shell-scripts gemaakt met certutil, waarbij dit wordt gebruikt om base64-invoer te decoderen, omdat cmd.exe vastloopt bij niet-ASCII-invoer. XPipe kan daarvoor ook PowerShell gebruiken, maar dat gaat langzamer.\n\nHiermee wordt elk gebruik van certutil op Windows-systemen uitgeschakeld om bepaalde functionaliteit te realiseren, en wordt in plaats daarvan teruggevallen op PowerShell. Dit is misschien goed nieuws voor sommige antivirusprogramma’s, aangezien sommige het gebruik van certutil blokkeren.
disableTerminalRemotePasswordPreparation=Het instellen van een wachtwoord voor externe toegang via de terminal uitschakelen
disableTerminalRemotePasswordPreparationDescription=Als je in de terminal een remote shell-verbinding moet maken die via meerdere tussensystemen loopt, kan het nodig zijn om de benodigde wachtwoorden op een van die tussensystemen alvast in te stellen, zodat de wachtwoordprompts automatisch worden ingevuld.\n\nAls je niet wilt dat de wachtwoorden ooit naar een tussensysteem worden verzonden, kun je deze functie uitschakelen. Eventuele vereiste tussensysteemwachtwoorden worden dan bij het openen in de terminal zelf opgevraagd.
