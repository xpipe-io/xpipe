teamVaults=Teamkluizen
vaultTypeNameDefault=Standaardkluis
vaultTypeNamePersonal=Persoonlijke kluis
vaultTypeNameTeam=Teamkluis
teamVaultsDescription=Met teamkluizen kunnen meerdere gebruikers en rollen veilig toegang krijgen tot een gedeelde kluis. Je kunt verbindingen en identiteiten zo instellen dat ze voor alle gebruikers gedeeld worden, of juist alleen beschikbaar zijn voor individuele gebruikers en rollen door ze te versleutelen met hun eigen sleutel. Andere gebruikers van de kluis hebben geen toegang tot persoonlijke en op rollen gebaseerde verbindingen en identiteiten als ze geen toegang hebben tot de sleutel.
vaultTypeContentDefault=Je gebruikt nu een standaardkluis zonder dat er een gebruiker of een eigen wachtwoordzin is ingesteld. Geheime gegevens worden versleuteld met de lokale kluissleutel.\n\nJe kunt upgraden naar een persoonlijke kluis door een kluisgebruikersaccount aan te maken. Hiermee kun je de geheimen in de kluis versleutelen met je eigen persoonlijke wachtzin, die je bij elke aanmelding moet invoeren om de kluis te ontgrendelen.
vaultTypeContentPersonal=Je gebruikt nu een persoonlijke kluis voor je gebruikersaccount. Geheime gegevens worden versleuteld met je persoonlijke wachtwoordzin.
vaultTypeContentTeam=Je gebruikt nu een teamkluis, waarmee meerdere gebruikers veilig toegang hebben tot een gedeelde kluis. Je kunt verbindingen en identiteiten zo instellen dat ze voor alle gebruikers gedeeld worden, of dat ze alleen beschikbaar zijn voor jouw persoonlijke gebruikersaccount of rol, door ze te versleutelen met je persoonlijke sleutel of rolsleutel. Andere kluisgebruikers hebben geen toegang tot je persoonlijke en op rollen gebaseerde verbindingen en identiteiten als ze geen toegang hebben tot de sleutel.
roleManagement=Rolbeheer
roleManagementEmpty=Rolbeheer
roleManagementDescription=Beheer bestaande kluisrollen of maak nieuwe aan. Elke kluisrol heeft zijn eigen unieke geheime sleutel die wordt gebruikt om verbindingen en identiteiten te versleutelen die alleen voor die rol beschikbaar mogen zijn en niet voor anderen.
roleManagementEmptyDescription=Beheer bestaande kluisrollen of maak nieuwe aan. Elke kluisrol heeft zijn eigen unieke geheime sleutel die wordt gebruikt om verbindingen en identiteiten te versleutelen die alleen voor die rol beschikbaar mogen zijn en niet voor anderen.\n\nOp rollen gebaseerde accounts voor een team worden ondersteund in het Professional-abonnement.
userManagement=Gebruikersbeheer
userManagementEmpty=Gebruikersbeheer
userManagementDescription=Beheer je bestaande kluisgebruiker of maak er een nieuwe aan. Je kluisgebruiker heeft een eigen wachtwoordzin die wordt gebruikt om verbindingen en identiteiten te versleutelen.
userManagementEmptyDescription=Beheer je bestaande kluisgebruiker of maak een nieuwe aan. Je kluisgebruiker heeft een eigen wachtzin die wordt gebruikt om verbindingen en identiteiten te versleutelen. Maak een gebruiker voor jezelf aan, zodat je verbindingen en identiteiten kunt versleutelen met je persoonlijke sleutel.
