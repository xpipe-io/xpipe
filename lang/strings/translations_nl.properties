unsyncedIdentityContent=Deze verbinding is gemarkeerd om tussen meerdere systemen te synchroniseren, maar de identiteit die je hebt geselecteerd is alleen lokaal. Dit zorgt ervoor dat de identiteit op andere systemen ontbreekt.\n\nJe kunt deze lokale identiteit omzetten naar een gesynchroniseerde identiteit, of naar een multi-identiteit, zodat je op elk gesynchroniseerd systeem tussen meerdere lokale identiteiten kunt schakelen.
