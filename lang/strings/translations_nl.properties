rdpClientDescription=Het RDP-clientprogramma dat je moet aanroepen als je RDP-verbindingen wilt starten.\n\nLet op: verschillende clients hebben verschillende mogelijkheden en integraties. Sommige clients ondersteunen het automatisch doorgeven van wachtwoorden niet, dus die moet je bij het starten nog steeds zelf invullen.
