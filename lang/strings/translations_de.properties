confirmVaultUnencryptContent=Möchtest du die erweiterte Tresorverschlüsselung wirklich deaktivieren? Dadurch wird die zusätzliche Verschlüsselung der gespeicherten Daten aufgehoben und vorhandene Daten werden überschrieben.
