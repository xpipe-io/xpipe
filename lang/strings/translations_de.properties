identitiesIntroHeader=Über Identitäten
identitiesIntroContent=Wenn du häufig verwendete Kombinationen aus Benutzernamen, Passwörtern und Schlüsseln wiederverwendest, kann es sinnvoll sein, wiederverwendbare Identitäten anzulegen. So kannst du beim Hinzufügen neuer Verbindungen schnell darauf zurückgreifen.
identitiesIntroBottomHeader=Identitäten teilen
identitiesIntroBottomContent=Du kannst Identitäten lokal hinzufügen oder sie auch im Git-Repository synchronisieren, wenn diese Funktion aktiviert ist. So kannst du Identitäten gezielt über mehrere Systeme hinweg und mit anderen Teammitgliedern teilen.
