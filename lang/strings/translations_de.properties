storeIntroImportContent=Nutzt du XPipe bereits auf einem anderen System? Synchronisiere deine bestehenden Verbindungen über mehrere Systeme hinweg über ein Remote-Git-Repository. Du kannst die Synchronisierung auch später jederzeit nachholen, falls sie noch nicht eingerichtet ist.
