fileWriteSudoTitle=Datei mit Sudo schreiben
fileWriteSudoContent=Die Datei, die du schreiben möchtest, gewährt deinem Benutzer keine Schreibrechte. Möchtest du diese Datei als Root mit „sudo“ schreiben? Dadurch wird automatisch Root-Rechte erteilt, entweder mit den vorhandenen Anmeldedaten oder über eine Eingabeaufforderung.
dontAllowTerminalRestart=Terminal-Neustart nicht zulassen
dontAllowTerminalRestartDescription=Standardmäßig können Terminalsitzungen nach ihrem Beenden direkt aus dem Terminal heraus neu gestartet werden. Um dies zu ermöglichen, akzeptiert XPipe diese externen Anfragen vom Terminal, um die Sitzung erneut zu starten\n\nXPipe hat keinerlei Kontrolle über das Terminal und darüber, woher dieser Aufruf stammt. Daher können auch böswillige lokale Anwendungen diese Funktion nutzen, um Verbindungen über XPipe herzustellen. Das Deaktivieren dieser Funktion verhindert dieses Szenario.
