clipboardNoticeTitle=Passwort kopiert
clipboardNoticeContent=Da die Zielanwendung die direkte Eingabe von Passwörtern nicht unterstützt, wurde dein Passwort in die Zwischenablage kopiert, damit du es einfügen kannst. Das wird in Zukunft automatisch geschehen. Die entsprechende Anzeige für die Zwischenablage siehst du unten rechts.
sftpNoticeTitle=Übertragung großer Dateien
sftpNoticeContent=Die Dateien, die du übertragen möchtest, sind ziemlich groß. Die aktuelle Sitzung basiert auf Raw-SSH, was dir nicht die bestmögliche Übertragungsgeschwindigkeit bietet. Wenn du die Übertragungsgeschwindigkeit erhöhen möchtest, kannst du im Rechtsklick-Menü des Dateibrowsers prüfen, ob du eine SFTP-Sitzung zum System eröffnen kannst.
hideVaultEntryNames=Namen der Git-Vault-Einträge ausblenden
hideVaultEntryNamesDescription=Entfernt alle Verbindungsnamen und sonstigen Informationen aus allen README-Dateien und Commit-Meldungen, wenn „git sync“ aktiviert ist. Diese Option verhindert jeglichen Einblick in die Struktur des verschlüsselten Tresor-Inhalts.
disableHardwareAcceleration=Hardwarebeschleunigung deaktivieren
disableHardwareAccelerationDescription=Deaktiviert jegliche Nutzung der Grafikkarte für das Rendering und verwendet ausschließlich eine Software-Rendering-Pipeline.\n\nDas führt zu einem erheblichen Leistungsverlust, kann aber die einzige Möglichkeit zum Rendern sein, wenn es Probleme mit dem Grafikkartentreiber gibt.
disableRdpWindowsSecurityWarning=RDP-Sicherheitswarnung deaktivieren
disableRdpWindowsSecurityWarningDescription=Die neue Windows-Warnung zu nicht signierten .rdp-Dateien soll beim Starten einer neuen Sitzung nicht mehr angezeigt werden.\n\nDadurch wird der Registrierungsschlüssel geändert, um den Windows-RDP-Client auf sein altes Verhalten zurückzusetzen. Bei dieser Aktion erscheint ein Popup-Fenster zur Administratorberechtigung.
rdpWindowsSecurityWarningDialogTitle=RDP-Sicherheitswarnungen
rdpWindowsSecurityWarningDialogContent=Seit Windows-Build 26200 zeigt Windows nun immer eine Warnung an, wenn eine nicht signierte RDP-Datei gestartet wird, unabhängig von ihrem Inhalt.\n\nDu kannst diese Warnung im Einstellungsmenü deaktivieren.
