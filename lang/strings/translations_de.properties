chmodPermissions=Neue Berechtigungen
editFilesWithDoubleClick=Dateien per Doppelklick bearbeiten
editFilesWithDoubleClickDescription=Wenn diese Option aktiviert ist, werden Dateien durch Doppelklicken direkt in deinem Texteditor geöffnet, anstatt das Kontextmenü anzuzeigen.
censorMode=Zensurmodus
censorModeDescription=Blendet alle Informationen wie Hostnamen, Benutzernamen, Verbindungsnamen und mehr aus.\n\nDas ist nützlich, wenn du einen Screenshot von XPipe machen oder den Bildschirm teilen möchtest und keine Informationen preisgeben willst.
