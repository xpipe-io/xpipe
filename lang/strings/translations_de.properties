unsyncedIdentityContent=Diese Verbindung ist für die Synchronisierung über mehrere Systeme hinweg markiert, aber die von dir ausgewählte Identität ist nur lokal gültig. Das führt dazu, dass die Identität auf anderen Systemen fehlt.\n\nDu kannst diese lokale Identität entweder in eine synchronisierte Identität umwandeln oder in eine Multi-Identität, um auf jedem synchronisierten System zwischen mehreren lokalen Identitäten zu wechseln.
