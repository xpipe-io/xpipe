passwordManagerMappingDescription=Die JSON-Daten können beliebige Schlüssel-Wert-Einträge speichern, daher musst du eine Zuordnung definieren, anhand derer XPipe einzelne Einträge wie Benutzername, Passwort und SSH-Schlüssel finden kann. Die Standardzuordnung kann bei Bedarf für einzelne Identitäten überschrieben werden.
