developerDisableSshTunnelGateways=SSH-Gateway-Tunneling deaktivieren
developerDisableSshTunnelGatewaysDescription=Verwende keine Tunnelsitzungen für Gateways, sondern verbinde dich stattdessen direkt mit dem System.
ttyWarning=Die Verbindung hat zwangsweise einen pty/tty zugewiesen und stellt keinen separaten stderr-Stream bereit.\n\nDas könnte zu einigen Problemen führen.\n\nWenn möglich, versuche, den Verbindungsbefehl so anzupassen, dass er keinen pty zuweist.
