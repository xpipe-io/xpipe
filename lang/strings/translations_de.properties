teamVaults=Team-Tresore
vaultTypeNameDefault=Standard-Tresor
vaultTypeNamePersonal=Persönlicher Tresor
vaultTypeNameTeam=Team-Tresor
teamVaultsDescription=Team-Tresore ermöglichen mehreren Nutzern und Rollen den sicheren Zugriff auf einen gemeinsamen Tresor. Du kannst Verbindungen und Identitäten so konfigurieren, dass sie entweder für alle Nutzer gemeinsam genutzt werden oder nur für einzelne Nutzer und Rollen verfügbar sind, indem du sie mit einem eigenen Schlüssel verschlüsselst. Andere Tresorbenutzer können nicht auf persönliche und rollenbasierte Verbindungen und Identitäten zugreifen, wenn sie keinen Zugriff auf den Schlüssel haben.
vaultTypeContentDefault=Du nutzt derzeit einen Standard-Tresor, für den noch kein Benutzer und keine benutzerdefinierte Passphrase festgelegt wurden. Geheimnisse werden mit dem lokalen Tresorschlüssel verschlüsselt.\n\nDu kannst auf einen persönlichen Tresor umsteigen, indem du ein Tresor-Benutzerkonto erstellst. So kannst du die Geheimnisse im Tresor mit deiner eigenen persönlichen Passphrase verschlüsseln, die du bei jeder Anmeldung eingeben musst, um den Tresor zu entsperren.
vaultTypeContentPersonal=Du nutzt derzeit einen persönlichen Tresor für deinen Benutzer. Geheimnisse werden mit deiner persönlichen Passphrase verschlüsselt.
vaultTypeContentTeam=Du nutzt derzeit einen Team-Tresor, der mehreren Nutzern den sicheren Zugriff auf einen gemeinsamen Tresor ermöglicht. Du kannst Verbindungen und Identitäten so konfigurieren, dass sie entweder für alle Nutzer freigegeben sind oder nur für deinen persönlichen Nutzer oder deine Rolle verfügbar sind, indem du sie mit deinem persönlichen Schlüssel oder deinem Rollenschlüssel verschlüsselst. Andere Tresorbenutzer können nicht auf deine persönlichen und rollenbasierten Verbindungen und Identitäten zugreifen, wenn sie keinen Zugriff auf den Schlüssel haben.
roleManagement=Rollenverwaltung
roleManagementEmpty=Rollenverwaltung
roleManagementDescription=Verwalte bestehende Tresorrollen oder erstelle neue. Jede Tresorrolle verfügt über einen eigenen geheimen Schlüssel, der zur Verschlüsselung von Verbindungen und Identitäten verwendet wird, die nur dieser Rolle und niemand anderem zugänglich sein sollen.
roleManagementEmptyDescription=Verwalte bestehende Tresorrollen oder erstelle neue. Jede Tresorrolle verfügt über einen eigenen geheimen Schlüssel, der zur Verschlüsselung von Verbindungen und Identitäten verwendet wird, die nur dieser Rolle und niemand anderem zugänglich sein sollen.\n\nRollenbasierte Konten für ein Team werden im Professional-Tarif unterstützt.
userManagement=Benutzerverwaltung
userManagementEmpty=Benutzerverwaltung
userManagementDescription=Verwalte deinen bestehenden Tresor-Benutzer oder erstelle einen neuen. Dein Tresor-Benutzer hat eine eigene Passphrase, die zur Verschlüsselung von Verbindungen und Identitäten verwendet wird.
userManagementEmptyDescription=Verwalte deinen bestehenden Tresor-Benutzer oder erstelle einen neuen. Dein Tresor-Benutzer hat eine eigene Passphrase, die zur Verschlüsselung von Verbindungen und Identitäten verwendet wird. Erstelle einen Benutzer für dich selbst, um Verbindungen und Identitäten mit deinem persönlichen Schlüssel verschlüsseln zu können.
