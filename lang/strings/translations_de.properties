addWorkspaceDescription=Öffne den Dialog zum Erstellen eines neuen Arbeitsbereichs
workspaceManagement=Arbeitsbereiche verwalten
workspaceManagementDescription=Arbeitsbereiche sind eigenständige Konfigurationen für die Ausführung von XPipe. Jeder Arbeitsbereich verfügt über ein Datenverzeichnis, in dem alle Daten lokal gespeichert werden. Dazu gehören Verbindungsdaten, Einstellungen und vieles mehr.\n\nWenn du die Synchronisierungsfunktion nutzt, kannst du außerdem jeden Arbeitsbereich mit einem anderen Git-Repository synchronisieren.
