limitedTouchscreenModeDescription=Wenn du diese App auf einer eher ungewöhnlichen Touchscreen-Oberfläche wie einem Handybildschirm nutzt, funktionieren manche Menüs möglicherweise nicht richtig. Wenn diese Option aktiviert ist, nutzt die Menü-Implementierung eingeschränktere Funktionen, um mit den nur sporadisch gesendeten Maus-/Touch-Ereignissen umzugehen.
