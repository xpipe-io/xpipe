enableConnectionHubTerminalDockingDescription=Du kannst Terminalfenster an das XPipe-Anwendungsfenster im Verbindungs-Hub andocken, um ein gewissermaßen integriertes Terminal zu simulieren. Die Terminalfenster werden dann von XPipe so verwaltet, dass sie immer in den Andockbereich passen.
enableFileBrowserTerminalDocking=Dateibrowser am Terminal andocken aktivieren
enableFileBrowserTerminalDockingDescription=Du kannst Terminalfenster im Dateibrowser an das XPipe-Anwendungsfenster andocken, um ein gewissermaßen integriertes Terminal zu simulieren. Die Terminalfenster werden dann von XPipe so verwaltet, dass sie immer in den Andockbereich passen.
