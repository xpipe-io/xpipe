pinLocalMachineOnStartupDescription=Öffne automatisch eine Registerkarte „Lokaler Rechner“ und hefte sie an. Das ist nützlich, wenn du häufig einen geteilten Dateibrowser verwendest, in dem sowohl der lokale Rechner als auch das Remote-Dateisystem geöffnet sind.
terminalErrorDescription=Dieser Fehler ist schwerwiegend und XPipe kann ohne Behebung nicht weiterarbeiten.
