terminalPrompt=Terminal-Eingabeaufforderung
terminalPromptDescription=Das Terminal-Prompt-Tool, das du in deinen Remote-Terminals verwenden kannst. Wenn du eine Terminal-Eingabeaufforderung aktivierst, wird das Prompt-Tool beim Öffnen einer Terminal-Sitzung automatisch auf dem Zielsystem eingerichtet und konfiguriert.\n\nDadurch werden keine bestehenden Prompt-Konfigurationen oder Profildateien auf dem System verändert. Dies verlängert die Ladezeit des Terminals beim ersten Start, während der Prompt auf dem Remote-System eingerichtet wird. Möglicherweise benötigt dein Terminal zusätzliche Schriftarten, um den Prompt korrekt anzuzeigen.
