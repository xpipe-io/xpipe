startupBehaviourDescription=Steuert das Standardverhalten der Desktop-Anwendung beim Start von XPipe.
clearCachesAlertTitle=Cache leeren
clearCachesAlertContent=Möchtest du alle XPipe-Caches leeren? Dadurch werden alle Cache-Daten gelöscht, die zur Verbesserung der Benutzererfahrung gespeichert wurden.
startGui=GUI starten
startInTray=Startet in der Taskleiste
startInBackground=Im Hintergrund starten
clearCaches=Caches leeren …
clearCachesDescription=Alle Cache-Daten löschen
cancel=Abbrechen
notAnAbsolutePath=Kein absoluter Pfad
notADirectory=Kein Verzeichnis
notAnEmptyDirectory=Kein leeres Verzeichnis
automaticallyCheckForUpdates=Nach Updates suchen
automaticallyCheckForUpdatesDescription=Wenn diese Option aktiviert ist, werden neue Versionsinformationen nach einer Weile automatisch abgerufen, während XPipe läuft. Du musst die Installation von Updates aber trotzdem noch ausdrücklich bestätigen.
developerMode=Entwicklermodus
developerModeDescription=Wenn diese Option aktiviert ist, hast du Zugriff auf eine Vielzahl zusätzlicher Optionen, die für die Entwicklung nützlich sind.
editor=Editor
custom=Benutzerdefiniert
passwordManager=Passwort-Manager
externalPasswordManager=Externer Passwort-Manager
passwordManagerDescription=Der lokal installierte Passwortmanager, der integriert werden soll.\n\nWenn du einen Passwortmanager installiert hast, kannst du XPipe so konfigurieren, dass es die Zugangsdaten daraus abruft, sodass XPipe die Zugangsdaten nicht selbst verwalten muss.
passwordManagerTest=Passwortmanager testen
passwordManagerTestDescription=Überprüfe, ob die Passwortmanager-Integration korrekt funktioniert. Achte darauf, das richtige Identifikationsformat zu verwenden, um auf einen Eintrag im Passwortmanager zu verweisen.
preferTerminalTabs=Lieber neue Tabs öffnen
preferTerminalTabsDescription=Legt fest, ob XPipe versucht, neue Registerkarten in deinem ausgewählten Terminal zu öffnen, anstatt neue Fenster zu öffnen. Nicht jedes Terminal unterstützt Registerkarten.
customRdpClientCommand=Benutzerdefinierter Befehl
customRdpClientCommandDescription=Der Befehl, der ausgeführt werden muss, um den benutzerdefinierten RDP-Client zu starten.\n\nDie Platzhalterzeichenfolge $FILE wird beim Aufruf durch den in Anführungszeichen gesetzten absoluten .rdp-Dateinamen ersetzt. Denk daran, den Pfad zur ausführbaren Datei in Anführungszeichen zu setzen, falls er Leerzeichen enthält.
customEditorCommand=Benutzerdefinierter Editor-Befehl
customEditorCommandDescription=Der Befehl, den du ausführen musst, um den benutzerdefinierten Editor zu starten.\n\nDie Platzhalterzeichenfolge $FILE wird beim Aufruf durch den in Anführungszeichen gesetzten absoluten Dateinamen ersetzt. Denk daran, den Pfad zur ausführbaren Datei deines Editors in Anführungszeichen zu setzen, falls er Leerzeichen enthält.
encryptAllVaultData=Verschlüssele alle Daten im Tresor
encryptAllVaultDataDescription=Wenn diese Option aktiviert ist, werden alle Teile der Vault-Verbindungsdaten mit deinem Benutzer-Vault-Verschlüsselungsschlüssel verschlüsselt, im Gegensatz dazu, dass nur die darin enthaltenen Geheimnisse verschlüsselt werden. Das bietet eine zusätzliche Sicherheitsebene für andere Parameter wie Benutzernamen, Hostnamen usw., die standardmäßig im Vault nicht verschlüsselt sind.\n\nDiese Option macht deinen Git-Vault-Verlauf und deine Diff-Dateien unbrauchbar, da du die ursprünglichen Änderungen nicht mehr sehen kannst, sondern nur noch binäre Änderungen.
vaultSecurity=Sicherheit des Tresors
developerDisableUpdateVersionCheck=Versionsprüfung deaktivieren
developerDisableUpdateVersionCheckDescription=Legt fest, ob der Update-Checker die Versionsnummer bei der Suche nach einem Update ignorieren soll.
shellCommandTest=Shell-Befehlstest
shellCommandTestDescription=Führe einen Befehl in der Shell-Sitzung aus, die intern von XPipe genutzt wird.
terminal=Terminal
terminalType=Terminalemulator
terminalConfiguration=Terminalkonfiguration
terminalCustomization=Anpassung des Terminals
editorConfiguration=Editor-Konfiguration
defaultApplication=Standard-App
initialSetup=Ersteinrichtung
terminalTypeDescription=Das Standard-Terminal, das zum Öffnen von Shell-Verbindungen verwendet wird.\n\nDer Umfang der unterstützten Funktionen variiert je nach Terminal, und jedes Terminal ist entweder als „empfohlen“ oder „nicht empfohlen“ gekennzeichnet. Die beste Benutzererfahrung erzielst du, wenn du ein empfohlenes Terminal verwendest.
customTerminalCommand=Benutzerdefinierter Terminalbefehl
customTerminalCommandDescription=Der Befehl, den du ausführen musst, um das benutzerdefinierte Terminal mit einem bestimmten Befehl zu öffnen.\n\nXPipe erstellt ein temporäres Shell-Skript zum Starten deines Terminals. Die Platzhalterzeichenfolge $CMD in dem von dir angegebenen Befehl wird beim Aufruf durch das eigentliche Startskript ersetzt. Denk daran, den Pfad zur ausführbaren Terminal-Datei in Anführungszeichen zu setzen, falls er Leerzeichen enthält.
clearTerminalOnInit=Terminal bei Start löschen
clearTerminalOnInitDescription=Wenn diese Option aktiviert ist, führt XPipe nach dem Start einer neuen Terminalsitzung einen „clear“-Befehl aus, um alle unnötigen Ausgaben zu entfernen, die beim Start der Terminalsitzung angezeigt wurden.
dontCachePasswords=Speichere abgefragte Passwörter nicht im Cache
dontCachePasswordsDescription=Legt fest, ob abgefragte Passwörter von XPipe intern zwischengespeichert werden sollen, damit du sie in der aktuellen Sitzung nicht erneut eingeben musst.\n\nWenn diese Funktion deaktiviert ist, musst du alle angeforderten Anmeldedaten jedes Mal neu eingeben, wenn sie vom System verlangt werden.
denyTempScriptCreation=Temporäre Skripterstellung verweigern
denyTempScriptCreationDescription=Um bestimmte Funktionen zu realisieren, erstellt XPipe manchmal temporäre Shell-Skripte auf einem Zielsystem, um die einfache Ausführung einfacher Befehle zu ermöglichen. Diese enthalten keine sensiblen Informationen und werden lediglich zu Implementierungszwecken erstellt.\n\nWenn dieses Verhalten deaktiviert ist, erstellt XPipe keine temporären Dateien auf einem Remote-System. Diese Option ist in Umgebungen mit hohen Sicherheitsanforderungen nützlich, in denen jede Änderung am Dateisystem überwacht wird. Ist diese Option deaktiviert, funktionieren einige Funktionen, z. B. Shell-Umgebungen und Skripte, nicht wie vorgesehen.
disableCertutilUse=Deaktiviere die Verwendung von „certutil“ unter Windows
useLocalFallbackShell=Lokale Fallback-Shell verwenden
useLocalFallbackShellDescription=Wechsle zu einer anderen lokalen Shell, um lokale Vorgänge abzuwickeln. Unter Windows wäre das PowerShell, auf anderen Systemen die Bourne-Shell.\n\nDiese Option kann verwendet werden, falls die normale lokale Standard-Shell deaktiviert ist oder in gewissem Maße nicht richtig funktioniert. Einige Funktionen funktionieren jedoch möglicherweise nicht wie erwartet, wenn diese Option aktiviert ist.
disableCertutilUseDescription=Aufgrund mehrerer Mängel und Fehler in cmd.exe werden temporäre Shell-Skripte mit certutil erstellt, indem dieses Programm zum Dekodieren von Base64-Eingaben verwendet wird, da cmd.exe bei Nicht-ASCII-Eingaben abstürzt. XPipe kann dafür auch PowerShell nutzen, was jedoch langsamer ist.\n\nDadurch wird jegliche Nutzung von „certutil“ auf Windows-Systemen zur Realisierung bestimmter Funktionen deaktiviert und stattdessen auf PowerShell zurückgegriffen. Das könnte einigen Antivirenprogrammen gefallen, da manche von ihnen die Nutzung von „certutil“ blockieren.
more=Mehr
translate=Übersetzungen
allConnections=Alle Verbindungen
allScripts=Alle Skripte
