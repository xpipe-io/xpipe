rdpClient=RDP-Client
rdpClientDescription=Das RDP-Client-Programm, das beim Herstellen von RDP-Verbindungen aufgerufen werden soll.\n\nBeachte, dass verschiedene Clients unterschiedliche Funktionen und Integrationsmöglichkeiten bieten. Einige Clients unterstützen die automatische Übertragung von Passwörtern nicht, sodass du diese beim Start weiterhin manuell eingeben musst.
localShell=Lokale Shell
themeDescription=Dein bevorzugtes Anzeigedesign.
dontAutomaticallyStartVmSshServer=Den SSH-Server für VMs nicht automatisch starten, wenn er benötigt wird
dontAutomaticallyStartVmSshServerDescription=Jede Shell-Verbindung zu einer auf einem Hypervisor laufenden VM wird über SSH hergestellt. XPipe kann den installierten SSH-Server bei Bedarf automatisch starten. Wenn du das aus Sicherheitsgründen nicht möchtest, kannst du dieses Verhalten einfach mit dieser Option deaktivieren.
confirmGitShareTitle=Git-Synchronisierung
confirmGitShareContent=Möchtest du die ausgewählte Datei zu deinem Git-Vault-Repository hinzufügen? Dadurch wird eine verschlüsselte Version der Datei in dein Git-Vault kopiert und deine Änderungen werden festgeschrieben. Du hast dann auf allen synchronisierten Desktops Zugriff auf die Datei.
gitShareFileTooltip=Füge die Datei zum Datenverzeichnis des Git-Tresors hinzu, damit sie automatisch synchronisiert wird.\n\nDiese Aktion kann nur genutzt werden, wenn der Git-Tresor in den Einstellungen aktiviert ist.
performanceMode=Leistungsmodus
performanceModeDescription=Deaktiviert alle visuellen Effekte, die nicht erforderlich sind, um die Leistung der Anwendung zu verbessern.
dontAcceptNewHostKeys=Neue SSH-Hostschlüssel nicht automatisch akzeptieren
dontAcceptNewHostKeysDescription=XPipe akzeptiert standardmäßig automatisch Hostschlüssel von Systemen, für die dein SSH-Client noch keinen bekannten Hostschlüssel gespeichert hat. Sollte sich jedoch ein bekannter Hostschlüssel geändert haben, lehnt es die Verbindung ab, solange du den neuen nicht akzeptierst.\n\nWenn du dieses Verhalten deaktivierst, kannst du alle Hostschlüssel überprüfen, auch wenn zunächst kein Konflikt vorliegt.
uiScale=UI-Skalierung
uiScaleDescription=Ein benutzerdefinierter Skalierungswert, der unabhängig von deiner systemweiten Anzeigeskalierung eingestellt werden kann. Die Werte werden in Prozent angegeben, sodass z. B. ein Wert von 150 zu einer UI-Skalierung von 150 % führt.
editorProgram=Editor-Programm
editorProgramDescription=Der Standard-Texteditor, der beim Bearbeiten jeglicher Art von Textdaten verwendet wird.
windowOpacity=Fenster-Deckkraft
windowOpacityDescription=Ändert die Deckkraft des Fensters, damit man sehen kann, was im Hintergrund passiert.
useSystemFont=Systemschriftart verwenden
openDataDir=Vault-Datenverzeichnis
openDataDirButton=Datenverzeichnis öffnen
openDataDirDescription=Wenn du zusätzliche Dateien, wie zum Beispiel SSH-Schlüssel, systemübergreifend mit deinem Git-Repository synchronisieren möchtest, kannst du sie im Verzeichnis „storage data“ ablegen. Bei allen dort referenzierten Dateien werden die Dateipfade auf jedem synchronisierten System automatisch angepasst.
#custom
updates=Updates
selectAll=Alles auswählen
advanced=Erweitert
thirdParty=Hinweise zu Open Source
eulaDescription=Lies dir die Endbenutzer-Lizenzvereinbarung für die XPipe-Anwendung durch
thirdPartyDescription=Die Open-Source-Lizenzen von Bibliotheken von Drittanbietern anzeigen
enableGitStorage=Synchronisierung aktivieren
gitSync=Git-Synchronisierung
enableGitStorageDescription=Wenn diese Option aktiviert ist, richtet XPipe ein Git-Repository für den lokalen Tresor ein und speichert alle Änderungen darin. Beachte, dass hierfür Git installiert sein muss und dass dies das Laden und Speichern verlangsamen kann.\n\nAlle Kategorien, die synchronisiert werden sollen, müssen ausdrücklich als synchronisiert markiert werden.
storageGitRemote=URL für die Remote-Synchronisierung
storageGitRemoteDescription=Wenn diese Option aktiviert ist, ruft XPipe beim Laden automatisch alle Änderungen ab und überträgt beim Speichern alle Änderungen an das Remote-Repository.\n\nSo kannst du deinen Tresor zwischen mehreren XPipe-Installationen teilen. Es werden HTTP- und SSH-URLs sowie lokale Verzeichnisse unterstützt.
vault=Tresor
vaultAccess=Zugriff auf den Tresor
workspaceLockDescription=Legt ein benutzerdefiniertes Passwort fest, um alle in XPipe gespeicherten sensiblen Daten zu verschlüsseln.\n\nDies sorgt für mehr Sicherheit, da es eine zusätzliche Verschlüsselungsebene für deine gespeicherten sensiblen Daten bietet. Du wirst dann beim Start von XPipe aufgefordert, das Passwort einzugeben.
useSystemFontDescription=Legt fest, ob deine Standard-Systemschriftart oder die Schriftart „Inter“ verwendet werden soll, die in XPipe enthalten ist.
windowOptions=Fensteroptionen
saveWindowLocation=Speicherort des Fensters
saveWindowLocationDescription=Legt fest, ob die Fensterkoordinaten beim Neustart gespeichert und wiederhergestellt werden sollen.
startupShutdown=Starten / Herunterfahren
showChildrenConnectionsInParentCategory=Unterkategorien in der übergeordneten Kategorie anzeigen
showChildrenConnectionsInParentCategoryDescription=Ob alle Verbindungen in Unterkategorien einbezogen werden sollen, wenn eine bestimmte übergeordnete Kategorie ausgewählt ist.\n\nWenn diese Option deaktiviert ist, verhalten sich die Kategorien eher wie klassische Ordner, die nur ihren direkten Inhalt anzeigen, ohne Unterordner einzubeziehen.
condenseConnectionDisplay=Anzeige der Verbindungen komprimieren
condenseConnectionDisplayDescription=Stell sicher, dass jede Verbindung auf oberster Ebene weniger vertikalen Platz einnimmt, damit die Verbindungsliste kompakter wird.
openConnectionSearchWindowOnConnectionCreation=Fenster zur Verbindungssuche beim Erstellen einer Verbindung öffnen
openConnectionSearchWindowOnConnectionCreationDescription=Ob das Fenster zur Suche nach verfügbaren Unterverbindungen beim Hinzufügen einer neuen Shell-Verbindung automatisch geöffnet werden soll oder nicht.
