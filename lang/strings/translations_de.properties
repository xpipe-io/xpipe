renameAll=Alle umbenennen
logging=Protokollierung
enableTerminalLogging=Terminal-Protokollierung aktivieren
enableTerminalLoggingDescription=Aktiviert die clientseitige Protokollierung für alle Terminalsitzungen. Alle Ein- und Ausgaben der Terminalsitzung werden in eine Sitzungsprotokolldatei geschrieben. Beachte, dass sensible Informationen wie Passwortabfragen nicht aufgezeichnet werden.
terminalLoggingDirectory=Protokolle von Terminalsitzungen
terminalLoggingDirectoryDescription=Alle Protokolle werden im XPipe-Datenverzeichnis auf deinem lokalen System gespeichert.
openSessionLogs=Sitzungsprotokolle öffnen
sessionLogging=Terminal-Protokollierung
sessionActive=Für diese Verbindung läuft gerade eine Hintergrundsitzung.\n\nUm diese Sitzung manuell zu beenden, klick auf die Statusanzeige.
skipValidation=Validierung überspringen
scriptsIntroHeader=Über Skripte
scriptsIntroContent=Du kannst Skripte beim Shell-Start, im Dateibrowser und auf Abruf ausführen. Du kannst Skripte selbst in XPipe erstellen oder vorhandene Skripte von deinem lokalen System oder aus einem entfernten Git-Repository importieren.
scriptsIntroBottomHeader=Verwendung von Skripten
scriptsIntroBottomContent=Es gibt eine Vielzahl von Beispielskripten für den Einstieg. Du kannst auf die Bearbeiten-Schaltfläche der einzelnen Skripte klicken, um zu sehen, wie sie umgesetzt sind. Skripte müssen erst aktiviert werden, damit sie ausgeführt werden und in den Menüs angezeigt werden; dafür gibt es bei jedem Skript einen Schalter.
scriptsIntroBottomButton=Erste Schritte
scriptSourcesIntroHeader=Skriptquellen
scriptSourcesIntroContent=Du kannst benutzerdefinierte Skriptquellen hinzufügen, um sofortigen Zugriff auf eine ganze Sammlung von Shell-Skripten zu haben. Sowohl lokale Quellen als auch entfernte Git-Repositorys werden als Quellen unterstützt. Alle aus der Quelle erkannten Skripte stehen automatisch zur Verfügung.
scriptSourcesIntroButton=Quelle hinzufügen ...
checkForSecurityUpdates=Auf Sicherheitsupdates prüfen
checkForSecurityUpdatesDescription=XPipe kann unabhängig von den normalen Funktionsupdates nach potenziellen Sicherheitsupdates suchen. Wenn diese Option aktiviert ist, wird zumindest die Installation wichtiger Sicherheitsupdates empfohlen, auch wenn die normale Update-Prüfung deaktiviert ist.\n\nWenn du diese Einstellung deaktivierst, wird keine externe Versionsabfrage durchgeführt, und du wirst nicht über Sicherheitsupdates benachrichtigt.
