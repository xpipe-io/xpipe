terminalPromptConfig=Konfigurationsdatei
terminalPromptConfigDescription=Die benutzerdefinierte Konfigurationsdatei, die auf die Eingabeaufforderung angewendet werden soll. Diese Konfiguration wird beim Start des Terminals automatisch auf dem Zielsystem eingerichtet und als Standardkonfiguration für die Eingabeaufforderung verwendet.\n\nWenn du die vorhandene Standardkonfigurationsdatei auf jedem System verwenden möchtest, kannst du dieses Feld leer lassen.
