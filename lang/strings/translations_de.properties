downloadsDirectoryDescription=Das benutzerdefinierte Verzeichnis, in das heruntergeladene Dateien gespeichert werden, wenn du auf die Schaltfläche „In den Download-Ordner verschieben“ klickst. Standardmäßig verwendet XPipe deinen Benutzer-Download-Ordner.
