terminalEnvironment=Terminal-Umgebung
terminalEnvironmentDescription=Falls du Funktionen einer lokalen Linux-basierten WSL-Umgebung für deine Terminal-Anpassung nutzen möchtest, kannst du diese als Terminalumgebung verwenden.\n\nAlle benutzerdefinierten Terminal-Init-Befehle und die Konfiguration des Terminal-Multiplexers werden dann in dieser WSL-Distribution ausgeführt.
terminalInitScript=Terminal-Init-Skript
terminalInitScriptDescription=Befehle, die in der Terminalumgebung ausgeführt werden sollen, bevor die Verbindung hergestellt wird. Damit kannst du die Terminalumgebung beim Start konfigurieren.
terminalMultiplexer=Terminal-Multiplexer
terminalMultiplexerDescription=Der Terminal-Multiplexer, der als Alternative zu Tabulatoren in einem Terminal verwendet werden kann. Dadurch werden bestimmte Funktionen der Terminalverwaltung, z. B. die Tabulatorverarbeitung, durch die Multiplexer-Funktionalität ersetzt.\n\nVoraussetzung ist, dass die entsprechende Multiplexer-Ausführungsdatei auf dem System installiert ist.
terminalMultiplexerWindowsDescription=Der Terminal-Multiplexer dient als Alternative zu Tabulatoren in einem Terminal. Er ersetzt bestimmte Funktionen der Terminalverwaltung, z. B. die Tabulatorverarbeitung, durch die Multiplexer-Funktionalität.\n\nVoraussetzung ist die Verwendung einer WSL-Terminalumgebung unter Windows sowie die Installation der Multiplexer-Ausführungsdatei auf dem WSL-System.
terminalAlwaysPauseOnExit=Beim Beenden immer eine Pause einlegen
terminalAlwaysPauseOnExitDescription=Wenn diese Option aktiviert ist, wirst du beim Beenden einer Terminalsitzung immer gefragt, ob du die Sitzung neu starten oder schließen möchtest. Ist sie deaktiviert, fragt XPipe nur bei fehlgeschlagenen Verbindungen nach, die mit einem Fehler beendet werden.
