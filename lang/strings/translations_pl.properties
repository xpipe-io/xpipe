backgroundSessionInactivityTimeoutDescription=Liczba sekund, po upływie których zamknięte zostaną sesje powłoki działające w tle, jeśli nie były używane.\n\nDomyślnie XPipe utrzymuje połączenia powłoki z systemami zdalnymi otwarte w tle, żeby móc z nich skorzystać później i przyspieszyć działanie programu. Jeśli chcesz, żeby te sesje były automatycznie zamykane po upływie określonego czasu, możesz ustawić tę opcję.
