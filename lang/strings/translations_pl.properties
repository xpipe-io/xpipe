apiKey=Klucz API
apiKeyDescription=Klucz API służący do uwierzytelniania żądań kierowanych do demona XPipe. Więcej informacji o uwierzytelnianiu znajdziesz w ogólnej dokumentacji API.
disableApiAuthentication=Wyłącz uwierzytelnianie API
disableApiAuthenticationDescription=Wyłącza wszystkie wymagane metody uwierzytelniania, dzięki czemu każde nieautoryzowane żądanie zostanie obsłużone.\n\nUwierzytelnianie powinno być wyłączone wyłącznie w celach programistycznych.
api=API
storeIntroImportContent=Korzystasz już z XPipe na innym systemie? Zsynchronizuj swoje istniejące połączenia między wieloma systemami za pomocą zdalnego repozytorium Git. Jeśli jeszcze tego nie zrobiłeś, możesz zsynchronizować połączenia w dowolnym momencie później.
storeIntroImportButton=Synchronizacja połączeń...
storeIntroImportHeader=Importuj połączenia
showNonRunningChildren=Pokaż systemy, które nie działają
httpApi=Interfejs API HTTP
isOnlySupportedLimit=jest obsługiwany tylko w ramach licencji profesjonalnej, jeśli masz więcej niż $COUNT$ ne połączeń
areOnlySupportedLimit=jest obsługiwany tylko w ramach licencji profesjonalnej, gdy masz więcej niż $COUNT$ ne połączeń
enabled=Włączone
copyId=Skopiuj identyfikator API
requireDoubleClickForConnections=Wymagaj podwójnego kliknięcia, żeby nawiązać połączenie
requireDoubleClickForConnectionsDescription=Jeśli ta opcja jest włączona, musisz dwukrotnie kliknąć połączenia, żeby je uruchomić. To przydatne, jeśli jesteś przyzwyczajony do dwukrotnego klikania.
clearTransferDescription=Wyczyść zaznaczenie
selectTab=Wybierz zakładkę
closeTab=Zamknij kartę
closeOtherTabs=Zamknij inne karty
closeAllTabs=Zamknij wszystkie karty
closeLeftTabs=Zamknij zakładki po lewej stronie
closeRightTabs=Zamknij karty po prawej stronie
addSerial=Szeregowe...
connect=Połącz
quickConnect=Szybkie połączenie
workspaces=Obszary robocze
manageWorkspaces=Zarządzaj obszarami roboczymi
addWorkspace=Dodaj obszar roboczy...
addWorkspaceDescription=Otwórz okno dialogowe tworzenia nowego obszaru roboczego
workspaceManagement=Zarządzaj obszarami roboczymi
workspaceManagementDescription=Obszary robocze to odrębne konfiguracje uruchamiania XPipe. Każdy obszar roboczy ma katalog danych, w którym wszystkie dane są przechowywane lokalnie. Obejmuje to dane połączeń, ustawienia i inne informacje.\n\nJeśli korzystasz z funkcji synchronizacji, możesz też zsynchronizować każdy obszar roboczy z innym repozytorium Git.
workspaceName=Nazwa obszaru roboczego
workspaceNameDescription=Nazwa wyświetlana obszaru roboczego
workspacePath=Ścieżka do obszaru roboczego
workspacePathDescription=Lokalizacja katalogu danych obszaru roboczego
workspaceCreationAlertTitle=Tworzenie obszaru roboczego
developerForceSshTty=Wymuś SSH TTY
developerForceSshTtyDescription=Spraw, żeby wszystkie połączenia SSH przydzielały pty, żeby sprawdzić obsługę brakującego stderr i pty.
developerDisableSshTunnelGateways=Wyłącz tunelowanie przez bramę SSH
developerDisableSshTunnelGatewaysDescription=Nie używaj sesji tunelowych dla bram, tylko łącz się bezpośrednio z systemem.
ttyWarning=Połączenie przydzieliło na siłę pty/tty i nie udostępnia osobnego strumienia stderr.\n\nMoże to powodować kilka problemów.\n\nJeśli to możliwe, spróbuj sprawić, żeby polecenie nawiązywania połączenia nie przydzielało pty.
xshellSetup=Konfiguracja Xshell
termiusSetup=Konfiguracja Termiusa
tryPtbDescription=Wypróbuj nowe funkcje już na wczesnym etapie w wersjach deweloperskich XPipe
confirmVaultUnencryptTitle=Potwierdź odszyfrowanie sejfu
confirmVaultUnencryptContent=Naprawdę chcesz wyłączyć zaawansowane szyfrowanie sejfu? Spowoduje to usunięcie dodatkowego szyfrowania przechowywanych danych i nadpisanie istniejących danych.
enableHttpApi=Włącz API HTTP
enableHttpApiDescription=Włącza API, umożliwiając programom zewnętrznym wywoływanie demona XPipe w celu wykonywania operacji na zarządzanych połączeniach.
chooseCustomIcon=Wybierz własną ikonę
gitVault=Git vault
fileBrowser=Przeglądarka plików
confirmAllDeletions=Potwierdź wszystkie usunięcia
confirmAllDeletionsDescription=Czy wyświetlać okno dialogowe z prośbą o potwierdzenie dla wszystkich operacji usuwania. Domyślnie potwierdzenie jest wymagane tylko w przypadku katalogów.
yesterday=Wczoraj
green=Zielony
yellow=Żółty
blue=Niebieski
red=Czerwony
cyan=Cyjan
purple=Fioletowy
asktextAlertTitle=Monit
fileWriteSudoTitle=Zapis do pliku za pomocą sudo
fileWriteSudoContent=Plik, do którego próbujesz zapisać dane, nie ma uprawnień do zapisu dla twojego użytkownika. Czy chcesz zapisać ten plik jako root za pomocą sudo? Spowoduje to automatyczne podniesienie uprawnień do roota przy użyciu istniejących danych logowania lub poprzez monit.
dontAllowTerminalRestart=Nie zezwalaj na ponowne uruchomienie terminala
dontAllowTerminalRestartDescription=Domyślnie sesje terminala można wznowić po ich zakończeniu z poziomu samego terminala. Żeby to umożliwić, XPipe akceptuje te zewnętrzne żądania z terminala, by ponownie uruchomić sesję\n\nXPipe nie ma żadnej kontroli nad terminalem ani nad tym, skąd pochodzi to wywołanie, więc złośliwe aplikacje lokalne też mogą wykorzystać tę funkcję do nawiązywania połączeń przez XPipe. Wyłączenie tej funkcji zapobiega takiej sytuacji.
openDocumentation=Otwórz dokumentację
openDocumentationDescription=Zajrzyj na stronę dokumentacji XPipe, żeby dowiedzieć się więcej o tym problemie
renameAll=Zmień nazwy wszystkich
logging=Rejestrowanie
enableTerminalLogging=Włącz rejestrowanie terminala
enableTerminalLoggingDescription=Włącza rejestrowanie po stronie klienta dla wszystkich sesji terminala. Wszystkie dane wejściowe i wyjściowe sesji terminala są zapisywane w pliku dziennika sesji. Pamiętaj, że żadne poufne informacje, takie jak monity o hasło, nie są rejestrowane.
terminalLoggingDirectory=Dzienniki sesji terminala
terminalLoggingDirectoryDescription=Wszystkie logi są zapisywane w katalogu danych XPipe na twoim komputerze.
openSessionLogs=Otwórz logi sesji
sessionLogging=Rejestracja danych z terminala
sessionActive=Dla tego połączenia działa sesja w tle.\n\nŻeby ręcznie zakończyć tę sesję, kliknij wskaźnik stanu.
skipValidation=Pomiń sprawdzanie poprawności
scriptsIntroHeader=O skryptach
scriptsIntroContent=Skrypty możesz uruchamiać podczas inicjalizacji powłoki, w przeglądarce plików oraz na żądanie. Skrypty możesz tworzyć samodzielnie w XPipe albo importować istniejące z lokalnego systemu lub ze zdalnego repozytorium Git.
scriptsIntroBottomHeader=Korzystanie ze skryptów
scriptsIntroBottomContent=Masz do wyboru różne przykładowe skrypty na początek. Możesz kliknąć przycisk edycji przy poszczególnych skryptach, żeby zobaczyć, jak są zaimplementowane. Żeby skrypty działały i pojawiały się w menu, trzeba je najpierw włączyć – przy każdym skrypcie jest do tego przełącznik.
scriptsIntroBottomButton=Zacznij
scriptSourcesIntroHeader=Źródła skryptów
scriptSourcesIntroContent=Możesz dodać własne źródła skryptów, żeby mieć natychmiastowy dostęp do całej kolekcji skryptów powłoki. Jako źródła obsługiwane są zarówno lokalne lokalizacje, jak i zdalne repozytoria Git. Wszystkie wykryte skrypty z danego źródła staną się dostępne automatycznie.
scriptSourcesIntroButton=Dodaj źródło...
checkForSecurityUpdates=Sprawdź dostępność aktualizacji zabezpieczeń
checkForSecurityUpdatesDescription=XPipe może sprawdzać dostępność potencjalnych aktualizacji zabezpieczeń niezależnie od zwykłych aktualizacji funkcji. Gdy ta opcja jest włączona, program będzie zalecał instalację przynajmniej ważnych aktualizacji zabezpieczeń, nawet jeśli zwykłe sprawdzanie aktualizacji jest wyłączone.\n\nWyłączenie tej opcji spowoduje, że nie będą wysyłane żadne zapytania o wersję, a ty nie będziesz otrzymywać powiadomień o aktualizacjach zabezpieczeń.
clickToDock=Kliknij, żeby zadokować terminal
terminalStarting=Czekam na uruchomienie terminala...
pinTab=Zakładka „Pin”
unpinTab=Odpiąć kartę
pinned=Przypięte
enableConnectionHubTerminalDocking=Przymocuj okno terminala do centrum połączeń
enableConnectionHubTerminalDockingDescription=Możesz zadokować okna terminala do okna aplikacji XPipe w centrum połączeń, żeby zasymulować coś w rodzaju zintegrowanego terminala. Okna terminala są wtedy zarządzane przez XPipe tak, żeby zawsze mieściły się w doku.
enableFileBrowserTerminalDocking=Włącz dokowanie terminala przeglądarki plików
enableFileBrowserTerminalDockingDescription=Możesz zadokować okna terminala do okna aplikacji XPipe w przeglądarce plików, żeby zasymulować coś w rodzaju zintegrowanego terminala. Okna terminala są wtedy zarządzane przez XPipe tak, żeby zawsze mieściły się w doku.
downloadsDirectory=Katalog plików do pobrania
downloadsDirectoryDescription=Katalog, do którego będą zapisywane pobrane pliki po kliknięciu przycisku „Przenieś do folderu pobranych plików”. Domyślnie XPipe używa katalogu „Pobrane” twojego konta użytkownika.
pinLocalMachineOnStartup=Przypnij kartę „Komputer lokalny” przy uruchomieniu
pinLocalMachineOnStartupDescription=Automatycznie otwórz kartę komputera lokalnego i przypnij ją. Jest to przydatne, jeśli często korzystasz z podzielonego okna przeglądarki plików, w którym otwarte są zarówno komputer lokalny, jak i zdalny system plików.
terminalErrorDescription=Ten błąd jest krytyczny i XPipe nie może dalej działać, dopóki go nie naprawisz.
groupName=Nazwa grupy
chmodPermissions=Nowe uprawnienia
editFilesWithDoubleClick=Edytuj pliki, klikając je dwukrotnie
editFilesWithDoubleClickDescription=Gdy ta opcja jest włączona, dwukrotne kliknięcie pliku spowoduje jego bezpośrednie otwarcie w edytorze tekstu zamiast wyświetlania menu kontekstowego.
censorMode=Tryb cenzury
censorModeDescription=Zamaskowuje wszelkie informacje, takie jak nazwy hostów, nazwy użytkowników, nazwy połączeń i inne.\n\nTo przydatne, jeśli chcesz zrobić zrzut ekranu lub udostępnić ekran XPipe i nie chcesz ujawnić żadnych informacji.
addIdentity=Tożsamość ...
identities=Tożsamości
addMacro=Czynność ...
identitiesIntroHeader=O tożsamościach
identitiesIntroContent=Jeśli często używasz tych samych kombinacji nazw użytkownika, haseł i kluczy, warto stworzyć tożsamości wielokrotnego użytku. Dzięki temu będziesz mógł szybko z nich korzystać podczas dodawania nowych połączeń.
identitiesIntroBottomHeader=Współdzielenie tożsamości
identitiesIntroBottomContent=Możesz dodawać tożsamości lokalnie lub zsynchronizować je z repozytorium Git, jeśli ta opcja jest włączona. Dzięki temu możesz wybiórczo udostępniać tożsamości na wielu systemach oraz innym członkom zespołu.
identitiesIntroBottomButton=Synchronizacja ustawień
identitiesIntroButton=Utwórz tożsamość
userName=Nazwa użytkownika
vaultAuth=Domyślne szyfrowanie sejfu
userAuth=Osobiste hasło użytkownika
roleAuth=Kontrola dostępu oparta na rolach
team=Zespół
teamSettings=Ustawienia zespołu
teamVaults=Skarbiec zespołu
vaultTypeNameDefault=Domyślny sejf
vaultTypeNamePersonal=Osobisty sejf
vaultTypeNameTeam=Skarbiec zespołu
teamVaultsDescription=Skarbiec zespołowy pozwala wielu użytkownikom i rolom na bezpieczny dostęp do wspólnego skarbca. Możesz skonfigurować połączenia i tożsamości tak, żeby były wspólne dla wszystkich użytkowników albo dostępne tylko dla poszczególnych użytkowników i ról – szyfrując je ich własnym kluczem. Inni użytkownicy skarbca nie mają dostępu do połączeń i tożsamości osobistych ani związanych z rolami, jeśli nie mają dostępu do klucza.
vaultTypeContentDefault=Obecnie korzystasz z domyślnego sejfu, w którym nie ustawiono jeszcze użytkownika ani niestandardowego hasła. Tajne dane są szyfrowane za pomocą lokalnego klucza sejfu.\n\nMożesz przejść na sejf osobisty, tworząc konto użytkownika sejfu. Dzięki temu będziesz mógł szyfrować dane w sejfie własnym hasłem, które musisz podawać przy każdym logowaniu, żeby odblokować sejf.
vaultTypeContentPersonal=W tej chwili korzystasz z osobistego sejfu dla swojego konta. Tajne dane są szyfrowane Twoim osobistym hasłem.
vaultTypeContentTeam=Korzystasz teraz ze skarbca zespołowego, który pozwala wielu użytkownikom na bezpieczny dostęp do wspólnego skarbca. Możesz skonfigurować połączenia i tożsamości tak, żeby były wspólne dla wszystkich użytkowników albo dostępne tylko dla ciebie osobiście lub dla twojej roli – wystarczy je zaszyfrować swoim kluczem osobistym lub kluczem roli. Inni użytkownicy skarbca nie mają dostępu do twoich osobistych i związanych z rolą połączeń oraz tożsamości, jeśli nie mają dostępu do klucza.
roleManagement=Zarządzanie rolami
roleManagementEmpty=Zarządzanie rolami
roleManagementDescription=Zarządzaj istniejącymi rolami w skarbcu lub twórz nowe. Każda rola w skarbcu ma swój własny, indywidualny klucz tajny, który służy do szyfrowania połączeń i tożsamości, które powinny być dostępne tylko dla tej roli, a nie dla innych.
roleManagementEmptyDescription=Zarządzaj istniejącymi rolami w skarbcu lub twórz nowe. Każda rola w skarbcu ma swój własny, indywidualny klucz tajny, który służy do szyfrowania połączeń i tożsamości, które powinny być dostępne tylko dla tej roli, a nie dla innych.\n\nKonta oparte na rolach dla zespołu są obsługiwane w planie profesjonalnym.
userManagement=Zarządzanie użytkownikami
