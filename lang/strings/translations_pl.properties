rdpConfiguration=Konfiguracja zdalnego pulpitu
rdpClient=Klient RDP
rdpClientDescription=Program kliencki RDP, który należy uruchomić, żeby nawiązać połączenie RDP.\n\nPamiętaj, że różne klienty mają różne możliwości i poziom integracji. Niektóre z nich nie obsługują automatycznego przekazywania haseł, więc nadal musisz je wpisać przy uruchamianiu.
localShell=Lokalna powłoka
themeDescription=Twój ulubiony motyw wyświetlania.
dontAutomaticallyStartVmSshServer=Nie uruchamiaj automatycznie serwera SSH dla maszyn wirtualnych, gdy jest to potrzebne
dontAutomaticallyStartVmSshServerDescription=Każde połączenie powłoki z maszyną wirtualną działającą w hiperwizorze odbywa się przez SSH. XPipe może automatycznie uruchomić zainstalowany serwer SSH, gdy zajdzie taka potrzeba. Jeśli nie chcesz tego z powodów bezpieczeństwa, możesz po prostu wyłączyć tę funkcję za pomocą tej opcji.
confirmGitShareTitle=Synchronizacja Git
confirmGitShareContent=Chcesz dodać wybrany plik do swojego repozytorium Git Vault? Spowoduje to skopiowanie zaszyfrowanej wersji pliku do Twojego Git Vault i zatwierdzenie zmian. Będziesz wtedy mieć dostęp do tego pliku na wszystkich zsynchronizowanych komputerach.
gitShareFileTooltip=Dodaj plik do katalogu danych git vault, żeby był automatycznie synchronizowany.\n\nTę opcję możesz użyć tylko wtedy, gdy git vault jest włączony w ustawieniach.
performanceMode=Tryb wydajności
performanceModeDescription=Wyłącza wszystkie efekty wizualne, które nie są niezbędne, żeby poprawić wydajność aplikacji.
dontAcceptNewHostKeys=Nie akceptuj automatycznie nowych kluczy hosta SSH
dontAcceptNewHostKeysDescription=XPipe domyślnie automatycznie akceptuje klucze hosta z systemów, w których twój klient SSH nie ma jeszcze zapisanych żadnych znanych kluczy hosta. Jeśli jednak któryś ze znanych kluczy hosta uległ zmianie, program odmówi połączenia, dopóki nie zaakceptujesz nowego klucza.\n\nWyłączenie tej funkcji pozwala na sprawdzenie wszystkich kluczy hosta, nawet jeśli początkowo nie ma żadnego konfliktu.
uiScale=Skala interfejsu użytkownika
uiScaleDescription=Niestandardowa wartość skalowania, którą można ustawić niezależnie od ogólnosystemowej skali wyświetlania. Wartości podaje się w procentach, więc np. wartość 150 spowoduje skalowanie interfejsu użytkownika do 150%.
editorProgram=Program do edycji
editorProgramDescription=Domyślny edytor tekstu, którego używasz do edycji wszelkiego rodzaju danych tekstowych.
windowOpacity=Przezroczystość okna
windowOpacityDescription=Zmienia przezroczystość okna, żebyś mógł śledzić, co się dzieje w tle.
useSystemFont=Użyj czcionki systemowej
openDataDir=Katalog danych sejfu
openDataDirButton=Katalog otwartych danych
openDataDirDescription=Jeśli chcesz zsynchronizować dodatkowe pliki, takie jak klucze SSH, między systemami a swoim repozytorium Git, możesz umieścić je w katalogu danych do przechowywania. Ścieżki dostępu do wszystkich plików w tym katalogu zostaną automatycznie dostosowane na każdym zsynchronizowanym systemie.
updates=Aktualizacje
selectAll=Zaznacz wszystko
advanced=Zaawansowane
thirdParty=Informacje o oprogramowaniu open source
eulaDescription=Przeczytaj umowę licencyjną użytkownika końcowego aplikacji XPipe
thirdPartyDescription=Zobacz licencje open source bibliotek innych firm
enableGitStorage=Włącz synchronizację
gitSync=Synchronizacja Git
enableGitStorageDescription=Po włączeniu tej opcji XPipe utworzy repozytorium git dla lokalnego sejfu i będzie zapisywać w nim wszelkie zmiany. Pamiętaj, że wymaga to zainstalowania git i może spowolnić ładowanie oraz zapisywanie danych.\n\nWszystkie kategorie, które mają być synchronizowane, trzeba wyraźnie oznaczyć jako zsynchronizowane.
storageGitRemote=Adres URL do zdalnej synchronizacji
storageGitRemoteDescription=Jeśli ta opcja jest włączona, XPipe automatycznie pobierze wszelkie zmiany podczas ładowania i prześle je do zdalnego repozytorium podczas zapisywania.\n\nDzięki temu możesz udostępniać swój sejf między wieloma instalacjami XPipe. Obsługuje adresy URL w protokołach HTTP i SSH, a także lokalne katalogi.
vault=Vault
vaultAccess=Dostęp do sejfu
workspaceLockDescription=Ustawia niestandardowe hasło do szyfrowania wszelkich poufnych informacji przechowywanych w XPipe.\n\nZapewnia to większe bezpieczeństwo, bo dodaje dodatkową warstwę szyfrowania dla twoich poufnych danych. Po uruchomieniu XPipe pojawi się monit o podanie hasła.
useSystemFontDescription=Określa, czy ma być używana domyślna czcionka systemowa, czy czcionka „Inter”, która jest dołączona do programu XPipe.
windowOptions=Opcje okna
saveWindowLocation=Zapisz położenie okna
saveWindowLocationDescription=Określa, czy współrzędne okna mają być zapisywane i przywracane po ponownym uruchomieniu.
startupShutdown=Uruchamianie / Wyłączanie
showChildrenConnectionsInParentCategory=Pokaż podkategorie w kategorii nadrzędnej
showChildrenConnectionsInParentCategoryDescription=Czy uwzględniać wszystkie połączenia znajdujące się w podkategoriach po wybraniu konkretnej kategorii nadrzędnej.\n\nJeśli ta opcja jest wyłączona, kategorie działają bardziej jak klasyczne foldery, które pokazują tylko swoją bezpośrednią zawartość, bez uwzględniania podfolderów.
condenseConnectionDisplay=Zwięzłe wyświetlanie połączeń
condenseConnectionDisplayDescription=Spraw, żeby każde połączenie najwyższego poziomu zajmowało mniej miejsca w pionie, żeby lista połączeń była bardziej zwarta.
openConnectionSearchWindowOnConnectionCreation=Otwórz okno wyszukiwania połączeń podczas tworzenia połączenia
openConnectionSearchWindowOnConnectionCreationDescription=Czy po dodaniu nowego połączenia powłoki ma się automatycznie otwierać okno do wyszukiwania dostępnych połączeń podrzędnych.
system=System
application=Aplikacja
storage=Pamięć masowa
runOnStartup=Uruchom przy starcie systemu
closeBehaviour=Zachowanie przy zamykaniu
closeBehaviourDescription=Określa, jak XPipe ma postąpić po zamknięciu głównego okna.
language=Język
languageDescription=Język wyświetlania, którego chcesz używać. Tłumaczenia są ulepszane dzięki wkładowi społeczności. Możesz pomóc w tłumaczeniu, zgłaszając poprawki na GitHubie.
lightTheme=Motyw jasny
darkTheme=Ciemny motyw
exit=Zamknij XPipe
continueInBackground=Kontynuuj w tle
minimizeToTray=Zminimalizuj do paska zadań
closeBehaviourAlertTitle=Ustaw sposób zamykania
closeBehaviourAlertTitleHeader=Wybierz, co ma się stać po zamknięciu okna. Wszystkie aktywne połączenia zostaną zamknięte po zamknięciu aplikacji.
startupBehaviour=Zachowanie podczas uruchamiania
startupBehaviourDescription=Określa domyślne zachowanie aplikacji po uruchomieniu XPipe.
clearCachesAlertTitle=Wyczyść pamięć podręczną
clearCachesAlertContent=Chcesz wyczyścić wszystkie pamięci podręczne XPipe? Spowoduje to usunięcie wszystkich danych z pamięci podręcznej, które zostały zapisane w celu poprawy komfortu użytkowania.
startGui=Uruchom GUI
startInTray=Uruchom z paska zadań
startInBackground=Uruchom w tle
clearCaches=Wyczyść pamięć podręczną...
clearCachesDescription=Usuń wszystkie dane z pamięci podręcznej
cancel=Anuluj
notAnAbsolutePath=To nie jest ścieżka bezwzględna
notADirectory=To nie jest katalog
notAnEmptyDirectory=Katalog nie jest pusty
automaticallyCheckForUpdates=Sprawdź, czy są aktualizacje
automaticallyCheckForUpdatesDescription=Gdy ta opcja jest włączona, po pewnym czasie, gdy XPipe działa, automatycznie pobierane są informacje o nowych wersjach. Nadal musisz jednak wyraźnie potwierdzić instalację każdej aktualizacji.
developerMode=Tryb programisty
developerModeDescription=Po włączeniu tej opcji będziesz mieć dostęp do wielu dodatkowych funkcji, które przydadzą się podczas tworzenia oprogramowania.
editor=Edytor
custom=Niestandardowy
passwordManager=Menedżer haseł
externalPasswordManager=Zewnętrzny menedżer haseł
passwordManagerDescription=Lokalnie zainstalowany menedżer haseł, z którym ma się zintegrować.\n\nJeśli masz zainstalowany menedżer haseł, możesz skonfigurować XPipe tak, żeby pobierał hasła właśnie z niego, dzięki czemu XPipe nie będzie musiało samodzielnie zarządzać hasłami.
passwordManagerTest=Przetestuj menedżera haseł
passwordManagerTestDescription=Sprawdź, czy integracja z menedżerem haseł działa poprawnie. Upewnij się, że używasz właściwego formatu identyfikatora, żeby odwołać się do wpisu w menedżerze haseł.
preferTerminalTabs=Wolę otwierać nowe karty
preferTerminalTabsDescription=Decyduje o tym, czy XPipe będzie próbował otwierać nowe karty w wybranym przez ciebie terminalu zamiast nowych okien. Nie każdy terminal obsługuje karty.
customRdpClientCommand=Polecenie niestandardowe
customRdpClientCommandDescription=Polecenie, które trzeba wykonać, żeby uruchomić niestandardowego klienta RDP.\n\nCiąg znaków zastępczy $FILE zostanie zastąpiony bezwzględną nazwą pliku .rdp w cudzysłowie, gdy zostanie wywołany. Pamiętaj, żeby ująć ścieżkę do pliku wykonywalnego w cudzysłowy, jeśli zawiera spacje.
customEditorCommand=Niestandardowe polecenie edytora
customEditorCommandDescription=Polecenie, które trzeba wykonać, żeby uruchomić edytor niestandardowy.\n\nCiąg zastępczy $FILE zostanie zastąpiony bezwzględną nazwą pliku w cudzysłowie po wywołaniu. Pamiętaj, żeby ująć ścieżkę do pliku wykonywalnego edytora w cudzysłowy, jeśli zawiera spacje.
encryptAllVaultData=Zaszyfruj wszystkie dane w sejfie
encryptAllVaultDataDescription=Po włączeniu tej opcji każda część danych połączenia z sejfem zostanie zaszyfrowana Twoim kluczem szyfrującym sejf użytkownika, a nie tylko same sekrety zawarte w tych danych. Zapewnia to dodatkową warstwę bezpieczeństwa dla innych parametrów, takich jak nazwy użytkowników, nazwy hostów itp., które domyślnie nie są szyfrowane w sejfie.\n\nTa opcja sprawi, że historia i różnice w skarbcu Git staną się bezużyteczne, bo nie będziesz już mógł zobaczyć oryginalnych zmian, a jedynie zmiany binarne.
vaultSecurity=Zabezpieczenia skarbca
developerDisableUpdateVersionCheck=Wyłącz sprawdzanie aktualizacji wersji
developerDisableUpdateVersionCheckDescription=Określa, czy narzędzie sprawdzające aktualizacje ma ignorować numer wersji podczas wyszukiwania aktualizacji.
shellCommandTest=Test poleceń powłoki
shellCommandTestDescription=Uruchom polecenie w sesji powłoki używanej wewnętrznie przez XPipe.
terminal=Terminal
terminalType=Emulator terminala
terminalConfiguration=Konfiguracja terminala
terminalCustomization=Dostosowywanie terminala
editorConfiguration=Konfiguracja edytora
defaultApplication=Aplikacja domyślna
initialSetup=Pierwsza konfiguracja
terminalTypeDescription=Domyślny terminal używany do otwierania połączeń z powłoką.\n\nPoziom obsługi funkcji różni się w zależności od terminala, a każdy z nich jest oznaczony jako zalecany lub niezalecany. Najlepsze wrażenia z użytkowania zapewni Ci zalecany terminal.
customTerminalCommand=Niestandardowe polecenie terminala
customTerminalCommandDescription=Polecenie, które trzeba wykonać, żeby otworzyć niestandardowy terminal z podanym poleceniem.\n\nXPipe stworzy tymczasowy skrypt powłoki uruchamiający, który zostanie wykonany przez twój terminal. Ciąg znaków zastępczy $CMD w podanym przez ciebie poleceniu zostanie zastąpiony przez rzeczywisty skrypt uruchamiający w momencie wywołania. Pamiętaj, żeby ująć ścieżkę do pliku wykonywalnego terminala w cudzysłowy, jeśli zawiera spacje.
clearTerminalOnInit=Wyczyść terminal przy uruchomieniu
clearTerminalOnInitDescription=Gdy ta opcja jest włączona, XPipe uruchomi polecenie „clear” po uruchomieniu nowej sesji terminala, żeby usunąć wszelkie niepotrzebne dane wyjściowe, które pojawiły się podczas uruchamiania sesji.
dontCachePasswords=Nie zapisuj w pamięci podręcznej haseł wprowadzanych na żądanie
dontCachePasswordsDescription=Określa, czy hasła, o które pyta program, mają być zapisywane w pamięci podręcznej XPipe, dzięki czemu nie musisz ich ponownie wpisywać w bieżącej sesji.\n\nJeśli ta opcja jest wyłączona, musisz ponownie wprowadzać wszystkie dane logowania za każdym razem, gdy system o to poprosi.
denyTempScriptCreation=Zablokuj tworzenie tymczasowych skryptów
denyTempScriptCreationDescription=Żeby zrealizować niektóre ze swoich funkcji, XPipe czasami tworzy tymczasowe skrypty powłoki w systemie docelowym, żeby ułatwić wykonywanie prostych poleceń. Nie zawierają one żadnych poufnych informacji i są tworzone wyłącznie w celach implementacyjnych.\n\nJeśli to zachowanie zostanie wyłączone, XPipe nie będzie tworzyć żadnych plików tymczasowych na zdalnym systemie. Ta opcja przydaje się w środowiskach o wysokim poziomie bezpieczeństwa, gdzie monitoruje się każdą zmianę w systemie plików. Jeśli ją wyłączysz, niektóre funkcje, np. środowiska powłoki i skrypty, nie będą działać tak, jak powinny.
disableCertutilUse=Wyłącz korzystanie z certutil w systemie Windows
useLocalFallbackShell=Użyj lokalnej powłoki awaryjnej
useLocalFallbackShellDescription=Przełącz się na inną lokalną powłokę, żeby obsługiwać operacje lokalne. W systemie Windows będzie to PowerShell, a na innych systemach – powłoka Bourne’a.\n\nZ tej opcji możesz skorzystać, jeśli standardowa lokalna powłoka jest wyłączona lub nie działa jak należy. Pamiętaj jednak, że po włączeniu tej opcji niektóre funkcje mogą nie działać tak, jak powinny.
disableCertutilUseDescription=Z powodu kilku niedociągnięć i błędów w cmd.exe tworzymy tymczasowe skrypty powłoki za pomocą certutil, wykorzystując go do dekodowania danych wejściowych w formacie base64, bo cmd.exe zawiesza się przy danych wejściowych spoza zestawu ASCII. XPipe może też używać do tego PowerShell, ale będzie to działało wolniej.\n\nTo wyłącza wszelkie użycie certutil w systemach Windows do realizacji niektórych funkcji i zamiast tego przechodzi na PowerShell. Może to ucieszyć niektóre programy antywirusowe, bo niektóre z nich blokują użycie certutil.
disableTerminalRemotePasswordPreparation=Wyłącz przygotowywanie hasła zdalnego dostępu do terminala
disableTerminalRemotePasswordPreparationDescription=W sytuacjach, gdy w terminalu trzeba nawiązać zdalne połączenie z powłoką, które przechodzi przez kilka systemów pośrednich, może być konieczne przygotowanie niezbędnych haseł na jednym z tych systemów, żeby umożliwić automatyczne wypełnianie pól dialogowych.\n\nJeśli nie chcesz, żeby hasła były w ogóle przesyłane do żadnego systemu pośredniczącego, możesz wyłączyć tę funkcję. W takim przypadku o wszelkie wymagane hasła pośrednie terminal zapyta sam po uruchomieniu.
