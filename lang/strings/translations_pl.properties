refreshIcons=Ikony odświeżania
refreshIconsDescription=Pobieranie, renderowanie i zapisywanie w pamięci podręcznej wszystkich dostępnych ikon (ponad 1000) z zewnętrznych źródeł do plików .png. To trochę potrwa...
refreshIconsIntro=Pobierz ikony
refreshIconsIntroDescription=Tutaj możesz ustawić własne ikony dla swoich połączeń. Najpierw musisz pobrać domyślny zestaw ikon. W menu ustawień możesz też skonfigurować własne źródła ikon.
