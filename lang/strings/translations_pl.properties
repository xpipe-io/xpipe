limitedTouchscreenModeDescription=Jeśli korzystasz z tej aplikacji na bardziej nietypowym interfejsie dotykowym, np. na ekranie telefonu, niektóre menu mogą nie działać poprawnie. Gdy ta opcja jest włączona, menu korzysta z bardziej ograniczonej funkcjonalności, żeby radzić sobie z rzadko wysyłanymi zdarzeniami myszy lub dotykowymi.
