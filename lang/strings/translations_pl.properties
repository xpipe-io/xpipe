unsyncedIdentityTitle=Niezsynchronizowana tożsamość
unsyncedIdentityContent=To połączenie jest oznaczone do synchronizacji między wieloma systemami, ale wybrana przez ciebie tożsamość jest tylko lokalna. Spowoduje to brak tożsamości w innych systemach.\n\nMożesz albo przekształcić tę lokalną tożsamość w tożsamość synchronizowaną, albo przekształcić ją w tożsamość wielokrotną, żeby przełączać się między wieloma lokalnymi tożsamościami w każdym zsynchronizowanym systemie.
