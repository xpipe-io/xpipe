browseCertificateStoreDescription=Otwórz katalog magazynu certyfikatów, żeby zarządzać zaakceptowanymi niestandardowymi certyfikatami TLS w formacie .pem. Certyfikaty są dodawane automatycznie w razie potrzeby i potwierdzane przez użytkownika, więc nie musisz ich tutaj dodawać ręcznie.
