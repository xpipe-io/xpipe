retry=Ponów próbę
retryAll=Spróbuj jeszcze raz
replace=Zastąp
replaceAll=Zastąp wszystko
hibernateBehaviour=Zachowanie trybu hibernacji
hibernateBehaviourDescription=Określa, jak aplikacja będzie się zachowywać, gdy system przejdzie w tryb hibernacji lub uśpienia.
overview=Przegląd
history=Historia
skipAll=Pomiń wszystko
