hashicorpVaultMappingDescription=Skarbiec może zasadniczo przechowywać dowolne zaszyfrowane dane w postaci par klucz-wartość, więc musisz zdefiniować mapowanie, dzięki któremu XPipe będzie mogło znaleźć poszczególne wpisy, takie jak nazwa użytkownika, hasło i klucze SSH. W razie potrzeby domyślne mapowanie można nadpisać dla poszczególnych tożsamości.
