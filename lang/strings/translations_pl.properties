gpgSyncDialogTitle=Synchronizacja z GPG
gpgSyncDialogContent=Masz włączone podpisywanie GPG dla git. Spowolni to operacje synchronizacji, więc synchronizacja większych zmian może potrwać nieco dłużej niż zwykle.
downloadDialogTitle=Pobieranie zakończone
downloadDialogContent=Pliki zostały pobrane na twój komputer. Teraz możesz je przeciągnąć i upuścić do swojego środowiska graficznego i aplikacji z okienka pobierania w lewym dolnym rogu.
syncInProgressTitle=Trwa synchronizacja
syncInProgressContent=Twoje zmiany są właśnie zapisywane i synchronizowane. Po zakończeniu operacji zmiany powinny być widoczne na serwerze zdalnym.
