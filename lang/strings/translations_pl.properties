disableSshPinCaching=Wyłącz buforowanie kodu PIN w SSH
disableSshPinCachingDescription=XPipe automatycznie zapisuje w pamięci podręcznej wszystkie kody PIN wprowadzone dla danego klucza podczas korzystania z jakiejś formy uwierzytelniania sprzętowego.\n\nWyłączenie tej opcji spowoduje, że przy każdej próbie połączenia będziesz musiał ponownie wprowadzać kod PIN.
