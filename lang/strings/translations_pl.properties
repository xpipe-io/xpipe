categorySync=Synchronizacja z repozytorium Git
categorySyncDescription=Automatycznie synchronizuj wszystkie połączenia z repozytorium Git. Wszystkie lokalne zmiany w połączeniach zostaną przesłane na serwer zdalny.
categorySyncSpecial=Synchronizacja z repozytorium Git\n(Nie da się tego ustawić dla specjalnej kategorii „$NAME$ ”)
categoryDontAllowScripts=Wyłącz wszystkie modyfikacje
categoryDontAllowScriptsDescription=Wyłącz wykonywanie poleceń i inne operacje w systemach z tej kategorii, żeby zapobiec jakimkolwiek zmianom. Spowoduje to wyłączenie wszystkich funkcji skryptowych, poleceń środowiska powłoki, monitów i nie tylko.
categoryConfirmAllModifications=Potwierdź wszystkie zmiany
categoryConfirmAllModificationsDescription=Najpierw potwierdź każdą zmianę dotyczącą połączenia lub systemu plików. Dzięki temu unikniesz przypadkowych operacji na ważnych systemach.
categoryDefaultIdentity=Domyślna tożsamość
categoryDefaultIdentityDescription=Jeśli często korzystasz z konkretnej tożsamości na wielu systemach z tej kategorii, ustawienie domyślnej tożsamości pozwoli ci ją wstępnie wybrać podczas tworzenia nowych połączeń.
categoryDefaultGateway=Brama domyślna
categoryDefaultGatewayDescription=Jeśli dla połączenia nie podano innej bramy, domyślnie używaj określonego systemu bramy dla wszystkich połączeń z tej kategorii.
