browseDirectory=Przeglądaj katalog
openTerminal=Otwórz terminal
documentation=Dokumentacja
report=Zgłoś błąd
keePassXcNotAssociated=Link do KeePassXC
keePassXcNotAssociatedDescription=XPipe nie jest powiązane z twoją lokalną bazą danych KeePassXC. Kliknij poniżej, żeby wykonać jednorazową czynność powiązania XPipe z bazą danych KeePassXC, dzięki czemu XPipe będzie mogło pobierać hasła.
keePassXcAssociateMore=Podłącz więcej baz danych
keePassXcAssociateMoreDescription=Możesz być podłączony do wielu baz danych KeePassXC jednocześnie
keePassXcAssociated=Linki do KeePassXC
keePassXcAssociatedDescription=XPipe jest połączony z następującymi lokalnymi bazami danych KeePassXC:
keePassXcNotAssociatedButton=Baza danych linków
identifier=Identyfikator
passwordManagerMapping=Niestandardowe przypisanie klawiszy
passwordManagerMappingDescription=Dane JSON mogą przechowywać dowolne wpisy typu klucz-wartość, więc musisz zdefiniować mapowanie, dzięki któremu XPipe będzie mogło znaleźć poszczególne wpisy, takie jak nazwa użytkownika, hasło i klucze SSH. W razie potrzeby domyślne mapowanie można nadpisać dla poszczególnych tożsamości.
passwordManagerCommand=Polecenie niestandardowe
passwordManagerCommandDescription=Niestandardowe polecenie, które trzeba uruchomić, żeby pobrać hasła. Ciąg znaków zastępczy $KEY zostanie zastąpiony kluczem hasła w cudzysłowie, gdy polecenie zostanie wywołane. Powinno to uruchomić interfejs CLI twojego menedżera haseł, który wyświetli surowe hasło lub dane logowania w formacie JSON na stdout.
chooseTemplate=Wybierz szablon
keePassXcPlaceholder=Adres URL wpisu w KeePassXC
terminalEnvironment=Środowisko terminala
terminalEnvironmentDescription=Jeśli chcesz skorzystać z funkcji lokalnego środowiska WSL opartego na systemie Linux do dostosowania terminala, możesz użyć go jako środowiska terminalowego.\n\nWszelkie niestandardowe polecenia inicjalizacyjne terminala oraz konfiguracja multipleksera terminala będą wtedy uruchamiane w tej dystrybucji WSL.
terminalInitScript=Skrypt inicjalizacyjny terminala
terminalInitScriptDescription=Polecenia do wykonania w środowisku terminala przed nawiązaniem połączenia. Możesz to wykorzystać do skonfigurowania środowiska terminala przy uruchomieniu.
terminalMultiplexer=Multiplekser terminali
terminalMultiplexerDescription=Multiplekser terminali, który można wykorzystać jako alternatywę dla kart w terminalu. Zastąpi on niektóre funkcje obsługi terminala, np. obsługę kart, funkcjonalnością multipleksera.\n\nWymaga zainstalowania odpowiedniego pliku wykonywalnego multipleksera w systemie.
terminalMultiplexerWindowsDescription=Multiplekser terminali, który można wykorzystać jako alternatywę dla kart w terminalu. Zastąpi on niektóre funkcje obsługi terminala, np. obsługę kart, funkcjonalnością multipleksera.\n\nWymaga użycia środowiska terminala WSL w systemie Windows oraz zainstalowania pliku wykonywalnego multipleksera w systemie WSL.
terminalAlwaysPauseOnExit=Zawsze zatrzymuj się przy zamykaniu
terminalAlwaysPauseOnExitDescription=Jeśli ta opcja jest włączona, przy zamykaniu sesji terminala zawsze pojawi się pytanie, czy chcesz ją zrestartować, czy zamknąć. Jeśli jest wyłączona, XPipe wyświetli to pytanie tylko w przypadku nieudanych połączeń, które kończą się błędem.
querying=Wykonywanie zapytania...
queryFailed=Zapytanie nie zwróciło żadnych przydatnych informacji
retrievedPassword=Źródło: $PASSWORD$
refreshOpenpubkey=Odśwież tożsamość openpubkey
refreshOpenpubkeyDescription=Uruchom opkssh refresh, żeby tożsamość openpubkey znów była ważna
all=Wszystko
terminalPrompt=Wiersz poleceń terminala
terminalPromptDescription=Narzędzie do wyświetlania podpowiedzi w terminalach zdalnych. Włączenie podpowiedzi w terminalu spowoduje automatyczną instalację i konfigurację tego narzędzia w systemie docelowym przy otwieraniu sesji terminalowej.\n\nNie powoduje to modyfikacji żadnych istniejących ustawień wiersza poleceń ani plików profilowych w systemie. Spowoduje to wydłużenie czasu ładowania terminala przy pierwszym uruchomieniu, podczas gdy wiersz poleceń będzie konfigurowany w systemie zdalnym. Twój terminal może potrzebować dodatkowych czcionek, żeby poprawnie wyświetlić wiersz poleceń.
terminalPromptConfiguration=Konfiguracja podpowiedzi terminala
terminalPromptConfig=Plik konfiguracyjny
terminalPromptConfigDescription=Niestandardowy plik konfiguracyjny, który ma być zastosowany do wiersza poleceń. Ta konfiguracja zostanie automatycznie ustawiona w systemie docelowym podczas inicjalizacji terminala i będzie używana jako domyślna konfiguracja wiersza poleceń.\n\nJeśli chcesz korzystać z istniejącego domyślnego pliku konfiguracyjnego w każdym systemie, możesz zostawić to pole puste.
passwordManagerKey=Wpis danych logowania
