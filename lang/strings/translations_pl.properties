gitUsername=Niestandardowa nazwa użytkownika w Git
gitUsernameDescription=Użytkownik zdefiniowany przez ciebie do uwierzytelniania się w zdalnym repozytorium Git. Domyślnie XPipe użyje aktualnie skonfigurowanych danych logowania z wiersza poleceń Git.\n\nTo ustawienie zastąpi wszelkie domyślne dane logowania, które są już skonfigurowane dla twojego lokalnego klienta wiersza poleceń Git.
gitPassword=Niestandardowe hasło do Git / osobisty token dostępu
gitPasswordDescription=Hasło lub osobisty token dostępu, którego używasz do uwierzytelniania. To, czy potrzebujesz hasła, czy osobistego tokenu dostępu, zależy od dostawcy git remote. To ustawienie zastąpi wszelkie domyślne dane logowania, które są już skonfigurowane dla twojego lokalnego klienta git CLI.
