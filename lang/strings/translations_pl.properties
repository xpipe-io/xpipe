clipboardNoticeTitle=Hasło skopiowane
clipboardNoticeContent=Ponieważ aplikacja, z której korzystasz, nie obsługuje bezpośredniego przekazywania haseł, twoje hasło zostało umieszczone w schowku, żebyś mógł je wkleić. W przyszłości będzie to odbywać się automatycznie. W prawym dolnym rogu możesz zobaczyć wskaźnik schowka.
sftpNoticeTitle=Przesyłanie dużych plików
sftpNoticeContent=Pliki, które próbujesz przesłać, są dość duże. Obecna sesja opiera się na protokole SSH w trybie surowym, co nie zapewnia najlepszej możliwej prędkości przesyłania. Jeśli chcesz zwiększyć prędkość przesyłania, możesz spróbować otworzyć sesję SFTP z systemem, korzystając z menu prawego przycisku myszy w przeglądarce plików.
hideVaultEntryNames=Ukryj nazwy wpisów w Git Vault
hideVaultEntryNamesDescription=Usuwa wszystkie nazwy połączeń i inne informacje z plików README oraz komunikatów commit, gdy włączona jest synchronizacja git. Ta opcja uniemożliwia wgląd w strukturę zaszyfrowanej zawartości sejfu.
disableHardwareAcceleration=Wyłącz przyspieszenie sprzętowe
disableHardwareAccelerationDescription=Wyłącza wykorzystanie karty graficznej do renderowania i korzysta wyłącznie z oprogramowania do renderowania.\n\nPowoduje to znaczny spadek wydajności, ale może to być jedyny sposób na renderowanie, jeśli występują problemy ze sterownikiem karty graficznej.
disableRdpWindowsSecurityWarning=Wyłącz ostrzeżenie dotyczące bezpieczeństwa RDP
disableRdpWindowsSecurityWarningDescription=Nie wyświetlaj nowego ostrzeżenia systemu Windows o niepodpisanych plikach .rdp przy każdym uruchamianiu nowej sesji.\n\nSpowoduje to zmianę klucza rejestru, co przywróci klientowi RDP systemu Windows poprzednie zachowanie. Ta czynność wyświetli okienko z prośbą o podniesienie uprawnień do poziomu administratora.
rdpWindowsSecurityWarningDialogTitle=Ostrzeżenia dotyczące bezpieczeństwa RDP
rdpWindowsSecurityWarningDialogContent=Od wersji Windows 26200 system zawsze wyświetla ostrzeżenie przy uruchamianiu niepodpisanego pliku RDP, niezależnie od jego zawartości.\n\nMożesz wyłączyć to ostrzeżenie w menu ustawień.
