externalActionTitle=Żądanie akcji zewnętrznej
externalActionContent=Zgłoszono żądanie wykonania akcji zewnętrznej. Czy chcesz zezwolić na uruchamianie akcji spoza XPipe?
noScriptStateAvailable=Odśwież stronę, żeby sprawdzić zgodność skryptu...
documentationDescription=Zajrzyj do dokumentacji
customEditorCommandInTerminal=Uruchom niestandardowe polecenie w terminalu
customEditorCommandInTerminalDescription=Jeśli twój edytor działa w trybie terminala, możesz włączyć tę opcję, żeby automatycznie otworzyć terminal i uruchomić polecenie w sesji terminalowej.\n\nMożesz używać tej opcji w edytorach takich jak vi, vim, nvim i innych.
disableHttpsTlsCheck=Wyłącz weryfikację certyfikatu w żądaniach HTTPS
disableHttpsTlsCheckDescription=Jeśli Twoja organizacja odszyfrowuje ruch HTTPS w zaporach sieciowych za pomocą przechwytywania SSL, wszelkie próby sprawdzenia aktualizacji lub licencji zakończą się niepowodzeniem z powodu niezgodności certyfikatów. Możesz to naprawić, włączając tę opcję i wyłączając weryfikację certyfikatów TLS.
connectionsSelected=$NUMBER$ wybrane połączenia
