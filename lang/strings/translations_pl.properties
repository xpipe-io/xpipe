httpProxyDescription=Proxy, z którego będą korzystać wszelkie żądania HTTP wysyłane przez XPipe i inne narzędzia zewnętrzne.\n\nJeśli proxy odszyfrowuje ruch TLS, po nawiązaniu połączenia pojawi się monit o dodanie niestandardowych certyfikatów do wewnętrznego magazynu certyfikatów XPipe. Możesz użyć przycisku testowego, żeby sprawdzić łączność.
