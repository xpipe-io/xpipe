sshVerboseOutput=Włącz szczegółowe wyjście SSH
sshVerboseOutputDescription=Spowoduje to wyświetlenie wielu informacji debugowania podczas łączenia się przez SSH. Przydatne przy rozwiązywaniu problemów z połączeniami SSH.
dontUseGateway=Nie używaj bramy
dontUseGatewayDescription=Nie używaj hosta hiperwizora jako bramy i połącz się bezpośrednio z adresem IP
categoryColor=Kolor kategorii
