openDocumentationDescription=Echa un vistazo a la página de documentación de XPipe sobre este tema
renameAll=Cambiar el nombre de todos
logging=Registro
enableTerminalLogging=Activar el registro del terminal
enableTerminalLoggingDescription=Activa el registro por parte del cliente para todas las sesiones de terminal. Todas las entradas y salidas de la sesión de terminal se guardan en un archivo de registro de la sesión. Ten en cuenta que no se guarda ninguna información confidencial, como las solicitudes de contraseña.
terminalLoggingDirectory=Registros de sesiones de terminal
terminalLoggingDirectoryDescription=Todos los registros se guardan en el directorio de datos de XPipe de tu sistema local.
openSessionLogs=Abrir los registros de sesión
sessionLogging=Registro de terminal
sessionActive=Hay una sesión en segundo plano en marcha para esta conexión.\n\nPara cerrar esta sesión manualmente, haz clic en el indicador de estado.
skipValidation=Saltar la validación
scriptsIntroHeader=Acerca de los scripts
scriptsIntroContent=Puedes ejecutar scripts al iniciar el shell, en el explorador de archivos y cuando quieras. Puedes crear tus propios scripts dentro de XPipe o importar los que ya tengas de tu sistema local o de un repositorio Git remoto.
scriptsIntroBottomHeader=Uso de scripts
scriptsIntroBottomContent=Hay un montón de scripts de ejemplo para empezar. Puedes hacer clic en el botón de edición de cada script para ver cómo están implementados. Primero tienes que activar los scripts para que se ejecuten y aparezcan en los menús; cada script tiene un botón para eso.
scriptsIntroBottomButton=Empieza ya
scriptSourcesIntroHeader=Códigos fuente
scriptSourcesIntroContent=Puedes añadir fuentes de scripts personalizadas para tener acceso inmediato a toda una colección de scripts de shell. Se admiten tanto fuentes locales como repositorios Git remotos. Todos los scripts detectados en la fuente estarán disponibles automáticamente.
scriptSourcesIntroButton=Añadir código fuente...
checkForSecurityUpdates=Comprueba si hay actualizaciones de seguridad
checkForSecurityUpdatesDescription=XPipe puede buscar posibles actualizaciones de seguridad por separado de las actualizaciones normales de funciones. Cuando esta opción está activada, se te recomendará instalar al menos las actualizaciones de seguridad importantes, incluso si la comprobación de actualizaciones normales está desactivada.\n\nSi desactivas esta opción, no se realizará ninguna solicitud de versión externa y no recibirás notificaciones sobre actualizaciones de seguridad.
clickToDock=Haz clic para acoplar el terminal
