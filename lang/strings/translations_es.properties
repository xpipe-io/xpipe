workspaceManagement=Gestionar espacios de trabajo
workspaceManagementDescription=Los espacios de trabajo son configuraciones distintas para ejecutar XPipe. Cada espacio de trabajo tiene un directorio de datos donde se guardan todos los datos de forma local. Esto incluye datos de conexión, ajustes y mucho más.\n\nSi usas la función de sincronización, también puedes elegir sincronizar cada espacio de trabajo con un repositorio de Git diferente.
