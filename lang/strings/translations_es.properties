teamVaults=Cajas fuertes de equipo
vaultTypeNameDefault=Caja fuerte predeterminada
vaultTypeNamePersonal=Caja fuerte personal
vaultTypeNameTeam=Caja fuerte del equipo
teamVaultsDescription=Las cajas fuertes de equipo permiten que varios usuarios y roles tengan acceso seguro a una caja fuerte compartida. Puedes configurar las conexiones y las identidades para que sean compartidas por todos los usuarios o para que solo estén disponibles para usuarios y roles concretos, cifrándolas con su propia clave. Los demás usuarios del almacén no pueden acceder a las conexiones e identidades personales y basadas en roles si no tienen acceso a la clave.
vaultTypeContentDefault=Ahora mismo estás usando una caja fuerte predeterminada sin usuario ni frase de contraseña personalizada. Los secretos se cifran con la clave local de la caja fuerte.\n\nPuedes pasar a una caja fuerte personal creando una cuenta de usuario para la caja fuerte. Esto te permite cifrar los secretos de la caja fuerte con tu propia contraseña personal, que tendrás que introducir cada vez que inicies sesión para desbloquearla.
vaultTypeContentPersonal=Ahora mismo estás usando una caja fuerte personal para tu usuario. Los secretos están cifrados con tu contraseña personal.
vaultTypeContentTeam=Ahora mismo estás usando una caja fuerte de equipo, que permite que varios usuarios tengan acceso seguro a una caja fuerte compartida. Puedes configurar las conexiones y las identidades para que sean compartidas por todos los usuarios o para que solo estén disponibles para tu usuario personal o tu rol, cifrándolas con tu clave personal o la clave de tu rol. Los demás usuarios del almacén no pueden acceder a tus conexiones e identidades personales y de rol si no tienen acceso a la clave.
roleManagement=Gestión de roles
roleManagementEmpty=Gestión de roles
roleManagementDescription=Gestiona los roles de la caja fuerte existentes o crea otros nuevos. Cada rol de la caja fuerte tiene su propia clave secreta individual, que se usa para cifrar conexiones e identidades a las que solo debe tener acceso ese rol y nadie más.
roleManagementEmptyDescription=Gestiona los roles de la caja fuerte existentes o crea otros nuevos. Cada rol de la caja fuerte tiene su propia clave secreta individual, que se usa para cifrar conexiones e identidades que solo deben estar disponibles para ese rol y no para otros.\n\nEl plan profesional admite cuentas basadas en roles para un equipo.
userManagement=Gestión de usuarios
userManagementEmpty=Gestión de usuarios
userManagementDescription=Gestiona tu usuario de la caja fuerte actual o crea uno nuevo. Tu usuario de la caja fuerte tiene su propia contraseña individual, que se usa para cifrar conexiones e identidades.
userManagementEmptyDescription=Gestiona tu usuario de la caja fuerte actual o crea uno nuevo. Tu usuario de la caja fuerte tiene su propia frase de contraseña, que se usa para cifrar conexiones e identidades. Crea un usuario para ti mismo para poder cifrar conexiones e identidades con tu clave personal.
