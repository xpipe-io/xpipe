developerDisableSshTunnelGateways=Desactivar el túnel de la pasarela SSH
developerDisableSshTunnelGatewaysDescription=No uses sesiones de túnel para las pasarelas; en su lugar, conéctate directamente al sistema.
ttyWarning=La conexión ha asignado un pty/tty de forma forzada y no proporciona un flujo stderr independiente.\n\nEsto podría dar lugar a algunos problemas.\n\nSi puedes, intenta que el comando de conexión no asigne un pty.
