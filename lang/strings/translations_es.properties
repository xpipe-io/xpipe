disableRdpWindowsSecurityWarningDescription=No muestres la nueva advertencia de Windows sobre archivos .rdp sin firmar cada vez que inicies una nueva sesión.\n\nEsto modificará la clave del registro para que el cliente RDP de Windows vuelva a su comportamiento anterior. Esta acción mostrará una ventana emergente para solicitar privilegios de administrador.
rdpWindowsSecurityWarningDialogTitle=Advertencias de seguridad de RDP
rdpWindowsSecurityWarningDialogContent=A partir de la versión 26200 de Windows, el sistema siempre mostrará una advertencia cuando se ejecute un archivo RDP sin firmar, independientemente de su contenido.\n\nPuedes desactivar esta advertencia en el menú de configuración.
