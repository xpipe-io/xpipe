dontAutomaticallyStartVmSshServer=No inicies automáticamente el servidor SSH para las máquinas virtuales cuando sea necesario
dontAutomaticallyStartVmSshServerDescription=Cualquier conexión de shell a una máquina virtual que se ejecute en un hipervisor se realiza a través de SSH. XPipe puede iniciar automáticamente el servidor SSH instalado cuando sea necesario. Si no quieres que esto ocurra por motivos de seguridad, puedes desactivar esta función con esta opción.
confirmGitShareTitle=Sincronización con Git
confirmGitShareContent=¿Quieres añadir el archivo seleccionado a tu repositorio de Git Vault? Esto copiará una versión cifrada del archivo en tu Git Vault y confirmará los cambios. Así podrás acceder al archivo desde todos los ordenadores sincronizados.
gitShareFileTooltip=Añade el archivo al directorio de datos de Git Vault para que se sincronice automáticamente.\n\nEsta acción solo se puede usar si Git Vault está activado en la configuración.
performanceMode=Modo de rendimiento
performanceModeDescription=Desactiva todos los efectos visuales que no sean necesarios para mejorar el rendimiento de la aplicación.
dontAcceptNewHostKeys=No aceptes automáticamente nuevas claves de host SSH
dontAcceptNewHostKeysDescription=Por defecto, XPipe aceptará automáticamente las claves de host de aquellos sistemas en los que tu cliente SSH aún no tenga guardada ninguna clave de host conocida. Sin embargo, si alguna clave de host conocida ha cambiado, rechazará la conexión a menos que aceptes la nueva.\n\nDesactivar este comportamiento te permite comprobar todas las claves de host, aunque al principio no haya ningún conflicto.
uiScale=Escala de la interfaz de usuario
uiScaleDescription=Un valor de escalado personalizado que puedes configurar independientemente de la escala de pantalla de todo el sistema. Los valores se expresan en porcentaje, así que, por ejemplo, un valor de 150 dará como resultado una escala de la interfaz de usuario del 150 %.
editorProgram=Programa de edición
editorProgramDescription=El editor de texto predeterminado que se usa para editar cualquier tipo de datos de texto.
windowOpacity=Opacidad de la ventana
windowOpacityDescription=Cambia la opacidad de la ventana para que puedas ver lo que pasa en segundo plano.
useSystemFont=Usa la fuente del sistema
openDataDir=Directorio de datos de la caja fuerte
openDataDirButton=Directorio de datos abierto
openDataDirDescription=Si quieres sincronizar archivos adicionales, como claves SSH, entre sistemas con tu repositorio de Git, puedes colocarlos en el directorio de datos de almacenamiento. Las rutas de acceso de cualquier archivo al que se haga referencia allí se adaptarán automáticamente en cualquier sistema sincronizado.
