rdpClientDescription=El programa cliente RDP al que hay que llamar al iniciar conexiones RDP.\n\nTen en cuenta que los distintos clientes tienen diferentes niveles de funcionalidad e integración. Algunos clientes no admiten el envío automático de contraseñas, así que tendrás que introducirlas manualmente al iniciar la conexión.
