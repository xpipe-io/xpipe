apiKeyDescription=La clave de la API para autenticar las solicitudes de la API del demonio XPipe. Para más información sobre cómo autenticarte, echa un vistazo a la documentación general de la API.
disableApiAuthentication=Desactivar la autenticación de la API
disableApiAuthenticationDescription=Desactiva todos los métodos de autenticación obligatorios para que se procesen todas las solicitudes sin autenticar.\n\nLa autenticación solo debe desactivarse con fines de desarrollo.
api=API
storeIntroImportContent=¿Ya usas XPipe en otro sistema? Sincroniza tus conexiones actuales entre varios sistemas a través de un repositorio de Git remoto. También puedes sincronizarlas más tarde en cualquier momento si aún no lo tienes configurado.
