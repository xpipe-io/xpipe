hideVaultEntryNamesDescription=Elimina todos los nombres de conexión y demás información de los archivos README y de los mensajes de commit cuando la sincronización de Git está activada. Esta opción evita que se pueda conocer la estructura del contenido cifrado de la caja fuerte.
disableHardwareAcceleration=Desactivar la aceleración por hardware
disableHardwareAccelerationDescription=Desactiva el uso de la tarjeta gráfica para el renderizado y solo utilizará un proceso de renderizado por software.\n\nEsto supone una pérdida significativa de rendimiento, pero puede que sea la única forma de renderizar si hay problemas con el controlador de la tarjeta gráfica.
