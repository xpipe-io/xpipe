ptbNoticeContent=Estás ejecutando una versión PTB de XPipe. Esta versión es inestable y puede contener errores. No deberías usarla a diario. Además, no recibirá actualizaciones periódicas una vez finalizado el periodo de pruebas. Para eso, tendrás que instalar y ejecutar la versión normal de XPipe.
userDeletionTitle=Eliminación de un usuario
userDeletionContent=¿Quieres eliminar este usuario de la caja fuerte? Esto volvería a cifrar todos los datos utilizando la clave predeterminada de la caja fuerte. Tardará un rato.
roleDeletionTitle=Eliminación de un rol
roleDeletionContent=¿Quieres eliminar esta función de la caja fuerte? Esto volvería a cifrar todas las identidades y secretos de conexión que usan esta función para que dejen de usarla. Puede que esto tarde un rato.
