startupBehaviourDescription=Controla el comportamiento predeterminado de la aplicación de escritorio al iniciar XPipe.
clearCachesAlertTitle=Borrar caché
clearCachesAlertContent=¿Quieres borrar todas las cachés de XPipe? Esto eliminará todos los datos de la caché que se guardan para mejorar la experiencia del usuario.
