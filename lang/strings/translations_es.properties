enableGitStorage=Activar la sincronización
gitSync=Sincronización con Git
enableGitStorageDescription=Cuando esté activado, XPipe inicializará un repositorio de Git para la caja fuerte local y guardará allí cualquier cambio. Ten en cuenta que esto requiere que tengas instalado Git y puede ralentizar las operaciones de carga y guardado.\n\nCualquier categoría que debas sincronizar debe marcarse explícitamente como sincronizada.
storageGitRemote=URL de sincronización remota
storageGitRemoteDescription=Cuando está activada, XPipe descargará automáticamente cualquier cambio al cargar y subirá cualquier cambio al repositorio remoto al guardar.\n\nEsto te permite compartir tu «caja fuerte» entre varias instalaciones de XPipe. Admite direcciones URL HTTP y SSH, además de directorios locales.
vault=Caja fuerte
vaultAccess=Acceso a la caja fuerte
workspaceLockDescription=Te permite establecer una contraseña personalizada para cifrar cualquier información confidencial almacenada en XPipe.\n\nEsto aumenta la seguridad, ya que añade una capa adicional de cifrado a tu información confidencial almacenada. A partir de entonces, se te pedirá que introduzcas la contraseña cada vez que se inicie XPipe.
useSystemFontDescription=Determina si se usa la fuente predeterminada del sistema o la fuente «Inter», que viene incluida con XPipe.
windowOptions=Opciones de la ventana
saveWindowLocation=Guardar la ubicación de la ventana
saveWindowLocationDescription=Determina si las coordenadas de la ventana deben guardarse y recuperarse al reiniciar.
startupShutdown=Inicio / Apagado
showChildrenConnectionsInParentCategory=Mostrar las subcategorías de una categoría principal
showChildrenConnectionsInParentCategoryDescription=Si se deben incluir o no todas las conexiones que están en las subcategorías cuando se selecciona una categoría principal concreta.\n\nSi lo desactivas, las categorías se comportan más como carpetas clásicas, que solo muestran su contenido directo sin incluir las subcarpetas.
condenseConnectionDisplay=Visualización resumida de las conexiones
condenseConnectionDisplayDescription=Haz que cada conexión de nivel superior ocupe menos espacio vertical para que la lista de conexiones quede más compacta.
openConnectionSearchWindowOnConnectionCreation=Abrir la ventana de búsqueda de conexiones al crear una conexión
openConnectionSearchWindowOnConnectionCreationDescription=Si se abre automáticamente la ventana para buscar subconexiones disponibles al añadir una nueva conexión de shell.
