enableConnectionHubTerminalDocking=Acoplar la ventana de la terminal al centro de conexiones
enableConnectionHubTerminalDockingDescription=Puedes acoplar ventanas de terminal a la ventana de la aplicación XPipe en el centro de conexiones para simular un terminal más o menos integrado. XPipe se encarga entonces de gestionar las ventanas de terminal para que siempre quepan en el acoplamiento.
enableFileBrowserTerminalDocking=Habilitar el acoplamiento del explorador de archivos al terminal
enableFileBrowserTerminalDockingDescription=Puedes acoplar ventanas de terminal a la ventana de la aplicación XPipe en el explorador de archivos para simular un terminal más o menos integrado. XPipe se encarga entonces de gestionar las ventanas de terminal para que siempre quepan en el acoplamiento.
downloadsDirectory=Directorio de descargas personalizado
downloadsDirectoryDescription=El directorio personalizado donde se guardarán los archivos descargados al hacer clic en el botón «Mover a descargas». Por defecto, XPipe usará tu directorio de descargas de usuario.
pinLocalMachineOnStartup=Fijar la pestaña «Equipo local» al iniciar el programa
pinLocalMachineOnStartupDescription=Abre automáticamente una pestaña de «Equipo local» y fíjala. Esto te viene bien si sueles usar un explorador de archivos dividido con el equipo local y el sistema de archivos remoto abiertos.
terminalErrorDescription=Este error es grave y XPipe no puede seguir funcionando sin solucionarlo.
