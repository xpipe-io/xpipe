sftpNoticeTitle=Transferencias de archivos grandes
sftpNoticeContent=Los archivos que estás intentando transferir son bastante grandes. La sesión actual se basa en SSH sin procesar, lo que no te ofrece la mejor velocidad de transferencia posible. Si necesitas aumentar la velocidad de transferencia, puedes ver la opción de abrir una sesión SFTP con el sistema en el menú contextual del explorador de archivos.
