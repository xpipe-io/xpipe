chmodPermissions=Nuevos permisos
editFilesWithDoubleClick=Edita archivos con un doble clic
editFilesWithDoubleClickDescription=Si está activada esta opción, al hacer doble clic en los archivos, estos se abrirán directamente en tu editor de texto en lugar de mostrar el menú contextual.
censorMode=Modo de censura
censorModeDescription=Oculta cualquier información como nombres de host, nombres de usuario, nombres de conexión y demás.\n\nEsto te viene bien si quieres hacer una captura de pantalla o compartir la pantalla de XPipe y no quieres que se filtre ninguna información.
