fileWriteSudoTitle=Escritura en un archivo con «sudo»
fileWriteSudoContent=El archivo en el que intentas escribir no te da permisos de escritura como usuario. ¿Quieres escribir en este archivo como root con sudo? Esto te dará acceso de root automáticamente, ya sea con las credenciales que tengas o a través de una ventana de comando.
dontAllowTerminalRestart=No permitir el reinicio del terminal
dontAllowTerminalRestartDescription=Por defecto, las sesiones de terminal se pueden reiniciar desde la propia terminal una vez que se han cerrado. Para permitir esto, XPipe aceptará estas solicitudes externas de la terminal para volver a iniciar la sesión\n\nXPipe no tiene ningún control sobre el terminal ni sobre el origen de esta llamada, por lo que las aplicaciones locales maliciosas también pueden usar esta funcionalidad para establecer conexiones a través de XPipe. Desactivar esta funcionalidad evita que esto ocurra.
