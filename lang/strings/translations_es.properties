limitedTouchscreenModeDescription=Si usas esta aplicación en una interfaz táctil menos habitual, como la pantalla de un móvil, puede que algunos menús no funcionen bien. Cuando activas esta opción, el menú usa funciones más limitadas para adaptarse a los eventos de ratón o táctiles que se reciben de forma esporádica.
