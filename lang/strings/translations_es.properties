notAnEmptyDirectory=No es un directorio vacío
automaticallyCheckForUpdates=Comprueba si hay actualizaciones
automaticallyCheckForUpdatesDescription=Cuando está activada esta opción, la información sobre nuevas versiones se descarga automáticamente al cabo de un rato mientras XPipe está en marcha. Aun así, tienes que confirmar explícitamente la instalación de cualquier actualización.
developerMode=Modo desarrollador
developerModeDescription=Cuando esté activada, tendrás acceso a un montón de opciones adicionales que te vendrán muy bien para desarrollar.
editor=Editor
custom=Personalizado
passwordManager=Gestor de contraseñas
externalPasswordManager=Gestor de contraseñas externo
passwordManagerDescription=El gestor de contraseñas instalado localmente con el que se va a integrar.\n\nSi tienes instalado un gestor de contraseñas, puedes configurar XPipe para que recupere las contraseñas de ahí, de modo que XPipe no tenga que gestionarlas por sí mismo.
passwordManagerTest=Prueba del gestor de contraseñas
passwordManagerTestDescription=Comprueba si la integración con el gestor de contraseñas funciona bien. Asegúrate de usar el formato de identificador correcto para hacer referencia a una entrada del gestor de contraseñas.
preferTerminalTabs=Prefiero abrir pestañas nuevas
preferTerminalTabsDescription=Determina si XPipe intentará abrir nuevas pestañas en el terminal que hayas elegido en lugar de nuevas ventanas. No todos los terminales admiten pestañas.
customRdpClientCommand=Comando personalizado
customRdpClientCommandDescription=El comando que hay que ejecutar para iniciar el cliente RDP personalizado.\n\nLa cadena de marcador de posición $FILE se sustituirá por el nombre absoluto del archivo .rdp entre comillas cuando se ejecute. Recuerda poner entre comillas la ruta del ejecutable si contiene espacios.
customEditorCommand=Comando personalizado del editor
customEditorCommandDescription=El comando que hay que ejecutar para iniciar el editor personalizado.\n\nLa cadena de marcador de posición $FILE se sustituirá por el nombre de archivo absoluto entre comillas cuando se ejecute. Recuerda poner entre comillas la ruta del ejecutable de tu editor si contiene espacios.
encryptAllVaultData=Cifra todos los datos de la caja fuerte
encryptAllVaultDataDescription=Cuando está activada, se cifrará toda la información de conexión al vault con tu clave de cifrado de usuario, en lugar de solo los secretos que contenga esa información. Esto añade otra capa de seguridad para otros parámetros, como nombres de usuario, nombres de host, etc., que no se cifran por defecto en el vault.\n\nEsta opción hará que tu historial y tus comparaciones de Git en la bóveda dejen de ser útiles, ya que ya no podrás ver los cambios originales, sino solo los cambios binarios.
vaultSecurity=Seguridad de la caja fuerte
developerDisableUpdateVersionCheck=Desactivar la comprobación de actualizaciones
developerDisableUpdateVersionCheckDescription=Determina si el verificador de actualizaciones ignorará el número de versión al buscar una actualización.
shellCommandTest=Prueba de comandos de Shell
shellCommandTestDescription=Ejecuta un comando en la sesión de shell que usa internamente XPipe.
terminal=Terminal
terminalType=Emulador de terminal
terminalConfiguration=Configuración del terminal
terminalCustomization=Personalización del terminal
editorConfiguration=Configuración del editor
defaultApplication=Aplicación predeterminada
initialSetup=Configuración inicial
terminalTypeDescription=El terminal predeterminado que se usa para abrir conexiones de shell.\n\nEl nivel de compatibilidad con las funciones varía según el terminal, y cada uno está marcado como recomendado o no recomendado. Tu experiencia de usuario será mejor si usas un terminal recomendado.
customTerminalCommand=Comando de terminal personalizado
customTerminalCommandDescription=El comando que hay que ejecutar para abrir el terminal personalizado con un comando determinado.\n\nXPipe creará un script de shell de inicio temporal para que lo ejecute tu terminal. La cadena de marcador de posición $CMD del comando que introduzcas se sustituirá por el script de inicio real cuando se ejecute. Recuerda poner entre comillas la ruta del ejecutable de tu terminal si contiene espacios.
clearTerminalOnInit=Borrar la terminal al iniciar
clearTerminalOnInitDescription=Cuando está activado, XPipe ejecutará un comando de borrado tras iniciar una nueva sesión de terminal para eliminar cualquier salida innecesaria que se haya mostrado al iniciar la sesión.
dontCachePasswords=No guardes en caché las contraseñas que te piden
dontCachePasswordsDescription=Determina si XPipe debe almacenar en caché las contraseñas solicitadas para que no tengas que volver a introducirlas en la sesión actual.\n\nSi esta opción está desactivada, tendrás que volver a introducir las credenciales cada vez que el sistema te las pida.
denyTempScriptCreation=No permitir la creación de scripts temporales
denyTempScriptCreationDescription=Para que algunas de sus funciones funcionen, XPipe a veces crea scripts de shell temporales en el sistema de destino para facilitar la ejecución de comandos sencillos. Estos no contienen ninguna información confidencial y solo se crean con fines de implementación.\n\nSi desactivas esta opción, XPipe no creará ningún archivo temporal en un sistema remoto. Esta opción es útil en entornos de alta seguridad donde se supervisa cualquier cambio en el sistema de archivos. Si la desactivas, algunas funciones, como los entornos de shell y los scripts, no funcionarán como deberían.
disableCertutilUse=Desactivar el uso de certutil en Windows
useLocalFallbackShell=Usar el shell de reserva local
useLocalFallbackShellDescription=Cambia a otro shell local para gestionar las operaciones locales. En Windows sería PowerShell y en otros sistemas, el shell de Bourne.\n\nPuedes usar esta opción si el shell local predeterminado está desactivado o no funciona bien. Eso sí, puede que algunas funciones no funcionen como esperabas cuando esta opción esté activada.
disableCertutilUseDescription=Debido a varias deficiencias y errores en cmd.exe, se crean scripts de shell temporales con certutil, utilizándolo para descodificar entradas en base64, ya que cmd.exe falla con entradas que no sean ASCII. XPipe también puede usar PowerShell para eso, pero será más lento.\n\nEsto desactiva cualquier uso de certutil en sistemas Windows para llevar a cabo ciertas funciones y recurre a PowerShell en su lugar. Esto puede gustar a algunos antivirus, ya que algunos de ellos bloquean el uso de certutil.
