terminalAlwaysPauseOnExitDescription=Si está activada, al salir de una sesión de terminal siempre se te preguntará si quieres reiniciar o cerrar la sesión. Si está desactivada, XPipe solo lo hará en el caso de conexiones fallidas que terminen con un error.
