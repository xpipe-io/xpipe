identitiesIntroHeader=Sobre las identidades
identitiesIntroContent=Si vuelves a usar combinaciones habituales de nombres de usuario, contraseñas y claves, puede que te interese crear identidades reutilizables. Así podrás acceder a ellas rápidamente cuando añadas nuevas conexiones.
identitiesIntroBottomHeader=Compartir identidades
identitiesIntroBottomContent=Puedes añadir identidades localmente o también sincronizarlas en el repositorio de Git cuando esta opción esté activada. Esto te permite compartir identidades de forma selectiva entre varios sistemas y con otros miembros del equipo.
