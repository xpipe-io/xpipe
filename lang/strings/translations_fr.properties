teamVaults=Coffres-forts d'équipe
#custom
vaultTypeNameDefault=Coffre-fort par défaut
vaultTypeNamePersonal=Coffre-fort personnel
vaultTypeNameTeam=Coffre-fort d'équipe
teamVaultsDescription=Les coffres-forts d'équipe permettent à plusieurs utilisateurs et rôles d'accéder en toute sécurité à un coffre-fort partagé. Tu peux configurer les connexions et les identités pour qu'elles soient partagées entre tous les utilisateurs ou réservées à des utilisateurs et rôles spécifiques en les chiffrant avec leur propre clé. Les autres utilisateurs du coffre-fort ne peuvent pas accéder aux connexions et identités personnelles ou liées à un rôle s'ils n'ont pas accès à la clé.
vaultTypeContentDefault=Tu utilises actuellement un coffre-fort par défaut sans utilisateur ni phrase de passe personnalisée. Les secrets sont chiffrés avec la clé du coffre-fort local.\n\nTu peux passer à un coffre-fort personnel en créant un compte utilisateur pour ce coffre-fort. Ça te permettra de chiffrer les secrets du coffre-fort avec ta propre phrase de passe, que tu devras saisir à chaque connexion pour déverrouiller le coffre-fort.
vaultTypeContentPersonal=Tu utilises actuellement un coffre-fort personnel pour ton compte utilisateur. Les informations confidentielles sont chiffrées à l'aide de ta phrase de passe personnelle.
vaultTypeContentTeam=Tu utilises actuellement un coffre-fort d'équipe, qui permet à plusieurs utilisateurs d'accéder en toute sécurité à un coffre-fort partagé. Tu peux configurer les connexions et les identités pour qu'elles soient partagées par tous les utilisateurs ou qu'elles ne soient disponibles que pour ton compte personnel ou ton rôle, en les chiffrant avec ta clé personnelle ou celle de ton rôle. Les autres utilisateurs du coffre-fort ne peuvent pas accéder à tes connexions et identités personnelles ou liées à ton rôle s’ils n’ont pas accès à la clé.
roleManagement=Gestion des rôles
roleManagementEmpty=Gestion des rôles
roleManagementDescription=Gère les rôles de coffre-fort existants ou en crée de nouveaux. Chaque rôle de coffre-fort a sa propre clé secrète, qui sert à chiffrer les connexions et les identités qui ne doivent être accessibles qu’à ce rôle et à personne d’autre.
roleManagementEmptyDescription=Gère les rôles de coffre-fort existants ou crée-en de nouveaux. Chaque rôle de coffre-fort a sa propre clé secrète, qui sert à chiffrer les connexions et les identités qui ne doivent être accessibles qu’à ce rôle et à personne d’autre.\n\nLes comptes basés sur les rôles pour une équipe sont pris en charge dans la formule Pro.
userManagement=Gestion des utilisateurs
userManagementEmpty=Gestion des utilisateurs
userManagementDescription=Gère ton utilisateur de coffre-fort existant ou crée-en un nouveau. Ton utilisateur de coffre-fort dispose de sa propre phrase de passe, qui sert à chiffrer les connexions et les identités.
userManagementEmptyDescription=Gère ton utilisateur de coffre-fort existant ou crée-en un nouveau. Ton utilisateur de coffre-fort dispose de sa propre phrase de passe, qui sert à chiffrer les connexions et les identités. Crée un utilisateur pour toi-même afin de pouvoir chiffrer les connexions et les identités avec ta clé personnelle.
userIntroHeader=Gestion des utilisateurs
userIntroContent=Crée ton premier compte utilisateur pour commencer. Ça te permettra de verrouiller cet espace de travail avec un mot de passe.
addReusableIdentity=Ajouter une identité réutilisable
users=Utilisateurs
syncVault=Synchronisation du coffre-fort
syncVaultDescription=Pour synchroniser ton coffre-fort sur plusieurs systèmes, active la synchronisation Git pour ce coffre-fort.
enableGitSync=Activer la synchronisation Git
browseVault=Données du coffre-fort
browseVaultDescription=Tu peux jeter un œil toi-même au répertoire « vault » dans ton gestionnaire de fichiers habituel. Note bien que les modifications externes ne sont pas recommandées et peuvent entraîner divers problèmes.
