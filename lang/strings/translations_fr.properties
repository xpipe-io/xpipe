confirmVaultUnencryptTitle=Confirmer le déchiffrement du coffre-fort
confirmVaultUnencryptContent=Tu veux vraiment désactiver le chiffrement avancé du coffre-fort ? Ça va supprimer le chiffrement supplémentaire des données stockées et écraser les données existantes.
enableHttpApi=Activer l'API HTTP
enableHttpApiDescription=Active l'API, ce qui permet à des programmes externes d'appeler le démon XPipe pour effectuer des actions sur tes connexions gérées.
chooseCustomIcon=Choisis une icône personnalisée
gitVault=Git vault
fileBrowser=Explorateur de fichiers
confirmAllDeletions=Confirmer toutes les suppressions
confirmAllDeletionsDescription=Indique s'il faut afficher une boîte de dialogue de confirmation pour toutes les opérations de suppression. Par défaut, seule la suppression des répertoires nécessite une confirmation.
