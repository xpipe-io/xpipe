ptbNoticeTitle=Avis concernant la version de test publique
ptbNoticeContent=Tu utilises une version PTB d'XPipe. Cette version est instable et peut contenir des bugs. Tu ne devrais pas l'utiliser au quotidien. Elle ne bénéficiera pas non plus de mises à jour régulières après sa période de test. Pour ça, tu devras installer et lancer la version normale d'XPipe.
userDeletionTitle=Suppression d'un utilisateur
userDeletionContent=Tu veux supprimer cet utilisateur du coffre-fort ? Ça va rechiffrer toutes les données avec la clé par défaut du coffre-fort. Ça va prendre un peu de temps.
roleDeletionTitle=Suppression d'un rôle
roleDeletionContent=Tu veux supprimer ce rôle de coffre-fort ? Ça va rechiffrer toutes les identités et tous les secrets de connexion qui utilisent ce rôle. Toutes les entrées qui ne sont accessibles qu'à ce rôle deviendront accessibles à tous les rôles. Ça va prendre un certain temps.
