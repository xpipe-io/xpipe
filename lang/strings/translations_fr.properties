startupBehaviourDescription=Définit le comportement par défaut de l'application de bureau au lancement de XPipe.
clearCachesAlertTitle=Vider le cache
clearCachesAlertContent=Tu veux vider tous les caches XPipe ? Ça va supprimer toutes les données de cache qui sont stockées pour améliorer l'expérience utilisateur.
startGui=Lancer l'interface graphique
startInTray=Lancer depuis la barre d'état système
startInBackground=Démarrer en arrière-plan
clearCaches=Vider les caches...
