rdpClient=Client RDP
rdpClientDescription=Le programme client RDP à appeler lors de l'établissement de connexions RDP.\n\nNote que les différents clients ont des capacités et des niveaux d'intégration variables. Certains clients ne prennent pas en charge la transmission automatique des mots de passe ; tu devras donc les saisir manuellement au moment du lancement.
localShell=Shell local
themeDescription=Ton thème d'affichage préféré.
dontAutomaticallyStartVmSshServer=Ne pas démarrer automatiquement le serveur SSH pour les machines virtuelles quand c'est nécessaire
dontAutomaticallyStartVmSshServerDescription=Toute connexion shell à une machine virtuelle fonctionnant dans un hyperviseur s'effectue via SSH. XPipe peut démarrer automatiquement le serveur SSH installé quand c'est nécessaire. Si tu ne veux pas ça pour des raisons de sécurité, tu peux simplement désactiver cette fonctionnalité avec cette option.
confirmGitShareTitle=Synchronisation Git
confirmGitShareContent=Tu veux ajouter le fichier sélectionné à ton dépôt Git Vault ? Ça va copier une version chiffrée du fichier dans ton Git Vault et valider tes modifications. Tu pourras ensuite accéder au fichier sur tous les ordinateurs synchronisés.
gitShareFileTooltip=Ajoute le fichier au répertoire de données du coffre-fort Git pour qu'il soit automatiquement synchronisé.\n\nCette action ne peut être utilisée que si le coffre-fort Git est activé dans les paramètres.
performanceMode=Mode de performance
performanceModeDescription=Désactive tous les effets visuels qui ne sont pas indispensables pour améliorer les performances de l'application.
dontAcceptNewHostKeys=N'accepte pas automatiquement les nouvelles clés d'hôte SSH
dontAcceptNewHostKeysDescription=Par défaut, XPipe accepte automatiquement les clés hôtes provenant de systèmes pour lesquels ton client SSH n'a pas encore enregistré de clé hôte connue. Cependant, si une clé hôte connue a changé, il refusera de se connecter tant que tu n'auras pas accepté la nouvelle.\n\nDésactiver ce comportement te permet de vérifier toutes les clés hôtes, même s'il n'y a pas de conflit au départ.
uiScale=Échelle de l'interface utilisateur
uiScaleDescription=Une valeur de mise à l'échelle personnalisée que tu peux définir indépendamment de l'échelle d'affichage de ton système. Les valeurs sont exprimées en pourcentage ; par exemple, une valeur de 150 donnera une échelle d'interface utilisateur de 150 %.
editorProgram=Programme d'édition
editorProgramDescription=L'éditeur de texte par défaut à utiliser pour modifier n'importe quel type de données textuelles.
windowOpacity=Opacité de la fenêtre
windowOpacityDescription=Modifie l'opacité de la fenêtre pour te permettre de suivre ce qui se passe en arrière-plan.
useSystemFont=Utiliser la police système
#custom
openDataDir=Répertoire de données du coffre-fort
openDataDirButton=Répertoire de données ouvertes
openDataDirDescription=Si tu veux synchroniser des fichiers supplémentaires, comme des clés SSH, entre tes différents systèmes via ton dépôt Git, tu peux les placer dans le répertoire de stockage des données. Les chemins d'accès de tous les fichiers qui s'y trouvent seront automatiquement adaptés sur chaque système synchronisé.
updates=Mises à jour
selectAll=Tout sélectionner
advanced=Avancé
thirdParty=Mentions relatives à l'open source
eulaDescription=Lis le contrat de licence utilisateur final de l'application XPipe
thirdPartyDescription=Consulter les licences open source des bibliothèques tierces
enableGitStorage=Activer la synchronisation
gitSync=Synchronisation Git
enableGitStorageDescription=Quand cette option est activée, XPipe va initialiser un dépôt Git pour le coffre-fort local et y valider toutes les modifications. Note que ça nécessite que Git soit installé et que ça peut ralentir les opérations de chargement et d'enregistrement.\n\nToutes les catégories qui doivent être synchronisées doivent être explicitement marquées comme synchronisées.
storageGitRemote=URL de synchronisation à distance
storageGitRemoteDescription=Quand cette option est activée, XPipe récupère automatiquement les modifications au chargement et les envoie vers le dépôt distant à l'enregistrement.\n\nÇa te permet de partager ton coffre-fort entre plusieurs installations d'XPipe. Ça prend en charge les URL HTTP et SSH, ainsi que les répertoires locaux.
#custom
vault=Coffre-fort
vaultAccess=Accès au coffre-fort
workspaceLockDescription=Permet de définir un mot de passe personnalisé pour crypter toutes les informations sensibles stockées dans XPipe.\n\nÇa renforce la sécurité, car ça ajoute une couche de cryptage supplémentaire pour tes informations sensibles stockées. On te demandera alors de saisir ce mot de passe au démarrage de XPipe.
useSystemFontDescription=Permet de choisir entre la police par défaut de ton système et la police « Inter », fournie avec XPipe.
windowOptions=Options de la fenêtre
saveWindowLocation=Enregistrer l'emplacement de la fenêtre
saveWindowLocationDescription=Permet de choisir si les coordonnées de la fenêtre doivent être enregistrées et restaurées au redémarrage.
startupShutdown=Démarrage / Arrêt
showChildrenConnectionsInParentCategory=Afficher les sous-catégories dans la catégorie parente
showChildrenConnectionsInParentCategoryDescription=Permet de choisir s'il faut inclure ou non toutes les connexions situées dans les sous-catégories lorsqu'une catégorie parente donnée est sélectionnée.\n\nSi cette option est désactivée, les catégories se comportent davantage comme des dossiers classiques qui n'affichent que leur contenu direct, sans inclure les sous-dossiers.
condenseConnectionDisplay=Affichage condensé des connexions
condenseConnectionDisplayDescription=Fais en sorte que chaque connexion de niveau supérieur prenne moins d'espace vertical pour que la liste des connexions soit plus compacte.
openConnectionSearchWindowOnConnectionCreation=Ouvrir la fenêtre de recherche de connexion lors de la création d'une connexion
openConnectionSearchWindowOnConnectionCreationDescription=Définit s'il faut ou non ouvrir automatiquement la fenêtre de recherche des sous-connexions disponibles lors de l'ajout d'une nouvelle connexion shell.
