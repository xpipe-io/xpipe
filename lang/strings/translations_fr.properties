limitedTouchscreenModeDescription=Si tu utilises cette appli sur une interface tactile un peu particulière, comme l'écran d'un téléphone, certains menus risquent de ne pas fonctionner correctement. Quand cette option est activée, le menu utilise des fonctionnalités plus limitées pour s'adapter aux événements souris/tactiles peu fréquents.
