addWorkspaceDescription=Ouvre la boîte de dialogue de création d'un nouvel espace de travail
workspaceManagement=Gérer les espaces de travail
workspaceManagementDescription=Les espaces de travail sont des configurations distinctes permettant d'exécuter XPipe. Chaque espace de travail dispose d'un répertoire de données où toutes les données sont stockées localement. Ça inclut les données de connexion, les paramètres, et bien plus encore.\n\nSi tu utilises la fonctionnalité de synchronisation, tu peux aussi choisir de synchroniser chaque espace de travail avec un dépôt Git différent.
