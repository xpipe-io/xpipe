workspaceCreationAlertTitle=Création d'un espace de travail
developerForceSshTty=Forcer le TTY SSH
developerForceSshTtyDescription=Fais en sorte que toutes les connexions SSH allouent un pty pour tester la prise en charge d'un stderr manquant et d'un pty.
developerDisableSshTunnelGateways=Désactiver le tunneling de la passerelle SSH
developerDisableSshTunnelGatewaysDescription=N'utilise pas de sessions tunnel pour les passerelles ; connecte-toi plutôt directement au système.
ttyWarning=La connexion a alloué de force un pty/tty et ne fournit pas de flux stderr séparé.\n\nÇa peut poser quelques problèmes.\n\nSi tu peux, essaie de faire en sorte que la commande de connexion n'alloue pas de pty.
