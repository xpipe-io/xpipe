sftpNoticeTitle=Transferts de fichiers volumineux
sftpNoticeContent=Les fichiers que tu essaies de transférer sont assez volumineux. La session actuelle utilise le protocole SSH brut, ce qui ne te permet pas d'atteindre la meilleure vitesse de transfert possible. Si tu as besoin d'augmenter la vitesse de transfert, tu peux envisager d'ouvrir une session SFTP vers le système via le menu contextuel de l'explorateur de fichiers.
hideVaultEntryNames=Masquer les noms des entrées de Git Vault
hideVaultEntryNamesDescription=Supprime tous les noms de connexion et autres informations des fichiers README et des messages de commit lorsque la synchronisation Git est activée. Cette option empêche toute divulgation de la structure du contenu chiffré du coffre-fort.
disableHardwareAcceleration=Désactiver l'accélération matérielle
disableHardwareAccelerationDescription=Désactive l'utilisation de la carte graphique pour le rendu et utilise uniquement un pipeline de rendu logiciel.\n\nÇa entraîne une baisse de performances importante, mais ça peut être la seule solution pour le rendu s'il y a des problèmes avec le pilote de la carte graphique.
disableRdpWindowsSecurityWarning=Désactiver l'avertissement de sécurité RDP
disableRdpWindowsSecurityWarningDescription=Ne pas afficher le nouvel avertissement de Windows concernant les fichiers .rdp non signés à chaque fois que tu lances une nouvelle session.\n\nÇa va modifier la clé de registre pour que le client RDP de Windows revienne à son ancien comportement. Cette action va faire apparaître une fenêtre contextuelle demandant les droits d'administrateur.
rdpWindowsSecurityWarningDialogTitle=Avertissements de sécurité RDP
rdpWindowsSecurityWarningDialogContent=Depuis la version 26200 de Windows, le système affiche désormais systématiquement un avertissement lorsqu'un fichier RDP non signé est lancé, quel que soit son contenu.\n\nTu peux désactiver cet avertissement dans le menu des paramètres.
