asktextAlertTitle=Invite
fileWriteSudoTitle=Écriture dans un fichier via sudo
fileWriteSudoContent=Le fichier que tu essaies d'écrire ne t'accorde pas les droits d'écriture. Tu veux écrire ce fichier en tant que root avec sudo ? Ça te fera automatiquement passer en mode root, soit avec tes identifiants actuels, soit via une invite.
dontAllowTerminalRestart=Ne pas autoriser le redémarrage du terminal
dontAllowTerminalRestartDescription=Par défaut, les sessions de terminal peuvent être relancées après leur fermeture depuis le terminal lui-même. Pour permettre ça, XPipe accepte ces requêtes externes provenant du terminal pour relancer la session\n\nXPipe n'a aucun contrôle sur le terminal ni sur l'origine de cet appel ; des applications locales malveillantes peuvent donc également utiliser cette fonctionnalité pour établir des connexions via XPipe. La désactivation de cette fonctionnalité permet d'éviter ce scénario.
openDocumentation=Documentation Open
openDocumentationDescription=Rends-toi sur la page de la doc XPipe pour en savoir plus sur ce problème
renameAll=Tout renommer
logging=Journalisation
enableTerminalLogging=Activer la journalisation du terminal
enableTerminalLoggingDescription=Active la journalisation côté client pour toutes les sessions de terminal. Toutes les entrées et sorties de la session de terminal sont enregistrées dans un fichier journal de session. Note que les informations sensibles, comme les demandes de mot de passe, ne sont pas enregistrées.
terminalLoggingDirectory=Journaux de session de terminal
terminalLoggingDirectoryDescription=Tous les fichiers journaux sont stockés dans le répertoire de données XPipe sur ton système local.
openSessionLogs=Journaux des sessions ouvertes
sessionLogging=Journalisation du terminal
sessionActive=Une session en arrière-plan est en cours pour cette connexion.\n\nPour arrêter cette session manuellement, clique sur l'indicateur d'état.
skipValidation=Ignorer la validation
scriptsIntroHeader=À propos des scripts
scriptsIntroContent=Tu peux exécuter des scripts au démarrage du shell, dans l'explorateur de fichiers et à la demande. Tu peux créer toi-même des scripts dans XPipe ou en importer des existants depuis ton système local ou depuis un dépôt Git distant.
scriptsIntroBottomHeader=Utilisation de scripts
scriptsIntroBottomContent=Il y a plein d'exemples de scripts pour te lancer. Tu peux cliquer sur le bouton « Modifier » de chaque script pour voir comment ils sont implémentés. Il faut d'abord activer les scripts pour qu'ils s'exécutent et apparaissent dans les menus ; il y a un bouton à cet effet sur chaque script.
scriptsIntroBottomButton=Pour commencer
scriptSourcesIntroHeader=Sources du script
scriptSourcesIntroContent=Tu peux ajouter des sources de scripts personnalisées pour accéder instantanément à toute une collection de scripts shell. Les sources locales et les dépôts Git distants sont tous deux pris en charge. Tous les scripts détectés dans la source seront automatiquement disponibles.
scriptSourcesIntroButton=Ajouter la source...
checkForSecurityUpdates=Vérifier les mises à jour de sécurité
checkForSecurityUpdatesDescription=XPipe peut vérifier les mises à jour de sécurité potentielles indépendamment des mises à jour habituelles des fonctionnalités. Lorsque cette option est activée, les mises à jour de sécurité au moins importantes te seront recommandées, même si la vérification habituelle des mises à jour est désactivée.\n\nSi tu désactives ce paramètre, aucune requête de version externe ne sera effectuée et tu ne seras pas averti des mises à jour de sécurité.
clickToDock=Clique pour ancrer le terminal
terminalStarting=En attente du démarrage du terminal...
#custom
pinTab=Épingler l'onglet
#custom
unpinTab=Détacher l'onglet
pinned=Épinglé
enableConnectionHubTerminalDocking=Ancrer la fenêtre du terminal au hub de connexion
enableConnectionHubTerminalDockingDescription=Tu peux ancrer des fenêtres de terminal à la fenêtre de l'application XPipe dans le hub de connexion pour simuler un terminal plus ou moins intégré. Les fenêtres de terminal sont alors gérées par XPipe pour s'adapter en permanence à l'ancrage.
enableFileBrowserTerminalDocking=Activer l'ancrage du navigateur de fichiers
enableFileBrowserTerminalDockingDescription=Tu peux ancrer des fenêtres de terminal à la fenêtre de l'application XPipe dans l'explorateur de fichiers pour simuler un terminal en quelque sorte intégré. Les fenêtres de terminal sont alors gérées par XPipe pour s'adapter en permanence à l'ancrage.
downloadsDirectory=Répertoire de téléchargements personnalisés
downloadsDirectoryDescription=Le répertoire personnalisé dans lequel les fichiers téléchargés seront placés lorsque tu cliques sur le bouton « Déplacer vers les téléchargements ». Par défaut, XPipe utilisera ton répertoire de téléchargements utilisateur.
pinLocalMachineOnStartup=Épingler l'onglet « Ordinateur local » au démarrage
pinLocalMachineOnStartupDescription=Ouvre automatiquement un onglet « Ordinateur local » et épingle-le. C'est pratique si tu utilises souvent un explorateur de fichiers en mode fractionné avec l'ordinateur local et le système de fichiers distant ouverts.
terminalErrorDescription=Cette erreur est fatale et XPipe ne peut pas continuer sans la corriger.
groupName=Nom du groupe
chmodPermissions=Nouvelles autorisations
editFilesWithDoubleClick=Modifie les fichiers en double-cliquant dessus
editFilesWithDoubleClickDescription=Quand cette option est activée, un double-clic sur un fichier l'ouvre directement dans ton éditeur de texte au lieu d'afficher le menu contextuel.
censorMode=Mode « Censor »
censorModeDescription=Masque toutes les informations telles que les noms d'hôtes, les noms d'utilisateurs, les noms de connexion, etc.\n\nC'est utile si tu comptes faire une capture d'écran ou partager ton écran avec XPipe sans divulguer d'informations.
addIdentity=Identité...
