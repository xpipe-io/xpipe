addMacro=Action...
identitiesIntroHeader=À propos des identités
identitiesIntroContent=Si tu réutilises souvent les mêmes combinaisons de noms d'utilisateur, de mots de passe et de clés, ça peut être utile de créer des identités réutilisables. Ça te permet de les retrouver rapidement quand tu ajoutes de nouvelles connexions.
identitiesIntroBottomHeader=Partage d'identités
identitiesIntroBottomContent=Tu peux ajouter des identités localement ou les synchroniser dans le dépôt Git lorsque cette fonctionnalité est activée. Ça te permet de partager de manière sélective des identités entre plusieurs systèmes et avec d'autres membres de l'équipe.
identitiesIntroBottomButton=Synchronisation de la configuration
identitiesIntroButton=Créer une identité
