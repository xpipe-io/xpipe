notAnEmptyDirectory=Ce n'est pas un répertoire vide
automaticallyCheckForUpdates=Vérifier les mises à jour
automaticallyCheckForUpdatesDescription=Quand cette option est activée, les infos sur les nouvelles versions sont automatiquement récupérées au bout d'un certain temps pendant que XPipe est en cours d'exécution. Tu dois quand même valider explicitement l'installation de chaque mise à jour.
developerMode=Mode développeur
developerModeDescription=Une fois cette option activée, tu auras accès à toute une série d'options supplémentaires utiles pour le développement.
editor=Éditeur
custom=Personnalisé
passwordManager=Gestionnaire de mots de passe
externalPasswordManager=Gestionnaire de mots de passe externe
passwordManagerDescription=Le gestionnaire de mots de passe installé localement avec lequel t'as besoin de t'intégrer.\n\nSi t'as un gestionnaire de mots de passe installé, tu peux configurer XPipe pour qu'il récupère les identifiants depuis celui-ci, comme ça XPipe n'aura pas à les gérer lui-même.
passwordManagerTest=Teste un gestionnaire de mots de passe
passwordManagerTestDescription=Vérifie si l'intégration du gestionnaire de mots de passe fonctionne correctement. Assure-toi d'utiliser le bon format d'identifiant pour référencer une entrée dans le gestionnaire de mots de passe.
preferTerminalTabs=Préfère ouvrir de nouveaux onglets
preferTerminalTabsDescription=Détermine si XPipe va essayer d'ouvrir de nouveaux onglets dans le terminal de ton choix plutôt que de nouvelles fenêtres. Tous les terminaux ne prennent pas en charge les onglets.
customRdpClientCommand=Commande personnalisée
customRdpClientCommandDescription=La commande à exécuter pour lancer le client RDP personnalisé.\n\nLa chaîne de caractères $FILE sera remplacée par le nom absolu du fichier .rdp entre guillemets lors de l'appel. N'oublie pas de mettre entre guillemets le chemin d'accès à ton exécutable s'il contient des espaces.
customEditorCommand=Commande d'éditeur personnalisée
customEditorCommandDescription=La commande à exécuter pour lancer l'éditeur personnalisé.\n\nLa chaîne de caractères $FILE sera remplacée par le nom de fichier absolu entre guillemets lors de l'appel. N'oublie pas de mettre entre guillemets le chemin d'accès à l'exécutable de ton éditeur s'il contient des espaces.
encryptAllVaultData=Crypte toutes les données du coffre-fort
encryptAllVaultDataDescription=Quand cette option est activée, toutes les données de connexion au coffre seront chiffrées avec ta clé de chiffrement du coffre utilisateur, et pas seulement les secrets contenus dans ces données. Ça ajoute une couche de sécurité supplémentaire pour d’autres paramètres comme les noms d’utilisateur, les noms d’hôte, etc., qui ne sont pas chiffrés par défaut dans le coffre.\n\nCette option rendra ton historique Git du coffre-fort et tes diffs inutilisables, car tu ne pourras plus voir les modifications d'origine, mais uniquement les modifications binaires.
#custom
vaultSecurity=Sécurité du coffre-fort
developerDisableUpdateVersionCheck=Désactiver la vérification de la mise à jour
developerDisableUpdateVersionCheckDescription=Détermine si le vérificateur de mises à jour va ignorer le numéro de version lors de la recherche d'une mise à jour.
shellCommandTest=Test de commande Shell
shellCommandTestDescription=Exécute une commande dans la session shell utilisée en interne par XPipe.
terminal=Terminal
terminalType=Émulateur de terminal
terminalConfiguration=Configuration du terminal
terminalCustomization=Personnalisation du terminal
editorConfiguration=Configuration de l'éditeur
defaultApplication=Application par défaut
initialSetup=Configuration initiale
terminalTypeDescription=Le terminal par défaut à utiliser pour ouvrir des connexions shell.\n\nLe niveau de prise en charge des fonctionnalités varie selon les terminaux, et chacun est indiqué comme étant soit recommandé, soit non recommandé. Tu profiteras d'une meilleure expérience utilisateur en utilisant un terminal recommandé.
customTerminalCommand=Commande de terminal personnalisée
customTerminalCommandDescription=La commande à exécuter pour ouvrir le terminal personnalisé avec une commande donnée.\n\nXPipe va créer un script shell de lancement temporaire que ton terminal devra exécuter. La chaîne de caractères de remplacement $CMD dans la commande que tu fournis sera remplacée par le script de lancement réel lors de son appel. N'oublie pas de mettre entre guillemets le chemin d'accès à l'exécutable de ton terminal s'il contient des espaces.
clearTerminalOnInit=Effacer le terminal à la démarrage
clearTerminalOnInitDescription=Quand cette option est activée, XPipe exécute une commande « clear » après le lancement d'une nouvelle session de terminal pour effacer tout affichage inutile qui aurait pu apparaître au démarrage de la session.
dontCachePasswords=Ne mets pas en cache les mots de passe demandés
dontCachePasswordsDescription=Détermine si les mots de passe demandés doivent être mis en cache en interne par XPipe pour que tu n'aies pas à les saisir à nouveau au cours de la session en cours.\n\nSi cette fonctionnalité est désactivée, tu devras ressaisir les identifiants demandés à chaque fois que le système t'y invite.
denyTempScriptCreation=Interdire la création de scripts temporaires
denyTempScriptCreationDescription=Pour mettre en œuvre certaines de ses fonctionnalités, XPipe crée parfois des scripts shell temporaires sur un système cible afin de faciliter l'exécution de commandes simples. Ceux-ci ne contiennent aucune information sensible et sont uniquement créés à des fins de mise en œuvre.\n\nSi cette fonctionnalité est désactivée, XPipe ne créera aucun fichier temporaire sur un système distant. Cette option est utile dans les environnements hautement sécurisés où chaque modification du système de fichiers est surveillée. Si elle est désactivée, certaines fonctionnalités, comme les environnements shell et les scripts, ne fonctionneront pas comme prévu.
disableCertutilUse=Désactiver l'utilisation de certutil sous Windows
useLocalFallbackShell=Utiliser le shell de secours local
useLocalFallbackShellDescription=Passe à un autre shell local pour gérer les opérations locales. Il s'agit de PowerShell sous Windows et du shell Bourne sur les autres systèmes.\n\nCette option peut être utilisée si le shell local par défaut est désactivé ou ne fonctionne pas correctement. Certaines fonctionnalités risquent toutefois de ne pas fonctionner comme prévu lorsque cette option est activée.
disableCertutilUseDescription=À cause de plusieurs lacunes et bugs dans cmd.exe, des scripts shell temporaires sont créés avec certutil en l'utilisant pour décoder les entrées en base64, car cmd.exe plante avec les entrées non-ASCII. XPipe peut aussi utiliser PowerShell pour ça, mais ce sera plus lent.\n\nÇa désactive toute utilisation de certutil sur les systèmes Windows pour mettre en œuvre certaines fonctionnalités et se rabat sur PowerShell à la place. Ça pourrait plaire à certains antivirus, car certains d'entre eux bloquent l'utilisation de certutil.
