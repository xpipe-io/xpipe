enableFileBrowserTerminalDockingDescription=Dosya tarayıcısındaki XPipe uygulama penceresine terminal pencerelerini kenetleyerek, bir nevi entegre terminal simülasyonu oluşturabilirsiniz. Terminal pencereleri, her zaman kenetleme alanına sığacak şekilde XPipe tarafından yönetilir.
downloadsDirectory=Özel indirme dizini
downloadsDirectoryDescription="İndirilenler klasörüne taşı" düğmesine tıklandığında indirilen dosyaların yerleştirileceği özel dizin. Varsayılan olarak, XPipe kullanıcı indirilenler dizinini kullanır.
pinLocalMachineOnStartup=Başlangıçta "Yerel Bilgisayar" sekmesini sabitle
pinLocalMachineOnStartupDescription=Yerel makine sekmesini otomatik olarak açın ve sabitleyin. Bu, yerel makine ve uzak dosya sistemi açıkken sık sık bölünmüş dosya tarayıcısını kullanıyorsanız yararlıdır.
