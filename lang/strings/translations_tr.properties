identitiesIntroHeader=Kimlikler hakkında
identitiesIntroContent=Kullanıcı adları, şifreler ve anahtarların sık kullanılan kombinasyonlarını tekrar kullanıyorsanız, yeniden kullanılabilir kimlikler oluşturmak mantıklı olabilir. Bu, yeni bağlantılar eklerken bunlara hızlı bir şekilde başvurabilmenizi sağlar.
identitiesIntroBottomHeader=Kimliklerin paylaşılması
identitiesIntroBottomContent=Kimlikleri yerel olarak ekleyebilir veya bu özellik etkinleştirildiğinde git deposuyla senkronize edebilirsiniz. Bu, kimlikleri birden fazla sistem arasında ve diğer ekip üyeleriyle seçici bir şekilde paylaşmanıza olanak tanır.
identitiesIntroBottomButton=Senkronizasyon ayarları
