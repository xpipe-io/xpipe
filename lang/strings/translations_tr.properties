vaultAccess=Kasa erişimi
workspaceLockDescription=XPipe'da depolanan tüm hassas bilgileri şifrelemek için özel bir şifre belirler.\n\nBu, depolanan hassas bilgileriniz için ek bir şifreleme katmanı sağladığından güvenliği artırır. Ardından, XPipe başlatıldığında şifre girmeniz istenecektir.
useSystemFontDescription=Varsayılan sistem yazı tipinin mi yoksa XPipe ile birlikte gelen Inter yazı tipinin mi kullanılacağını belirler.
