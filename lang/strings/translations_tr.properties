sftpNoticeTitle=Büyük dosya aktarımları
sftpNoticeContent=Aktarmaya çalıştığınız dosyalar oldukça büyüktür. Mevcut oturum, size mümkün olan en yüksek aktarım hızını sağlamayan ham SSH'ye dayanmaktadır. Aktarım hızını artırmanız gerekiyorsa, dosya tarayıcısındaki sağ tıklama menüsünden sisteme bir SFTP oturumu açmayı deneyebilirsiniz.
