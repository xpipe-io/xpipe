workspaceManagementDescription=Çalışma alanları, XPipe'ı çalıştırmak için kullanılan farklı yapılandırmalardır. Her çalışma alanında, tüm verilerin yerel olarak depolandığı bir veri dizini bulunur. Bu veriler arasında bağlantı verileri, ayarlar ve daha fazlası yer alır.\n\nSenkronizasyon özelliğini kullanıyorsanız, her çalışma alanını farklı bir git deposuyla senkronize etmeyi de seçebilirsiniz.
