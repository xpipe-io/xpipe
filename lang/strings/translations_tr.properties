passwordManagerTestDescription=Şifre yöneticisi entegrasyonunun doğru şekilde çalışıp çalışmadığını kontrol edin. Şifre yöneticisindeki bir girişe başvururken doğru tanımlayıcı biçimini kullandığınızdan emin olun.
