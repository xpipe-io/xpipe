enableTerminalLoggingDescription=Tüm terminal oturumları için istemci tarafında günlük kaydı özelliğini etkinleştirir. Terminal oturumunun tüm giriş ve çıkışları bir oturum günlük dosyasına yazılır. Şifre istemleri gibi hassas bilgilerin kaydedilmediğine dikkat edin.
