scriptsIntroHeader=Komut dosyaları hakkında
scriptsIntroContent=Komut dosyalarını kabuk başlatma sırasında, dosya tarayıcısında ve isteğe bağlı olarak çalıştırabilirsiniz. Komut dosyalarını XPipe içinde kendiniz oluşturabilir veya yerel sisteminizden ya da uzak bir Git deposundan mevcut olanları içe aktarabilirsiniz.
scriptsIntroBottomHeader=Komut dosyalarını kullanma
scriptsIntroBottomContent=Başlangıç için çeşitli örnek komut dosyaları mevcuttur. Her bir komut dosyasının düzenle düğmesine tıklayarak bunların nasıl uygulandığını görebilirsiniz. Komut dosyalarının çalışabilmesi ve menülerde görünmesi için önce etkinleştirilmesi gerekir; bunun için her komut dosyasında bir açma/kapama düğmesi bulunur.
scriptsIntroBottomButton=Başlayın
scriptSourcesIntroHeader=Komut dosyası kaynakları
scriptSourcesIntroContent=Bir kabuk betik koleksiyonunun tamamına anında erişebilmek için özel betik kaynakları ekleyebilirsiniz. Hem yerel kaynaklar hem de uzak git depoları kaynak olarak desteklenmektedir. Kaynaktan algılanan tüm betikler otomatik olarak kullanılabilir hale gelir.
scriptSourcesIntroButton=Kaynak ekle ...
checkForSecurityUpdates=Güvenlik güncellemelerini kontrol edin
checkForSecurityUpdatesDescription=XPipe, normal özellik güncellemelerinden ayrı olarak olası güvenlik güncellemelerini kontrol edebilir. Bu özellik etkinleştirildiğinde, normal güncelleme kontrolü devre dışı olsa bile en azından önemli güvenlik güncellemelerinin yüklenmesi önerilecektir.\n\nBu ayarın devre dışı bırakılması durumunda, harici sürüm sorgulaması yapılmayacak ve güvenlik güncellemeleri hakkında herhangi bir bildirim almayacaksınız.
