preferTerminalTabsDescription=XPipe'ın yeni pencereler yerine seçtiğiniz terminalde yeni sekmeler açmaya çalışıp çalışmayacağını belirler. Her terminal sekmeleri desteklemez.
customRdpClientCommand=Özel komut
customRdpClientCommandDescription=Özel RDP istemcisini başlatmak için çalıştırılması gereken komut.\n\nYer tutucu dizesi $FILE, çağrıldığında tırnak içine alınmış mutlak .rdp dosya adıyla değiştirilecektir. Yürütülebilir dosyanın yolunda boşluk varsa, tırnak içine almayı unutmayın.
customEditorCommand=Özel düzenleyici komutu
customEditorCommandDescription=Özel düzenleyiciyi başlatmak için çalıştırılacak komut.\n\n$FILE yer tutucu dizesi, çağrıldığında tırnak içine alınmış mutlak dosya adıyla değiştirilecektir. Düzenleyicinizin yürütülebilir dosya yolunda boşluk varsa, bu yolu tırnak içine almayı unutmayın.
encryptAllVaultData=Kasa verilerinin tamamını şifrele
encryptAllVaultDataDescription=Etkinleştirildiğinde, kasa bağlantı verilerinin içindeki yalnızca gizli bilgiler değil, verilerin her parçası kullanıcı kasa şifreleme anahtarınızla şifrelenecektir. Bu, kasada varsayılan olarak şifrelenmeyen kullanıcı adları, ana bilgisayar adları vb. gibi diğer parametreler için ek bir güvenlik katmanı sağlar.\n\nBu seçenek, artık orijinal değişiklikleri göremeyeceğiniz, yalnızca ikili değişiklikleri görebileceğiniz için git kasası geçmişinizi ve farklarını kullanılamaz hale getirecektir.
vaultSecurity=Kasa güvenliği
developerDisableUpdateVersionCheck=Sürüm Kontrolünü Devre Dışı Bırak
