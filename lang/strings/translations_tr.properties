openDataDirDescription=SSH anahtarları gibi ek dosyaları sistemler arasında git deponuzla senkronize etmek istiyorsanız, bunları depolama verileri dizinine yerleştirebilirsiniz. Bu dizinde bulunan tüm dosyaların dosya yolları, senkronize edilen herhangi bir sistemde otomatik olarak uyarlanacaktır.
