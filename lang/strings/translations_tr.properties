passwordManagerDescription=Entegre edilecek yerel olarak yüklü şifre yöneticisi.\n\nYüklü bir şifre yöneticiniz varsa, XPipe'ın şifreleri kendisi yönetmek zorunda kalmaması için, XPipe'ı bu şifre yöneticisinden gizli bilgileri alması üzere yapılandırabilirsiniz.
