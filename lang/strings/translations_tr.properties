teamVaults=Ekip kasaları
vaultTypeNameDefault=Varsayılan kasa
vaultTypeNamePersonal=Kişisel kasa
vaultTypeNameTeam=Ekip kasası
teamVaultsDescription=Takım kasaları, birden fazla kullanıcı ve rolün paylaşılan bir kasaya güvenli bir şekilde erişmesine olanak tanır. Bağlantıları ve kimlikleri, tüm kullanıcılar için paylaşılacak şekilde yapılandırabilir veya kendi anahtarlarıyla şifreleyerek yalnızca belirli kullanıcılar ve roller için kullanılabilir hale getirebilirsiniz. Anahtara erişimi olmayan diğer kasa kullanıcıları, kişisel ve rol tabanlı bağlantılara ve kimliklere erişemez.
vaultTypeContentDefault=Şu anda, kullanıcı ve özel parolası ayarlanmamış varsayılan bir kasa kullanıyorsunuz. Gizli bilgiler, yerel kasa anahtarıyla şifrelenir.\n\nBir kasa kullanıcı hesabı oluşturarak kişisel kasaya geçebilirsiniz. Bu, kasayı her oturum açışınızda kilidi açmak için girmeniz gereken kendi kişisel parolanızla kasa gizli bilgilerini şifrelemenizi sağlar.
vaultTypeContentPersonal=Şu anda kullanıcınız için kişisel bir kasa kullanıyorsunuz. Gizli bilgiler, kişisel şifrenizle şifrelenmiştir.
vaultTypeContentTeam=Şu anda, birden fazla kullanıcının paylaşılan bir kasaya güvenli bir şekilde erişmesine olanak tanıyan bir takım kasası kullanıyorsunuz. Bağlantıları ve kimlikleri, tüm kullanıcılarla paylaşılacak şekilde ya da kişisel anahtarınız veya rol anahtarınızla şifreleyerek yalnızca kişisel kullanıcınız veya rolünüz için kullanılabilir olacak şekilde yapılandırabilirsiniz. Anahtara erişimi olmayan diğer kasa kullanıcıları, kişisel ve rol tabanlı bağlantılarınıza ve kimliklerinize erişemez.
roleManagement=Rol yönetimi
roleManagementEmpty=Rol yönetimi
roleManagementDescription=Mevcut kasa rollerini yönetin veya yenilerini oluşturun. Her kasa rolünün, yalnızca o rolün erişebileceği ve başkalarının erişemeyeceği bağlantıları ve kimlikleri şifrelemek için kullanılan kendine özgü bir gizli anahtarı vardır.
roleManagementEmptyDescription=Mevcut kasa rollerini yönetin veya yenilerini oluşturun. Her kasa rolünün, yalnızca o rolün erişebileceği ve başkalarının erişemeyeceği bağlantıları ve kimlikleri şifrelemek için kullanılan kendine özgü bir gizli anahtarı vardır.\n\nProfesyonel planda, bir ekip için rol tabanlı hesaplar desteklenmektedir.
userManagement=Kullanıcı yönetimi
userManagementEmpty=Kullanıcı yönetimi
userManagementDescription=Mevcut kasası kullanıcınızı yönetin veya yeni bir kullanıcı oluşturun. Kasa kullanıcınızın, bağlantıları ve kimlikleri şifrelemek için kullanılan kendine özgü bir parolası vardır.
userManagementEmptyDescription=Mevcut kasası kullanıcınızı yönetin veya yeni bir kullanıcı oluşturun. Kasası kullanıcınızın, bağlantıları ve kimlikleri şifrelemek için kullanılan kendine özgü bir parolası vardır. Kişisel anahtarınızla bağlantıları ve kimlikleri şifreleyebilmek için kendinize bir kullanıcı oluşturun.
