rdpClientDescription=RDP bağlantıları başlatılırken çağrılacak RDP istemci programı.\n\nÇeşitli istemcilerin farklı düzeylerde yeteneklere ve entegrasyonlara sahip olduğunu unutmayın. Bazı istemciler şifrelerin otomatik olarak aktarılmasını desteklemez, bu nedenle başlatma sırasında şifreleri yine de girmeniz gerekir.
