confirmGitShareTitle=Git senkronizasyonu
confirmGitShareContent=Seçilen dosyayı Git Vault deponuza eklemek istiyor musunuz? Bu işlem, dosyanın şifrelenmiş bir sürümünü Git Vault'unuza kopyalayacak ve değişikliklerinizi kaydedecektir. Ardından, senkronize edilmiş tüm masaüstü bilgisayarlardan dosyaya erişebileceksiniz.
gitShareFileTooltip=Dosyayı, otomatik olarak senkronize edilmesi için git vault veri dizinine ekleyin.\n\nBu eylem, yalnızca ayarlarda git vault etkinleştirildiğinde kullanılabilir.
performanceMode=Performans modu
performanceModeDescription=Uygulamanın performansını artırmak amacıyla gerekli olmayan tüm görsel efektleri devre dışı bırakır.
dontAcceptNewHostKeys=Yeni SSH ana bilgisayar anahtarlarını otomatik olarak kabul etme
dontAcceptNewHostKeysDescription=XPipe, varsayılan olarak SSH istemcinizde henüz kaydedilmiş bilinen bir ana bilgisayar anahtarı bulunmayan sistemlerden gelen ana bilgisayar anahtarlarını otomatik olarak kabul eder. Ancak, bilinen herhangi bir ana bilgisayar anahtarı değişmişse, yeni anahtarı kabul etmediğiniz sürece bağlantı kurulmaz.\n\nBu davranışı devre dışı bırakmak, başlangıçta herhangi bir çakışma olmasa bile tüm ana bilgisayar anahtarlarını kontrol etmenizi sağlar.
uiScale=Kullanıcı Arayüzü Ölçeği
uiScaleDescription=Sistem genelindeki ekran ölçeğinden bağımsız olarak ayarlanabilen özel bir ölçeklendirme değeri. Değerler yüzde cinsindendir; örneğin, 150 değeri, kullanıcı arayüzünün %150 oranında ölçeklenmesine neden olur.
