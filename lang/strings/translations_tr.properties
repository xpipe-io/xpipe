enableGitStorageDescription=Etkinleştirildiğinde, XPipe yerel kasa için bir git deposu başlatır ve yapılan tüm değişiklikleri bu depoya kaydeder. Bunun için git'in kurulu olması gerektiğini ve yükleme ile kaydetme işlemlerini yavaşlatabileceğini unutmayın.\n\nSenkronize edilmesi gereken tüm kategoriler, açıkça senkronize olarak işaretlenmelidir.
storageGitRemote=Uzaktan senkronizasyon URL'si
storageGitRemoteDescription=Bu ayar etkinleştirildiğinde, XPipe yükleme sırasında değişiklikleri otomatik olarak alır ve kaydetme sırasında değişiklikleri uzak depoya gönderir.\n\nBu, kasanızı birden fazla XPipe kurulumunda paylaşmanıza olanak tanır. HTTP ve SSH URL'lerinin yanı sıra yerel dizinleri de destekler.
