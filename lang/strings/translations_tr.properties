disableRdpWindowsSecurityWarning=RDP güvenlik uyarısını devre dışı bırak
disableRdpWindowsSecurityWarningDescription=Yeni bir oturum açıldığında, imzalanmamış .rdp dosyalarıyla ilgili yeni Windows uyarısını gösterme.\n\nBu işlem, Windows RDP istemcisini eski davranışına döndürmek için kayıt defteri anahtarını değiştirecektir. Bu işlem, yönetici ayrıcalıkları gerektiren bir açılır pencere gösterecektir.
rdpWindowsSecurityWarningDialogTitle=RDP güvenlik uyarıları
rdpWindowsSecurityWarningDialogContent=Windows 26200 sürümünden itibaren, Windows artık içeriğine bakılmaksızın imzalanmamış bir RDP dosyası başlatıldığında her zaman bir uyarı gösterecektir.\n\nBu uyarıyı ayarlar menüsünden devre dışı bırakabilirsiniz.
