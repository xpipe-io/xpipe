fileWriteSudoTitle=Sudo ile dosya yazma
fileWriteSudoContent=Yazmaya çalıştığınız dosya, kullanıcınıza yazma izni vermiyor. Bu dosyayı sudo komutuyla root olarak yazmak ister misiniz? Bu işlem, mevcut kimlik bilgilerini kullanarak veya bir komut istemi aracılığıyla otomatik olarak root ayrıcalıklarına yükseltilecektir.
dontAllowTerminalRestart=Terminalin yeniden başlatılmasına izin verme
dontAllowTerminalRestartDescription=Varsayılan olarak, terminal oturumları sonlandırıldıktan sonra terminal içinden yeniden başlatılabilir. Bunu sağlamak için XPipe, oturumu yeniden başlatmak üzere terminalden gelen bu harici istekleri kabul eder\n\nXPipe, terminal üzerinde veya bu çağrının nereden geldiği konusunda herhangi bir kontrole sahip değildir; bu nedenle, kötü niyetli yerel uygulamalar da bu işlevselliği kullanarak XPipe üzerinden bağlantılar kurabilir. Bu işlevselliği devre dışı bırakmak, bu senaryoyu önler.
