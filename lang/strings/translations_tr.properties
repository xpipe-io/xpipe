editFilesWithDoubleClickDescription=Bu özellik etkinleştirildiğinde, dosyalara çift tıkladığınızda bağlam menüsü gösterilmeyecek ve dosyalar doğrudan metin düzenleyicinizde açılacaktır.
censorMode=Sansür modu
censorModeDescription=Ana bilgisayar adları, kullanıcı adları, bağlantı adları ve benzeri bilgileri bulanıklaştırır.\n\nBu özellik, XPipe'ın ekran görüntüsünü almak veya ekran paylaşımı yapmak istediğinizde herhangi bir bilgi sızmasını önlemek için kullanışlıdır.
