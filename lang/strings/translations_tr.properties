storeIntroImportContent=Başka bir sistemde XPipe'ı zaten kullanıyor musunuz? Uzak bir git deposu aracılığıyla mevcut bağlantılarınızı birden fazla sistem arasında senkronize edin. Henüz kurulum yapılmamışsa, daha sonra istediğiniz zaman senkronize edebilirsiniz.
