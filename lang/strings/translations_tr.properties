enableConnectionHubTerminalDockingDescription=Bağlantı merkezindeki XPipe uygulama penceresine terminal pencerelerini yerleştirerek, bir nevi entegre bir terminal simülasyonu oluşturabilirsiniz. Terminal pencereleri, her zaman yerleştirme alanına sığacak şekilde XPipe tarafından yönetilir.
