terminalTypeDescription=Kabuk bağlantılarını açmak için kullanılacak varsayılan terminal.\n\nÖzellik desteği düzeyi terminale göre değişir ve her terminal "önerilen" veya "önerilmeyen" olarak işaretlenmiştir. Önerilen bir terminal kullandığınızda en iyi kullanıcı deneyimini yaşarsınız.
customTerminalCommand=Özel terminal komutu
customTerminalCommandDescription=Belirtilen komutla özel terminali açmak için çalıştırılması gereken komut.\n\nXPipe, terminalinizin çalıştırması için geçici bir başlatıcı kabuk betiği oluşturacaktır. Sağladığınız komuttaki $CMD yer tutucu dizesi, çağrıldığında gerçek başlatıcı betiği ile değiştirilecektir. Terminal çalıştırılabilir dosyanızın yolunda boşluk varsa, bunu tırnak içine almayı unutmayın.
clearTerminalOnInit=Başlatma sırasında terminali temizle
clearTerminalOnInitDescription=Etkinleştirildiğinde, XPipe yeni bir terminal oturumu başlatıldıktan sonra bir temizleme komutu çalıştırarak, terminal oturumunun başlatılması sırasında yazdırılan gereksiz çıktıları kaldırır.
dontCachePasswords=İstenen şifreleri önbelleğe almayın
dontCachePasswordsDescription=Sorgulanan şifrelerin XPipe tarafından dahili olarak önbelleğe alınmasını kontrol eder; böylece mevcut oturumda bunları tekrar girmek zorunda kalmazsınız.\n\nBu davranış devre dışı bırakılırsa, sistem tarafından her istendiğinde istenen kimlik bilgilerini yeniden girmeniz gerekir.
denyTempScriptCreation=Geçici komut dosyası oluşturulmasını engelle
denyTempScriptCreationDescription=XPipe, bazı işlevlerini gerçekleştirmek için bazen basit komutların kolayca yürütülmesini sağlamak amacıyla hedef sistemde geçici kabuk betikleri oluşturur. Bunlar herhangi bir hassas bilgi içermez ve yalnızca uygulama amaçlı oluşturulur.\n\nBu davranış devre dışı bırakılırsa, XPipe uzak sistemde herhangi bir geçici dosya oluşturmaz. Bu seçenek, her dosya sistemi değişikliğinin izlendiği yüksek güvenlikli ortamlarda kullanışlıdır. Bu seçenek devre dışı bırakılırsa, kabuk ortamları ve betikler gibi bazı işlevler amaçlandığı gibi çalışmayacaktır.
disableCertutilUse=Windows'ta certutil kullanımını devre dışı bırakma
useLocalFallbackShell=Yerel yedek kabuğu kullan
useLocalFallbackShellDescription=Yerel işlemleri gerçekleştirmek için başka bir yerel kabuk kullanmaya geçin. Bu, Windows'ta PowerShell, diğer sistemlerde ise Bourne kabuğu olacaktır.\n\nBu seçenek, normal yerel varsayılan kabuk devre dışı bırakılmışsa veya bir dereceye kadar bozulmuşsa kullanılabilir. Ancak bu seçenek etkinleştirildiğinde bazı özellikler beklendiği gibi çalışmayabilir.
disableCertutilUseDescription=cmd.exe'deki çeşitli eksiklikler ve hatalar nedeniyle, cmd.exe ASCII dışı girdilerde çökmesi nedeniyle, base64 girdisini çözmek için certutil kullanılarak geçici kabuk betikleri oluşturulur. XPipe bunun için PowerShell'i de kullanabilir, ancak bu daha yavaş olacaktır.\n\nBu, bazı işlevleri gerçekleştirmek için Windows sistemlerinde certutil kullanımını devre dışı bırakır ve bunun yerine PowerShell'e geri dönülmesini sağlar. Bazı antivirüs programları certutil kullanımını engellediğinden, bu durum bazı antivirüs programlarını memnun edebilir.
