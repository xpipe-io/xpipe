hideVaultEntryNamesDescription=Fjerner alle forbindelsesnavne og andre oplysninger fra README-filer og commit-beskeder, når git sync er aktiveret. Denne indstilling forhindrer indsigt i strukturen af det krypterede indhold i boksen.
disableHardwareAcceleration=Deaktiver hardwareacceleration
disableHardwareAccelerationDescription=Deaktiverer al brug af grafikkortet til rendering og bruger udelukkende en softwarebaseret rendering-pipeline.\n\nDette medfører en betydelig forringelse af ydeevnen, men kan være den eneste mulighed for rendering, hvis der er problemer med grafikkortdriveren.
disableRdpWindowsSecurityWarning=Deaktiver RDP-sikkerhedsadvarsel
disableRdpWindowsSecurityWarningDescription=Vis ikke den nye Windows-advarsel om usignerede .rdp-filer, når der startes en ny session.\n\nDette ændrer registreringsnøglen, så Windows RDP-klienten vender tilbage til sin tidligere adfærd. Denne handling vil frembringe en popup-meddelelse om administratorrettigheder.
rdpWindowsSecurityWarningDialogTitle=RDP-sikkerhedsadvarsler
rdpWindowsSecurityWarningDialogContent=Siden Windows-build 26200 viser Windows nu altid en advarsel, når en usigneret RDP-fil startes, uanset dens indhold.\n\nDu kan deaktivere denne advarsel i indstillingsmenuen.
