fileWriteSudoTitle=Sudo-filskrivning
fileWriteSudoContent=Den fil, du forsøger at skrive til, giver ikke din bruger skrivetilladelse. Vil du skrive til denne fil som root med sudo? Dette vil automatisk give root-adgang enten med de eksisterende legitimationsoplysninger eller via en prompt.
dontAllowTerminalRestart=Tillad ikke genstart af terminalen
dontAllowTerminalRestartDescription=Som standard kan terminalsessioner genstartes fra terminalen, efter at de er afsluttet. For at muliggøre dette accepterer XPipe disse eksterne anmodninger fra terminalen om at starte sessionen igen\n\nXPipe har ingen kontrol over terminalen eller over, hvor denne anmodning kommer fra, så ondsindede lokale programmer kan også udnytte denne funktion til at oprette forbindelser via XPipe. Deaktivering af denne funktion forhindrer dette scenarie.
