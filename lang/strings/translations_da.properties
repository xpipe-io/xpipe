ptbNoticeTitle=Meddelelse om den offentlige testversion
ptbNoticeContent=Du kører en PTB-version af XPipe. Denne version er ustabil og kan indeholde fejl. Du bør ikke bruge den som din daglige drivrutine. Den vil heller ikke modtage regelmæssige opdateringer efter testperioden. Til det formål skal du installere og starte den normale XPipe-udgave.
userDeletionTitle=Sletning af bruger
userDeletionContent=Vil du slette denne Vault-bruger? Dette vil genkryptere alle data ved hjælp af standard-Vault-nøglen. Det vil tage et stykke tid.
roleDeletionTitle=Sletning af rolle
roleDeletionContent=Vil du slette denne Vault-rolle? Dette vil genkryptere alle identiteter og forbindelsesnøgler, der bruger denne rolle, så de ikke længere bruger den. Dette kan tage et stykke tid.
