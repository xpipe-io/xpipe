clipboardNoticeContent=Da målapplikationen ikke understøtter direkte overførsel af adgangskoder, er din adgangskode blevet kopieret til udklipsholderen, så du kan indsætte den. Dette vil fremover ske automatisk. Du kan se indikatoren for udklipsholderen i nederste højre hjørne.
sftpNoticeTitle=Overførsel af store filer
sftpNoticeContent=De filer, du forsøger at overføre, er ret store. Den aktuelle session er baseret på rå SSH, hvilket ikke giver dig den bedst mulige overførselshastighed. Du kan overveje at åbne en SFTP-session til systemet via højreklikmenuen i filbrowseren, hvis du har brug for at øge overførselshastigheden.
