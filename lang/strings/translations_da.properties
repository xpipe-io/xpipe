enableConnectionHubTerminalDocking=Fastgør terminalvinduet til forbindelseshubben
enableConnectionHubTerminalDockingDescription=Du kan fastgøre terminalvinduer til XPipe-programvinduet i forbindelseshubben for at simulere en form for integreret terminal. Terminalvinduerne styres derefter af XPipe, så de altid passer ind i docken.
enableFileBrowserTerminalDocking=Aktivér docking af filbrowser-terminalen
enableFileBrowserTerminalDockingDescription=Du kan fastgøre terminalvinduer til XPipe-programvinduet i filbrowseren for at simulere en slags integreret terminal. Terminalvinduerne styres derefter af XPipe, så de altid passer ind i docken.
downloadsDirectory=Brugerdefineret download-mappe
downloadsDirectoryDescription=Det brugerdefinerede bibliotek, hvor downloadede filer skal placeres, når der klikkes på knappen "Flyt til downloads". Som standard bruger XPipe dit brugerbibliotek til downloads.
pinLocalMachineOnStartup=Fastgør fanen "Lokal maskine" ved opstart
pinLocalMachineOnStartupDescription=Åbn automatisk fanen "Lokal maskine" og fastgør den. Dette er nyttigt, hvis du ofte bruger en delt filbrowser, hvor både den lokale maskine og det eksterne filsystem er åbne.
terminalErrorDescription=Denne fejl er kritisk, og XPipe kan ikke fortsætte, uden at den løses.
