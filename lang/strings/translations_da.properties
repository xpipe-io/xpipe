chmodPermissions=Nye tilladelser
editFilesWithDoubleClick=Rediger filer ved at dobbeltklikke
editFilesWithDoubleClickDescription=Når denne funktion er aktiveret, åbnes filer direkte i din teksteditor ved dobbeltklik i stedet for at vise kontekstmenuen.
censorMode=Censurtilstand
censorModeDescription=Slører alle oplysninger såsom værtsnavne, brugernavne, forbindelsesnavne og mere.\n\nDette er nyttigt, hvis du har til hensigt at tage et skærmbillede eller dele skærmen i XPipe og ikke ønsker at lække nogen oplysninger.
