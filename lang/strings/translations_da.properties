identitiesIntroHeader=Om identiteter
identitiesIntroContent=Hvis du genbruger almindelige kombinationer af brugernavne, adgangskoder og nøgler, kan det være en god idé at oprette genbrugelige identiteter. På den måde kan du hurtigt henvise til dem, når du tilføjer nye forbindelser.
identitiesIntroBottomHeader=Deling af identiteter
identitiesIntroBottomContent=Du kan tilføje identiteter lokalt eller synkronisere dem i Git-repositoriet, når denne funktion er aktiveret. Dette gør det muligt at dele identiteter selektivt på tværs af flere systemer og med andre teammedlemmer.
