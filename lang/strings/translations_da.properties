limitedTouchscreenModeDescription=Når du bruger dette program på en mere usædvanlig touchscreen-grænseflade, såsom en telefonskærm, fungerer nogle menuer muligvis ikke korrekt. Når denne indstilling er aktiveret, bruger menuimplementeringen en mere begrænset funktionalitet for at kunne håndtere de sjældne mus-/berøringshændelser.
