automaticallyCheckForUpdates=Søg efter opdateringer
automaticallyCheckForUpdatesDescription=Når denne funktion er aktiveret, hentes oplysninger om nye udgivelser automatisk efter et stykke tid, mens XPipe kører. Du skal dog stadig udtrykkeligt bekræfte installationen af eventuelle opdateringer.
