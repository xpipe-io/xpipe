startupShutdown=Opstart / Nedlukning
showChildrenConnectionsInParentCategory=Vis underkategorier i overordnet kategori
showChildrenConnectionsInParentCategoryDescription=Om alle forbindelser i underkategorier skal medtages, når en bestemt overordnet kategori er valgt.\n\nHvis denne funktion er deaktiveret, fungerer kategorierne mere som klassiske mapper, der kun viser deres direkte indhold uden at medtage undermapper.
condenseConnectionDisplay=Komprimeret visning af forbindelser
condenseConnectionDisplayDescription=Sørg for, at hver forbindelse på øverste niveau optager mindre lodret plads, så forbindelseslisten bliver mere kompakt.
openConnectionSearchWindowOnConnectionCreation=Åbn vinduet til søgning efter forbindelser, når der oprettes en forbindelse
