custom=Brugerdefineret
passwordManager=Adgangskodemanager
externalPasswordManager=Ekstern adgangskodemanager
passwordManagerDescription=Den lokalt installerede adgangskodemanager, der skal integreres med.\n\nHvis du har en adgangskodemanager installeret, kan du konfigurere XPipe til at hente adgangskoder derfra, så XPipe ikke selv behøver at administrere adgangskoderne.
passwordManagerTest=Test af adgangskodemanager
passwordManagerTestDescription=Kontroller, om integrationen med adgangskodemanageren fungerer korrekt. Sørg for at bruge det korrekte identifikatorformat til at henvise til en post i adgangskodemanageren.
preferTerminalTabs=Foretrækker at åbne nye faner
preferTerminalTabsDescription=Bestemmer, om XPipe skal forsøge at åbne nye faner i den valgte terminal i stedet for nye vinduer. Ikke alle terminaler understøtter faner.
customRdpClientCommand=Brugerdefineret kommando
customRdpClientCommandDescription=Den kommando, der skal udføres for at starte den brugerdefinerede RDP-klient.\n\nPladsholderstrengen $FILE erstattes med det absolutte .rdp-filnavn i anførselstegn, når den kaldes. Husk at sætte anførselstegn omkring stien til den eksekverbare fil, hvis den indeholder mellemrum.
customEditorCommand=Brugerdefineret redigeringskommando
customEditorCommandDescription=Den kommando, der skal udføres for at starte den brugerdefinerede editor.\n\nPladsholderstrengen $FILE erstattes med det absolutte filnavn i anførselstegn, når den kaldes. Husk at sætte anførselstegn omkring stien til editorens eksekverbare fil, hvis den indeholder mellemrum.
encryptAllVaultData=Krypter alle data i pengeskabet
encryptAllVaultDataDescription=Når denne indstilling er aktiveret, krypteres alle dele af forbindelsesdataene til Vault med din brugerkrypteringsnøgle til Vault, i modsætning til kun de hemmelige oplysninger i disse data. Dette tilføjer et ekstra sikkerhedslag for andre parametre som brugernavne, værtsnavne osv., der ikke er krypteret som standard i Vault.\n\nDenne indstilling vil gøre din Git-vault-historik og diffs ubrugelige, da du ikke længere kan se de oprindelige ændringer, men kun binære ændringer.
vaultSecurity=Sikkerhed i pengeskabet
developerDisableUpdateVersionCheck=Deaktiver kontrol af opdateringsversion
developerDisableUpdateVersionCheckDescription=Bestemmer, om opdateringskontrollen skal ignorere versionsnummeret, når der søges efter en opdatering.
shellCommandTest=Test af Shell-kommandoer
shellCommandTestDescription=Kør en kommando i den shell-session, der bruges internt af XPipe.
terminal=Terminal
terminalType=Terminalemulator
terminalConfiguration=Terminalkonfiguration
terminalCustomization=Tilpasning af terminaler
editorConfiguration=Redigeringskonfiguration
defaultApplication=Standardprogram
initialSetup=Første opsætning
terminalTypeDescription=Den standardterminal, der skal bruges til at åbne shell-forbindelser.\n\nOmfanget af understøttede funktioner varierer fra terminal til terminal, og hver terminal er markeret som enten anbefalet eller ikke anbefalet. Du får den bedste brugeroplevelse, når du bruger en anbefalet terminal.
customTerminalCommand=Brugerdefineret terminalkommando
customTerminalCommandDescription=Den kommando, der skal udføres for at åbne den brugerdefinerede terminal med en given kommando.\n\nXPipe opretter et midlertidigt launcher-shell-script, som din terminal skal udføre. Pladsholderstrengen $CMD i den kommando, du angiver, erstattes af det egentlige launcher-script, når det kaldes. Husk at sætte din terminals eksekverbare sti i anførselstegn, hvis den indeholder mellemrum.
clearTerminalOnInit=Ryd terminal ved opstart
clearTerminalOnInitDescription=Når denne funktion er aktiveret, vil XPipe køre en clear-kommando, når en ny terminalsession startes, for at fjerne unødvendig output, der blev skrevet til skærmen under opstarten af terminalsessionen.
dontCachePasswords=Gem ikke adgangskoder, der indtastes ved anmodning, i cachen
dontCachePasswordsDescription=Bestemmer, om de forespurgte adgangskoder skal gemmes internt i XPipe, så du ikke behøver at indtaste dem igen i den aktuelle session.\n\nHvis denne funktion er deaktiveret, skal du indtaste de adgangskoder, du bliver bedt om, hver gang systemet kræver dem.
denyTempScriptCreation=Afvis oprettelse af midlertidige scripts
denyTempScriptCreationDescription=For at realisere nogle af sine funktioner opretter XPipe undertiden midlertidige shell-scripts på et målsystem for at muliggøre en nem udførelse af enkle kommandoer. Disse indeholder ingen følsomme oplysninger og oprettes udelukkende til implementeringsformål.\n\nHvis denne funktion er deaktiveret, opretter XPipe ingen midlertidige filer på et fjernsystem. Denne indstilling er nyttig i miljøer med høje sikkerhedskrav, hvor enhver ændring i filsystemet overvåges. Hvis denne funktion er deaktiveret, vil visse funktioner, f.eks. shell-miljøer og scripts, ikke fungere som tilsigtet.
disableCertutilUse=Deaktiver brug af certutil på Windows
useLocalFallbackShell=Brug lokal fallback-shell
useLocalFallbackShellDescription=Skift til en anden lokal shell til at håndtere lokale operationer. Dette vil være PowerShell på Windows og Bourne-shell på andre systemer.\n\nDenne indstilling kan bruges, hvis den normale lokale standard-shell er deaktiveret eller i en eller anden grad ikke fungerer korrekt. Nogle funktioner fungerer dog muligvis ikke som forventet, når denne indstilling er aktiveret.
disableCertutilUseDescription=På grund af flere mangler og fejl i cmd.exe oprettes der midlertidige shell-scripts med certutil ved at bruge det til at afkode base64-input, da cmd.exe går ned ved ikke-ASCII-input. XPipe kan også bruge PowerShell til dette, men det vil være langsommere.\n\nDette deaktiverer al brug af certutil på Windows-systemer til at realisere visse funktioner og falder i stedet tilbage på PowerShell. Dette kan glæde nogle antivirusprogrammer, da nogle af dem blokerer brugen af certutil.
