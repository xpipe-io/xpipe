team=Team
teamSettings=Teamindstillinger
teamVaults=Team-bokse
vaultTypeNameDefault=Standardboks
vaultTypeNamePersonal=Personlig opbevaringsboks
vaultTypeNameTeam=Team-boks
teamVaultsDescription=Team-vaults giver flere brugere og roller sikker adgang til et delt vault. Du kan konfigurere forbindelser og identiteter, så de enten deles med alle brugere eller kun er tilgængelige for enkelte brugere og roller ved at kryptere dem med deres egen nøgle. Andre brugere af opbevaringsstedet kan ikke få adgang til personlige og rollebaserede forbindelser og identiteter, hvis de ikke har adgang til nøglen.
vaultTypeContentDefault=Du bruger i øjeblikket en standardboks uden bruger og uden en brugerdefineret adgangskode. Hemmelighederne krypteres med den lokale boksnøgle.\n\nDu kan opgradere til en personlig boks ved at oprette en brugerkonto til boksen. Dette giver dig mulighed for at kryptere hemmelighederne i boksen med din egen personlige adgangskode, som du skal indtaste ved hvert login for at låse boksen op.
vaultTypeContentPersonal=Du bruger i øjeblikket en personlig boks til din bruger. Hemmelighederne er krypteret med din personlige adgangskode.
vaultTypeContentTeam=Du bruger i øjeblikket et team-vault, som giver flere brugere sikker adgang til et delt vault. Du kan konfigurere forbindelser og identiteter, så de enten deles med alle brugere eller kun er tilgængelige for din personlige bruger eller rolle ved at kryptere dem med din personlige nøgle eller rolle-nøgle. Andre brugere af opbevaringsstedet kan ikke få adgang til dine personlige og rollebaserede forbindelser og identiteter, hvis de ikke har adgang til nøglen.
roleManagement=Rolestyring
roleManagementEmpty=Rolestyring
roleManagementDescription=Administrer eksisterende vault-roller, eller opret nye. Hver vault-rolle har sin egen individuelle hemmelige nøgle, som bruges til at kryptere forbindelser og identiteter, der kun skal være tilgængelige for den pågældende rolle og ikke for andre.
roleManagementEmptyDescription=Administrer eksisterende vault-roller, eller opret nye. Hver vault-rolle har sin egen individuelle hemmelige nøgle, der bruges til at kryptere forbindelser og identiteter, som kun skal være tilgængelige for den pågældende rolle og ikke for andre.\n\nRollebaserede konti til et team understøttes i Professional-abonnementet.
userManagement=Brugeradministration
userManagementEmpty=Brugeradministration
userManagementDescription=Administrer din eksisterende Vault-bruger, eller opret en ny. Din Vault-bruger har sin egen individuelle adgangskode, der bruges til at kryptere forbindelser og identiteter.
userManagementEmptyDescription=Administrer din eksisterende Vault-bruger, eller opret en ny. Din Vault-bruger har sin egen individuelle adgangskode, der bruges til at kryptere forbindelser og identiteter. Opret en bruger til dig selv, så du kan kryptere forbindelser og identiteter med din personlige nøgle.
userIntroHeader=Brugeradministration
userIntroContent=Opret den første brugerkonto til dig selv for at komme i gang. Dette giver dig mulighed for at låse dette arbejdsområde med en adgangskode.
