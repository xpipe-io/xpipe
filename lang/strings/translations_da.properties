dontAutomaticallyStartVmSshServer=Start ikke automatisk SSH-serveren for virtuelle maskiner, når det er nødvendigt
dontAutomaticallyStartVmSshServerDescription=Enhver shell-forbindelse til en VM, der kører i en hypervisor, oprettes via SSH. XPipe kan automatisk starte den installerede SSH-server, når det er nødvendigt. Hvis du af sikkerhedsmæssige årsager ikke ønsker dette, kan du blot deaktivere denne funktion med denne indstilling.
confirmGitShareTitle=Git-synkronisering
confirmGitShareContent=Vil du føje den valgte fil til dit Git Vault-repository? Dette vil kopiere en krypteret version af filen til dit Git Vault og gemme dine ændringer. Du vil derefter have adgang til filen på alle synkroniserede computere.
gitShareFileTooltip=Føj filen til git vault-datakataloget, så den synkroniseres automatisk.\n\nDenne handling kan kun bruges, når git vault er aktiveret i indstillingerne.
performanceMode=Ydelsesmodus
performanceModeDescription=Deaktiverer alle visuelle effekter, der ikke er nødvendige, for at forbedre programmets ydeevne.
dontAcceptNewHostKeys=Accepter ikke nye SSH-værtsnøgler automatisk
dontAcceptNewHostKeysDescription=XPipe accepterer som standard automatisk værtsnøgler fra systemer, hvor din SSH-klient ikke allerede har en kendt værtsnøgle gemt. Hvis en kendt værtsnøgle imidlertid er ændret, vil programmet nægte at oprette forbindelse, medmindre du accepterer den nye.\n\nVed at deaktivere denne funktion kan du kontrollere alle værtsnøgler, selvom der ikke er nogen konflikt i første omgang.
uiScale=UI-skala
uiScaleDescription=En brugerdefineret skaleringsværdi, der kan indstilles uafhængigt af den systemomfattende skærmskalering. Værdierne angives i procent, så f.eks. vil en værdi på 150 resultere i en brugergrænsefladeskalering på 150 %.
editorProgram=Redigeringsprogram
editorProgramDescription=Den standardteksteditor, der skal bruges ved redigering af alle former for tekstdata.
windowOpacity=Vinduets gennemsigtighed
windowOpacityDescription=Ændrer vinduets gennemsigtighed for at holde styr på, hvad der sker i baggrunden.
useSystemFont=Brug systemskrifttypen
openDataDir=Vault-datakatalog
openDataDirButton=Åben datakatalog
openDataDirDescription=Hvis du vil synkronisere yderligere filer, såsom SSH-nøgler, på tværs af systemer med dit Git-repository, kan du placere dem i mappen »storage data«. Filstierne for alle filer, der henvises til der, tilpasses automatisk på alle synkroniserede systemer.
updates=Opdateringer
selectAll=Vælg alt
advanced=Avanceret
thirdParty=Meddelelser om open source
eulaDescription=Læs brugerlicensaftalen for XPipe-applikationen
thirdPartyDescription=Se open source-licenserne for tredjepartsbiblioteker
enableGitStorage=Aktivér synkronisering
gitSync=Git-synkronisering
enableGitStorageDescription=Når denne funktion er aktiveret, opretter XPipe et Git-repository for den lokale boks og gemmer eventuelle ændringer der. Bemærk, at dette kræver, at Git er installeret, og at det kan gøre indlæsning og gemning langsommere.\n\nAlle kategorier, der skal synkroniseres, skal udtrykkeligt markeres som synkroniserede.
storageGitRemote=URL til fjernsynkronisering
storageGitRemoteDescription=Når denne indstilling er aktiveret, henter XPipe automatisk eventuelle ændringer ved indlæsning og sender eventuelle ændringer til det eksterne repository ved gemning.\n\nDette giver dig mulighed for at dele dit vault mellem flere XPipe-installationer. Det understøtter HTTP- og SSH-URL'er samt lokale mapper.
vault=Vault
vaultAccess=Adgang til pengeskabet
workspaceLockDescription=Indstiller en brugerdefineret adgangskode til at kryptere alle følsomme oplysninger, der er gemt i XPipe.\n\nDette øger sikkerheden, da det giver et ekstra krypteringslag til dine gemte følsomme oplysninger. Du bliver derefter bedt om at indtaste adgangskoden, når XPipe starter.
useSystemFontDescription=Bestemmer, om der skal bruges systemets standardskrifttype eller Inter-skrifttypen, som følger med XPipe.
windowOptions=Vinduesindstillinger
saveWindowLocation=Gem vinduets placering
