developerForceSshTtyDescription=Sørg for, at alle SSH-forbindelser allokerer en pty for at teste understøttelsen af en manglende stderr og en pty.
developerDisableSshTunnelGateways=Deaktiver SSH-gateway-tunneling
developerDisableSshTunnelGatewaysDescription=Brug ikke tunnelsessioner til gateways, men opret i stedet en direkte forbindelse til systemet.
ttyWarning=Forbindelsen har tvunget tildelt en pty/tty og leverer ikke en separat stderr-strøm.\n\nDette kan medføre nogle problemer.\n\nHvis det er muligt, bør du undersøge, om forbindelseskommandoen kan indstilles til ikke at tildele en pty.
