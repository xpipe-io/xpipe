workspaceManagement=Administrer arbejdsområder
workspaceManagementDescription=Arbejdsområder er forskellige konfigurationer til at køre XPipe. Hvert arbejdsområde har et datakatalog, hvor alle data gemmes lokalt. Dette omfatter forbindelsesdata, indstillinger og mere.\n\nHvis du bruger synkroniseringsfunktionen, kan du også vælge at synkronisere hvert arbejdsområde med et andet Git-repository.
