rdpClient=RDP-klient
rdpClientDescription=Det RDP-klientprogram, der skal kaldes, når der oprettes RDP-forbindelser.\n\nBemærk, at forskellige klienter har forskellige niveauer af funktionalitet og integration. Nogle klienter understøtter ikke automatisk overførsel af adgangskoder, så du skal stadig indtaste dem ved opstart.
