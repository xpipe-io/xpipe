renameAll=Omdøb alle
logging=Logning
enableTerminalLogging=Aktivér terminallogning
enableTerminalLoggingDescription=Aktiverer logning på klientsiden for alle terminalsessioner. Alle ind- og uddata fra terminalsessionen skrives til en sessionslogfil. Bemærk, at følsomme oplysninger, såsom adgangskodeforespørgsler, ikke registreres.
terminalLoggingDirectory=Logs fra terminalsessioner
terminalLoggingDirectoryDescription=Alle logfiler gemmes i XPipe-datakataloget på dit lokale system.
openSessionLogs=Åbn sessionslogfiler
sessionLogging=Terminallogning
sessionActive=Der kører en baggrundssession for denne forbindelse.\n\nFor at afbryde denne session manuelt skal du klikke på statusindikatoren.
skipValidation=Spring validering over
scriptsIntroHeader=Om scripts
scriptsIntroContent=Du kan køre scripts ved shell-opstart, i filbrowseren og efter behov. Du kan selv oprette scripts i XPipe eller importere eksisterende scripts fra dit lokale system eller fra et eksternt Git-repository.
scriptsIntroBottomHeader=Brug af scripts
scriptsIntroBottomContent=Der findes en række eksempelskripter, som du kan bruge til at komme i gang. Du kan klikke på redigeringsknappen for de enkelte skripter for at se, hvordan de er implementeret. Skripterne skal først aktiveres, før de kan køres og vises i menuerne; der er en aktiveringsknap på hvert skript til dette formål.
scriptsIntroBottomButton=Kom godt i gang
scriptSourcesIntroHeader=Skriptkilder
scriptSourcesIntroContent=Du kan tilføje brugerdefinerede scriptkilder for at få øjeblikkelig adgang til en hel samling af shell-scripts. Både lokale kilder og eksterne Git-repositorier understøttes som kilder. Alle scripts, der findes i kilden, bliver automatisk tilgængelige.
scriptSourcesIntroButton=Tilføj kilde ...
checkForSecurityUpdates=Kontroller for sikkerhedsopdateringer
checkForSecurityUpdatesDescription=XPipe kan kontrollere for potentielle sikkerhedsopdateringer uafhængigt af de normale funktionsopdateringer. Når denne funktion er aktiveret, vil i det mindste vigtige sikkerhedsopdateringer blive anbefalet til installation, selvom den normale opdateringskontrol er deaktiveret.\n\nHvis du deaktiverer denne indstilling, vil der ikke blive foretaget nogen ekstern versionsforespørgsel, og du vil ikke blive underrettet om eventuelle sikkerhedsopdateringer.
clickToDock=Klik for at dokke terminalen
