sftpNoticeContent=File yang ingin Anda transfer berukuran cukup besar. Sesi saat ini menggunakan SSH mentah, yang tidak memberikan kecepatan transfer terbaik. Anda dapat mempertimbangkan untuk membuka sesi SFTP ke sistem melalui menu klik kanan di penjelajah file jika Anda perlu meningkatkan kecepatan transfer.
