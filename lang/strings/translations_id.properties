disableSshPinCaching=Nonaktifkan penyimpanan PIN SSH
disableSshPinCachingDescription=XPipe akan secara otomatis menyimpan dalam cache PIN apa pun yang dimasukkan untuk sebuah kunci saat menggunakan bentuk otentikasi berbasis perangkat keras.\n\nMenonaktifkan fitur ini akan mengakibatkan Anda harus memasukkan kembali PIN pada setiap upaya koneksi.
