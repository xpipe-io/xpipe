developerForceSshTtyDescription=Pastikan semua koneksi SSH mengalokasikan pty untuk menguji dukungan terhadap stderr yang hilang dan pty.
developerDisableSshTunnelGateways=Nonaktifkan terowongan gateway SSH
developerDisableSshTunnelGatewaysDescription=Jangan gunakan sesi terowongan untuk gateway, melainkan sambungkan langsung ke sistem.
ttyWarning=Koneksi ini telah mengalokasikan pty/tty secara paksa dan tidak menyediakan aliran stderr terpisah.\n\nHal ini mungkin menyebabkan beberapa masalah.\n\nJika memungkinkan, coba atur perintah koneksi agar tidak mengalokasikan pty.
