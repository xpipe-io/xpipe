sshVerboseOutput=Aktifkan keluaran SSH yang terperinci
sshVerboseOutputDescription=Ini akan menampilkan banyak informasi debug saat terhubung melalui SSH. Berguna untuk memecahkan masalah terkait koneksi SSH.
dontUseGateway=Jangan gunakan gateway
dontUseGatewayDescription=Jangan gunakan host hypervisor sebagai gateway dan sambungkan langsung ke alamat IP
categoryColor=Warna kategori
