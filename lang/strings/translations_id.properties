gitPasswordDescription=Kata sandi atau token akses pribadi yang digunakan untuk otentikasi. Apakah Anda memerlukan kata sandi atau token akses pribadi bergantung pada penyedia git remote yang digunakan. Pengaturan ini akan menggantikan kredensial default apa pun yang telah dikonfigurasi untuk klien git CLI lokal Anda.
