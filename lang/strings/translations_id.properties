gitUsername=Nama pengguna Git khusus
gitUsernameDescription=Pengguna khusus untuk otentikasi ke repositori Git jarak jauh. Secara default, XPipe akan menggunakan kredensial yang saat ini dikonfigurasi pada CLI Git.\n\nPengaturan ini akan menggantikan kredensial default apa pun yang sudah dikonfigurasi untuk klien CLI Git lokal Anda.
