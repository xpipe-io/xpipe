categoryFreezeDescription=Menandai konfigurasi koneksi sebagai read-only. Artinya, konfigurasi entri koneksi yang sudah ada dalam kategori ini tidak dapat diubah. Namun, koneksi baru tetap dapat ditambahkan.
updateFail=Pembaruan instalasi tidak berhasil
