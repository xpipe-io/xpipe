categorySync=Sinkronisasi dengan repositori Git
categorySyncDescription=Sinkronkan semua koneksi secara otomatis dengan repositori Git. Semua perubahan lokal pada koneksi akan dikirim ke repositori jarak jauh.
categorySyncSpecial=Sinkronisasi dengan repositori Git\n(Tidak dapat dikonfigurasi untuk kategori khusus "$NAME$")
categoryDontAllowScripts=Nonaktifkan semua modifikasi
categoryDontAllowScriptsDescription=Nonaktifkan eksekusi perintah dan operasi lainnya pada sistem dalam kategori ini untuk mencegah adanya modifikasi. Hal ini akan menonaktifkan semua fungsi skrip, perintah lingkungan shell, prompt, dan lainnya.
categoryConfirmAllModifications=Konfirmasi semua perubahan
categoryConfirmAllModificationsDescription=Pastikan untuk mengonfirmasi terlebih dahulu setiap perubahan pada koneksi atau sistem berkas. Hal ini dapat mencegah terjadinya operasi yang tidak disengaja pada sistem-sistem penting.
categoryDefaultIdentity=Identitas default
categoryDefaultIdentityDescription=Jika Anda sering menggunakan identitas tertentu pada banyak sistem dalam kategori ini, maka dengan menetapkan identitas default, Anda dapat memilihnya terlebih dahulu saat membuat koneksi baru.
categoryDefaultGateway=Gerbang default
categoryDefaultGatewayDescription=Gunakan sistem gateway yang ditentukan untuk semua koneksi dalam kategori ini sebagai default jika tidak ada gateway lain yang ditentukan untuk suatu koneksi.
