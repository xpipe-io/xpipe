passwordManagerMapping=Pemetaan kunci khusus
passwordManagerMappingDescription=Data JSON dapat menyimpan entri kunci-nilai apa pun, sehingga Anda harus mendefinisikan pemetaan yang memungkinkan XPipe menemukan entri individual seperti nama pengguna, kata sandi, dan kunci SSH berdasarkan kunci-kunci tersebut. Pemetaan default dapat diganti oleh identitas individual jika diperlukan.
passwordManagerCommand=Perintah khusus
passwordManagerCommandDescription=Perintah khusus yang harus dijalankan untuk mengambil kata sandi. String penanda $KEY akan diganti dengan kunci kata sandi yang diapit tanda kutip saat perintah ini dijalankan. Perintah ini seharusnya memanggil CLI pengelola kata sandi Anda untuk menampilkan kata sandi mentah atau kredensial dalam format JSON ke stdout.
chooseTemplate=Pilih templat
keePassXcPlaceholder=URL entri KeePassXC
terminalEnvironment=Lingkungan terminal
terminalEnvironmentDescription=Jika Anda ingin menggunakan fitur-fitur lingkungan WSL berbasis Linux lokal untuk penyesuaian terminal Anda, Anda dapat menggunakannya sebagai lingkungan terminal.\n\nPerintah inisialisasi terminal khusus dan konfigurasi multiplexer terminal apa pun kemudian akan dijalankan di distribusi WSL ini.
terminalInitScript=Skrip inisialisasi terminal
terminalInitScriptDescription=Perintah yang harus dijalankan di lingkungan terminal sebelum koneksi dimulai. Anda dapat menggunakan ini untuk mengonfigurasi lingkungan terminal saat startup.
terminalMultiplexer=Multiplexer terminal
terminalMultiplexerDescription=Multiplexer terminal yang dapat digunakan sebagai alternatif tab dalam terminal. Fitur ini akan menggantikan beberapa karakteristik penanganan terminal, misalnya penanganan tab, dengan fungsi multiplexer.\n\nMembutuhkan file eksekusi multiplexer yang bersangkutan untuk diinstal pada sistem.
terminalMultiplexerWindowsDescription=Multiplexer terminal yang dapat digunakan sebagai alternatif tab di terminal. Fitur ini akan menggantikan beberapa karakteristik penanganan terminal, misalnya penanganan tab, dengan fungsi multiplexer.\n\nMembutuhkan penggunaan lingkungan terminal WSL di Windows dan file eksekusi multiplexer yang telah diinstal pada sistem WSL.
terminalAlwaysPauseOnExit=Selalu jeda saat keluar
terminalAlwaysPauseOnExitDescription=Jika diaktifkan, saat keluar dari sesi terminal, Anda akan selalu diminta untuk memilih antara memulai ulang atau menutup sesi tersebut. Jika dinonaktifkan, XPipe hanya akan melakukan hal tersebut untuk koneksi yang gagal dan berakhir dengan pesan kesalahan.
querying=Sedang melakukan kueri ...
queryFailed=Kueri tidak mengembalikan rahasia yang dapat digunakan
retrievedPassword=Diperoleh: $PASSWORD$
refreshOpenpubkey=Perbarui identitas openpubkey
refreshOpenpubkeyDescription=Jalankan perintah `opkssh refresh` untuk mengaktifkan kembali identitas openpubkey
all=Semua
terminalPrompt=Prompt terminal
terminalPromptDescription=Alat prompt terminal yang akan digunakan pada terminal jarak jauh Anda. Mengaktifkan prompt terminal akan secara otomatis mengatur dan mengonfigurasi alat prompt tersebut pada sistem tujuan saat membuka sesi terminal.\n\nHal ini tidak akan mengubah konfigurasi prompt atau berkas profil yang sudah ada pada sistem. Hal ini akan memperpanjang waktu pemuatan terminal pada penggunaan pertama saat prompt sedang disiapkan di sistem jarak jauh. Terminal Anda mungkin memerlukan font tambahan untuk menampilkan prompt dengan benar.
terminalPromptConfiguration=Konfigurasi prompt terminal
terminalPromptConfig=Berkas konfigurasi
terminalPromptConfigDescription=Berkas konfigurasi khusus yang akan diterapkan pada prompt. Konfigurasi ini akan secara otomatis disiapkan pada sistem tujuan saat terminal diinisialisasi dan digunakan sebagai konfigurasi prompt default.\n\nJika Anda ingin menggunakan berkas konfigurasi default yang sudah ada pada setiap sistem, Anda dapat membiarkan kolom ini kosong.
