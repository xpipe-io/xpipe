workspaceManagement=Kelola ruang kerja
workspaceManagementDescription=Ruang kerja adalah konfigurasi terpisah untuk menjalankan XPipe. Setiap ruang kerja memiliki direktori data tempat semua data disimpan secara lokal. Ini mencakup data koneksi, pengaturan, dan lainnya.\n\nJika Anda menggunakan fitur sinkronisasi, Anda juga dapat memilih untuk menyinkronkan setiap ruang kerja dengan repositori Git yang berbeda.
