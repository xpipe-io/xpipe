rdpConfiguration=Konfigurasi desktop jarak jauh
rdpClient=Klien RDP
rdpClientDescription=Program klien RDP yang harus dipanggil saat memulai koneksi RDP.\n\nPerlu diperhatikan bahwa berbagai klien memiliki tingkat kemampuan dan integrasi yang berbeda-beda. Beberapa klien tidak mendukung pengiriman kata sandi secara otomatis, sehingga Anda tetap harus mengisinya saat memulai koneksi.
localShell=Shell lokal
themeDescription=Tema tampilan pilihan Anda.
dontAutomaticallyStartVmSshServer=Jangan secara otomatis memulai server SSH untuk VM saat diperlukan
dontAutomaticallyStartVmSshServerDescription=Setiap koneksi shell ke VM yang berjalan di hypervisor dilakukan melalui SSH. XPipe dapat secara otomatis memulai server SSH yang terinstal saat diperlukan. Jika Anda tidak menginginkan hal ini karena alasan keamanan, Anda dapat menonaktifkan perilaku ini dengan opsi ini.
confirmGitShareTitle=Sinkronisasi Git
confirmGitShareContent=Apakah Anda ingin menambahkan berkas yang dipilih ke repositori Git Vault Anda? Tindakan ini akan menyalin versi terenkripsi dari berkas tersebut ke Git Vault Anda dan melakukan commit terhadap perubahan Anda. Anda kemudian akan dapat mengakses berkas tersebut di semua desktop yang disinkronkan.
gitShareFileTooltip=Tambahkan berkas ke direktori data git vault agar secara otomatis disinkronkan.\n\nTindakan ini hanya dapat digunakan jika git vault diaktifkan di pengaturan.
performanceMode=Mode kinerja
performanceModeDescription=Menonaktifkan semua efek visual yang tidak diperlukan guna meningkatkan kinerja aplikasi.
dontAcceptNewHostKeys=Jangan menerima kunci host SSH baru secara otomatis
dontAcceptNewHostKeysDescription=Secara default, XPipe akan secara otomatis menerima kunci host dari sistem yang belum memiliki kunci host yang dikenal yang tersimpan di klien SSH Anda. Namun, jika ada kunci host yang dikenal telah berubah, XPipe akan menolak untuk terhubung kecuali Anda menerima kunci yang baru.\n\nMenonaktifkan perilaku ini memungkinkan Anda untuk memeriksa semua kunci host, meskipun pada awalnya tidak ada konflik.
uiScale=Skala Antarmuka Pengguna
uiScaleDescription=Nilai penskalaan khusus yang dapat diatur secara terpisah dari skala tampilan sistem Anda secara keseluruhan. Nilai-nilai tersebut dinyatakan dalam persentase, sehingga misalnya nilai 150 akan menghasilkan skala antarmuka pengguna sebesar 150%.
editorProgram=Program Editor
editorProgramDescription=Editor teks bawaan yang digunakan saat mengedit data teks apa pun.
windowOpacity=Tingkat opasitas jendela
windowOpacityDescription=Mengubah tingkat opasitas jendela untuk memantau apa yang terjadi di latar belakang.
useSystemFont=Gunakan font sistem
openDataDir=Direktori data Vault
openDataDirButton=Direktori data terbuka
openDataDirDescription=Jika Anda ingin menyinkronkan berkas tambahan, seperti kunci SSH, di seluruh sistem dengan repositori Git Anda, Anda dapat menempatkannya di direktori data penyimpanan. Setiap berkas yang dirujuk di sana akan secara otomatis menyesuaikan jalur berkasnya di setiap sistem yang disinkronkan.
updates=Pembaruan
selectAll=Pilih semua
advanced=Lanjutan
thirdParty=Pemberitahuan sumber terbuka
eulaDescription=Baca Perjanjian Lisensi Pengguna Akhir (EULA) untuk aplikasi XPipe
thirdPartyDescription=Lihat lisensi sumber terbuka dari pustaka pihak ketiga
enableGitStorage=Aktifkan sinkronisasi
gitSync=Sinkronisasi Git
enableGitStorageDescription=Jika diaktifkan, XPipe akan menginisialisasi repositori Git untuk brankas lokal dan melakukan commit terhadap setiap perubahan ke dalamnya. Perlu diperhatikan bahwa hal ini memerlukan Git yang sudah terinstal dan mungkin memperlambat proses pemuatan dan penyimpanan.\n\nSetiap kategori yang ingin disinkronkan harus ditandai secara eksplisit sebagai "disinkronkan".
storageGitRemote=URL sinkronisasi jarak jauh
storageGitRemoteDescription=Jika diaktifkan, XPipe akan secara otomatis menarik perubahan apa pun saat memuat dan mengirimkan perubahan apa pun ke repositori jarak jauh saat menyimpan.\n\nHal ini memungkinkan Anda untuk berbagi brankas Anda di antara beberapa instalasi XPipe. Fitur ini mendukung URL HTTP dan SSH, serta direktori lokal.
vault=Vault
vaultAccess=Akses ke brankas
workspaceLockDescription=Menetapkan kata sandi khusus untuk mengenkripsi informasi sensitif apa pun yang disimpan di XPipe.\n\nHal ini meningkatkan keamanan karena memberikan lapisan enkripsi tambahan untuk informasi sensitif yang Anda simpan. Anda kemudian akan diminta untuk memasukkan kata sandi tersebut saat XPipe dimulai.
useSystemFontDescription=Menentukan apakah akan menggunakan font sistem default Anda atau font Inter, yang disertakan dalam XPipe.
windowOptions=Opsi Jendela
saveWindowLocation=Simpan lokasi jendela
saveWindowLocationDescription=Menentukan apakah koordinat jendela harus disimpan dan dipulihkan saat aplikasi dimulai ulang.
startupShutdown=Pengaktifan / Penonaktifan
showChildrenConnectionsInParentCategory=Tampilkan kategori anak dalam kategori induk
showChildrenConnectionsInParentCategoryDescription=Apakah semua koneksi yang berada di subkategori akan disertakan atau tidak ketika kategori induk tertentu dipilih.\n\nJika opsi ini dinonaktifkan, kategori-kategori tersebut akan berperilaku lebih mirip folder klasik yang hanya menampilkan isi langsungnya tanpa menyertakan subfolder.
condenseConnectionDisplay=Tampilan koneksi ringkas
condenseConnectionDisplayDescription=Buatlah setiap koneksi tingkat atas memakan ruang vertikal yang lebih sedikit agar daftar koneksi menjadi lebih ringkas.
openConnectionSearchWindowOnConnectionCreation=Buka jendela pencarian koneksi saat membuat koneksi
openConnectionSearchWindowOnConnectionCreationDescription=Apakah jendela untuk mencari subkoneksi yang tersedia akan dibuka secara otomatis saat menambahkan koneksi shell baru.
