limitedTouchscreenModeDescription=Saat menggunakan aplikasi ini pada antarmuka layar sentuh yang lebih tidak umum seperti layar ponsel, beberapa menu mungkin tidak berfungsi dengan baik. Saat opsi ini diaktifkan, implementasi menu menggunakan fungsionalitas yang lebih terbatas agar dapat beroperasi dengan peristiwa mouse/sentuhan yang jarang dikirim.
