refreshIconsDescription=Mengunduh, menampilkan, dan menyimpan dalam cache semua ikon yang tersedia (lebih dari 1.000) dari sumber eksternal ke berkas .png. Proses ini akan memakan waktu cukup lama ...
refreshIconsIntro=Unduh ikon
refreshIconsIntroDescription=Di sini Anda dapat mengatur ikon khusus untuk koneksi Anda. Set ikon default harus diunduh terlebih dahulu. Anda juga dapat mengonfigurasi sumber ikon khusus di menu pengaturan.
