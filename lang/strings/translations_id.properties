disableApiAuthenticationDescription=Menonaktifkan semua metode otentikasi yang diperlukan sehingga permintaan apa pun yang tidak terotentikasi akan diproses.\n\nOtentikasi hanya boleh dinonaktifkan untuk keperluan pengembangan.
