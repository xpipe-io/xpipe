vncClientDescription=Klien VNC yang akan dijalankan saat membuka koneksi VNC di XPipe.\n\nAnda memiliki pilihan untuk menggunakan klien VNC bawaan di dalam XPipe atau, sebagai alternatif, menjalankan klien VNC eksternal yang terinstal secara lokal jika Anda menginginkan penyesuaian yang lebih luas.
