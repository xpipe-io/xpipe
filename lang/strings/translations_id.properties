fileWriteSudoTitle=Penulisan berkas dengan perintah sudo
fileWriteSudoContent=Berkas yang Anda coba tulis tidak memberikan izin tulis kepada pengguna Anda. Apakah Anda ingin menulis berkas ini sebagai root dengan sudo? Tindakan ini akan secara otomatis menaikkan hak akses ke root menggunakan kredensial yang ada atau melalui prompt.
dontAllowTerminalRestart=Jangan izinkan terminal dimulai ulang
dontAllowTerminalRestartDescription=Secara default, sesi terminal dapat dimulai ulang setelah berakhir dari dalam terminal itu sendiri. Untuk memungkinkan hal ini, XPipe akan menerima permintaan eksternal dari terminal tersebut untuk memulai ulang sesi\n\nXPipe tidak memiliki kendali atas terminal maupun asal panggilan tersebut, sehingga aplikasi lokal yang berbahaya juga dapat memanfaatkan fungsi ini untuk membuat koneksi melalui XPipe. Menonaktifkan fungsi ini akan mencegah skenario tersebut.
openDocumentation=Buka dokumentasi
openDocumentationDescription=Kunjungi halaman dokumentasi XPipe untuk masalah ini
renameAll=Ganti nama semua
logging=Pencatatan
enableTerminalLogging=Aktifkan pencatatan terminal
enableTerminalLoggingDescription=Mengaktifkan pencatatan di sisi klien untuk semua sesi terminal. Semua masukan dan keluaran dari sesi terminal dicatat ke dalam berkas log sesi. Perlu diperhatikan bahwa informasi sensitif seperti permintaan kata sandi tidak dicatat.
terminalLoggingDirectory=Catatan sesi terminal
terminalLoggingDirectoryDescription=Semua log disimpan di direktori data XPipe pada sistem lokal Anda.
openSessionLogs=Buka log sesi
sessionLogging=Pencatatan terminal
sessionActive=Sesi latar belakang sedang berjalan untuk koneksi ini.\n\nUntuk menghentikan sesi ini secara manual, klik indikator status.
skipValidation=Lewati validasi
scriptsIntroHeader=Tentang skrip
scriptsIntroContent=Anda dapat menjalankan skrip saat inisialisasi shell, di penjelajah berkas, dan sesuai permintaan. Anda dapat membuat skrip sendiri di dalam XPipe atau mengimpor skrip yang sudah ada dari sistem lokal Anda atau dari repositori Git jarak jauh.
scriptsIntroBottomHeader=Menggunakan skrip
scriptsIntroBottomContent=Tersedia berbagai contoh skrip untuk memulai. Anda dapat mengklik tombol edit pada masing-masing skrip untuk melihat bagaimana skrip tersebut diimplementasikan. Skrip harus diaktifkan terlebih dahulu agar dapat dijalankan dan muncul di menu; terdapat tombol pengaktifan pada setiap skrip untuk tujuan tersebut.
scriptsIntroBottomButton=Memulai
scriptSourcesIntroHeader=Sumber skrip
scriptSourcesIntroContent=Anda dapat menambahkan sumber skrip kustom untuk mendapatkan akses instan ke seluruh koleksi skrip shell. Baik sumber lokal maupun repositori Git jarak jauh didukung sebagai sumber. Semua skrip yang terdeteksi dari sumber tersebut akan tersedia secara otomatis.
scriptSourcesIntroButton=Tambahkan sumber ...
checkForSecurityUpdates=Periksa pembaruan keamanan
checkForSecurityUpdatesDescription=XPipe dapat memeriksa pembaruan keamanan potensial secara terpisah dari pembaruan fitur biasa. Jika opsi ini diaktifkan, setidaknya pembaruan keamanan yang penting akan direkomendasikan untuk diinstal meskipun pemeriksaan pembaruan biasa dinonaktifkan.\n\nMenonaktifkan pengaturan ini akan mengakibatkan tidak adanya permintaan versi eksternal yang dilakukan, dan Anda tidak akan diberi tahu mengenai pembaruan keamanan apa pun.
clickToDock=Klik untuk menambatkan terminal
terminalStarting=Menunggu terminal dimulai ...
pinTab=Tab Pin
unpinTab=Lepaskan tab
pinned=Disematkan
enableConnectionHubTerminalDocking=Menempelkan jendela terminal ke hub koneksi
enableConnectionHubTerminalDockingDescription=Anda dapat menambatkan jendela terminal ke jendela aplikasi XPipe di pusat koneksi untuk mensimulasikan terminal yang terintegrasi. Jendela terminal tersebut kemudian dikelola oleh XPipe agar selalu muat di dalam area penambatan.
enableFileBrowserTerminalDocking=Aktifkan penyambungan terminal penjelajah file
enableFileBrowserTerminalDockingDescription=Anda dapat menambatkan jendela terminal ke jendela aplikasi XPipe di penjelajah file untuk mensimulasikan terminal yang terintegrasi. Jendela terminal tersebut kemudian dikelola oleh XPipe agar selalu muat di dalam area penambatan.
downloadsDirectory=Direktori unduhan khusus
downloadsDirectoryDescription=Direktori khusus untuk menyimpan file yang diunduh saat mengklik tombol "Pindahkan ke Unduhan". Secara default, XPipe akan menggunakan direktori unduhan pengguna Anda.
pinLocalMachineOnStartup=Menyematkan tab "Komputer Lokal" saat startup
pinLocalMachineOnStartupDescription=Buka tab mesin lokal secara otomatis dan sematkan tab tersebut. Fitur ini berguna jika Anda sering menggunakan penjelajah file terpisah dengan mesin lokal dan sistem file jarak jauh yang terbuka.
terminalErrorDescription=Kesalahan ini bersifat fatal dan XPipe tidak dapat melanjutkan tanpa memperbaikinya.
groupName=Nama grup
chmodPermissions=Izin baru
editFilesWithDoubleClick=Edit file dengan mengklik dua kali
editFilesWithDoubleClickDescription=Jika diaktifkan, mengklik ganda file akan langsung membukanya di editor teks Anda, bukan menampilkan menu konteks.
censorMode=Mode sensor
censorModeDescription=Menyembunyikan informasi seperti nama host, nama pengguna, nama koneksi, dan lainnya.\n\nFitur ini berguna jika Anda ingin mengambil tangkapan layar atau berbagi layar XPipe tanpa membocorkan informasi apa pun.
addIdentity=Identitas ...
identities=Identitas
addMacro=Tindakan ...
identitiesIntroHeader=Tentang identitas
identitiesIntroContent=Jika Anda menggunakan kembali kombinasi nama pengguna, kata sandi, dan kunci yang umum, mungkin lebih baik untuk membuat identitas yang dapat digunakan kembali. Hal ini memungkinkan Anda untuk dengan cepat merujuknya saat menambahkan koneksi baru.
identitiesIntroBottomHeader=Berbagi identitas
identitiesIntroBottomContent=Anda dapat menambahkan identitas secara lokal atau juga menyinkronkannya ke repositori Git jika fitur ini diaktifkan. Hal ini memungkinkan Anda untuk berbagi identitas secara selektif di antara beberapa sistem dan dengan anggota tim lainnya.
identitiesIntroBottomButton=Sinkronisasi pengaturan
identitiesIntroButton=Buat identitas
userName=Nama pengguna
vaultAuth=Enkripsi brankas default
userAuth=Kata sandi pribadi pengguna
roleAuth=Kontrol akses berbasis peran
team=Tim
teamSettings=Pengaturan tim
teamVaults=Brankas tim
vaultTypeNameDefault=Brankas default
vaultTypeNamePersonal=Brankas pribadi
vaultTypeNameTeam=Brankas tim
teamVaultsDescription=Brankas tim memungkinkan beberapa pengguna dan peran untuk memiliki akses aman ke brankas bersama. Anda dapat mengonfigurasi koneksi dan identitas agar dapat dibagikan kepada semua pengguna atau hanya tersedia bagi pengguna dan peran tertentu dengan mengenkripsinya menggunakan kunci masing-masing. Pengguna brankas lainnya tidak dapat mengakses koneksi dan identitas pribadi maupun berbasis peran jika mereka tidak memiliki akses ke kunci tersebut.
vaultTypeContentDefault=Saat ini Anda menggunakan brankas default yang belum memiliki pengguna dan frasa sandi khusus. Rahasia dienkripsi menggunakan kunci brankas lokal.\n\nAnda dapat meningkatkan ke brankas pribadi dengan membuat akun pengguna brankas. Hal ini memungkinkan Anda untuk mengenkripsi rahasia brankas dengan frasa sandi pribadi Anda sendiri yang harus Anda masukkan setiap kali login untuk membuka brankas.
vaultTypeContentPersonal=Saat ini Anda sedang menggunakan brankas pribadi untuk akun Anda. Informasi rahasia dienkripsi menggunakan frasa sandi pribadi Anda.
vaultTypeContentTeam=Saat ini Anda menggunakan brankas tim, yang memungkinkan beberapa pengguna mengakses brankas bersama secara aman. Anda dapat mengonfigurasi koneksi dan identitas agar dapat dibagikan kepada semua pengguna atau hanya tersedia untuk pengguna pribadi atau peran Anda dengan mengenkripsinya menggunakan kunci pribadi atau kunci peran Anda. Pengguna brankas lainnya tidak dapat mengakses koneksi dan identitas pribadi serta berbasis peran Anda jika mereka tidak memiliki akses ke kunci tersebut.
roleManagement=Manajemen peran
roleManagementEmpty=Manajemen peran
roleManagementDescription=Kelola peran vault yang sudah ada atau buat yang baru. Setiap peran vault memiliki kunci rahasia tersendiri yang digunakan untuk mengenkripsi koneksi dan identitas yang seharusnya hanya dapat diakses oleh peran tersebut dan tidak oleh pihak lain.
roleManagementEmptyDescription=Kelola peran vault yang sudah ada atau buat yang baru. Setiap peran vault memiliki kunci rahasia tersendiri yang digunakan untuk mengenkripsi koneksi dan identitas yang seharusnya hanya dapat diakses oleh peran tersebut dan tidak oleh pihak lain.\n\nAkun berbasis peran untuk tim didukung dalam paket profesional.
userManagement=Manajemen pengguna
userManagementEmpty=Manajemen pengguna
userManagementDescription=Kelola pengguna vault yang sudah ada atau buat yang baru. Setiap pengguna vault memiliki frasa sandi tersendiri yang digunakan untuk mengenkripsi koneksi dan identitas.
userManagementEmptyDescription=Kelola pengguna vault yang sudah ada atau buat yang baru. Setiap pengguna vault memiliki frasa sandi tersendiri yang digunakan untuk mengenkripsi koneksi dan identitas. Buat pengguna untuk diri Anda sendiri agar dapat mengenkripsi koneksi dan identitas dengan kunci pribadi Anda.
userIntroHeader=Manajemen pengguna
userIntroContent=Buat akun pengguna pertama untuk diri Anda sendiri sebagai langkah awal. Hal ini memungkinkan Anda mengunci ruang kerja ini dengan kata sandi.
addReusableIdentity=Tambahkan identitas yang dapat digunakan kembali
