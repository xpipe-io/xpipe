ptbNoticeTitle=Pengumuman mengenai versi uji coba publik
ptbNoticeContent=Anda sedang menjalankan versi PTB dari XPipe. Versi ini tidak stabil dan mungkin mengandung bug. Anda sebaiknya tidak menggunakannya sebagai aplikasi harian. Versi ini juga tidak akan menerima pembaruan rutin setelah masa pengujiannya berakhir. Untuk itu, Anda harus menginstal dan menjalankan rilis XPipe yang normal.
userDeletionTitle=Penghapusan pengguna
userDeletionContent=Apakah Anda ingin menghapus pengguna vault ini? Tindakan ini akan mengenkripsi ulang semua data menggunakan kunci vault default. Proses ini akan memakan waktu cukup lama.
roleDeletionTitle=Penghapusan peran
roleDeletionContent=Apakah Anda ingin menghapus peran brankas ini? Tindakan ini akan mengenkripsi ulang semua identitas dan rahasia koneksi yang menggunakan peran ini. Semua entri yang hanya dapat diakses oleh peran ini akan menjadi tersedia bagi semua peran. Proses ini akan memakan waktu cukup lama.
