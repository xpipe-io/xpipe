closeBehaviourAlertTitle=Tentukan perilaku penutupan
closeBehaviourAlertTitleHeader=Pilih tindakan yang akan dilakukan saat menutup jendela. Semua koneksi yang aktif akan ditutup saat aplikasi dimatikan.
startupBehaviour=Perilaku saat startup
startupBehaviourDescription=Mengatur perilaku default aplikasi desktop saat XPipe dijalankan.
clearCachesAlertTitle=Hapus Cache
clearCachesAlertContent=Apakah Anda ingin menghapus semua cache XPipe? Tindakan ini akan menghapus semua data cache yang disimpan untuk meningkatkan pengalaman pengguna.
startGui=Mulai GUI
startInTray=Mulai dari baki sistem
startInBackground=Mulai di latar belakang
clearCaches=Hapus cache ...
clearCachesDescription=Hapus semua data cache
cancel=Batal
notAnAbsolutePath=Bukan jalur absolut
notADirectory=Bukan direktori
notAnEmptyDirectory=Bukan direktori kosong
automaticallyCheckForUpdates=Periksa pembaruan
automaticallyCheckForUpdatesDescription=Jika diaktifkan, informasi rilis baru akan diambil secara otomatis setelah beberapa saat saat XPipe sedang berjalan. Anda tetap harus secara eksplisit mengonfirmasi pemasangan pembaruan apa pun.
developerMode=Mode pengembang
developerModeDescription=Jika diaktifkan, Anda akan memiliki akses ke berbagai opsi tambahan yang berguna untuk pengembangan.
editor=Editor
custom=Kustom
passwordManager=Pengelola kata sandi
externalPasswordManager=Pengelola kata sandi eksternal
passwordManagerDescription=Manajer kata sandi yang diinstal secara lokal untuk diintegrasikan.\n\nJika Anda telah menginstal manajer kata sandi, Anda dapat mengonfigurasi XPipe untuk mengambil rahasia dari manajer tersebut sehingga XPipe tidak perlu mengelola rahasia tersebut sendiri.
passwordManagerTest=Uji pengelola kata sandi
passwordManagerTestDescription=Periksa apakah integrasi pengelola kata sandi berfungsi dengan benar. Pastikan untuk menggunakan format pengenal yang benar untuk merujuk pada entri di pengelola kata sandi.
preferTerminalTabs=Lebih suka membuka tab baru
preferTerminalTabsDescription=Menentukan apakah XPipe akan mencoba membuka tab baru di terminal yang Anda pilih alih-alih jendela baru. Tidak semua terminal mendukung tab.
customRdpClientCommand=Perintah khusus
customRdpClientCommandDescription=Perintah yang harus dijalankan untuk memulai klien RDP kustom.\n\nString placeholder $FILE akan diganti dengan nama file .rdp absolut yang diapit tanda kutip saat dipanggil. Pastikan untuk mengapit jalur file executable dengan tanda kutip jika mengandung spasi.
customEditorCommand=Perintah editor khusus
customEditorCommandDescription=Perintah yang harus dijalankan untuk memulai editor khusus.\n\nString placeholder $FILE akan diganti dengan nama file absolut yang diapit tanda kutip saat dipanggil. Ingatlah untuk mengapit jalur eksekusi editor Anda dengan tanda kutip jika jalur tersebut mengandung spasi.
encryptAllVaultData=Enkripsi semua data di brankas
encryptAllVaultDataDescription=Jika diaktifkan, setiap bagian dari data koneksi vault akan dienkripsi menggunakan kunci enkripsi vault pengguna Anda, bukan hanya rahasia yang terdapat di dalam data tersebut. Hal ini menambahkan lapisan keamanan tambahan untuk parameter lain seperti nama pengguna, nama host, dll., yang secara default tidak dienkripsi di dalam vault.\n\nOpsi ini akan membuat riwayat dan perbandingan (diffs) vault Git Anda tidak berguna lagi, karena Anda tidak dapat melihat perubahan aslinya lagi, melainkan hanya perubahan biner.
vaultSecurity=Keamanan brankas
developerDisableUpdateVersionCheck=Nonaktifkan Pemeriksaan Versi Pembaruan
developerDisableUpdateVersionCheckDescription=Menentukan apakah pemeriksa pembaruan akan mengabaikan nomor versi saat mencari pembaruan.
shellCommandTest=Uji Perintah Shell
shellCommandTestDescription=Jalankan perintah dalam sesi shell yang digunakan secara internal oleh XPipe.
terminal=Terminal
terminalType=Emulator terminal
terminalConfiguration=Konfigurasi terminal
terminalCustomization=Penyesuaian terminal
editorConfiguration=Konfigurasi editor
defaultApplication=Aplikasi default
initialSetup=Pengaturan awal
terminalTypeDescription=Terminal default yang digunakan untuk membuka koneksi shell.\n\nTingkat dukungan fitur bervariasi tergantung pada terminal, dan masing-masing ditandai sebagai direkomendasikan atau tidak direkomendasikan. Pengalaman pengguna Anda akan optimal jika menggunakan terminal yang direkomendasikan.
customTerminalCommand=Perintah terminal khusus
customTerminalCommandDescription=Perintah yang harus dijalankan untuk membuka terminal khusus dengan perintah tertentu.\n\nXPipe akan membuat skrip shell peluncur sementara untuk dijalankan oleh terminal Anda. String pengganti $CMD dalam perintah yang Anda berikan akan diganti dengan skrip peluncur yang sebenarnya saat dipanggil. Ingatlah untuk mengapit jalur eksekusi terminal Anda dengan tanda kutip jika jalur tersebut mengandung spasi.
clearTerminalOnInit=Hapus terminal saat inisialisasi
clearTerminalOnInitDescription=Jika diaktifkan, XPipe akan menjalankan perintah clear setelah sesi terminal baru diluncurkan untuk menghapus output yang tidak diperlukan yang ditampilkan saat memulai sesi terminal.
dontCachePasswords=Jangan menyimpan kata sandi yang diminta dalam cache
dontCachePasswordsDescription=Menentukan apakah kata sandi yang diminta akan disimpan dalam cache internal oleh XPipe sehingga Anda tidak perlu memasukkannya kembali dalam sesi saat ini.\n\nJika fitur ini dinonaktifkan, Anda harus memasukkan kembali kredensial yang diminta setiap kali sistem memintanya.
denyTempScriptCreation=Tolak pembuatan skrip sementara
denyTempScriptCreationDescription=Untuk mewujudkan beberapa fungsinya, XPipe terkadang membuat skrip shell sementara pada sistem target agar perintah sederhana dapat dijalankan dengan mudah. Skrip ini tidak berisi informasi sensitif apa pun dan hanya dibuat untuk keperluan implementasi.\n\nJika perilaku ini dinonaktifkan, XPipe tidak akan membuat file sementara apa pun di sistem jarak jauh. Opsi ini berguna dalam konteks keamanan tinggi di mana setiap perubahan pada sistem berkas dipantau. Jika opsi ini dinonaktifkan, beberapa fungsi, misalnya lingkungan shell dan skrip, tidak akan berfungsi sebagaimana mestinya.
disableCertutilUse=Nonaktifkan penggunaan certutil di Windows
useLocalFallbackShell=Gunakan shell cadangan lokal
useLocalFallbackShellDescription=Beralihlah ke shell lokal lain untuk menangani operasi lokal. Shell tersebut adalah PowerShell pada Windows dan Bourne shell pada sistem lain.\n\nOpsi ini dapat digunakan jika shell lokal default yang biasa digunakan dinonaktifkan atau mengalami gangguan. Namun, beberapa fitur mungkin tidak berfungsi sebagaimana mestinya saat opsi ini diaktifkan.
disableCertutilUseDescription=Karena beberapa kekurangan dan bug pada cmd.exe, skrip shell sementara dibuat menggunakan certutil dengan memanfaatkannya untuk mendekode masukan base64, karena cmd.exe mengalami kegagalan saat menghadapi masukan non-ASCII. XPipe juga dapat menggunakan PowerShell untuk tujuan tersebut, namun hal ini akan lebih lambat.\n\nHal ini menonaktifkan penggunaan certutil pada sistem Windows untuk mewujudkan beberapa fungsi dan beralih ke PowerShell sebagai gantinya. Hal ini mungkin disukai oleh beberapa perangkat lunak antivirus karena beberapa di antaranya memblokir penggunaan certutil.
