browseVault=Data brankas
browseVaultDescription=Anda dapat melihat direktori vault tersebut sendiri melalui pengelola file bawaan Anda. Perlu diperhatikan bahwa pengeditan dari luar tidak disarankan dan dapat menyebabkan berbagai masalah.
