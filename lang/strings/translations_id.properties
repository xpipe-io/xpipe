language=Bahasa
languageDescription=Bahasa tampilan yang akan digunakan. Terjemahan ini terus ditingkatkan berkat kontribusi komunitas. Anda dapat membantu upaya penerjemahan ini dengan mengirimkan perbaikan terjemahan di GitHub.
