disableHardwareAcceleration=Nonaktifkan akselerasi perangkat keras
disableHardwareAccelerationDescription=Menonaktifkan penggunaan kartu grafis untuk rendering dan hanya akan menggunakan pipeline rendering perangkat lunak.\n\nHal ini menyebabkan penurunan kinerja yang signifikan, tetapi mungkin merupakan satu-satunya cara untuk melakukan rendering jika terdapat masalah dengan driver kartu grafis.
disableRdpWindowsSecurityWarning=Nonaktifkan peringatan keamanan RDP
disableRdpWindowsSecurityWarningDescription=Jangan tampilkan peringatan Windows baru mengenai berkas .rdp yang tidak ditandatangani setiap kali memulai sesi baru.\n\nTindakan ini akan mengubah kunci registri untuk mengembalikan klien RDP Windows ke perilaku lamanya. Tindakan ini akan menampilkan jendela popup permintaan hak akses Administrator.
rdpWindowsSecurityWarningDialogTitle=Peringatan keamanan RDP
rdpWindowsSecurityWarningDialogContent=Sejak Windows build 26200, Windows kini akan selalu menampilkan peringatan saat file RDP yang tidak ditandatangani dijalankan, terlepas dari isinya.\n\nAnda dapat menonaktifkan peringatan ini di menu pengaturan.
