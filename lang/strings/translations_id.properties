customEditorCommandInTerminal=Menjalankan perintah khusus di terminal
customEditorCommandInTerminalDescription=Jika editor Anda berbasis terminal, Anda dapat mengaktifkan opsi ini untuk secara otomatis membuka terminal dan menjalankan perintah tersebut dalam sesi terminal.\n\nAnda dapat menggunakan opsi ini untuk editor seperti vi, vim, nvim, dan lainnya.
disableHttpsTlsCheck=Nonaktifkan verifikasi sertifikat permintaan HTTPS
disableHttpsTlsCheckDescription=Jika organisasi Anda mendekripsi lalu lintas HTTPS di firewall menggunakan SSL interception, semua permintaan HTTP akan gagal kecuali sertifikatnya tepercaya. Anda dapat mengaktifkan opsi ini dan menonaktifkan validasi sertifikat TLS untuk pengujian jika ada yang tidak berfungsi sesuai harapan dengan sertifikat kustom.
