workspaceManagement=Gestisci gli spazi di lavoro
workspaceManagementDescription=Gli spazi di lavoro sono configurazioni distinte per l'esecuzione di XPipe. Ogni spazio di lavoro ha una directory dati in cui tutti i dati vengono memorizzati localmente. Ciò include i dati di connessione, le impostazioni e altro ancora.\n\nSe usi la funzione di sincronizzazione, puoi anche scegliere di sincronizzare ogni spazio di lavoro con un repository Git diverso.
