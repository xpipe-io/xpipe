confirmVaultUnencryptTitle=Conferma la decrittografia del vault
confirmVaultUnencryptContent=Vuoi davvero disattivare la crittografia avanzata del vault? Questo rimuoverà la crittografia aggiuntiva dai dati archiviati e sovrascriverà i dati esistenti.
