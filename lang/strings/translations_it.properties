clipboardNoticeContent=Dato che l'applicazione di destinazione non supporta l'inserimento diretto delle password, la tua password è stata copiata negli appunti in modo che tu possa incollarla. In futuro questa operazione avverrà automaticamente. Puoi vedere l'indicatore degli appunti nell'angolo in basso a destra.
sftpNoticeTitle=Trasferimento di file di grandi dimensioni
sftpNoticeContent=I file che stai cercando di trasferire sono piuttosto grandi. La sessione attuale si basa su SSH raw, che non ti garantisce la massima velocità di trasferimento possibile. Se hai bisogno di aumentare la velocità di trasferimento, puoi provare ad aprire una sessione SFTP con il sistema dal menu contestuale nel browser dei file.
hideVaultEntryNames=Nascondi i nomi delle voci di Git Vault
hideVaultEntryNamesDescription=Rimuove tutti i nomi delle connessioni e altre informazioni dai file README e dai messaggi di commit quando è abilitata la sincronizzazione Git. Questa opzione impedisce di capire la struttura dei contenuti del vault crittografato.
disableHardwareAcceleration=Disattiva l'accelerazione hardware
disableHardwareAccelerationDescription=Disattiva l'uso della scheda grafica per il rendering e utilizza esclusivamente una pipeline di rendering software.\n\nQuesto comporta un calo significativo delle prestazioni, ma potrebbe essere l'unico modo per eseguire il rendering se ci sono problemi con il driver della scheda grafica.
disableRdpWindowsSecurityWarning=Disattiva l'avviso di sicurezza RDP
disableRdpWindowsSecurityWarningDescription=Non mostrare il nuovo avviso di Windows sui file .rdp non firmati ogni volta che avvii una nuova sessione.\n\nQuesto modificherà la chiave di registro per riportare il client RDP di Windows al suo comportamento precedente. Questa azione farà apparire una finestra pop-up che richiede l'elevazione dei privilegi di amministratore.
rdpWindowsSecurityWarningDialogTitle=Avvisi di sicurezza RDP
rdpWindowsSecurityWarningDialogContent=A partire dalla build 26200 di Windows, il sistema operativo mostrerà sempre un avviso quando viene avviato un file RDP non firmato, indipendentemente dal suo contenuto.\n\nPuoi disattivare questo avviso dal menu delle impostazioni.
