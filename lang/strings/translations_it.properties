limitedTouchscreenModeDescription=Quando usi questa app su un'interfaccia touchscreen un po' particolare, come lo schermo di un telefono, alcuni menu potrebbero non funzionare bene. Quando questa opzione è attiva, il menu usa funzionalità più limitate per gestire gli eventi del mouse o del tocco che arrivano sporadicamente.
