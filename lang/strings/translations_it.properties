passwordManagerMapping=Mappatura personalizzata delle chiavi
passwordManagerMappingDescription=I dati JSON possono contenere qualsiasi voce chiave-valore, quindi dovrai definire una mappatura in base alla quale XPipe possa individuare singole voci come nome utente, password e chiavi SSH. Se necessario, la mappatura predefinita può essere sovrascritta dalle singole identità.
