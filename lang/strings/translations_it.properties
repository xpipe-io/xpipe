fileWriteSudoTitle=Scrittura su file con sudo
fileWriteSudoContent=Il file che stai cercando di scrivere non concede i permessi di scrittura al tuo utente. Vuoi scrivere questo file come root con sudo? In questo modo si passerà automaticamente a root utilizzando le credenziali esistenti o tramite una richiesta di conferma.
dontAllowTerminalRestart=Non consentire il riavvio del terminale
dontAllowTerminalRestartDescription=Per impostazione predefinita, le sessioni del terminale possono essere riavviate dopo la loro chiusura direttamente dal terminale. Per consentire ciò, XPipe accetta queste richieste esterne provenienti dal terminale per riavviare la sessione\n\nXPipe non ha alcun controllo sul terminale né sulla provenienza di questa chiamata, quindi anche le applicazioni locali dannose possono sfruttare questa funzionalità per avviare connessioni tramite XPipe. Disattivando questa funzionalità si previene questo scenario.
