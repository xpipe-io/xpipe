rdpClient=Client RDP
rdpClientDescription=Il programma client RDP da chiamare quando avvii le connessioni RDP.\n\nTieni presente che i vari client hanno livelli diversi di funzionalità e integrazione. Alcuni client non supportano l'inserimento automatico delle password, quindi dovrai comunque inserirle al momento dell'avvio.
localShell=Shell locale
themeDescription=Il tuo tema di visualizzazione preferito.
dontAutomaticallyStartVmSshServer=Non avviare automaticamente il server SSH per le macchine virtuali quando necessario
dontAutomaticallyStartVmSshServerDescription=Qualsiasi connessione shell a una macchina virtuale in esecuzione su un hypervisor avviene tramite SSH. XPipe può avviare automaticamente il server SSH installato quando necessario. Se non vuoi che ciò avvenga per motivi di sicurezza, puoi semplicemente disabilitare questa funzione con questa opzione.
confirmGitShareTitle=Sincronizzazione Git
confirmGitShareContent=Vuoi aggiungere il file selezionato al tuo repository Git Vault? In questo modo verrà copiata una versione crittografata del file nel tuo Git Vault e verranno salvate le modifiche. Potrai quindi accedere al file su tutti i desktop sincronizzati.
gitShareFileTooltip=Aggiungi il file alla directory dei dati di Git Vault in modo che venga sincronizzato automaticamente.\n\nQuesta azione può essere utilizzata solo se Git Vault è abilitato nelle impostazioni.
performanceMode=Modalità di funzionamento
performanceModeDescription=Disattiva tutti gli effetti visivi non necessari per migliorare le prestazioni dell'applicazione.
dontAcceptNewHostKeys=Non accettare automaticamente le nuove chiavi host SSH
dontAcceptNewHostKeysDescription=Per impostazione predefinita, XPipe accetta automaticamente le chiavi host dai sistemi per i quali il tuo client SSH non ha ancora salvato alcuna chiave host nota. Se però una chiave host nota è cambiata, rifiuterà la connessione a meno che tu non accetti quella nuova.\n\nDisattivando questa opzione, puoi verificare tutte le chiavi host, anche se inizialmente non c'è alcun conflitto.
uiScale=Scala dell'interfaccia utente
uiScaleDescription=Un valore di ridimensionamento personalizzato che puoi impostare indipendentemente dalla scala di visualizzazione a livello di sistema. I valori sono espressi in percentuale, quindi, ad esempio, un valore di 150 comporterà una scala dell'interfaccia utente del 150%.
editorProgram=Programma di editing
editorProgramDescription=L'editor di testo predefinito da usare quando modifichi qualsiasi tipo di dato testuale.
windowOpacity=Opacità della finestra
windowOpacityDescription=Modifica l'opacità della finestra per tenere d'occhio cosa succede in background.
useSystemFont=Usa il font di sistema
openDataDir=Directory dei dati del Vault
openDataDirButton=Directory dei dati aperti
openDataDirDescription=Se vuoi sincronizzare altri file, come le chiavi SSH, tra i vari sistemi tramite il tuo repository Git, puoi inserirli nella directory dei dati di archiviazione. I percorsi dei file presenti in quella directory verranno adattati automaticamente su ogni sistema sincronizzato.
updates=Aggiornamenti
selectAll=Seleziona tutto
advanced=Avanzate
thirdParty=Note sull'open source
eulaDescription=Leggi il Contratto di licenza con l'utente finale dell'applicazione XPipe
thirdPartyDescription=Visualizza le licenze open source delle librerie di terze parti
enableGitStorage=Abilita la sincronizzazione
gitSync=Sincronizzazione Git
enableGitStorageDescription=Se abilitata, XPipe inizializzerà un repository Git per il vault locale e salverà tutte le modifiche al suo interno. Tieni presente che questo richiede l'installazione di Git e potrebbe rallentare le operazioni di caricamento e salvataggio.\n\nTutte le categorie che devono essere sincronizzate devono essere contrassegnate esplicitamente come sincronizzate.
storageGitRemote=URL di sincronizzazione remota
storageGitRemoteDescription=Se impostato, XPipe scaricherà automaticamente eventuali modifiche al momento del caricamento e le invierà al repository remoto al momento del salvataggio.\n\nQuesto ti permette di condividere il tuo vault tra più installazioni di XPipe. Supporta URL HTTP e SSH, oltre alle directory locali.
vault=Vault
vaultAccess=Accesso al caveau
workspaceLockDescription=Imposta una password personalizzata per crittografare tutte le informazioni sensibili memorizzate in XPipe.\n\nQuesto garantisce una maggiore sicurezza, poiché aggiunge un ulteriore livello di crittografia alle tue informazioni sensibili memorizzate. Ti verrà quindi richiesto di inserire la password all'avvio di XPipe.
useSystemFontDescription=Determina se utilizzare il font predefinito del sistema o il font Inter, incluso in XPipe.
windowOptions=Opzioni della finestra
saveWindowLocation=Salva la posizione della finestra
saveWindowLocationDescription=Determina se le coordinate della finestra devono essere salvate e ripristinate al riavvio.
startupShutdown=Avvio / Spegnimento
showChildrenConnectionsInParentCategory=Mostra le sottocategorie nella categoria principale
showChildrenConnectionsInParentCategoryDescription=Se includere o meno tutte le connessioni presenti nelle sottocategorie quando viene selezionata una determinata categoria principale.\n\nSe questa opzione è disattivata, le categorie si comportano più come le classiche cartelle, mostrando solo i contenuti diretti senza includere le sottocartelle.
condenseConnectionDisplay=Visualizzazione sintetica delle connessioni
condenseConnectionDisplayDescription=Fai in modo che ogni collegamento di primo livello occupi meno spazio in verticale, così da ottenere un elenco dei collegamenti più compatto.
openConnectionSearchWindowOnConnectionCreation=Apri la finestra di ricerca delle connessioni al momento della creazione della connessione
openConnectionSearchWindowOnConnectionCreationDescription=Se aprire o meno automaticamente la finestra per cercare le sottoconnnessioni disponibili quando aggiungi una nuova connessione shell.
