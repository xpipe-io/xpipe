renameAll=Rinomina tutto
logging=Registrazione
enableTerminalLogging=Abilita la registrazione del terminale
enableTerminalLoggingDescription=Attiva la registrazione lato client per tutte le sessioni del terminale. Tutti gli input e gli output della sessione del terminale vengono scritti in un file di log della sessione. Tieni presente che le informazioni sensibili, come le richieste di password, non vengono registrate.
terminalLoggingDirectory=Registri delle sessioni terminali
terminalLoggingDirectoryDescription=Tutti i log vengono salvati nella directory dei dati di XPipe sul tuo sistema locale.
openSessionLogs=Apri i log delle sessioni
sessionLogging=Registrazione dei log del terminale
sessionActive=Per questa connessione è in esecuzione una sessione in background.\n\nPer interrompere manualmente questa sessione, clicca sull'indicatore di stato.
skipValidation=Salta la convalida
scriptsIntroHeader=Informazioni sugli script
scriptsIntroContent=Puoi eseguire gli script all'avvio della shell, nel browser dei file e quando vuoi. Puoi creare gli script direttamente in XPipe oppure importarne di esistenti dal tuo sistema locale o da un repository Git remoto.
scriptsIntroBottomHeader=Uso degli script
scriptsIntroBottomContent=Ci sono diversi script di esempio per iniziare. Puoi cliccare sul pulsante "Modifica" di ogni singolo script per vedere come sono implementati. Per far sì che gli script vengano eseguiti e appaiano nei menu, devi prima abilitarli: su ogni script c'è un pulsante per farlo.
scriptsIntroBottomButton=Inizia
scriptSourcesIntroHeader=Codice sorgente
scriptSourcesIntroContent=Puoi aggiungere fonti di script personalizzate per avere accesso immediato a un'intera raccolta di script di shell. Sono supportate sia le fonti locali che i repository Git remoti. Tutti gli script rilevati dalla fonte saranno disponibili automaticamente.
scriptSourcesIntroButton=Aggiungi sorgente ...
checkForSecurityUpdates=Verifica la presenza di aggiornamenti di sicurezza
checkForSecurityUpdatesDescription=XPipe può verificare la presenza di potenziali aggiornamenti di sicurezza separatamente dai normali aggiornamenti delle funzionalità. Quando questa opzione è abilitata, ti verrà consigliato di installare almeno gli aggiornamenti di sicurezza importanti anche se il controllo normale degli aggiornamenti è disabilitato.\n\nSe disabiliti questa impostazione, non verrà effettuata alcuna richiesta di versione esterna e non riceverai notifiche relative agli aggiornamenti di sicurezza.
clickToDock=Clicca per agganciare il terminale
