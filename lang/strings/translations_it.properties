passwordManagerCommandDescription=Il comando personalizzato da eseguire per recuperare le password. La stringa segnaposto $KEY verrà sostituita dalla chiave della password racchiusa tra virgolette quando viene richiamato. Questo dovrebbe richiamare la CLI del tuo gestore di password per stampare la password grezza o le credenziali in formato JSON su stdout.
