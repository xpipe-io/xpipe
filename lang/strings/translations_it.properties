disableHttpsTlsCheckDescription=Se la tua organizzazione decrittografa il traffico HTTPS nei firewall tramite l'intercettazione SSL, qualsiasi richiesta HTTP fallirà a meno che i certificati non siano considerati affidabili. Puoi abilitare questa opzione e disabilitare la convalida dei certificati TLS a scopo di test, nel caso in cui qualcosa non funzioni come previsto con i certificati personalizzati.
