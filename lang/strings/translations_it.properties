startupBehaviourDescription=Controlla il comportamento predefinito dell'applicazione desktop all'avvio di XPipe.
clearCachesAlertTitle=Svuota la cache
clearCachesAlertContent=Vuoi svuotare tutte le cache di XPipe? Questa operazione eliminerà tutti i dati della cache memorizzati per migliorare l'esperienza utente.
startGui=Avvia l'interfaccia grafica
