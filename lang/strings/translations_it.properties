teamVaults=Cassaforte di squadra
vaultTypeNameDefault=Cassaforti predefinita
vaultTypeNamePersonal=Cassaforte personale
vaultTypeNameTeam=Cassaforte del team
teamVaultsDescription=I vault di squadra permettono a più utenti e ruoli di accedere in modo sicuro a un vault condiviso. Puoi configurare le connessioni e le identità in modo che siano condivise tra tutti gli utenti oppure disponibili solo per singoli utenti e ruoli, crittografandole con la loro chiave personale. Gli altri utenti del vault non possono accedere alle connessioni e alle identità personali e basate sui ruoli se non hanno accesso alla chiave.
vaultTypeContentDefault=Al momento stai usando un vault predefinito senza utente né passphrase personalizzata. I segreti sono crittografati con la chiave del vault locale.\n\nPuoi passare a un vault personale creando un account utente per il vault. Questo ti permette di crittografare le informazioni riservate del vault con la tua passphrase personale, che dovrai inserire ad ogni accesso per sbloccare il vault.
vaultTypeContentPersonal=Al momento stai utilizzando una cassaforte personale per il tuo account. Le informazioni riservate sono crittografate con la tua passphrase personale.
vaultTypeContentTeam=Al momento stai usando un vault di gruppo, che permette a più utenti di accedere in modo sicuro a un vault condiviso. Puoi configurare le connessioni e le identità in modo che siano condivise con tutti gli utenti oppure disponibili solo per il tuo utente personale o ruolo, crittografandole con la tua chiave personale o di ruolo. Gli altri utenti del vault non possono accedere alle tue connessioni e identità personali e basate sul ruolo se non hanno accesso alla chiave.
roleManagement=Gestione dei ruoli
roleManagementEmpty=Gestione dei ruoli
roleManagementDescription=Gestisci i ruoli del vault esistenti o creane di nuovi. Ogni ruolo del vault ha la propria chiave segreta individuale, che viene utilizzata per crittografare le connessioni e le identità che dovrebbero essere accessibili solo a quel ruolo e non ad altri.
roleManagementEmptyDescription=Gestisci i ruoli del vault esistenti o creane di nuovi. Ogni ruolo del vault ha la propria chiave segreta individuale, che viene utilizzata per crittografare le connessioni e le identità che dovrebbero essere accessibili solo a quel ruolo e non ad altri.\n\nGli account basati sui ruoli per un team sono supportati nel piano Professional.
userManagement=Gestione degli utenti
userManagementEmpty=Gestione degli utenti
userManagementDescription=Gestisci il tuo utente del vault esistente o creane uno nuovo. Il tuo utente del vault ha una passphrase personale che viene utilizzata per crittografare le connessioni e le identità.
userManagementEmptyDescription=Gestisci il tuo utente del vault esistente o creane uno nuovo. Il tuo utente del vault ha una passphrase personale che viene utilizzata per crittografare connessioni e identità. Crea un utente per te stesso per poter crittografare connessioni e identità con la tua chiave personale.
userIntroHeader=Gestione degli utenti
userIntroContent=Crea il tuo primo account utente per iniziare. Questo ti permette di proteggere questo spazio di lavoro con una password.
