terminalEnvironment=Ambiente terminale
terminalEnvironmentDescription=Se vuoi usare le funzionalità di un ambiente WSL locale basato su Linux per personalizzare il tuo terminale, puoi utilizzarlo come ambiente terminale.\n\nQualsiasi comando di inizializzazione personalizzato del terminale e qualsiasi configurazione del multiplexer del terminale verranno quindi eseguiti in questa distribuzione WSL.
terminalInitScript=Script di inizializzazione del terminale
terminalInitScriptDescription=Comandi da eseguire nell'ambiente terminale prima che venga avviata la connessione. Puoi usarli per configurare l'ambiente terminale all'avvio.
terminalMultiplexer=Multiplexer di terminali
terminalMultiplexerDescription=Il multiplexer per terminali da usare in alternativa alle schede in un terminale. Questo sostituirà alcune caratteristiche di gestione del terminale, ad esempio la gestione delle schede, con le funzionalità del multiplexer.\n\nRichiede che il relativo eseguibile del multiplexer sia installato sul sistema.
terminalMultiplexerWindowsDescription=Il multiplexer per terminali da usare in alternativa alle schede in un terminale. Questo sostituirà alcune caratteristiche di gestione del terminale, ad esempio la gestione delle schede, con le funzionalità del multiplexer.\n\nRichiede l'uso di un ambiente terminale WSL su Windows e l'installazione dell'eseguibile del multiplexer sul sistema WSL.
terminalAlwaysPauseOnExit=Metti sempre in pausa all'uscita
terminalAlwaysPauseOnExitDescription=Se abilitata, quando chiudi una sessione terminale ti verrà sempre chiesto se vuoi riavviare o chiudere la sessione. Se disabilitata, XPipe lo farà solo per le connessioni fallite che terminano con un errore.
