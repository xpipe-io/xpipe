terminalPrompt=Prompt del terminale
terminalPromptDescription=Lo strumento di prompt del terminale da utilizzare nei tuoi terminali remoti. Abilitando un prompt del terminale, lo strumento verrà automaticamente installato e configurato sul sistema di destinazione all'apertura di una sessione terminale.\n\nQuesto non modifica nessuna configurazione esistente del prompt né i file di profilo presenti sul sistema. La prima volta, il tempo di caricamento del terminale aumenterà mentre il prompt viene configurato sul sistema remoto. Il tuo terminale potrebbe aver bisogno di font aggiuntivi per visualizzare correttamente il prompt.
terminalPromptConfiguration=Configurazione del prompt del terminale
terminalPromptConfig=File di configurazione
terminalPromptConfigDescription=Il file di configurazione personalizzato da applicare al prompt. Questa configurazione verrà impostata automaticamente sul sistema di destinazione all'avvio del terminale e verrà utilizzata come configurazione predefinita del prompt.\n\nSe vuoi utilizzare il file di configurazione predefinito già presente su ciascun sistema, puoi lasciare questo campo vuoto.
