developerForceSshTty=Forza SSH TTY
developerForceSshTtyDescription=Fai in modo che tutte le connessioni SSH assegnino un pty per verificare il supporto in caso di assenza di stderr e di un pty.
developerDisableSshTunnelGateways=Disattiva il tunneling del gateway SSH
developerDisableSshTunnelGatewaysDescription=Non usare sessioni tunnel per i gateway, ma collegati direttamente al sistema.
ttyWarning=La connessione ha assegnato forzatamente un pty/tty e non fornisce un flusso stderr separato.\n\nQuesto potrebbe causare alcuni problemi.\n\nSe puoi, cerca di fare in modo che il comando di connessione non assegni un pty.
