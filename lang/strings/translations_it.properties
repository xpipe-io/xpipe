storeIntroImportContent=Usi già XPipe su un altro sistema? Sincronizza le tue connessioni esistenti su più sistemi tramite un repository Git remoto. Se non l'hai ancora configurato, puoi sincronizzarle in un secondo momento, quando vuoi.
