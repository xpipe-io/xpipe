identitiesIntroHeader=A proposito delle identità
identitiesIntroContent=Se riutilizzi combinazioni comuni di nomi utente, password e chiavi, potrebbe essere utile creare identità riutilizzabili. Questo ti permette di richiamarle velocemente quando aggiungi nuove connessioni.
identitiesIntroBottomHeader=Condivisione delle identità
identitiesIntroBottomContent=Puoi aggiungere identità a livello locale oppure sincronizzarle nel repository Git, se questa opzione è abilitata. Questo ti permette di condividere in modo selettivo le identità su più sistemi e con altri membri del team.
