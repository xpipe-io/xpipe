disableApiAuthentication=Disattiva l'autenticazione API
disableApiAuthenticationDescription=Disattiva tutti i metodi di autenticazione obbligatori in modo che venga gestita qualsiasi richiesta non autenticata.\n\nL'autenticazione dovrebbe essere disattivata solo a scopo di sviluppo.
