unpinTab=Sblocca scheda
pinned=Aggiunto ai preferiti
enableConnectionHubTerminalDocking=Aggiungi la finestra del terminale all'hub di connessione
enableConnectionHubTerminalDockingDescription=Puoi agganciare le finestre del terminale alla finestra dell'applicazione XPipe nell'hub di connessione per simulare un terminale in qualche modo integrato. Le finestre del terminale vengono poi gestite da XPipe in modo da adattarsi sempre allo spazio di aggancio.
enableFileBrowserTerminalDocking=Abilita l'ancoraggio del terminale del browser dei file
enableFileBrowserTerminalDockingDescription=Puoi agganciare le finestre del terminale alla finestra dell'applicazione XPipe nel browser dei file per simulare un terminale in qualche modo integrato. Le finestre del terminale vengono poi gestite da XPipe in modo da adattarsi sempre allo spazio di aggancio.
downloadsDirectory=Cartella personalizzata per i download
downloadsDirectoryDescription=La cartella personalizzata in cui salvare i file scaricati quando clicchi sul pulsante "Sposta in Download". Per impostazione predefinita, XPipe userà la tua cartella "Download".
pinLocalMachineOnStartup=Fissa la scheda "Computer locale" all'avvio
pinLocalMachineOnStartupDescription=Apri automaticamente una scheda del computer locale e fissala. È utile se usi spesso un browser di file diviso con il computer locale e il file system remoto aperti.
terminalErrorDescription=Questo errore è grave e XPipe non può proseguire senza risolverlo.
groupName=Nome del gruppo
chmodPermissions=Nuove autorizzazioni
editFilesWithDoubleClick=Modifica i file con un doppio clic
editFilesWithDoubleClickDescription=Quando questa opzione è attiva, facendo doppio clic sui file questi si apriranno direttamente nel tuo editor di testo invece di visualizzare il menu contestuale.
censorMode=Modalità Censore
censorModeDescription=Oscura tutte le informazioni come nomi host, nomi utente, nomi delle connessioni e altro ancora.\n\nÈ utile se vuoi fare uno screenshot o condividere lo schermo di XPipe senza far trapelare nessuna informazione.
