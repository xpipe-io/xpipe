categoryDontAllowScriptsDescription=Disattiva l'esecuzione di comandi e altre operazioni sui sistemi di questa categoria per impedire qualsiasi modifica. In questo modo verranno disattivate tutte le funzionalità di scripting, i comandi dell'ambiente shell, i prompt e altro ancora.
