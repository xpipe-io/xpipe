notADirectory=Non è una directory
notAnEmptyDirectory=Non è una cartella vuota
automaticallyCheckForUpdates=Verifica la disponibilità di aggiornamenti
automaticallyCheckForUpdatesDescription=Quando questa opzione è abilitata, dopo un po' di tempo, mentre XPipe è in esecuzione, vengono scaricate automaticamente le informazioni sulle nuove versioni. Devi comunque confermare esplicitamente l'installazione di qualsiasi aggiornamento.
developerMode=Modalità sviluppatore
developerModeDescription=Una volta attivata questa opzione, avrai accesso a una serie di opzioni aggiuntive utili per lo sviluppo.
editor=Editor
custom=Personalizzato
passwordManager=Gestore di password
externalPasswordManager=Gestore di password esterno
passwordManagerDescription=Il gestore di password installato localmente con cui integrarsi.\n\nSe hai un gestore di password installato, puoi configurare XPipe in modo che recuperi le credenziali da lì, così XPipe non dovrà gestirle direttamente.
passwordManagerTest=Prova il gestore di password
passwordManagerTestDescription=Controlla se l'integrazione con il gestore di password funziona correttamente. Assicurati di usare il formato di identificatore corretto per fare riferimento a una voce nel gestore di password.
preferTerminalTabs=Preferisci aprire nuove schede
preferTerminalTabsDescription=Determina se XPipe proverà ad aprire nuove schede nel terminale che hai scelto invece di nuove finestre. Non tutti i terminali supportano le schede.
customRdpClientCommand=Comando personalizzato
customRdpClientCommandDescription=Il comando da eseguire per avviare il client RDP personalizzato.\n\nLa stringa segnaposto $FILE verrà sostituita dal nome assoluto del file .rdp racchiuso tra virgolette quando viene richiamata. Ricordati di racchiudere tra virgolette il percorso dell'eseguibile se contiene spazi.
customEditorCommand=Comando personalizzato dell'editor
customEditorCommandDescription=Il comando da eseguire per avviare l'editor personalizzato.\n\nLa stringa segnaposto $FILE verrà sostituita dal nome assoluto del file racchiuso tra virgolette al momento dell'esecuzione. Ricordati di racchiudere tra virgolette il percorso dell'eseguibile dell'editor se contiene spazi.
encryptAllVaultData=Crittografa tutti i dati del vault
encryptAllVaultDataDescription=Se abilitata, ogni parte dei dati di connessione al vault verrà crittografata con la tua chiave di crittografia del vault utente, anziché solo i segreti contenuti in quei dati. Questo aggiunge un ulteriore livello di sicurezza per altri parametri come nomi utente, nomi host, ecc., che non sono crittografati di default nel vault.\n\nQuesta opzione renderà inutili la cronologia e i diff del tuo vault Git, poiché non potrai più vedere le modifiche originali, ma solo quelle binarie.
vaultSecurity=Sicurezza del caveau
developerDisableUpdateVersionCheck=Disattiva il controllo della versione di aggiornamento
developerDisableUpdateVersionCheckDescription=Determina se il programma di verifica degli aggiornamenti ignorerà il numero di versione durante la ricerca di un aggiornamento.
shellCommandTest=Test dei comandi della shell
shellCommandTestDescription=Esegui un comando nella sessione della shell utilizzata internamente da XPipe.
terminal=Terminale
terminalType=Emulatore di terminale
terminalConfiguration=Configurazione del terminale
terminalCustomization=Personalizzazione del terminale
editorConfiguration=Configurazione dell'editor
defaultApplication=Applicazione predefinita
initialSetup=Configurazione iniziale
terminalTypeDescription=Il terminale predefinito da usare per aprire le connessioni alla shell.\n\nIl livello di supporto delle funzionalità varia a seconda del terminale, e ognuno è contrassegnato come consigliato o non consigliato. L'esperienza utente sarà ottimale se usi un terminale consigliato.
customTerminalCommand=Comando personalizzato del terminale
customTerminalCommandDescription=Il comando da eseguire per aprire il terminale personalizzato con un comando specifico.\n\nXPipe creerà uno script shell temporaneo di avvio che il tuo terminale dovrà eseguire. La stringa segnaposto $CMD nel comando che inserisci verrà sostituita dallo script di avvio effettivo al momento dell'esecuzione. Ricordati di mettere tra virgolette il percorso dell'eseguibile del terminale se contiene spazi.
clearTerminalOnInit=Cancella il terminale all'avvio
clearTerminalOnInitDescription=Quando è abilitato, XPipe eseguirà un comando di cancellazione dopo l'avvio di una nuova sessione terminale per rimuovere qualsiasi output superfluo visualizzato durante l'avvio della sessione terminale.
dontCachePasswords=Non memorizzare nella cache le password richieste
dontCachePasswordsDescription=Determina se le password richieste devono essere memorizzate nella cache interna di XPipe, in modo da non doverle inserire nuovamente nella sessione corrente.\n\nSe questa opzione è disattivata, dovrai reinserire le credenziali richieste ogni volta che il sistema te le chiederà.
denyTempScriptCreation=Impedisci la creazione temporanea di script
denyTempScriptCreationDescription=Per garantire alcune delle sue funzionalità, XPipe a volte crea script di shell temporanei sul sistema di destinazione per permettere di eseguire facilmente comandi semplici. Questi non contengono informazioni sensibili e vengono creati solo a scopo di implementazione.\n\nSe questa opzione è disabilitata, XPipe non creerà alcun file temporaneo sul sistema remoto. È utile in contesti ad alta sicurezza dove ogni modifica al file system viene monitorata. Se disabilitata, alcune funzionalità, come gli ambienti shell e gli script, non funzioneranno come previsto.
disableCertutilUse=Disattiva l'uso di certutil su Windows
useLocalFallbackShell=Usa la shell di fallback locale
useLocalFallbackShellDescription=Passa all'uso di un'altra shell locale per gestire le operazioni locali. Su Windows si tratta di PowerShell, mentre su altri sistemi è la shell Bourne.\n\nQuesta opzione può essere utilizzata nel caso in cui la normale shell locale predefinita sia disabilitata o non funzioni correttamente. Tuttavia, quando questa opzione è abilitata, alcune funzionalità potrebbero non funzionare come previsto.
disableCertutilUseDescription=A causa di diverse carenze e bug in cmd.exe, vengono creati script di shell temporanei con certutil, usandolo per decodificare l'input base64, dato che cmd.exe va in crash con l'input non ASCII. XPipe può usare anche PowerShell per questo, ma sarà più lento.\n\nQuesto disabilita qualsiasi uso di certutil sui sistemi Windows per realizzare alcune funzionalità, ricorrendo invece a PowerShell. Questo potrebbe far piacere ad alcuni antivirus, dato che alcuni di loro bloccano l'uso di certutil.
