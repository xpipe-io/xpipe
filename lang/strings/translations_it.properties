ptbNoticeContent=Stai utilizzando una build PTB di XPipe. Questa versione è instabile e potrebbe contenere bug. Non dovresti usarla come versione principale. Inoltre, non riceverà aggiornamenti regolari dopo il periodo di test. Per questo dovrai installare e avviare la versione normale di XPipe.
userDeletionTitle=Cancellazione di un utente
userDeletionContent=Vuoi eliminare questo utente del vault? Questa operazione crittograferà nuovamente tutti i dati utilizzando la chiave predefinita del vault. Ci vorrà un po' di tempo.
roleDeletionTitle=Eliminazione di un ruolo
roleDeletionContent=Vuoi eliminare questo ruolo del vault? Questa operazione ricrittograferà tutte le identità e i segreti di connessione che utilizzano questo ruolo, in modo che non venga più utilizzato. L'operazione potrebbe richiedere un po' di tempo.
