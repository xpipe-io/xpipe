automaticallyCheckForUpdatesDescription=När denna funktion är aktiverad hämtas information om nya versioner automatiskt efter en stund medan XPipe körs. Du måste fortfarande uttryckligen bekräfta installationen av eventuella uppdateringar.
developerMode=Utvecklingsläge
developerModeDescription=När funktionen är aktiverad får du tillgång till en rad ytterligare alternativ som är användbara för utveckling.
editor=Redigerare
custom=Anpassad
passwordManager=Lösenordshanterare
externalPasswordManager=Extern lösenordshanterare
passwordManagerDescription=Den lokalt installerade lösenordshanteraren som ska integreras med.\n\nOm du har en lösenordshanterare installerad kan du konfigurera XPipe så att programmet hämtar lösenord från den, så att XPipe inte behöver hantera lösenorden själv.
passwordManagerTest=Testa lösenordshanteraren
passwordManagerTestDescription=Kontrollera om integrationen med lösenordshanteraren fungerar korrekt. Se till att använda rätt identifieringsformat för att hänvisa till en post i lösenordshanteraren.
preferTerminalTabs=Öppna helst nya flikar
preferTerminalTabsDescription=Avgör om XPipe ska försöka öppna nya flikar i den terminal du valt istället för nya fönster. Alla terminaler stöder inte flikar.
customRdpClientCommand=Anpassat kommando
customRdpClientCommandDescription=Kommandot som ska köras för att starta den anpassade RDP-klienten.\n\nPlatshållarsträngen $FILE ersätts med det absoluta .rdp-filnamnet inom citattecken när kommandot anropas. Kom ihåg att sätta citattecken runt sökvägen till den körbara filen om den innehåller mellanslag.
customEditorCommand=Anpassat redigeringskommando
customEditorCommandDescription=Kommandot som ska köras för att starta den anpassade redigeraren.\n\nPlatshållarsträngen $FILE ersätts med det absoluta filnamnet inom citattecken när kommandot anropas. Kom ihåg att sätta citattecken runt sökvägen till redigerarens körbara fil om den innehåller mellanslag.
encryptAllVaultData=Kryptera all information i valvet
encryptAllVaultDataDescription=När detta är aktiverat kommer alla delar av anslutningsuppgifterna till valvet att krypteras med din användarkrypteringsnyckel för valvet, istället för att endast hemligheterna i dessa uppgifter krypteras. Detta lägger till ytterligare ett säkerhetslager för andra parametrar som användarnamn, värdnamn etc., som inte krypteras som standard i valvet.\n\nDetta alternativ gör din Git-valvhistorik och dina diffar oanvändbara, eftersom du inte längre kan se de ursprungliga ändringarna, utan endast binära ändringar.
vaultSecurity=Säkerhet i valvet
developerDisableUpdateVersionCheck=Inaktivera kontroll av uppdateringsversion
developerDisableUpdateVersionCheckDescription=Avgör om uppdateringskontrollen ska ignorera versionsnumret när den söker efter en uppdatering.
shellCommandTest=Test av Shell-kommandon
shellCommandTestDescription=Kör ett kommando i den shell-session som används internt av XPipe.
terminal=Terminal
terminalType=Terminalemulator
terminalConfiguration=Terminalkonfiguration
terminalCustomization=Anpassning av terminaler
editorConfiguration=Redigeringskonfiguration
defaultApplication=Standardprogram
initialSetup=Initial installation
terminalTypeDescription=Standardterminalen som ska användas för att öppna shell-anslutningar.\n\nGraden av funktionsstöd varierar beroende på terminal, och varje terminal är markerad som antingen rekommenderad eller icke rekommenderad. Du får den bästa användarupplevelsen när du använder en rekommenderad terminal.
customTerminalCommand=Anpassat terminalkommando
customTerminalCommandDescription=Kommandot som ska köras för att öppna den anpassade terminalen med ett angivet kommando.\n\nXPipe skapar ett tillfälligt startskript som din terminal ska köra. Platshållarsträngen $CMD i det kommando du anger kommer att ersättas av det faktiska startskriptet när det anropas. Kom ihåg att sätta citattecken runt sökvägen till din terminalkörbar om den innehåller mellanslag.
clearTerminalOnInit=Rensa terminalen vid start
clearTerminalOnInitDescription=När denna funktion är aktiverad kör XPipe ett rensningskommando efter att en ny terminalsession har startats för att ta bort all onödig utdata som skrevs ut under uppstarten av terminalsessionen.
dontCachePasswords=Cache inte lösenord som anges vid inloggning
dontCachePasswordsDescription=Styr om begärda lösenord ska lagras internt av XPipe så att du inte behöver ange dem igen under den aktuella sessionen.\n\nOm denna funktion är inaktiverad måste du ange de begärda inloggningsuppgifterna på nytt varje gång systemet begär dem.
denyTempScriptCreation=Neka tillfällig skapande av skript
denyTempScriptCreationDescription=För att kunna utföra vissa av sina funktioner skapar XPipe ibland tillfälliga shell-skript på ett målsystem för att underlätta utförandet av enkla kommandon. Dessa innehåller ingen känslig information och skapas endast för implementeringsändamål.\n\nOm detta beteende är inaktiverat kommer XPipe inte att skapa några tillfälliga filer på ett fjärrsystem. Detta alternativ är användbart i miljöer med höga säkerhetskrav där varje ändring i filsystemet övervakas. Om detta är inaktiverat kommer vissa funktioner, t.ex. shell-miljöer och skript, inte att fungera som avsett.
disableCertutilUse=Inaktivera användningen av certutil i Windows
useLocalFallbackShell=Använd lokalt reservskal
useLocalFallbackShellDescription=Byt till ett annat lokalt skal för att hantera lokala åtgärder. Detta skulle vara PowerShell i Windows och Bourne-skalet på andra system.\n\nDet här alternativet kan användas om det normala lokala standardskalet är inaktiverat eller inte fungerar som det ska. Vissa funktioner kanske dock inte fungerar som förväntat när det här alternativet är aktiverat.
disableCertutilUseDescription=På grund av flera brister och buggar i cmd.exe skapas tillfälliga shell-skript med certutil genom att använda det för att avkoda base64-inmatning, eftersom cmd.exe kraschar vid icke-ASCII-inmatning. XPipe kan också använda PowerShell för detta, men det blir långsammare.\n\nDetta inaktiverar all användning av certutil på Windows-system för att realisera vissa funktioner och faller istället tillbaka på PowerShell. Detta kan uppskattas av vissa antivirusprogram, eftersom vissa av dem blockerar användningen av certutil.
