workspaceManagementDescription=Arbetsytor är olika konfigurationer för att köra XPipe. Varje arbetsyta har en datakatalog där all data lagras lokalt. Detta inkluderar anslutningsdata, inställningar och mer.\n\nOm du använder synkroniseringsfunktionen kan du också välja att synkronisera varje arbetsyta med ett separat Git-repository.
