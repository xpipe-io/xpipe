identitiesIntroHeader=Om identiteter
identitiesIntroContent=Om du återanvänder vanliga kombinationer av användarnamn, lösenord och nycklar kan det vara lämpligt att skapa återanvändbara identiteter. På så sätt kan du snabbt hänvisa till dem när du lägger till nya anslutningar.
identitiesIntroBottomHeader=Delning av identiteter
identitiesIntroBottomContent=Du kan lägga till identiteter lokalt eller synkronisera dem till Git-repositoriet när denna funktion är aktiverad. Detta gör det möjligt att selektivt dela identiteter mellan flera system och med andra teammedlemmar.
