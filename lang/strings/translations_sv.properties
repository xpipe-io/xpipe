startupShutdown=Uppstart / Avstängning
showChildrenConnectionsInParentCategory=Visa underkategorier i överordnad kategori
showChildrenConnectionsInParentCategoryDescription=Om alla anslutningar i underkategorier ska inkluderas när en viss överordnad kategori är vald.\n\nOm denna funktion är inaktiverad fungerar kategorierna mer som klassiska mappar som endast visar sitt direkta innehåll utan att inkludera undermappar.
condenseConnectionDisplay=Komprimerad anslutningsvisning
condenseConnectionDisplayDescription=Se till att varje anslutning på högsta nivå tar mindre vertikalt utrymme för att möjliggöra en mer komprimerad anslutningslista.
openConnectionSearchWindowOnConnectionCreation=Öppna fönstret för anslutningssökning vid skapande av anslutning
openConnectionSearchWindowOnConnectionCreationDescription=Om fönstret för att söka efter tillgängliga underanslutningar ska öppnas automatiskt när en ny shell-anslutning läggs till.
