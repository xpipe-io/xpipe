fileWriteSudoTitle=Sudo-filskrivning
fileWriteSudoContent=Den fil du försöker skriva till har inte skrivbehörighet för din användare. Vill du skriva till den här filen som root med sudo? Detta kommer automatiskt att höja behörigheten till root, antingen med befintliga inloggningsuppgifter eller via en inmatningsprompt.
dontAllowTerminalRestart=Tillåt inte omstart av terminalen
dontAllowTerminalRestartDescription=Som standard kan terminalsessioner startas om efter att de har avslutats inifrån terminalen. För att möjliggöra detta accepterar XPipe dessa externa förfrågningar från terminalen om att starta om sessionen\n\nXPipe har ingen kontroll över terminalen eller varifrån denna begäran kommer, vilket innebär att skadliga lokala program också kan utnyttja denna funktion för att upprätta anslutningar via XPipe. Genom att inaktivera denna funktion förhindras detta scenario.
