enableConnectionHubTerminalDockingDescription=Du kan docka terminalfönster till XPipe-programfönstret i anslutningshubben för att simulera en något integrerad terminal. Terminalfönstren hanteras då av XPipe så att de alltid passar in i dockningen.
enableFileBrowserTerminalDocking=Aktivera dockning av filbläddraren
enableFileBrowserTerminalDockingDescription=Du kan docka terminalfönster till XPipe-programfönstret i filbläddraren för att simulera en något integrerad terminal. Terminalfönstren hanteras då av XPipe så att de alltid passar in i dockningen.
downloadsDirectory=Anpassad nedladdningskatalog
downloadsDirectoryDescription=Den anpassade mappen där nedladdade filer ska placeras när du klickar på knappen ”Flytta till nedladdningar”. Som standard använder XPipe din användarmapp för nedladdningar.
pinLocalMachineOnStartup=Fäst fliken ”Lokal dator” vid start
pinLocalMachineOnStartupDescription=Öppna automatiskt fliken för den lokala datorn och fäst den. Detta är användbart om du ofta använder en delad filbläddrare där både den lokala datorn och det fjärranslutna filsystemet är öppna.
terminalErrorDescription=Det här felet är allvarligt och XPipe kan inte fortsätta utan att det åtgärdas.
