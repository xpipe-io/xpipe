openDataDir=Vault-datakatalog
openDataDirButton=Öppen datakatalog
openDataDirDescription=Om du vill synkronisera ytterligare filer, till exempel SSH-nycklar, mellan system med ditt Git-repositorium kan du placera dem i katalogen för lagringsdata. Filvägarna för alla filer som refereras där anpassas automatiskt på alla synkroniserade system.
updates=Uppdateringar
