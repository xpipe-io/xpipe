censorMode=Censurläge
censorModeDescription=Döljer all information såsom värdnamn, användarnamn, anslutningsnamn och annat.\n\nDetta är användbart om du vill ta en skärmdump eller dela skärmen i XPipe utan att avslöja någon information.
