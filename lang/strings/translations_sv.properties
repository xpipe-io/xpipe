sftpNoticeTitle=Överföring av stora filer
sftpNoticeContent=Filerna du försöker överföra är ganska stora. Den aktuella sessionen baseras på rå SSH, vilket inte ger dig bästa möjliga överföringshastighet. Du kan överväga att öppna en SFTP-session till systemet via högerklickmenyn i filutforskaren om du behöver öka överföringshastigheten.
