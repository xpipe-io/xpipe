dontAutomaticallyStartVmSshServer=Starta inte SSH-servern automatiskt för virtuella maskiner när det behövs
dontAutomaticallyStartVmSshServerDescription=Alla shell-anslutningar till en virtuell maskin som körs i en hypervisor sker via SSH. XPipe kan automatiskt starta den installerade SSH-servern när det behövs. Om du av säkerhetsskäl inte vill ha detta kan du helt enkelt inaktivera denna funktion med detta alternativ.
confirmGitShareTitle=Git-synkronisering
confirmGitShareContent=Vill du lägga till den markerade filen i ditt Git Vault-arkiv? Detta kommer att kopiera en krypterad version av filen till ditt Git Vault och spara dina ändringar. Du kommer då att ha tillgång till filen på alla synkroniserade datorer.
gitShareFileTooltip=Lägg till filen i git vault-datakatalogen så att den synkroniseras automatiskt.\n\nDenna åtgärd kan endast användas när git vault är aktiverat i inställningarna.
performanceMode=Prestandaläge
performanceModeDescription=Inaktiverar alla visuella effekter som inte är nödvändiga för att förbättra programmets prestanda.
dontAcceptNewHostKeys=Acceptera inte nya SSH-värdnycklar automatiskt
dontAcceptNewHostKeysDescription=XPipe accepterar som standard automatiskt värdnycklar från system där din SSH-klient inte redan har någon känd värdnyckel sparad. Om någon känd värdnyckel har ändrats kommer programmet dock att vägra att ansluta om du inte accepterar den nya.\n\nGenom att inaktivera detta beteende kan du kontrollera alla värdnycklar, även om det inte finns någon konflikt från början.
uiScale=UI-skala
uiScaleDescription=Ett anpassat skalningsvärde som kan ställas in oberoende av systemets allmänna skärmskala. Värdena anges i procent, så t.ex. ett värde på 150 ger en gränssnittskala på 150 %.
editorProgram=Redigeringsprogram
editorProgramDescription=Standardtextredigeraren som ska användas vid redigering av alla typer av textdata.
