scriptsIntroHeader=Om skript
scriptsIntroContent=Du kan köra skript vid shell-start, i filbläddraren och på begäran. Du kan skapa skript själv i XPipe eller importera befintliga skript från ditt lokala system eller från ett fjärr-git-arkiv.
scriptsIntroBottomHeader=Användning av skript
scriptsIntroBottomContent=Det finns en rad olika exempelskript att utgå ifrån. Du kan klicka på redigeringsknappen för de enskilda skripten för att se hur de är implementerade. Skripten måste först aktiveras för att kunna köras och visas i menyerna; det finns en knapp för detta på varje skript.
scriptsIntroBottomButton=Kom igång
scriptSourcesIntroHeader=Skriptkällor
scriptSourcesIntroContent=Du kan lägga till anpassade skriptkällor för att få omedelbar tillgång till en hel samling av shell-skript. Både lokala källor och fjärr-git-repositorier stöds som källor. Alla skript som upptäcks från källan blir automatiskt tillgängliga.
scriptSourcesIntroButton=Lägg till källa ...
checkForSecurityUpdates=Kontrollera om det finns säkerhetsuppdateringar
checkForSecurityUpdatesDescription=XPipe kan söka efter eventuella säkerhetsuppdateringar separat från vanliga funktionsuppdateringar. När denna funktion är aktiverad kommer åtminstone viktiga säkerhetsuppdateringar att rekommenderas för installation även om den vanliga uppdateringskontrollen är inaktiverad.\n\nOm du inaktiverar denna inställning kommer inga externa versionsförfrågningar att utföras, och du kommer inte att få några meddelanden om säkerhetsuppdateringar.
clickToDock=Klicka för att docka terminalen
