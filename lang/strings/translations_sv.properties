rdpClientDescription=Det RDP-klientprogram som ska anropas när RDP-anslutningar startas.\n\nObservera att olika klienter har olika funktioner och integrationsnivåer. Vissa klienter stöder inte automatisk överföring av lösenord, så du måste fortfarande ange dem vid start.
