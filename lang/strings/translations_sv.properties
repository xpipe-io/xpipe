disableHardwareAcceleration=Inaktivera hårdvaruacceleration
disableHardwareAccelerationDescription=Inaktiverar all användning av grafikkortet för rendering och använder endast en mjukvarubaserad renderingspipeline.\n\nDetta medför en betydande prestandaförsämring, men kan vara det enda sättet att rendera om det finns problem med grafikkortets drivrutin.
disableRdpWindowsSecurityWarning=Inaktivera RDP-säkerhetsvarning
disableRdpWindowsSecurityWarningDescription=Visa inte den nya Windows-varningen om osignerade .rdp-filer när en ny session startas.\n\nDetta ändrar registernyckeln så att Windows RDP-klienten återgår till sitt tidigare beteende. Denna åtgärd kommer att visa ett popup-fönster där du måste ange administratörsbehörighet.
rdpWindowsSecurityWarningDialogTitle=RDP-säkerhetsvarningar
rdpWindowsSecurityWarningDialogContent=Sedan Windows-version 26200 visar Windows alltid en varning när en osignerad RDP-fil startas, oavsett dess innehåll.\n\nDu kan inaktivera denna varning i inställningsmenyn.
