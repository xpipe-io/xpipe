teamVaults=Teamvalv
vaultTypeNameDefault=Standardvalv
vaultTypeNamePersonal=Personligt valv
vaultTypeNameTeam=Teamvalv
teamVaultsDescription=Teamvalv gör det möjligt för flera användare och roller att få säker åtkomst till ett delat valv. Du kan konfigurera anslutningar och identiteter så att de antingen delas med alla användare eller endast är tillgängliga för enskilda användare och roller genom att kryptera dem med deras egen nyckel. Andra användare av valvet kan inte komma åt personliga och rollbaserade anslutningar och identiteter om de inte har tillgång till nyckeln.
vaultTypeContentDefault=Du använder för närvarande ett standardvalv utan användare och utan anpassad lösenfras. Hemligheterna krypteras med den lokala valvnyckeln.\n\nDu kan uppgradera till ett personligt valv genom att skapa ett valvkonto. Detta gör att du kan kryptera valvshemligheter med din egen personliga lösenfras, som du måste ange vid varje inloggning för att låsa upp valvet.
vaultTypeContentPersonal=Du använder för närvarande ett personligt valv för din användare. Hemlig information krypteras med din personliga lösenfras.
vaultTypeContentTeam=Du använder för närvarande ett teamvalv, vilket gör det möjligt för flera användare att få säker åtkomst till ett delat valv. Du kan konfigurera anslutningar och identiteter så att de antingen delas med alla användare eller endast är tillgängliga för din personliga användare eller roll genom att kryptera dem med din personliga nyckel eller rollnyckel. Andra användare av förvaret kan inte komma åt dina personliga och rollbaserade anslutningar och identiteter om de inte har tillgång till nyckeln.
roleManagement=Rollhantering
roleManagementEmpty=Rollhantering
roleManagementDescription=Hantera befintliga valvroller eller skapa nya. Varje valvroll har sin egen individuella hemliga nyckel som används för att kryptera anslutningar och identiteter som endast ska vara tillgängliga för den rollen och inte för andra.
roleManagementEmptyDescription=Hantera befintliga valvroller eller skapa nya. Varje valvroll har sin egen unika hemliga nyckel som används för att kryptera anslutningar och identiteter som endast ska vara tillgängliga för den rollen och inte för andra.\n\nRollbaserade konton för ett team stöds i Professional-planen.
userManagement=Användarhantering
userManagementEmpty=Användarhantering
userManagementDescription=Hantera din befintliga valv-användare eller skapa en ny. Din valv-användare har en egen individuell lösenfras som används för att kryptera anslutningar och identiteter.
userManagementEmptyDescription=Hantera din befintliga valv-användare eller skapa en ny. Din valv-användare har en egen individuell lösenfras som används för att kryptera anslutningar och identiteter. Skapa en användare åt dig själv för att kunna kryptera anslutningar och identiteter med din personliga nyckel.
