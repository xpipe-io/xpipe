thirdPartyDescription=Visa öppen källkodslicenserna för tredjepartsbibliotek
enableGitStorage=Aktivera synkronisering
gitSync=Git-synkronisering
enableGitStorageDescription=När funktionen är aktiverad kommer XPipe att initialisera ett Git-arkiv för det lokala valvet och lägga in eventuella ändringar i det. Observera att detta kräver att Git är installerat och kan göra att inläsnings- och sparningsoperationer går långsammare.\n\nAlla kategorier som ska synkroniseras måste uttryckligen markeras som synkroniserade.
storageGitRemote=URL för fjärrsynkronisering
storageGitRemoteDescription=När denna inställning är aktiverad hämtar XPipe automatiskt eventuella ändringar vid inläsning och skickar eventuella ändringar till det fjärrlagret vid sparande.\n\nDetta gör att du kan dela ditt valv mellan flera XPipe-installationer. Det stöder HTTP- och SSH-URL:er samt lokala kataloger.
vault=Vault
vaultAccess=Åtkomst till valvet
workspaceLockDescription=Ställer in ett anpassat lösenord för att kryptera all känslig information som lagras i XPipe.\n\nDetta ger ökad säkerhet eftersom det tillför ett extra krypteringsskikt för din lagrade känsliga information. Du kommer sedan att uppmanas att ange lösenordet när XPipe startar.
useSystemFontDescription=Styr om standardtypsnittet i systemet eller typsnittet Inter, som ingår i XPipe, ska användas.
