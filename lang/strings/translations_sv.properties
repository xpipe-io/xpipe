logging=Loggning
enableTerminalLogging=Aktivera terminalloggning
enableTerminalLoggingDescription=Aktiverar loggning på klientsidan för alla terminalsessioner. All in- och utdata från terminalsessionen skrivs till en sessionsloggfil. Observera att känslig information, såsom lösenordsförfrågningar, inte registreras.
