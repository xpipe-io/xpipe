terminalPromptConfig=Ficheiro de configuração
terminalPromptConfigDescription=O ficheiro de configuração personalizado a aplicar ao prompt. Esta configuração será definida automaticamente no sistema de destino quando o terminal for inicializado e será utilizada como configuração padrão do prompt.\n\nSe quiseres usar o ficheiro de configuração padrão já existente em cada sistema, podes deixar este campo em branco.
