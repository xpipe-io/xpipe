terminalEnvironment=Ambiente de terminal
terminalEnvironmentDescription=Se quiseres usar funcionalidades de um ambiente WSL local baseado em Linux para personalizar o teu terminal, podes usá-lo como ambiente de terminal.\n\nQuaisquer comandos de inicialização personalizados do terminal e configurações do multiplexador de terminais serão então executados nesta distribuição WSL.
terminalInitScript=Script de inicialização do terminal
terminalInitScriptDescription=Comandos a executar no ambiente do terminal antes de iniciar a ligação. Podes usar isto para configurar o ambiente do terminal à partida.
terminalMultiplexer=Multiplexador de terminais
terminalMultiplexerDescription=O multiplexador de terminal para usar como alternativa às separadores num terminal. Isto vai substituir certas características de funcionamento do terminal, por exemplo, a gestão das separadores, pela funcionalidade do multiplexador.\n\nRequer que o executável do multiplexador esteja instalado no sistema.
terminalMultiplexerWindowsDescription=O multiplexador de terminal para usar como alternativa às separadores num terminal. Isto vai substituir certas características de funcionamento do terminal, por exemplo, a gestão das separadores, pela funcionalidade do multiplexador.\n\nRequer a utilização de um ambiente de terminal WSL no Windows e que o executável do multiplexador esteja instalado no sistema WSL.
terminalAlwaysPauseOnExit=Faz sempre uma pausa ao sair
terminalAlwaysPauseOnExitDescription=Quando esta opção estiver ativada, ao sair de uma sessão de terminal, ser-te-á sempre pedido que reinicies ou encerres a sessão. Se estiver desativada, o XPipe só fará isso no caso de ligações falhadas que terminem com um erro.
