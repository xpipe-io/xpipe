automaticallyCheckForUpdates=Verificar se há atualizações
automaticallyCheckForUpdatesDescription=Quando esta opção estiver ativada, as informações sobre novas versões são automaticamente obtidas após algum tempo, enquanto o XPipe estiver a funcionar. No entanto, ainda tens de confirmar explicitamente a instalação de qualquer atualização.
developerMode=Modo de programador
developerModeDescription=Quando estiver ativada, vais ter acesso a várias opções adicionais que são úteis para o desenvolvimento.
editor=Editor
custom=Personalizado
passwordManager=Gestor de palavras-passe
externalPasswordManager=Gestor de palavras-passe externo
passwordManagerDescription=O gestor de palavras-passe instalado localmente com o qual te vais integrar.\n\nSe tiveres um gestor de palavras-passe instalado, podes configurar o XPipe para recuperar as palavras-passe a partir dele, para que o XPipe não tenha de gerir as palavras-passe por si próprio.
passwordManagerTest=Testa o gestor de palavras-passe
passwordManagerTestDescription=Verifica se a integração com o gestor de palavras-passe está a funcionar bem. Certifica-te de que usas o formato de identificador correto para referenciar uma entrada no gestor de palavras-passe.
preferTerminalTabs=Prefiro abrir novos separadores
preferTerminalTabsDescription=Determina se o XPipe vai tentar abrir novos separadores no terminal que escolheste, em vez de novas janelas. Nem todos os terminais suportam separadores.
customRdpClientCommand=Comando personalizado
customRdpClientCommandDescription=O comando a executar para iniciar o cliente RDP personalizado.\n\nA string de espaço reservado $FILE será substituída pelo nome absoluto do ficheiro .rdp entre aspas quando for chamado. Lembra-te de colocar o caminho do executável entre aspas se este contiver espaços.
customEditorCommand=Comando personalizado do editor
customEditorCommandDescription=O comando a executar para iniciar o editor personalizado.\n\nA string de espaço reservado $FILE será substituída pelo nome absoluto do ficheiro entre aspas quando for chamado. Lembra-te de colocar o caminho do executável do teu editor entre aspas se este contiver espaços.
encryptAllVaultData=Encripta todos os dados do cofre
encryptAllVaultDataDescription=Quando ativada, toda a informação de ligação ao cofre será encriptada com a tua chave de encriptação do cofre de utilizador, em vez de apenas os segredos contidos nessa informação. Isto adiciona mais uma camada de segurança a outros parâmetros, como nomes de utilizador, nomes de anfitrião, etc., que não são encriptados por predefinição no cofre.\n\nEsta opção tornará o teu histórico e as comparações do cofre Git inúteis, uma vez que já não poderás ver as alterações originais, apenas as alterações binárias.
vaultSecurity=Segurança do cofre
developerDisableUpdateVersionCheck=Desativar a verificação de atualizações
developerDisableUpdateVersionCheckDescription=Determina se o verificador de atualizações vai ignorar o número da versão ao procurar uma atualização.
shellCommandTest=Teste de comandos do Shell
shellCommandTestDescription=Executa um comando na sessão do shell usada internamente pelo XPipe.
terminal=Terminal
terminalType=Emulador de terminal
terminalConfiguration=Configuração do terminal
terminalCustomization=Personalização do terminal
editorConfiguration=Configuração do editor
defaultApplication=Aplicação predefinida
initialSetup=Configuração inicial
terminalTypeDescription=O terminal predefinido a utilizar para abrir ligações ao shell.\n\nO nível de suporte a funcionalidades varia consoante o terminal, e cada um está marcado como recomendado ou não recomendado. A tua experiência de utilizador será melhor se usares um terminal recomendado.
customTerminalCommand=Comando personalizado do terminal
customTerminalCommandDescription=O comando a executar para abrir o terminal personalizado com um determinado comando.\n\nO XPipe vai criar um script shell temporário de lançamento para o teu terminal executar. A string de espaço reservado $CMD no comando que forneceres será substituída pelo script de lançamento real quando for chamado. Lembra-te de colocar o caminho do executável do teu terminal entre aspas se este contiver espaços.
clearTerminalOnInit=Limpar o terminal na inicialização
clearTerminalOnInitDescription=Quando ativado, o XPipe executa um comando «clear» depois de uma nova sessão de terminal ser iniciada, para remover qualquer saída desnecessária que tenha sido apresentada durante o arranque da sessão de terminal.
dontCachePasswords=Não guardes em cache as palavras-passe solicitadas
dontCachePasswordsDescription=Determina se as palavras-passe solicitadas devem ser armazenadas em cache internamente pelo XPipe, para que não tenhas de as introduzir novamente na sessão atual.\n\nSe esta funcionalidade estiver desativada, terás de voltar a introduzir as credenciais sempre que o sistema as solicitar.
denyTempScriptCreation=Recusar a criação temporária de scripts
denyTempScriptCreationDescription=Para concretizar algumas das suas funcionalidades, o XPipe, por vezes, cria scripts de shell temporários num sistema de destino para facilitar a execução de comandos simples. Estes não contêm nenhuma informação sensível e são criados apenas para fins de implementação.\n\nSe este comportamento estiver desativado, o XPipe não vai criar nenhum ficheiro temporário num sistema remoto. Esta opção é útil em contextos de alta segurança, onde todas as alterações no sistema de ficheiros são monitorizadas. Se estiver desativada, algumas funcionalidades, como ambientes de shell e scripts, não vão funcionar como previsto.
disableCertutilUse=Desativar a utilização do certutil no Windows
useLocalFallbackShell=Usar o shell de recurso local
useLocalFallbackShellDescription=Muda para usar outro shell local para gerir as operações locais. No Windows, seria o PowerShell; noutros sistemas, o shell Bourne.\n\nPodes usar esta opção caso o shell local padrão esteja desativado ou não esteja a funcionar bem. No entanto, algumas funcionalidades podem não funcionar como esperado quando esta opção estiver ativada.
disableCertutilUseDescription=Devido a várias falhas e bugs no cmd.exe, são criados scripts temporários de shell com o certutil, usando-o para descodificar entradas em base64, já que o cmd.exe falha com entradas não ASCII. O XPipe também pode usar o PowerShell para isso, mas vai ser mais lento.\n\nIsto desativa qualquer utilização do certutil em sistemas Windows para implementar certas funcionalidades, recorrendo ao PowerShell em vez disso. Isto pode agradar a alguns antivírus, já que alguns deles bloqueiam a utilização do certutil.
