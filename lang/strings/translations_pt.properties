terminalPrompt=Prompt do terminal
terminalPromptDescription=A ferramenta de prompt de terminal a utilizar nos teus terminais remotos. Ativar um prompt de terminal vai instalar e configurar automaticamente a ferramenta de prompt no sistema de destino quando abrires uma sessão de terminal.\n\nIsto não altera quaisquer configurações de prompt existentes nem ficheiros de perfil no sistema. Isto vai aumentar o tempo de carregamento do terminal na primeira vez, enquanto o prompt está a ser configurado no sistema remoto. O teu terminal pode precisar de tipos de letra adicionais para mostrar o prompt corretamente.
