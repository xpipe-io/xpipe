ptbNoticeTitle=Aviso sobre a versão de teste pública
ptbNoticeContent=Estás a utilizar uma versão PTB do XPipe. Esta versão é instável e pode conter erros. Não a deves utilizar no dia a dia. Além disso, não receberá atualizações regulares após o período de testes. Para isso, terás de instalar e iniciar a versão normal do XPipe.
userDeletionTitle=Eliminação de utilizador
userDeletionContent=Queres eliminar este utilizador do cofre? Isto vai encriptar novamente todos os dados usando a chave padrão do cofre. Isto vai demorar algum tempo.
roleDeletionTitle=Eliminação de funções
roleDeletionContent=Queres eliminar esta função do cofre? Isto vai encriptar novamente todas as identidades e segredos de ligação que utilizam esta função. Quaisquer entradas que sejam acessíveis apenas a esta função passarão a estar disponíveis para todas as funções. Isto vai demorar algum tempo.
