disableApiAuthenticationDescription=Desativa todos os métodos de autenticação obrigatórios para que qualquer pedido não autenticado seja processado.\n\nA autenticação só deve ser desativada para fins de desenvolvimento.
api=API
storeIntroImportContent=Já usas o XPipe noutro sistema? Sincroniza as tuas ligações existentes entre vários sistemas através de um repositório Git remoto. Também podes sincronizar mais tarde, a qualquer momento, se ainda não estiver configurado.
