gitVault=Git vault
fileBrowser=Explorador de ficheiros
confirmAllDeletions=Confirma todas as eliminações
confirmAllDeletionsDescription=Se deve ser apresentada uma caixa de diálogo de confirmação para todas as operações de eliminação. Por predefinição, só os diretórios exigem confirmação.
