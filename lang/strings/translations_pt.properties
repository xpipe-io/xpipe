startupBehaviourDescription=Controla o comportamento predefinido da aplicação de secretária quando o XPipe é iniciado.
clearCachesAlertTitle=Limpar a cache
clearCachesAlertContent=Queres limpar todos os caches do XPipe? Isto vai apagar todos os dados em cache que estão guardados para melhorar a experiência do utilizador.
