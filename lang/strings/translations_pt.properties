confirmVaultUnencryptTitle=Confirma a descodificação do cofre
confirmVaultUnencryptContent=Queres mesmo desativar a encriptação avançada do cofre? Isto vai remover a encriptação adicional dos dados armazenados e vai sobrescrever os dados existentes.
enableHttpApi=Ativar a API HTTP
enableHttpApiDescription=Ativa a API, permitindo que programas externos chamem o daemon XPipe para realizar ações com as tuas ligações geridas.
