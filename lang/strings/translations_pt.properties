clipboardNoticeContent=Como a aplicação em questão não suporta a introdução direta de palavras-passe, a tua palavra-passe foi colocada na área de transferência para que a possas colar. No futuro, isto será feito automaticamente. Podes ver o indicador da área de transferência no canto inferior direito.
sftpNoticeTitle=Transferências de ficheiros grandes
sftpNoticeContent=Os ficheiros que estás a tentar transferir são bastante grandes. A sessão atual está a ser feita através de SSH sem encriptação, o que não te dá a melhor velocidade de transferência possível. Se precisares de aumentar a velocidade de transferência, podes tentar abrir uma sessão SFTP para o sistema através do menu do botão direito do rato no explorador de ficheiros.
hideVaultEntryNames=Ocultar os nomes das entradas do Git Vault
hideVaultEntryNamesDescription=Remove todos os nomes de ligação e outras informações de quaisquer ficheiros README e mensagens de commit quando o git sync estiver ativado. Esta opção impede que se perceba a estrutura do conteúdo encriptado do cofre.
disableHardwareAcceleration=Desativar a aceleração por hardware
disableHardwareAccelerationDescription=Desativa qualquer utilização da placa gráfica para renderização e vai usar apenas um pipeline de renderização por software.\n\nIsto causa uma queda significativa no desempenho, mas pode ser a única forma de renderizar se houver problemas com o controlador da placa gráfica.
disableRdpWindowsSecurityWarning=Desativar o aviso de segurança do RDP
disableRdpWindowsSecurityWarningDescription=Não mostres o novo aviso do Windows sobre ficheiros .rdp não assinados sempre que iniciares uma nova sessão.\n\nIsto vai alterar a chave do registo para fazer com que o cliente RDP do Windows volte ao comportamento anterior. Esta ação vai mostrar uma janela pop-up a pedir direitos de administrador.
rdpWindowsSecurityWarningDialogTitle=Avisos de segurança do RDP
rdpWindowsSecurityWarningDialogContent=A partir da versão 26200 do Windows, o sistema passa a mostrar sempre um aviso quando um ficheiro RDP não assinado é executado, independentemente do seu conteúdo.\n\nPodes desativar este aviso no menu de definições.
