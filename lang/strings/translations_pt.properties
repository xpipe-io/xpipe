addMacro=Ação...
identitiesIntroHeader=Sobre identidades
identitiesIntroContent=Se estiveres a reutilizar combinações comuns de nomes de utilizador, palavras-passe e chaves, pode fazer sentido criar identidades reutilizáveis. Isso permite-te consultá-las rapidamente quando adicionares novas ligações.
identitiesIntroBottomHeader=Partilha de identidades
identitiesIntroBottomContent=Podes adicionar identidades localmente ou também sincronizá-las no repositório Git, quando esta funcionalidade estiver ativada. Isto permite partilhar identidades de forma seletiva entre vários sistemas e com outros membros da equipa.
identitiesIntroBottomButton=Sincronização da configuração
identitiesIntroButton=Criar identidade
