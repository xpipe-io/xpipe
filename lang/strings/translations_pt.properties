rdpClient=Cliente RDP
rdpClientDescription=O programa cliente RDP a chamar ao iniciar ligações RDP.\n\nRepara que os vários clientes têm diferentes níveis de funcionalidades e integrações. Alguns clientes não suportam a introdução automática de palavras-passe, por isso ainda tens de as introduzir manualmente ao iniciar a ligação.
