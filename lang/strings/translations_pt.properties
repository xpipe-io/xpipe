disableHttpsTlsCheckDescription=Se a tua organização estiver a descodificar o tráfego HTTPS nas firewalls através da interceção de SSL, quaisquer pedidos HTTP irão falhar, a menos que os certificados sejam considerados de confiança. Podes ativar esta opção e desativar a validação de certificados TLS para testar, caso algo não funcione como esperado com os certificados personalizados.
