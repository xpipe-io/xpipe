backgroundSessionInactivityTimeoutDescription=O número de segundos após o qual as sessões de shell em segundo plano serão encerradas, caso não tenham sido utilizadas.\n\nPor predefinição, o XPipe mantém as ligações de shell a sistemas remotos abertas em segundo plano para as reutilizar mais tarde e acelerar as operações. Se quiseres que estas sejam encerradas automaticamente após um determinado período, podes definir esta opção.
