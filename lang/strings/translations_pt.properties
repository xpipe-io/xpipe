fileWriteSudoTitle=Gravação de ficheiro com o `sudo`
fileWriteSudoContent=O ficheiro que estás a tentar gravar não tem permissões de gravação para o teu utilizador. Queres gravar este ficheiro como root com o sudo? Isto vai elevar automaticamente os teus privilégios para root, seja com as credenciais existentes ou através de um prompt.
dontAllowTerminalRestart=Não permitir o reinício do terminal
dontAllowTerminalRestartDescription=Por predefinição, as sessões de terminal podem ser reiniciadas depois de terminarem a partir do próprio terminal. Para permitir isso, o XPipe aceita estes pedidos externos do terminal para reiniciar a sessão\n\nO XPipe não tem qualquer controlo sobre o terminal nem sobre a origem desta chamada, pelo que aplicações locais maliciosas também podem usar esta funcionalidade para estabelecer ligações através do XPipe. Desativar esta funcionalidade evita esta situação.
openDocumentation=Documentação aberta
openDocumentationDescription=Visita a página de documentação do XPipe sobre este assunto
renameAll=Renomear tudo
logging=Registo
enableTerminalLogging=Ativar o registo do terminal
enableTerminalLoggingDescription=Ativa o registo do lado do cliente para todas as sessões de terminal. Todas as entradas e saídas da sessão de terminal são gravadas num ficheiro de registo da sessão. Nota que qualquer informação confidencial, como pedidos de palavra-passe, não é registada.
terminalLoggingDirectory=Registos de sessões de terminal
terminalLoggingDirectoryDescription=Todos os registos são guardados no diretório de dados do XPipe no teu sistema local.
openSessionLogs=Abrir registos de sessão
sessionLogging=Registo do terminal
sessionActive=Está a decorrer uma sessão em segundo plano para esta ligação.\n\nPara encerrar esta sessão manualmente, clica no indicador de estado.
skipValidation=Ignorar validação
scriptsIntroHeader=Sobre os scripts
scriptsIntroContent=Podes executar scripts na inicialização do shell, no explorador de ficheiros e sempre que quiseres. Podes criar os teus próprios scripts no XPipe ou importar scripts já existentes do teu sistema local ou de um repositório Git remoto.
scriptsIntroBottomHeader=Usar scripts
scriptsIntroBottomContent=Há vários exemplos de scripts para começares. Podes clicar no botão «Editar» de cada script para veres como estão implementados. Os scripts têm de ser ativados para poderem ser executados e aparecerem nos menus; há um botão de ativação/desativação em cada script para isso.
scriptsIntroBottomButton=Começa já
scriptSourcesIntroHeader=Fontes do script
scriptSourcesIntroContent=Podes adicionar fontes de scripts personalizadas para teres acesso imediato a toda uma coleção de scripts de shell. São suportadas tanto fontes locais como repositórios Git remotos. Todos os scripts detetados na fonte ficarão disponíveis automaticamente.
scriptSourcesIntroButton=Adicionar código-fonte...
checkForSecurityUpdates=Verifica se há atualizações de segurança
checkForSecurityUpdatesDescription=O XPipe pode verificar se há possíveis atualizações de segurança separadamente das atualizações normais de funcionalidades. Quando esta opção estiver ativada, as atualizações de segurança, pelo menos as mais importantes, serão recomendadas para instalação, mesmo que a verificação normal de atualizações esteja desativada.\n\nSe desativares esta configuração, não será feita nenhuma verificação externa da versão e não serás notificado sobre quaisquer atualizações de segurança.
clickToDock=Clica para acoplar o terminal
terminalStarting=À espera que o terminal arranque...
pinTab=Separador «Pin»
unpinTab=Desfixar separador
pinned=Fixado
enableConnectionHubTerminalDocking=Anexar a janela do terminal ao hub de ligação
enableConnectionHubTerminalDockingDescription=Podes encaixar janelas de terminal na janela da aplicação XPipe, no centro de ligações, para simular um terminal mais ou menos integrado. As janelas de terminal são então geridas pelo XPipe para se adaptarem sempre ao espaço de encaixe.
enableFileBrowserTerminalDocking=Ativar a fixação do terminal do explorador de ficheiros
enableFileBrowserTerminalDockingDescription=Podes encaixar janelas de terminal na janela da aplicação XPipe no explorador de ficheiros para simular um terminal mais ou menos integrado. As janelas de terminal são então geridas pelo XPipe para se adaptarem sempre ao espaço de encaixe.
downloadsDirectory=Diretório de downloads personalizados
downloadsDirectoryDescription=O diretório personalizado onde os ficheiros descarregados vão ficar quando clicas no botão «Mover para Downloads». Por predefinição, o XPipe usa o teu diretório de downloads de utilizador.
pinLocalMachineOnStartup=Fixar o separador «Máquina local» no arranque
pinLocalMachineOnStartupDescription=Abrir automaticamente um separador da máquina local e fixá-lo. Isto é útil se usares frequentemente um explorador de ficheiros dividido, com a máquina local e o sistema de ficheiros remoto abertos.
terminalErrorDescription=Este erro é grave e o XPipe não pode continuar sem o resolver.
groupName=Nome do grupo
chmodPermissions=Novas permissões
editFilesWithDoubleClick=Edita ficheiros com um duplo clique
editFilesWithDoubleClickDescription=Quando esta opção estiver ativada, ao clicar duas vezes nos ficheiros, estes abrem-se diretamente no teu editor de texto, em vez de aparecer o menu de contexto.
censorMode=Modo de censura
censorModeDescription=Oculta qualquer informação, como nomes de anfitriões, nomes de utilizador, nomes de ligação e muito mais.\n\nIsto é útil se quiseres fazer uma captura de ecrã ou partilhar o ecrã do XPipe e não quiseres revelar nenhuma informação.
