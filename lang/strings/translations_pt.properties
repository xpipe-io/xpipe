workspaceManagement=Gerir espaços de trabalho
workspaceManagementDescription=Os espaços de trabalho são configurações distintas para executar o XPipe. Cada espaço de trabalho tem um diretório de dados onde toda a informação é guardada localmente. Isso inclui dados de ligação, definições e muito mais.\n\nSe usares a funcionalidade de sincronização, também podes optar por sincronizar cada espaço de trabalho com um repositório Git diferente.
