passwordManagerCommandDescription=O comando personalizado a executar para obter as palavras-passe. A string de espaço reservado $KEY será substituída pela chave da palavra-passe entre aspas quando for chamado. Isto deve chamar a CLI do teu gestor de palavras-passe para apresentar a palavra-passe ou as credenciais em formato JSON na saída padrão (stdout).
