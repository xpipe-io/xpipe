themeDescription=O teu tema de visualização preferido.
dontAutomaticallyStartVmSshServer=Não iniciares automaticamente o servidor SSH para as máquinas virtuais quando for necessário
dontAutomaticallyStartVmSshServerDescription=Qualquer ligação de shell a uma VM em execução num hipervisor é feita através do SSH. O XPipe pode iniciar automaticamente o servidor SSH instalado quando necessário. Se não quiseres isto por motivos de segurança, basta desativares este comportamento com esta opção.
confirmGitShareTitle=Sincronização do Git
confirmGitShareContent=Queres adicionar o ficheiro selecionado ao teu repositório do Git Vault? Isto vai copiar uma versão encriptada do ficheiro para o teu Git Vault e confirmar as tuas alterações. Depois, vais ter acesso ao ficheiro em todos os computadores sincronizados.
gitShareFileTooltip=Adiciona o ficheiro ao diretório de dados do git vault para que seja sincronizado automaticamente.\n\nEsta ação só pode ser usada quando o git vault estiver ativado nas definições.
performanceMode=Modo de desempenho
performanceModeDescription=Desativa todos os efeitos visuais que não são necessários, para melhorar o desempenho da aplicação.
dontAcceptNewHostKeys=Não aceites automaticamente novas chaves de anfitrião SSH
dontAcceptNewHostKeysDescription=Por predefinição, o XPipe aceita automaticamente as chaves de anfitrião de sistemas em que o teu cliente SSH ainda não tenha nenhuma chave de anfitrião conhecida guardada. No entanto, se alguma chave de anfitrião conhecida tiver sido alterada, o XPipe recusará a ligação, a menos que aceites a nova chave.\n\nDesativar este comportamento permite-te verificar todas as chaves de anfitrião, mesmo que não haja nenhum conflito inicialmente.
uiScale=Escala da interface do utilizador
uiScaleDescription=Um valor de escala personalizado que podes definir independentemente da escala de visualização do teu sistema. Os valores são expressos em percentagem; por exemplo, um valor de 150 resultará numa escala da interface de utilizador de 150%.
editorProgram=Programa de edição
editorProgramDescription=O editor de texto predefinido a utilizar ao editar qualquer tipo de dados de texto.
windowOpacity=Opacidade da janela
windowOpacityDescription=Altera a opacidade da janela para acompanhar o que se passa em segundo plano.
useSystemFont=Usar o tipo de letra do sistema
openDataDir=Diretório de dados do Vault
openDataDirButton=Diretório de dados aberto
openDataDirDescription=Se quiseres sincronizar ficheiros adicionais, como chaves SSH, entre sistemas com o teu repositório Git, podes colocá-los no diretório de dados de armazenamento. Os caminhos de qualquer ficheiro referenciado nesse diretório serão automaticamente adaptados em qualquer sistema sincronizado.
updates=Atualizações
selectAll=Selecionar tudo
advanced=Avançado
thirdParty=Avisos sobre software de código aberto
eulaDescription=Lê o Contrato de Licença do Utilizador Final da aplicação XPipe
thirdPartyDescription=Ver as licenças de código aberto das bibliotecas de terceiros
enableGitStorage=Ativar a sincronização
gitSync=Sincronização do Git
enableGitStorageDescription=Quando ativado, o XPipe vai inicializar um repositório Git para o cofre local e submeter quaisquer alterações para lá. Repara que isto requer que o Git esteja instalado e pode tornar as operações de carregamento e gravação mais lentas.\n\nQuaisquer categorias que devam ser sincronizadas têm de ser explicitamente marcadas como sincronizadas.
storageGitRemote=URL de sincronização remota
storageGitRemoteDescription=Quando esta opção estiver ativada, o XPipe vai buscar automaticamente quaisquer alterações ao carregar e enviar quaisquer alterações para o repositório remoto ao guardar.\n\nIsto permite-te partilhar o teu cofre entre várias instalações do XPipe. Suporta URLs HTTP e SSH, além de diretórios locais.
vault=Cofre
vaultAccess=Acesso ao cofre
workspaceLockDescription=Define uma palavra-passe personalizada para encriptar qualquer informação confidencial guardada no XPipe.\n\nIsto aumenta a segurança, pois oferece uma camada adicional de encriptação para a tua informação confidencial guardada. Depois, ser-te-á pedido que introduzas a palavra-passe quando o XPipe for iniciado.
useSystemFontDescription=Determina se se deve usar o tipo de letra predefinido do sistema ou o tipo de letra «Inter», que vem incluído no XPipe.
windowOptions=Opções da janela
saveWindowLocation=Guardar a localização da janela
saveWindowLocationDescription=Determina se as coordenadas da janela devem ser guardadas e restauradas ao reiniciar.
startupShutdown=Arranque / Desligamento
showChildrenConnectionsInParentCategory=Mostrar categorias secundárias na categoria principal
showChildrenConnectionsInParentCategoryDescription=Se deves ou não incluir todas as ligações que estão nas subcategorias quando uma determinada categoria principal está selecionada.\n\nSe esta opção estiver desativada, as categorias funcionam mais como pastas clássicas, que só mostram o conteúdo direto sem incluir as subpastas.
condenseConnectionDisplay=Exibição condensada das ligações
condenseConnectionDisplayDescription=Faz com que cada ligação de nível superior ocupe menos espaço na vertical, para que a lista de ligações fique mais compacta.
openConnectionSearchWindowOnConnectionCreation=Abrir a janela de pesquisa de ligações ao criar uma ligação
openConnectionSearchWindowOnConnectionCreationDescription=Se queres ou não que a janela para procurar subligações disponíveis se abra automaticamente quando adicionares uma nova ligação shell.
