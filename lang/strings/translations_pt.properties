teamVaults=Cofres de equipa
vaultTypeNameDefault=Cofre predefinido
vaultTypeNamePersonal=Cofre pessoal
vaultTypeNameTeam=Cofre da equipa
teamVaultsDescription=Os cofres de equipa permitem que vários utilizadores e funções tenham acesso seguro a um cofre partilhado. Podes configurar as ligações e identidades para serem partilhadas por todos os utilizadores ou para ficarem disponíveis apenas para utilizadores e funções específicos, encriptando-as com a sua própria chave. Os outros utilizadores do cofre não conseguem aceder às ligações e identidades pessoais e baseadas em funções se não tiverem acesso à chave.
vaultTypeContentDefault=De momento, estás a usar um cofre predefinido, sem utilizador nem frase-passe personalizada definida. Os segredos são encriptados com a chave do cofre local.\n\nPodes atualizar para um cofre pessoal criando uma conta de utilizador do cofre. Isso permite-te encriptar os segredos do cofre com a tua própria frase-passe pessoal, que terás de introduzir em cada início de sessão para desbloquear o cofre.
vaultTypeContentPersonal=Estás a usar um cofre pessoal para o teu utilizador. As informações confidenciais estão encriptadas com a tua frase-passe pessoal.
vaultTypeContentTeam=De momento, estás a usar um cofre de equipa, que permite que vários utilizadores tenham acesso seguro a um cofre partilhado. Podes configurar as ligações e identidades para que sejam partilhadas por todos os utilizadores ou para que estejam disponíveis apenas para o teu utilizador pessoal ou função, encriptando-as com a tua chave pessoal ou de função. Os outros utilizadores do cofre não conseguem aceder às tuas ligações e identidades pessoais e baseadas na função se não tiverem acesso à chave.
roleManagement=Gestão de funções
roleManagementEmpty=Gestão de funções
roleManagementDescription=Gere as funções existentes do cofre ou crie novas. Cada função do cofre tem a sua própria chave secreta individual, que é usada para encriptar ligações e identidades que só devem estar disponíveis para essa função e não para outras.
roleManagementEmptyDescription=Gere as funções existentes do cofre ou crie novas. Cada função do cofre tem a sua própria chave secreta individual, que é usada para encriptar ligações e identidades que só devem estar disponíveis para essa função e não para outras.\n\nAs contas baseadas em funções para uma equipa são suportadas no plano profissional.
userManagement=Gestão de utilizadores
userManagementEmpty=Gestão de utilizadores
userManagementDescription=Gere o teu utilizador do cofre já existente ou cria um novo. O teu utilizador do cofre tem a sua própria frase-passe individual, que é usada para encriptar ligações e identidades.
userManagementEmptyDescription=Gere o teu utilizador do cofre já existente ou cria um novo. O teu utilizador do cofre tem a sua própria frase-passe individual, que é usada para encriptar ligações e identidades. Cria um utilizador para ti próprio para poderes encriptar ligações e identidades com a tua chave pessoal.
userIntroHeader=Gestão de utilizadores
userIntroContent=Cria a tua primeira conta de utilizador para começares. Isto permite-te bloquear este espaço de trabalho com uma palavra-passe.
