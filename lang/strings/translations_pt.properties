passwordManagerMapping=Mapeamento personalizado de teclas
passwordManagerMappingDescription=Os dados JSON podem armazenar quaisquer entradas do tipo chave-valor, por isso vais ter de definir um mapeamento que permita ao XPipe encontrar entradas individuais, como nome de utilizador, palavra-passe e chaves SSH. O mapeamento predefinido pode ser substituído por identidades individuais, quando necessário.
