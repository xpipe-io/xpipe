developerForceSshTtyDescription=Faz com que todas as ligações SSH aloquem um pty para testar o suporte a um stderr em falta e a um pty.
developerDisableSshTunnelGateways=Desativar o tunelamento do gateway SSH
developerDisableSshTunnelGatewaysDescription=Não uses sessões de túnel para gateways; em vez disso, liga-te diretamente ao sistema.
ttyWarning=A ligação atribuiu à força um pty/tty e não fornece um fluxo stderr separado.\n\nIsto pode causar alguns problemas.\n\nSe puderes, tenta fazer com que o comando de ligação não atribua um pty.
