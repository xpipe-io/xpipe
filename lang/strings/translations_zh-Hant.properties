logging=記錄
enableTerminalLogging=啟用終端機記錄功能
enableTerminalLoggingDescription=啟用所有終端機連線的客戶端記錄功能。終端機連線的所有輸入與輸出內容都會寫入連線記錄檔案中。請注意，任何敏感資訊（例如密碼提示）均不會被記錄。
terminalLoggingDirectory=終端機連線日誌
terminalLoggingDirectoryDescription=所有日誌皆儲存於您本機系統的 XPipe 資料目錄中。
openSessionLogs=開啟連線日誌
sessionLogging=終端記錄
sessionActive=此連線目前有一個背景工作階段正在執行。\n\n若要手動停止此工作階段，請點擊狀態指示器。
skipValidation=跳過驗證
scriptsIntroHeader=關於腳本
scriptsIntroContent=您可以在 shell 初始化時、檔案瀏覽器中，以及按需執行腳本。您可以在 XPipe 內自行建立腳本，或從本地系統或遠端 Git 儲存庫匯入現有腳本。
scriptsIntroBottomHeader=使用腳本
scriptsIntroBottomContent=這裡提供多種範例腳本供您入門使用。您可以點擊個別腳本的編輯按鈕，查看其實作方式。腳本必須先啟用才能執行並顯示在選單中，每個腳本上都有一個用於此目的的切換開關。
scriptsIntroBottomButton=開始使用
scriptSourcesIntroHeader=腳本來源
scriptSourcesIntroContent=您可以新增自訂腳本來源，以便立即存取整套 shell 腳本集合。系統同時支援本地來源與遠端 git 儲存庫作為來源。來源中所有被偵測到的腳本都會自動變得可用。
scriptSourcesIntroButton=新增來源 ...
checkForSecurityUpdates=檢查安全性更新
checkForSecurityUpdatesDescription=XPipe 可獨立於一般功能更新之外，單獨檢查潛在的安全性更新。啟用此功能後，即使一般更新檢查已停用，系統仍會建議安裝至少「重要」等級的安全性更新。\n\n若停用此設定，系統將不會執行任何外部版本查詢，且您也不會收到任何安全性更新的通知。
clickToDock=點擊以將終端機停靠
terminalStarting=正在等待終端機啟動……
pinTab=「Pin」分頁
unpinTab=取消固定分頁
pinned=已釘選
enableConnectionHubTerminalDocking=將終端視窗停靠至連接樞紐
enableConnectionHubTerminalDockingDescription=您可將終端機視窗停靠至「連線樞紐」中的 XPipe 應用程式視窗，以模擬某種程度的整合式終端機。此後，這些終端機視窗將由 XPipe 進行管理，確保其始終能適配停靠區域。
enableFileBrowserTerminalDocking=啟用檔案瀏覽器視窗的停靠功能
enableFileBrowserTerminalDockingDescription=您可以在檔案瀏覽器中將終端機視窗停靠至 XPipe 應用程式視窗，以模擬某種程度的整合式終端機。此後，這些終端機視窗將由 XPipe 進行管理，確保其始終能適配停靠區域。
downloadsDirectory=自訂下載目錄
downloadsDirectoryDescription=點擊「移至下載」按鈕時，用來存放下載檔案的自訂目錄。預設情況下，XPipe 會使用您的使用者下載目錄。
pinLocalMachineOnStartup=啟動時將「本機」分頁固定
pinLocalMachineOnStartupDescription=自動開啟「本機」分頁並將其釘選。若您經常使用分割式檔案瀏覽器，同時開啟本機與遠端檔案系統，此功能將十分實用。
terminalErrorDescription=此錯誤屬致命錯誤，若不加以修正，XPipe 將無法繼續運作。
