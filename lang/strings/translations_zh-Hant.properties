enableGitStorage=啟用同步功能
gitSync=Git 同步
enableGitStorageDescription=啟用此功能後，XPipe 會為本機金庫初始化一個 Git 儲存庫，並將任何變更提交至該儲存庫。請注意，此功能需要已安裝 Git，且可能會減慢載入與儲存操作的速度。\n\n任何需要同步的分類，都必須明確標記為「已同步」。
storageGitRemote=遠端同步網址
storageGitRemoteDescription=若啟用此設定，XPipe 會在載入時自動拉取任何變更，並在儲存時將任何變更推送至遠端儲存庫。\n\n這讓您能夠在多個 XPipe 安裝環境之間共享您的資料庫。它支援 HTTP 和 SSH URL，以及本機目錄。
vault=金庫
vaultAccess=金庫存取
workspaceLockDescription=設定自訂密碼以加密儲存於 XPipe 中的任何敏感資訊。\n\n此舉能為您儲存的敏感資訊提供額外的加密層，從而提升安全性。此後，當 XPipe 啟動時，系統將提示您輸入該密碼。
useSystemFontDescription=用於控制是否使用系統預設字型，或是 XPipe 內建的 Inter 字型。
