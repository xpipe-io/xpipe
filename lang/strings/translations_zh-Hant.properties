chmodPermissions=新權限
editFilesWithDoubleClick=雙擊編輯檔案
editFilesWithDoubleClickDescription=啟用此功能後，雙擊檔案將直接在您的文字編輯器中開啟該檔案，而非顯示快顯選單。
censorMode=審查模式
censorModeDescription=將主機名稱、使用者名稱、連線名稱等資訊進行模糊處理。\n\n若您打算擷取 XPipe 的螢幕截圖或進行螢幕共享，且不希望洩露任何資訊，此功能將十分實用。
