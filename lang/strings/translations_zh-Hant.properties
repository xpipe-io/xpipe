addMacro=動作 ...
identitiesIntroHeader=關於身分識別
identitiesIntroContent=若您會重複使用常見的用戶名稱、密碼與金鑰組合，建立可重複使用的身分識別或許是個好主意。這樣一來，在新增連線時，您便能快速引用這些身分識別。
identitiesIntroBottomHeader=身分共享
identitiesIntroBottomContent=您可以將身分資訊新增至本機，或在啟用此功能時將其同步至 Git 儲存庫。這讓您能夠有選擇性地在多個系統之間，以及與其他團隊成員共享身分資訊。
