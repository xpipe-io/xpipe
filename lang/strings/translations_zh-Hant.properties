ptbNoticeContent=您目前正在執行 XPipe 的 PTB 版本。此版本不穩定，可能包含錯誤。請勿將其用作日常主要程式。此外，此版本在測試期結束後將不再獲得定期更新。若需此類更新，您必須安裝並執行 XPipe 的正式發行版。
userDeletionTitle=刪除使用者
userDeletionContent=您要刪除此金庫使用者嗎？此操作將使用預設金庫金鑰重新加密所有資料。此過程將耗費一段時間。
roleDeletionTitle=刪除角色
roleDeletionContent=您要刪除此金庫角色嗎？此操作將重新加密所有使用此角色的身分識別與連線密鑰。任何僅限此角色存取的項目，將開放給所有角色存取。此過程將耗費一段時間。
