automaticallyCheckForUpdatesDescription=啟用此功能後，當 XPipe 運行一段時間後，系統會自動擷取最新的版本資訊。但您仍需明確確認是否安裝任何更新。
developerMode=開發者模式
developerModeDescription=啟用此功能後，您將可使用多種有助於開發的額外選項。
editor=編輯器
custom=自訂
passwordManager=密碼管理工具
externalPasswordManager=外部密碼管理工具
passwordManagerDescription=需與之整合的本地安裝型密碼管理工具。\n\n若您已安裝密碼管理工具，可設定 XPipe 從該工具擷取密鑰，如此一來 XPipe 便無需自行管理這些密鑰。
passwordManagerTest=測試密碼管理器
passwordManagerTestDescription=請檢查密碼管理器的整合功能是否運作正常。請務必使用正確的識別碼格式來引用密碼管理器中的條目。
preferTerminalTabs=建議開啟新分頁
preferTerminalTabsDescription=此設定用於控制 XPipe 是否會嘗試在您選定的終端機中開啟新分頁，而非新視窗。並非所有終端機都支援分頁功能。
customRdpClientCommand=自訂指令
customRdpClientCommandDescription=用於啟動自訂 RDP 客戶端的執行指令。\n\n呼叫時，佔位符字串 $FILE 將被帶引號的絕對 .rdp 檔案名稱所取代。若可執行檔路徑中包含空格，請務必為其加上引號。
customEditorCommand=自訂編輯器指令
customEditorCommandDescription=用於啟動自訂編輯器的執行指令。\n\n呼叫時，佔位字串 $FILE 將被引號包圍的絕對檔案名稱所取代。若編輯器可執行檔的路徑中包含空格，請務必將其以引號包圍。
encryptAllVaultData=將所有保險庫資料加密
encryptAllVaultDataDescription=啟用此功能後，金庫連線資料的每個部分都將使用您的使用者金庫加密金鑰進行加密，而非僅加密該資料中的機密資訊。這為使用者名稱、主機名稱等其他參數增添了額外的安全層，這些參數在金庫中預設並未加密。\n\n此選項將使您的 Git 金庫歷史紀錄與差異比較無用，因為您將無法再查看原始變更內容，僅能看到二進位變更。
vaultSecurity=金庫安全性
developerDisableUpdateVersionCheck=停用版本更新檢查
developerDisableUpdateVersionCheckDescription=控制更新檢查程式在搜尋更新時是否會忽略版本號。
shellCommandTest=Shell 指令測試
shellCommandTestDescription=在 XPipe 內部使用的殼層工作階段中執行一項指令。
terminal=終端機
terminalType=終端模擬器
terminalConfiguration=終端機設定
terminalCustomization=終端機自訂設定
editorConfiguration=編輯器設定
defaultApplication=預設應用程式
initialSetup=初始設定
terminalTypeDescription=用於開啟 shell 連線的預設終端機。\n\n各終端機對功能的支持程度不盡相同，每款終端機皆標示為「建議」或「不建議」。使用「建議」的終端機時，您的使用體驗將最佳。
customTerminalCommand=自訂終端機指令
customTerminalCommandDescription=用於以指定指令開啟自訂終端機的執行指令。\n\nXPipe 會為您的終端機建立一個臨時啟動器 shell 腳本以供執行。您提供的指令中，佔位符字串 $CMD 將在呼叫時被實際的啟動器腳本所取代。若終端機可執行檔的路徑中包含空格，請記得將其加上引號。
clearTerminalOnInit=初始化時清除終端機
clearTerminalOnInitDescription=啟用此功能後，XPipe 會在啟動新的終端機工作階段後執行「clear」指令，以清除在啟動終端機工作階段時所產生的任何不必要輸出。
dontCachePasswords=請勿將系統提示的密碼儲存至快取
dontCachePasswordsDescription=此設定用於控制 XPipe 是否應將查詢到的密碼內部快取，以便您在當前工作階段中無需再次輸入。\n\n若此功能已停用，每當系統要求輸入憑證時，您都必須重新輸入系統提示的憑證。
denyTempScriptCreation=拒絕建立臨時腳本
denyTempScriptCreationDescription=為了實現部分功能，XPipe 有時會在目標系統上建立臨時 shell 腳本，以便輕鬆執行簡單的指令。這些腳本不包含任何敏感資訊，純粹是為了實作目的而建立。\n\n若停用此行為，XPipe 將不會在遠端系統上建立任何臨時檔案。此選項在高度安全的環境中特別有用，此類環境會監控每項檔案系統變更。若停用此功能，某些功能（例如 shell 環境和腳本）將無法如預期般運作。
disableCertutilUse=在 Windows 上停用 certutil
useLocalFallbackShell=使用本機備用殼層
useLocalFallbackShellDescription=切換至使用另一個本機殼層來處理本機操作。在 Windows 系統上為 PowerShell，其他系統則為 Bourne 殼層。\n\n若一般本機預設殼層已停用或出現某種程度的故障，即可使用此選項。不過，啟用此選項後，部分功能可能無法如預期般運作。
disableCertutilUseDescription=由於 cmd.exe 存在若干缺陷與錯誤，因此會透過 certutil 建立臨時 shell 腳本，並利用其解碼 base64 輸入，因為 cmd.exe 遇到非 ASCII 輸入時會發生錯誤。XPipe 亦可使用 PowerShell 達成此目的，但速度會較慢。\n\n此設定將停用 Windows 系統上透過 certutil 實現特定功能的任何操作，並改以 PowerShell 作為備用方案。此舉可能會讓部分防毒軟體感到滿意，因為其中有些會封鎖 certutil 的使用。
