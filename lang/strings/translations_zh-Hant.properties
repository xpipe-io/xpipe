dontAutomaticallyStartVmSshServerDescription=任何連接到在虛擬機器管理程式中運行的虛擬機器的 shell 連線，皆透過 SSH 建立。XPipe 可在需要時自動啟動已安裝的 SSH 伺服器。若您基於安全考量不希望如此，則可透過此選項停用此功能。
confirmGitShareTitle=Git 同步
confirmGitShareContent=您要將選定的檔案新增至您的 Git Vault 儲存庫嗎？此操作會將該檔案的加密版本複製到您的 Git Vault 中，並提交您的變更。之後，您將能在所有已同步的桌面電腦上存取該檔案。
gitShareFileTooltip=將檔案新增至 Git Vault 資料目錄，以便自動同步。\n\n此操作僅在設定中啟用 Git Vault 時方可使用。
performanceMode=效能模式
performanceModeDescription=停用所有非必要的視覺效果，以提升應用程式效能。
dontAcceptNewHostKeys=不要自動接受新的 SSH 主機金鑰
dontAcceptNewHostKeysDescription=XPipe 預設會自動接受來自那些您的 SSH 客戶端尚未儲存已知主機金鑰的系統所傳來的主機金鑰。然而，若任何已知主機金鑰已發生變更，除非您接受新的主機金鑰，否則它將拒絕建立連線。\n\n停用此行為可讓您檢查所有主機金鑰，即使最初並無衝突的情況。
uiScale=使用者介面比例
uiScaleDescription=一個可獨立於系統整體顯示比例設定的自訂縮放值。數值以百分比為單位，例如，若設定為 150，則使用者介面比例將為 150%。
