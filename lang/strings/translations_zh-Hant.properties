windowOpacityDescription=調整視窗的透明度，以便掌握背景中的動態。
useSystemFont=使用系統字型
openDataDir=Vault 資料目錄
openDataDirButton=開放資料目錄
openDataDirDescription=若您希望透過 Git 儲存庫在不同系統間同步其他檔案（例如 SSH 金鑰），可將這些檔案放置於儲存資料目錄中。該目錄中引用的任何檔案，其檔案路徑都會在所有同步的系統上自動調整。
