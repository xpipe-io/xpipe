workspaceManagement=管理工作區
workspaceManagementDescription=工作區是執行 XPipe 的獨立配置。每個工作區都有一個資料目錄，所有資料皆儲存於此處，包括連線資料、設定等。\n\n若您使用同步功能，亦可選擇將每個工作區與不同的 Git 儲存庫進行同步。
