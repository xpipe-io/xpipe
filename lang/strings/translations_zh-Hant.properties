fileWriteSudoTitle=Sudo 檔案寫入
fileWriteSudoContent=您嘗試寫入的檔案未授予您的使用者寫入權限。您是否要使用 sudo 以 root 身分寫入此檔案？此操作將自動提升至 root 權限，並使用現有憑證或透過提示視窗進行驗證。
dontAllowTerminalRestart=不允許終端機重新啟動
dontAllowTerminalRestartDescription=預設情況下，終端機工作階段在終端機內部結束後，可重新啟動。為實現此功能，XPipe 會接受來自終端機的這些外部請求，以重新啟動該工作階段\n\n由於 XPipe 無法控制終端機及其呼叫來源，因此惡意的本地應用程式亦可利用此功能透過 XPipe 建立連線。停用此功能可防止此類情況發生。
