showChildrenConnectionsInParentCategory=在父類別中顯示子類別
showChildrenConnectionsInParentCategoryDescription=當選取某個父類別時，是否包含該類別下所有子類別中的連接。\n\n若此功能被停用，類別的運作方式將更接近傳統資料夾，僅顯示其直接內容，而不包含子資料夾。
condenseConnectionDisplay=精簡連線顯示
condenseConnectionDisplayDescription=讓每個頂層連結佔用的垂直空間更少，以便使連結清單更為緊湊。
openConnectionSearchWindowOnConnectionCreation=建立連線時開啟連線搜尋視窗
openConnectionSearchWindowOnConnectionCreationDescription=在新增一個 shell 連線時，是否自動開啟視窗以搜尋可用的子連線。
