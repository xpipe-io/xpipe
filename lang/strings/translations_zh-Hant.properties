teamVaults=團隊保險庫
vaultTypeNameDefault=預設保險庫
vaultTypeNamePersonal=個人保險庫
vaultTypeNameTeam=團隊保險庫
teamVaultsDescription=團隊金庫允許多位使用者和角色安全地存取共用金庫。您可以透過使用各自的金鑰進行加密，將連線和身分設定為供所有使用者共用，或僅供個別使用者和角色使用。 若其他金庫使用者無法取得該金鑰，便無法存取個人及基於角色的連線與身分識別資訊。
vaultTypeContentDefault=您目前正在使用一個預設金庫，尚未設定使用者帳戶及自訂密碼短語。機密資料會使用本機金庫金鑰進行加密。\n\n您可以透過建立金庫使用者帳戶，將其升級為個人金庫。這樣一來，您便能使用自己的個人密碼短語來加密金庫中的機密資料，且每次登入時都必須輸入該密碼短語才能解鎖金庫。
vaultTypeContentPersonal=您目前正在為您的使用者使用一個個人保險庫。機密資訊會使用您的個人密碼短語進行加密。
vaultTypeContentTeam=您目前正在使用團隊金庫，該功能允許多位使用者安全地存取共用金庫。您可以透過使用個人金鑰或角色金鑰進行加密，將連線與身分設定為供所有使用者共用，或僅限您的個人使用者或角色使用。 若其他金庫使用者無法取得該金鑰，便無法存取您的個人及基於角色的連線與身分。
roleManagement=角色管理
roleManagementEmpty=角色管理
roleManagementDescription=管理現有的金庫角色或建立新的角色。每個金庫角色皆擁有專屬的機密金鑰，該金鑰用於加密僅限該角色存取、其他角色不得存取的連線與身分識別資訊。
roleManagementEmptyDescription=管理現有的金庫角色或建立新的角色。每個金庫角色皆擁有專屬的機密金鑰，該金鑰用於加密僅限該角色存取、其他角色不得存取的連線與身分識別資訊。\n\n專業方案支援團隊的基於角色的帳戶。
userManagement=使用者管理
userManagementEmpty=使用者管理
userManagementDescription=管理您現有的金庫使用者，或建立新的金庫使用者。您的金庫使用者擁有專屬的密碼短語，該密碼短語用於加密連線及身分驗證。
userManagementEmptyDescription=管理您現有的金庫使用者，或建立新的使用者。您的金庫使用者擁有專屬的密碼短語，用於加密連線與身分識別。為自己建立一個使用者，以便能使用您的個人金鑰來加密連線與身分識別。
userIntroHeader=使用者管理
userIntroContent=請先為自己建立第一個使用者帳戶，以便開始使用。這樣一來，您就能使用密碼鎖定此工作區。
addReusableIdentity=新增可重複使用的身分識別
