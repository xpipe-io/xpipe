storageGitRemote=Remote sync URL
storageGitRemoteDescription=When set, XPipe will automatically pull any changes when loading and push any changes to the remote repository when saving.\n\nThis allows you to share your vault between multiple XPipe installations. It supports HTTP and SSH URLs, plus local directories.
