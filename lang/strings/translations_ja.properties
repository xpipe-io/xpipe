eulaDescription=XPipeアプリケーションのエンドユーザー使用許諾契約書をお読みください
thirdPartyDescription=サードパーティ製ライブラリのオープンソースライセンスを確認する
enableGitStorage=同期を有効にする
gitSync=Git同期
enableGitStorageDescription=この機能を有効にすると、XPipeはローカルボールト用のGitリポジトリを初期化し、変更内容をそこにコミットする。なお、これにはGitのインストールが必要であり、読み込みや保存の処理が遅くなる可能性があることに注意すること。\n\n同期対象とするカテゴリは、明示的に「同期済み」としてマークする必要がある。
storageGitRemote=リモート同期URL
storageGitRemoteDescription=設定すると、XPipeは読み込み時に変更を自動的に取得し、保存時に変更をリモートリポジトリにプッシュする。\n\nこれにより、複数のXPipeインストール間でVaultを共有できる。HTTPおよびSSH URLに加え、ローカルディレクトリもサポートしている。
vault=Vault
vaultAccess=Vaultへのアクセス
workspaceLockDescription=XPipeに保存されている機密情報を暗号化するために、カスタムパスワードを設定する。\n\nこれにより、保存された機密情報に対して追加の暗号化層が提供されるため、セキュリティが強化される。その後、XPipeの起動時にパスワードの入力を求められる。
useSystemFontDescription=システムの既定のフォントを使用するか、XPipeに同梱されている「Inter」フォントを使用するかを指定する。
windowOptions=ウィンドウのオプション
