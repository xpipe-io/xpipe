identitiesIntroHeader=IDについて
identitiesIntroContent=ユーザー名、パスワード、キーの一般的な組み合わせを再利用する場合は、再利用可能なIDを作成するのが合理的かもしれない。これにより、新しい接続を追加する際に、それらを素早く参照できるようになる。
identitiesIntroBottomHeader=IDの共有
identitiesIntroBottomContent=IDをローカルに追加できるほか、有効化されている場合はGitリポジトリと同期することもできる。これにより、複数のシステム間や他のチームメンバーと、IDを選択的に共有することが可能になる。
identitiesIntroBottomButton=同期の設定
identitiesIntroButton=IDを作成する
userName=ユーザー名
vaultAuth=デフォルトの保管庫の暗号化
userAuth=個人のユーザーパスフレーズ
roleAuth=ロールベースのアクセス制御
team=チーム
