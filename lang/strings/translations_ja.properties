passwordManagerTestDescription=パスワードマネージャーとの連携が正しく機能しているか確認する。パスワードマネージャー内のエントリを参照する際は、正しい識別子形式を使用するように注意する。
preferTerminalTabs=新しいタブで開くことを推奨する
preferTerminalTabsDescription=XPipeが新しいウィンドウではなく、選択したターミナルで新しいタブを開こうとするかどうかを制御する。すべてのターミナルがタブに対応しているわけではない。
customRdpClientCommand=カスタムコマンド
customRdpClientCommandDescription=カスタムRDPクライアントを起動するために実行するコマンド。\n\n呼び出し時に、プレースホルダー文字列 $FILE は、引用符で囲まれた絶対パス形式の .rdp ファイル名に置き換えられる。実行ファイルのパスにスペースが含まれる場合は、必ず引用符で囲むこと。
customEditorCommand=カスタムエディタコマンド
customEditorCommandDescription=カスタムエディタを起動するために実行するコマンド。\n\n呼び出し時に、プレースホルダー文字列 $FILE は引用符で囲まれた絶対ファイル名に置き換えられる。エディタの実行ファイルのパスにスペースが含まれる場合は、必ず引用符で囲むこと。
encryptAllVaultData=保管庫内のすべてのデータを暗号化する
encryptAllVaultDataDescription=有効にすると、Vault接続データのすべての部分が、そのデータ内のシークレットのみではなく、ユーザーのVault暗号化キーで暗号化される。これにより、Vaultではデフォルトで暗号化されないユーザー名やホスト名などのパラメータに対して、セキュリティがさらに強化される。\n\nこのオプションを有効にすると、元の変更内容を確認できなくなり、バイナリ形式の変更のみが表示されるため、Git Vaultの履歴や差分情報は利用できなくなる。
vaultSecurity=Vaultのセキュリティ
developerDisableUpdateVersionCheck=バージョン更新チェックを無効にする
developerDisableUpdateVersionCheckDescription=更新チェッカーが更新を検索する際に、バージョン番号を無視するかどうかを制御する。
shellCommandTest=シェルコマンドのテスト
shellCommandTestDescription=XPipeが内部で使用しているシェルセッションでコマンドを実行する。
terminal=ターミナル
