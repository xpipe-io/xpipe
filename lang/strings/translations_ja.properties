passwordManagerDescription=連携させるローカルにインストールされたパスワードマネージャー。\n\nパスワードマネージャーがインストールされている場合、XPipeがパスワードを独自に管理する必要がないよう、XPipeがそこからパスワードを取得するように設定できる。
