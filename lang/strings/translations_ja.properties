automaticallyCheckForUpdates=更新を確認する
automaticallyCheckForUpdatesDescription=この機能を有効にすると、XPipeの動作中に一定時間が経過した後、新しいリリース情報が自動的に取得される。ただし、アップデートのインストールについては、依然として明示的に確認する必要がある。
developerMode=開発者モード
developerModeDescription=この機能を有効にすると、開発に役立つさまざまな追加オプションを利用できるようになる。
editor=エディタ
