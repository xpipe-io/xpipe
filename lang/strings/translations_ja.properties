dontAutomaticallyStartVmSshServer=必要に応じてVMのSSHサーバーを自動起動しない
dontAutomaticallyStartVmSshServerDescription=ハイパーバイザー上で動作するVMへのシェル接続は、すべてSSHを介して行われる。XPipeは、必要に応じてインストール済みのSSHサーバーを自動的に起動できる。セキュリティ上の理由でこれを望まない場合は、このオプションを使用してこの動作を無効にすればよい。
confirmGitShareTitle=Git同期
confirmGitShareContent=選択したファイルをGit Vaultリポジトリに追加するか？ これにより、ファイルの暗号化されたバージョンがGit Vaultにコピーされ、変更がコミットされる。その後、同期されたすべてのデスクトップでそのファイルにアクセスできるようになる。
gitShareFileTooltip=Git Vaultのデータディレクトリにファイルを追加し、自動的に同期されるようにする。\n\nこの操作は、設定でGit Vaultが有効になっている場合にのみ利用できる。
performanceMode=パフォーマンスモード
performanceModeDescription=アプリケーションのパフォーマンスを向上させるため、不要な視覚効果をすべて無効にする。
dontAcceptNewHostKeys=新しいSSHホストキーを自動的に受け入れない
dontAcceptNewHostKeysDescription=XPipeは、デフォルトでは、SSHクライアントに既知のホストキーが保存されていないシステムからのホストキーを自動的に受け入れる。ただし、既知のホストキーに変更があった場合、新しいキーを受け入れない限り接続を拒否する。\n\nこの動作を無効にすると、初期段階で競合がなくても、すべてのホストキーを確認できるようになる。
uiScale=UIのスケール
uiScaleDescription=システム全体の表示スケールとは独立して設定できる、カスタムスケール値だ。値はパーセント単位で指定されるため、例えば150と設定すると、UIのスケールは150％になる。
editorProgram=エディタプログラム
