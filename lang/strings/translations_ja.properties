defaultApplication=デフォルトのアプリケーション
initialSetup=初期設定
terminalTypeDescription=シェル接続を開く際に使用するデフォルトのターミナルだ。\n\n機能のサポート状況はターミナルによって異なり、それぞれ「推奨」または「非推奨」とマークされている。「推奨」のターミナルを使用すると、最高のユーザー体験が得られる。
customTerminalCommand=カスタム端末コマンド
customTerminalCommandDescription=指定されたコマンドでカスタムターミナルを開くために実行するコマンド。\n\nXPipeは、ターミナルで実行するための一時的なランチャーシェルスクリプトを作成する。指定したコマンド内のプレースホルダー文字列「$CMD」は、呼び出された際に実際のランチャースクリプトに置き換えられる。ターミナルの実行可能ファイルのパスにスペースが含まれる場合は、必ず引用符で囲むこと。
clearTerminalOnInit=初期化時にターミナルをクリアする
clearTerminalOnInitDescription=この機能を有効にすると、XPipeは新しいターミナルセッションが起動された後、clearコマンドを実行し、ターミナルセッションの起動中に表示された不要な出力を削除する。
dontCachePasswords=入力されたパスワードをキャッシュしない
dontCachePasswordsDescription=クエリされたパスワードをXPipeが内部でキャッシュするかどうかを制御する。これにより、現在のセッション内で再度入力する必要がなくなる。\n\nこの動作が無効になっている場合、システムから要求されるたびに、プロンプトが表示された認証情報を再入力する必要がある。
denyTempScriptCreation=一時スクリプトの作成を拒否する
denyTempScriptCreationDescription=XPipeは、一部の機能を実現するために、簡単なコマンドを容易に実行できるよう、ターゲットシステム上に一時的なシェルスクリプトを作成することがある。これらには機密情報は一切含まれておらず、実装上の目的のみで作成されるものである。\n\nこの動作を無効にすると、XPipeはリモートシステム上に一時ファイルを一切作成しなくなる。このオプションは、ファイルシステムの変更がすべて監視されるような高度なセキュリティ環境において有用だ。これを無効にすると、シェル環境やスクリプトなど、一部の機能が意図した通りに動作しなくなる。
disableCertutilUse=Windowsでのcertutilの使用を無効にする
useLocalFallbackShell=ローカルのフォールバックシェルを使用する
useLocalFallbackShellDescription=ローカル操作を処理するために、別のローカルシェルを使用するように切り替える。WindowsではPowerShell、その他のシステムではbourneシェルとなる。\n\nこのオプションは、通常のローカルデフォルトシェルが無効になっている場合や、ある程度機能不全に陥っている場合に利用できる。ただし、このオプションを有効にすると、一部の機能が期待通りに動作しない場合がある。
disableCertutilUseDescription=cmd.exeにはいくつかの欠点やバグがあるため、非ASCII入力でcmd.exeが動作しなくなることを踏まえ、base64入力をデコードするためにcertutilを使用して一時的なシェルスクリプトが生成される。XPipeではPowerShellを使用することも可能だが、その場合は処理速度が低下する。\n\nこれにより、Windowsシステム上で特定の機能を実現するためにcertutilを使用することを一切無効化し、代わりにPowerShellにフォールバックする。一部のアンチウイルスソフトはcertutilの使用をブロックするため、この変更はそうしたソフトの動作に好影響を与える可能性がある。
