teamVaults=チーム用保管庫
vaultTypeNameDefault=デフォルトの保管庫
vaultTypeNamePersonal=パーソナル・ヴォールト
vaultTypeNameTeam=チーム用保管庫
teamVaultsDescription=チームボールトを使用すると、複数のユーザーやロールが共有ボールトに安全にアクセスできる。接続やIDについては、すべてのユーザーで共有するように設定することも、個々のユーザーやロール専用の鍵で暗号化して、特定のユーザーやロールのみが利用できるように設定することもできる。 他のVaultユーザーは、その鍵へのアクセス権がない限り、個人およびロールベースの接続やIDにアクセスすることはできない。
vaultTypeContentDefault=現在、ユーザーやカスタムパスフレーズが設定されていないデフォルトのボールトを使用している。シークレットはローカルボールトキーで暗号化されている。\n\nVaultユーザーアカウントを作成することで、個人用Vaultにアップグレードできる。これにより、Vaultのシークレットを独自のパスフレーズで暗号化できるようになり、Vaultのロックを解除するにはログインのたびにそのパスフレーズを入力する必要がある。
vaultTypeContentPersonal=現在、ユーザー用の個人用保管庫を使用している。機密情報は、個人のパスフレーズで暗号化されている。
vaultTypeContentTeam=現在、チーム用ボールトを使用している。これにより、複数のユーザーが共有ボールトに安全にアクセスできる。接続やIDについては、すべてのユーザーで共有するか、個人キーまたはロールキーで暗号化して、自身のユーザーまたはロールでのみ利用可能にするか、設定できる。 他のVaultユーザーは、その鍵へのアクセス権がない限り、あなたの個人およびロールベースの接続やIDにアクセスすることはできない。
roleManagement=役割管理
roleManagementEmpty=役割管理
roleManagementDescription=既存のVaultロールを管理したり、新しいロールを作成したりする。各Vaultロールには固有の秘密鍵があり、そのロールのみが利用可能で、他のロールには利用できない接続やIDの暗号化に使用される。
roleManagementEmptyDescription=既存のVaultロールを管理したり、新しいロールを作成したりできる。各Vaultロールには固有の秘密鍵があり、そのロールのみが利用可能で、他のロールには利用できない接続やIDの暗号化に使用される。\n\nチーム向けのロールベースのアカウントは、プロフェッショナルプランでサポートされている。
userManagement=ユーザー管理
userManagementEmpty=ユーザー管理
userManagementDescription=既存のVaultユーザーを管理するか、新しいユーザーを作成する。Vaultユーザーには、接続や身元の暗号化に使用される固有のパスフレーズが設定されている。
userManagementEmptyDescription=既存のVaultユーザーを管理するか、新しいユーザーを作成する。Vaultユーザーにはそれぞれ固有のパスフレーズがあり、これを使用して接続やIDを暗号化する。自分のユーザーを作成すれば、個人の鍵を使って接続やIDを暗号化できるようになる。
userIntroHeader=ユーザー管理
userIntroContent=まず、自分用の最初のユーザーアカウントを作成して、使い始めよう。これにより、このワークスペースをパスワードでロックできるようになる。
addReusableIdentity=再利用可能なIDを追加する
users=ユーザー
