addWorkspaceDescription=新しいワークスペース作成ダイアログを開く
workspaceManagement=ワークスペースの管理
workspaceManagementDescription=ワークスペースとは、XPipeを実行するための個別の設定のことだ。各ワークスペースにはデータディレクトリがあり、すべてのデータがローカルに保存される。これには接続データや設定などが含まれる。\n\n同期機能を使用する場合、各ワークスペースを異なるGitリポジトリと同期させることも選択できる。
