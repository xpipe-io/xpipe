developerForceSshTty=SSH TTYを強制する
developerForceSshTtyDescription=すべてのSSH接続でptyを割り当てるようにし、stderrの欠落およびptyのサポート状況をテストする。
developerDisableSshTunnelGateways=SSHゲートウェイトンネリングを無効にする
developerDisableSshTunnelGatewaysDescription=ゲートウェイにはトンネルセッションを使用せず、代わりにシステムに直接接続する。
ttyWarning=この接続はpty/ttyを強制的に割り当てており、個別のstderrストリームを提供していない。\n\nこれにより、いくつかの問題が生じる可能性がある。\n\n可能であれば、接続コマンドがptyを割り当てないようにする方法を検討してほしい。
