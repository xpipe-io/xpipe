rdpClientDescription=RDP接続を確立する際に呼び出すRDPクライアントプログラム。\n\nクライアントによって機能や統合の程度が異なる点に注意が必要だ。一部のクライアントはパスワードの自動入力に対応していないため、起動時に手動で入力する必要がある。
