openDataDir=Vaultデータディレクトリ
openDataDirButton=データディレクトリを開く
openDataDirDescription=SSHキーなどの追加ファイルを、Gitリポジトリを介してシステム間で同期したい場合は、それらをストレージデータディレクトリに配置すればよい。そこに参照されているファイルは、同期されたどのシステムにおいても、ファイルパスが自動的に調整される。
