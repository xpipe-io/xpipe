rdpWindowsSecurityWarningDialogContent=Windows ビルド 26200 以降、Windows では、内容にかかわらず、署名のない RDP ファイルが起動されると、常に警告が表示されるようになった。\n\nこの警告は、設定メニューで無効にすることができる。
