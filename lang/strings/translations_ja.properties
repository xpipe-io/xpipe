userDeletionTitle=ユーザーの削除
userDeletionContent=このVaultユーザーを削除してもよいか？ これにより、すべてのデータがデフォルトのVaultキーを使用して再暗号化される。これにはしばらく時間がかかる。
roleDeletionTitle=ロールの削除
roleDeletionContent=このVaultロールを削除してもよいか。これにより、このロールを使用しているすべてのIDおよび接続シークレットが再暗号化される。このロールのみがアクセス可能なエントリは、すべてのロールからアクセス可能になる。この処理には時間がかかる。
