asktextAlertTitle=プロンプト
fileWriteSudoTitle=Sudoによるファイル書き込み
fileWriteSudoContent=書き込もうとしているファイルには、現在のユーザーに書き込み権限がない。sudo を使って root としてこのファイルに書き込むか？ これにより、既存の認証情報またはプロンプトを通じて、自動的に root 権限が昇格される。
dontAllowTerminalRestart=端末の再起動を許可しない
dontAllowTerminalRestartDescription=デフォルトでは、ターミナルセッションは、ターミナル内から終了した後でも再起動できる。これを可能にするため、XPipeはターミナルからの外部リクエストを受け入れ、セッションを再起動する\n\nXPipeはターミナルやこの呼び出しの送信元を制御できないため、悪意のあるローカルアプリケーションもこの機能を利用して、XPipe経由で接続を確立することが可能だ。この機能を無効にすることで、このような事態を防ぐことができる。
openDocumentation=ドキュメントを開く
openDocumentationDescription=この問題については、XPipeのドキュメントページを参照のこと
renameAll=すべてを名前変更する
logging=ロギング
enableTerminalLogging=ターミナルログを有効にする
enableTerminalLoggingDescription=すべてのターミナルセッションについて、クライアント側のログ記録を有効にする。ターミナルセッションのすべての入出力は、セッションログファイルに書き込まれる。なお、パスワードの入力要求などの機密情報は記録されない点に注意すること。
terminalLoggingDirectory=端末セッションのログ
terminalLoggingDirectoryDescription=すべてのログは、ローカルシステムのXPipeデータディレクトリに保存される。
openSessionLogs=セッションログを開く
sessionLogging=端末のログ記録
sessionActive=この接続に対して、バックグラウンドセッションが実行されている。\n\nこのセッションを手動で停止するには、ステータスインジケータをクリックする。
skipValidation=検証をスキップする
scriptsIntroHeader=スクリプトについて
scriptsIntroContent=スクリプトは、シェル起動時、ファイルブラウザ内、およびオンデマンドで実行できる。XPipe内で自分でスクリプトを作成したり、ローカルシステムやリモートのGitリポジトリから既存のスクリプトをインポートしたりできる。
scriptsIntroBottomHeader=スクリプトの使用
scriptsIntroBottomContent=最初に試せるサンプルスクリプトが多数用意されている。個々のスクリプトの編集ボタンをクリックすると、その実装内容を確認できる。スクリプトを実行したりメニューに表示させたりするには、まず有効にする必要があり、各スクリプトにはそのための切り替えスイッチがある。
scriptsIntroBottomButton=はじめに
scriptSourcesIntroHeader=スクリプトのソースコード
scriptSourcesIntroContent=カスタムスクリプトソースを追加することで、シェルスクリプトのコレクション全体に即座にアクセスできるようになる。ソースとしては、ローカルソースとリモートのGitリポジトリの両方がサポートされている。ソースから検出されたすべてのスクリプトは、自動的に利用可能になる。
scriptSourcesIntroButton=ソースを追加...
checkForSecurityUpdates=セキュリティ更新プログラムを確認する
checkForSecurityUpdatesDescription=XPipeは、通常の機能更新とは別に、セキュリティ更新の可能性を確認できる。これを有効にすると、通常の更新チェックが無効になっていても、少なくとも重要なセキュリティ更新についてはインストールが推奨される。\n\nこの設定を無効にすると、外部へのバージョン確認が行われなくなり、セキュリティ更新に関する通知も表示されなくなる。
clickToDock=クリックしてターミナルをドッキングする
terminalStarting=端末の起動を待機中……
pinTab=「Pin」タブ
unpinTab=タブの固定を解除
pinned=固定済み
enableConnectionHubTerminalDocking=ターミナルウィンドウを接続ハブにドッキングする
enableConnectionHubTerminalDockingDescription=接続ハブ内のXPipeアプリケーションウィンドウにターミナルウィンドウをドッキングすることで、ある程度統合されたターミナルをシミュレートできる。ドッキングされたターミナルウィンドウはXPipeによって管理され、常にドッキング領域に収まるよう調整される。
enableFileBrowserTerminalDocking=ファイルブラウザのターミナルドッキングを有効にする
enableFileBrowserTerminalDockingDescription=ファイルブラウザ内のXPipeアプリケーションウィンドウにターミナルウィンドウをドッキングすることで、ある程度統合されたターミナルをシミュレートできる。ドッキングされたターミナルウィンドウは、常にドック内に収まるようXPipeによって管理される。
downloadsDirectory=カスタムダウンロードディレクトリ
downloadsDirectoryDescription=「ダウンロードへ移動」ボタンをクリックした際に、ダウンロードしたファイルを保存するカスタムディレクトリだ。デフォルトでは、XPipeはユーザーのダウンロードディレクトリを使用する。
pinLocalMachineOnStartup=起動時に「ローカルマシン」タブを固定する
pinLocalMachineOnStartupDescription=ローカルマシンのタブを自動的に開き、固定する。これは、ローカルマシンとリモートファイルシステムを開いた状態で、分割ファイルブラウザを頻繁に利用する場合に便利だ。
terminalErrorDescription=このエラーは致命的なものであり、修正しない限りXPipeは処理を続行できない。
groupName=グループ名
chmodPermissions=新しい権限
editFilesWithDoubleClick=ダブルクリックでファイルを編集する
editFilesWithDoubleClickDescription=この機能を有効にすると、ファイルをダブルクリックした際にコンテキストメニューが表示される代わりに、そのままテキストエディタでファイルが開かれる。
censorMode=検閲モード
censorModeDescription=ホスト名、ユーザー名、接続名などの情報をすべてぼかす。\n\nこれは、XPipeのスクリーンショットや画面共有を行う際、情報を漏らしたくない場合に役立つ。
