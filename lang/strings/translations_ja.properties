confirmVaultUnencryptContent=高度な保管庫の暗号化を本当に無効にするのか。これにより、保存データの追加暗号化が解除され、既存のデータが上書きされる。
enableHttpApi=HTTP APIを有効にする
enableHttpApiDescription=このAPIを有効にすると、外部プログラムがXPipeデーモンを呼び出し、管理対象の接続に対して操作を実行できるようになる。
chooseCustomIcon=カスタムアイコンを選択する
gitVault=Git Vault
fileBrowser=ファイルブラウザ
confirmAllDeletions=すべての削除を確認する
confirmAllDeletionsDescription=すべての削除操作に対して確認ダイアログを表示するかどうか。デフォルトでは、ディレクトリの削除のみ確認が必要となる。
yesterday=昨日
