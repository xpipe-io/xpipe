sftpNoticeContent=Файлы, которые ты пытаешься передать, довольно большие. Текущий сеанс работает по протоколу SSH без шифрования, что не обеспечивает максимальную скорость передачи данных. Если тебе нужно увеличить скорость передачи, попробуй открыть сеанс SFTP с системой через контекстное меню в файловом браузере.
hideVaultEntryNames=Скрыть названия записей в Git Vault
hideVaultEntryNamesDescription=Удаляет все имена подключений и прочую информацию из файлов README и сообщений о фиксации, когда включена синхронизация git. Эта опция не даёт возможности понять структуру содержимого зашифрованного хранилища.
disableHardwareAcceleration=Отключить аппаратное ускорение
disableHardwareAccelerationDescription=Отключает использование видеокарты для рендеринга и использует только программный конвейер рендеринга.\n\nЭто приводит к значительному снижению производительности, но может быть единственным способом рендеринга, если возникают проблемы с драйвером видеокарты.
disableRdpWindowsSecurityWarning=Отключить предупреждение о безопасности RDP
disableRdpWindowsSecurityWarningDescription=Не показывать новое предупреждение Windows о неподписанных файлах .rdp при каждом запуске новой сессии.\n\nЭто изменит ключ реестра, чтобы вернуть клиент RDP Windows к прежнему поведению. При этом появится всплывающее окно с запросом на повышение прав администратора.
rdpWindowsSecurityWarningDialogTitle=Предупреждения о безопасности RDP
rdpWindowsSecurityWarningDialogContent=Начиная со сборки Windows 26200, Windows теперь всегда будет показывать предупреждение при запуске неподписанного RDP-файла, независимо от его содержимого.\n\nТы можешь отключить это предупреждение в меню настроек.
