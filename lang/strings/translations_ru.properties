vaultTypeNamePersonal=Личное хранилище
vaultTypeNameTeam=Командное хранилище
teamVaultsDescription=Командные хранилища позволяют нескольким пользователям и ролям получать безопасный доступ к общему хранилищу. Ты можешь настроить подключения и идентификаторы так, чтобы они были общими для всех пользователей или доступны только отдельным пользователям и ролям, зашифровав их собственным ключом. Другие пользователи хранилища не смогут получить доступ к личным и ролевым подключениям и идентификаторам, если у них нет доступа к ключу.
vaultTypeContentDefault=Сейчас ты используешь хранилище по умолчанию, в котором не задан ни пользователь, ни собственная парольная фраза. Секреты шифруются с помощью ключа локального хранилища.\n\nТы можешь перейти на личное хранилище, создав учетную запись пользователя хранилища. Это позволит тебе шифровать секреты хранилища с помощью своей личной парольной фразы, которую нужно вводить при каждом входе в систему, чтобы разблокировать хранилище.
vaultTypeContentPersonal=Сейчас ты используешь личный хранилище для своего пользователя. Секретные данные зашифрованы твоей личной парольной фразой.
vaultTypeContentTeam=Сейчас ты используешь командное хранилище, которое позволяет нескольким пользователям безопасно получать доступ к общему хранилищу. Ты можешь настроить подключения и идентификаторы так, чтобы они были общими для всех пользователей или доступны только тебе лично или твоей роли, зашифровав их своим личным ключом или ключом роли. Другие пользователи хранилища не смогут получить доступ к твоим личным и ролевым подключениям и идентификаторам, если у них нет доступа к ключу.
roleManagement=Управление ролями
roleManagementEmpty=Управление ролями
roleManagementDescription=Управляй существующими ролями хранилища или создавай новые. У каждой роли хранилища есть свой индивидуальный секретный ключ, который используется для шифрования соединений и идентификационных данных, доступ к которым должен быть только у этой роли, а не у других.
roleManagementEmptyDescription=Управляй существующими ролями хранилища или создавай новые. У каждой роли хранилища есть свой индивидуальный секретный ключ, который используется для шифрования соединений и идентификационных данных, доступных только этой роли, а не другим.\n\nУчётки на основе ролей для команды поддерживаются в профессиональном тарифе.
userManagement=Управление пользователями
userManagementEmpty=Управление пользователями
userManagementDescription=Управляй существующим пользователем хранилища или создай нового. У каждого пользователя хранилища есть своя индивидуальная парольная фраза, которая используется для шифрования соединений и идентификации.
userManagementEmptyDescription=Управляй существующим пользователем хранилища или создай нового. У каждого пользователя хранилища есть своя индивидуальная парольная фраза, которая используется для шифрования соединений и идентификационных данных. Создай себе пользователя, чтобы иметь возможность шифровать соединения и идентификационные данные с помощью своего личного ключа.
userIntroHeader=Управление пользователями
userIntroContent=Чтобы начать работу, создай для себя первую учетную запись. Это позволит тебе заблокировать эту рабочую область с помощью пароля.
