all=Все
terminalPrompt=Приглашение терминала
terminalPromptDescription=Инструмент для настройки командной строки терминала, который можно использовать на удаленных терминалах. Если включить командную строку терминала, инструмент для её настройки будет автоматически установлен и настроен на целевой системе при открытии сеанса терминала.\n\nЭто не изменит никаких существующих настроек командной строки или файлов профилей в системе. При первом запуске терминала время загрузки увеличится, пока командная строка будет настраиваться на удалённой системе. Для правильного отображения командной строки твоему терминалу могут понадобиться дополнительные шрифты.
terminalPromptConfiguration=Настройка командной строки терминала
terminalPromptConfig=Файл настроек
terminalPromptConfigDescription=Пользовательский файл настроек, который будет применяться к командной строке. Эта конфигурация будет автоматически установлена на целевой системе при инициализации терминала и будет использоваться в качестве конфигурации командной строки по умолчанию.\n\nЕсли ты хочешь использовать существующий файл настроек по умолчанию на каждой системе, можешь оставить это поле пустым.
