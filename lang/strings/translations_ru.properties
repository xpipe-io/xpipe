touchNoticeTitle=Подтвердить присутствие пользователя
touchNoticeContent=Твой ключ безопасности просит тебя подтвердить своё присутствие, например, прикоснувшись к нему. Когда это потребуется в будущем, в правом нижнем углу появится индикатор отпечатка пальца.
