manageWorkspaces=Управление рабочими пространствами
addWorkspace=Добавить рабочую область...
addWorkspaceDescription=Открой диалоговое окно создания новой рабочей области
workspaceManagement=Управление рабочими пространствами
workspaceManagementDescription=Рабочие пространства — это отдельные конфигурации для запуска XPipe. У каждого рабочего пространства есть каталог данных, в котором все данные хранятся локально. Сюда входят данные о подключениях, настройки и многое другое.\n\nЕсли ты используешь функцию синхронизации, ты также можешь настроить синхронизацию каждого рабочего пространства с отдельным репозиторием Git.
workspaceName=Название рабочей области
workspaceNameDescription=Отображаемое имя рабочей области
workspacePath=Путь к рабочей области
workspacePathDescription=Расположение каталога данных рабочей области
workspaceCreationAlertTitle=Создание рабочей области
developerForceSshTty=Принудительное использование SSH TTY
developerForceSshTtyDescription=Заставь все SSH-соединения выделять pty, чтобы проверить поддержку отсутствующего stderr и pty.
developerDisableSshTunnelGateways=Отключить туннелирование через SSH-шлюз
developerDisableSshTunnelGatewaysDescription=Не используй туннельные сессии для шлюзов, а подключайся напрямую к системе.
ttyWarning=Соединение принудительно выделило pty/tty и не предоставляет отдельного потока stderr.\n\nЭто может привести к некоторым проблемам.\n\nЕсли есть возможность, попробуй настроить команду соединения так, чтобы она не выделяла pty.
xshellSetup=Настройка Xshell
#custom
termiusSetup=Настройка Termius
tryPtbDescription=Попробуй новые функции на ранних этапах в разработческих сборках XPipe
#custom
confirmVaultUnencryptTitle=Подтверждение не зашифрованного хранилища
confirmVaultUnencryptContent=Ты действительно хочешь отключить расширенное шифрование хранилища? Это приведёт к отключению дополнительного шифрования сохраненных данных и перезаписыванию существующих данных.
enableHttpApi=Включить HTTP API
enableHttpApiDescription=Включает API, позволяя внешним программам вызывать демон XPipe для выполнения действий с твоими управляемыми соединениями.
chooseCustomIcon=Выбери собственную иконку
gitVault=Git vault
fileBrowser=Обзор файлов
#custom
confirmAllDeletions=Подтверждение для удаления
confirmAllDeletionsDescription=Отображать ли диалоговое окно подтверждения для всех операций удаления. По умолчанию подтверждение требуется только для каталогов.
yesterday=Вчера
green=Зелёный
yellow=Жёлтый
blue=Синий
red=Красный
cyan=Голубой
purple=Фиолетовый
asktextAlertTitle=Запрос
fileWriteSudoTitle=Запись в файл с помощью sudo
fileWriteSudoContent=У тебя нет прав на запись в файл, который ты пытаешься сохранить. Хочешь записать этот файл от имени root с помощью sudo? При этом автоматически будет выполнен переход к правам root либо с использованием существующих учетных данных, либо через запрос в командной строке.
dontAllowTerminalRestart=Не разрешать перезапуск терминала
dontAllowTerminalRestartDescription=По умолчанию сеансы терминала можно перезапустить после их завершения прямо из терминала. Чтобы это было возможно, XPipe будет принимать такие внешние запросы от терминала на повторный запуск сеанса\n\nXPipe не контролирует терминал и не знает, откуда приходит этот вызов, поэтому вредоносные локальные приложения тоже могут использовать эту функцию для установки соединений через XPipe. Отключение этой функции предотвращает такой сценарий.
#custom
openDocumentation=Открыть документацию
openDocumentationDescription=Загляни на страницу документации XPipe, чтобы узнать больше об этой проблеме
renameAll=Переименовать всё
logging=Ведение журнала
enableTerminalLogging=Включить ведение журнала терминала
enableTerminalLoggingDescription=Включает ведение журнала на стороне клиента для всех сеансов терминала. Все входящие и исходящие данные сеанса терминала записываются в файл журнала сеанса. Обрати внимание, что конфиденциальная информация, такая как запросы паролей, не записывается.
terminalLoggingDirectory=Журналы сеансов терминала
terminalLoggingDirectoryDescription=Все журналы хранятся в каталоге данных XPipe на твоей локальной системе.
openSessionLogs=Открыть журналы сеансов
sessionLogging=Ведение журнала терминала
sessionActive=Для этого соединения запущен фоновый сеанс.\n\nЧтобы вручную завершить этот сеанс, нажми на индикатор состояния.
#custom
skipValidation=Пропустить проверку
scriptsIntroHeader=О скриптах
scriptsIntroContent=Ты можешь запускать скрипты при запуске оболочки, в файловом браузере и по запросу. Ты можешь создавать скрипты самостоятельно в XPipe или импортировать уже готовые из своей локальной системы или из удалённого репозитория Git.
scriptsIntroBottomHeader=Использование скриптов
scriptsIntroBottomContent=Здесь есть множество примеров скриптов, с которых можно начать. Можешь нажать на кнопку «Редактировать» у каждого скрипта, чтобы посмотреть, как он реализован. Чтобы скрипты запускались и отображались в меню, их сначала нужно включить — для этого у каждого скрипта есть соответствующий переключатель.
scriptsIntroBottomButton=Начало работы
scriptSourcesIntroHeader=Исходные коды скриптов
scriptSourcesIntroContent=Ты можешь добавлять собственные источники скриптов, чтобы получить мгновенный доступ ко всей коллекции скриптов оболочки. В качестве источников поддерживаются как локальные папки, так и удалённые репозитории Git. Все обнаруженные скрипты из источника станут доступны автоматически.
scriptSourcesIntroButton=Добавить исходный код...
checkForSecurityUpdates=Проверить наличие обновлений безопасности
checkForSecurityUpdatesDescription=XPipe может проверять наличие потенциальных обновлений безопасности отдельно от обычных обновлений функций. Если эта функция включена, тебе будут предлагать установить как минимум важные обновления безопасности, даже если обычная проверка обновлений отключена.\n\nЕсли отключить этот параметр, запрос внешней версии не будет выполняться, и ты не будешь получать уведомления о каких-либо обновлениях безопасности.
clickToDock=Нажми, чтобы прикрепить терминал
terminalStarting=Ожидание запуска терминала...
#custom
pinTab=Закрепить вкладку
unpinTab=Открепить вкладку
#custom
pinned=Закреплена
enableConnectionHubTerminalDocking=Привязать окно терминала к концентратору подключений
enableConnectionHubTerminalDockingDescription=Ты можешь прикрепить окна терминала к окну приложения XPipe в центре подключений, чтобы имитировать нечто вроде интегрированного терминала. После этого XPipe будет управлять окнами терминала так, чтобы они всегда помещались в док.
enableFileBrowserTerminalDocking=Включить привязку терминала файлового браузера
enableFileBrowserTerminalDockingDescription=Ты можешь прикрепить окна терминала к окну приложения XPipe в файловом браузере, чтобы имитировать нечто вроде интегрированного терминала. После этого XPipe будет управлять окнами терминала так, чтобы они всегда помещались в док.
downloadsDirectory=Пользовательский каталог для загрузок
downloadsDirectoryDescription=Пользовательский каталог, в который будут сохраняться скачанные файлы при нажатии кнопки «Переместить в папку «Загрузки»». По умолчанию XPipe будет использовать твою пользовательскую папку «Загрузки».
pinLocalMachineOnStartup=Закрепить вкладку «Локальный компьютер» при запуске
pinLocalMachineOnStartupDescription=Автоматически открывай вкладку «Локальный компьютер» и закрепляй её. Это пригодится, если ты часто используешь разделённый файловый браузер с открытыми локальным компьютером и удалённой файловой системой.
terminalErrorDescription=Эта ошибка критическая, и XPipe не сможет продолжить работу, пока её не устранят.
groupName=Название группы
chmodPermissions=Новые права доступа
editFilesWithDoubleClick=Редактируй файлы двойным щелчком
editFilesWithDoubleClickDescription=Если эта функция включена, при двойном щелчке по файлам они сразу откроются в твоём текстовом редакторе, а не появится контекстное меню.
censorMode=Режим цензуры
censorModeDescription=Затуманивает любую информацию, такую как имена хостов, имена пользователей, названия подключений и т. д.\n\nЭто пригодится, если ты собираешься сделать скриншот или поделиться экраном XPipe и не хочешь раскрыть какую-либо информацию.
addIdentity=Идентификатор ...
