gpgSyncDialogTitle=Синхронизация с GPG
gpgSyncDialogContent=У тебя включена подпись GPG для git. Это замедлит синхронизацию, поэтому синхронизация крупных изменений может занять немного больше времени, чем обычно.
downloadDialogTitle=Загрузка завершена
downloadDialogContent=Файлы уже скачаны на твой компьютер. Теперь ты можешь перетащить их из панели загрузок в левом нижнем углу в свою рабочую среду и приложения.
syncInProgressTitle=Идет синхронизация
syncInProgressContent=Сейчас твои изменения сохраняются и синхронизируются. Как только операция завершится, ты должен увидеть изменения на удаленном устройстве.
