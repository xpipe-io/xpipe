httpProxy=HTTP-прокси
httpProxyDescription=Прокси, который будет использоваться для всех HTTP-запросов, отправляемых XPipe и другими внешними инструментами.\n\nЕсли прокси расшифровывает TLS-трафик, после установления соединения тебе будет предложено добавить пользовательские сертификаты во внутреннее хранилище сертификатов XPipe. Чтобы проверить подключение, нажми кнопку «Тест».
