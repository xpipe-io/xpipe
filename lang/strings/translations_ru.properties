terminalMultiplexer=Терминальный мультиплексор
terminalMultiplexerDescription=Терминальный мультиплексор, который можно использовать вместо вкладок в терминале. Он заменит некоторые функции терминала, например работу с вкладками, на возможности мультиплексора.\n\nДля этого нужно, чтобы в системе был установлен соответствующий исполняемый файл мультиплексора.
terminalMultiplexerWindowsDescription=Терминальный мультиплексор, который можно использовать вместо вкладок в терминале. Он заменит некоторые функции терминала, например работу с вкладками, на возможности мультиплексора.\n\nТребуется использовать терминальную среду WSL в Windows, а также установить исполняемый файл мультиплексора в системе WSL.
terminalAlwaysPauseOnExit=Всегда делать паузу при выходе
terminalAlwaysPauseOnExitDescription=Если эта опция включена, при выходе из сеанса терминала тебе всегда будет предложено либо перезапустить сеанс, либо закрыть его. Если она отключена, XPipe будет предлагать это только в случае сбоев подключения, при которых сеанс завершается с ошибкой.
