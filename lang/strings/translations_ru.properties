passwordManagerDescription=Местный менеджер паролей, с которым нужно интегрироваться.\n\nЕсли у тебя установлен менеджер паролей, ты можешь настроить XPipe так, чтобы он получал секретные данные из него, и тогда XPipe не придётся самому управлять этими данными.
passwordManagerTest=Тестовый менеджер паролей
passwordManagerTestDescription=Проверь, правильно ли работает интеграция с менеджером паролей. Убедись, что используешь правильный формат идентификатора для ссылки на запись в менеджере паролей.
preferTerminalTabs=Лучше открывать новые вкладки
preferTerminalTabsDescription=Определяет, будет ли XPipe пытаться открывать новые вкладки в выбранном тобой терминале вместо новых окон. Не все терминалы поддерживают вкладки.
customRdpClientCommand=Пользовательская команда
customRdpClientCommandDescription=Команда, которую нужно выполнить, чтобы запустить пользовательский RDP-клиент.\n\nСтрока-заполнитель $FILE при вызове будет заменена на абсолютное имя файла .rdp в кавычках. Не забудь взять путь к исполняемому файлу в кавычки, если он содержит пробелы.
customEditorCommand=Пользовательская команда редактора
customEditorCommandDescription=Команда, которую нужно выполнить, чтобы запустить пользовательский редактор.\n\nСтрока-заполнитель $FILE при вызове будет заменена абсолютным именем файла в кавычках. Не забудь заключить путь к исполняемому файлу редактора в кавычки, если он содержит пробелы.
encryptAllVaultData=Зашифруй все данные хранилища
encryptAllVaultDataDescription=Если эта опция включена, все данные подключения к хранилищу будут шифроваться твоим пользовательским ключом шифрования хранилища, а не только секретные данные внутри этих данных. Это добавляет ещё один уровень безопасности для других параметров, таких как имена пользователей, имена хостов и т. д., которые по умолчанию не шифруются в хранилище.\n\nЭта опция сделает твою историю и сравнения git-хранилища бесполезными, так как ты больше не сможешь видеть исходные изменения, а только бинарные.
vaultSecurity=Безопасность хранилища
developerDisableUpdateVersionCheck=Отключить проверку версии обновлений
developerDisableUpdateVersionCheckDescription=Определяет, будет ли программа проверки обновлений игнорировать номер версии при поиске обновлений.
shellCommandTest=Тест команд оболочки
shellCommandTestDescription=Запустить команду в сеансе командной строки, который XPipe использует внутренне.
terminal=Терминал
terminalType=Эмулятор терминала
terminalConfiguration=Настройка терминала
terminalCustomization=Настройка терминала
editorConfiguration=Настройки редактора
defaultApplication=Приложение по умолчанию
initialSetup=Первоначальная настройка
terminalTypeDescription=Терминал по умолчанию, который используется для открытия подключений к оболочке.\n\nУровень поддержки функций зависит от терминала, и каждый из них помечен как «рекомендуемый» или «не рекомендуемый». Лучший пользовательский опыт ты получишь, если будешь использовать рекомендуемый терминал.
customTerminalCommand=Пользовательская команда терминала
customTerminalCommandDescription=Команда, которую нужно выполнить, чтобы открыть пользовательский терминал с заданной командой.\n\nXPipe создаст временный скрипт-запуска для выполнения в твоём терминале. Строка-заполнитель $CMD в указанной тобой команде будет заменена на фактический скрипт-запуска при вызове. Не забудь взять путь к исполняемому файлу терминала в кавычки, если он содержит пробелы.
clearTerminalOnInit=Очистить терминал при запуске
clearTerminalOnInitDescription=Если эта опция включена, XPipe запустит команду очистки после запуска нового сеанса терминала, чтобы удалить весь ненужный вывод, который появился при запуске сеанса.
dontCachePasswords=Не сохраняй в кэше пароли, введенные по запросу
dontCachePasswordsDescription=Определяет, следует ли XPipe сохранять запрошенные пароли во внутреннем кэше, чтобы тебе не пришлось вводить их заново в текущем сеансе.\n\nЕсли эта функция отключена, тебе придётся вводить все запрошенные учетные данные заново каждый раз, когда система их потребует.
denyTempScriptCreation=Запретить создание временных скриптов
denyTempScriptCreationDescription=Чтобы реализовать некоторые свои функции, XPipe иногда создаёт временные скрипты оболочки на целевой системе, чтобы можно было легко выполнять простые команды. Они не содержат никакой конфиденциальной информации и создаются исключительно для целей реализации.\n\nЕсли эту функцию отключить, XPipe не будет создавать никаких временных файлов на удалённой системе. Эта опция пригодится в условиях повышенной безопасности, где отслеживается каждое изменение в файловой системе. Если её отключить, некоторые функции, например, среды оболочки и скрипты, не будут работать как положено.
disableCertutilUse=Отключи использование certutil в Windows
useLocalFallbackShell=Использовать локальную резервную оболочку
useLocalFallbackShellDescription=Переключись на использование другой локальной оболочки для выполнения локальных операций. В Windows это будет PowerShell, а в других системах — оболочка Bourne.\n\nЭту опцию можно использовать, если обычная локальная оболочка по умолчанию отключена или работает с перебоями. Однако при включении этой опции некоторые функции могут работать не так, как ожидается.
disableCertutilUseDescription=Из-за ряда недостатков и ошибок в cmd.exe временные скрипты оболочки создаются с помощью certutil, который используется для декодирования входных данных в формате base64, так как cmd.exe вылетает при обработке не-ASCII-данных. XPipe также может использовать для этого PowerShell, но это будет работать медленнее.\n\nЭто отключает любое использование certutil в системах Windows для реализации определённых функций и вместо этого переключается на PowerShell. Это может порадовать некоторые антивирусы, так как некоторые из них блокируют использование certutil.
