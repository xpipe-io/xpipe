browseCertificateStoreDescription=Открой каталог хранилища сертификатов, чтобы управлять принятыми пользовательскими сертификатами TLS в формате .pem. Сертификаты добавляются автоматически при необходимости и подтверждаются пользователем, поэтому тебе не нужно добавлять их сюда вручную.
