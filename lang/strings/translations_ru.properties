addMacro=Действие...
identitiesIntroHeader=Об идентификаторах
identitiesIntroContent=Если ты повторно используешь типичные комбинации имён пользователей, паролей и ключей, может быть полезно создать многоразовые идентификаторы. Это позволит тебе быстро находить их при добавлении новых подключений.
identitiesIntroBottomHeader=Совместное использование идентификаторов
identitiesIntroBottomContent=Ты можешь добавлять идентификаторы локально или синхронизировать их с репозиторием Git, если эта функция включена. Это позволяет выборочно делиться идентификаторами между несколькими системами и с другими членами команды.
