vaultMigratedContent=Твой хранилище было перенесено. Имей в виду, что при переносе были удалены все пользователи и группы хранилища, поэтому тебе придётся заново создать их в меню настроек.
vaultMigratedGitContent=Твой хранилище было перенесено. Обрати внимание, что при переносе были удалены все пользователи и группы хранилища, поэтому тебе придётся заново создать их в меню настроек.\n\nКак только ты это сделаешь, ты также сможешь снова включить синхронизацию через Git.
