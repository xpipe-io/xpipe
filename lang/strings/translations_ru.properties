showChildrenConnectionsInParentCategory=Показывать дочерние категории в родительской категории
showChildrenConnectionsInParentCategoryDescription=Включать ли все подключения, расположенные в подкатегориях, при выборе определённой родительской категории.\n\nЕсли эта опция отключена, категории ведут себя скорее как классические папки, которые показывают только своё непосредственное содержимое, не включая подпапки.
