passwordManagerMappingDescription=Данные в формате JSON могут хранить любые записи типа «ключ-значение», поэтому тебе нужно определить сопоставление, по которому XPipe сможет находить отдельные записи, такие как имя пользователя, пароль и SSH-ключи. При необходимости сопоставление по умолчанию можно переопределить для отдельных учетных записей.
