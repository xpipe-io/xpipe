terminalEnvironment=Терминальная среда
terminalEnvironmentDescription=Если ты хочешь использовать возможности локальной среды WSL на базе Linux для настройки терминала, можешь использовать её в качестве терминальной среды.\n\nВ этом случае все твои пользовательские команды инициализации терминала и настройки мультиплексора терминалов будут запускаться в этом дистрибутиве WSL.
