disableApiAuthentication=Отключить аутентификацию по API
disableApiAuthenticationDescription=Отключает все обязательные методы аутентификации, чтобы обрабатывались любые неаутентифицированные запросы.\n\nАутентификацию следует отключать только для целей разработки.
api=API
storeIntroImportContent=Уже используешь XPipe на другой системе? Синхронизируй свои существующие подключения между несколькими системами через удалённый репозиторий Git. Если это ещё не настроено, ты всегда сможешь синхронизировать позже.
storeIntroImportButton=Синхронизация подключений...
storeIntroImportHeader=Импорт подключений
showNonRunningChildren=Показать неработающие системы
httpApi=HTTP API
isOnlySupportedLimit=поддерживается только при наличии профессиональной лицензии, если количество подключений превышает $COUNT$
areOnlySupportedLimit=поддерживается только при наличии профессиональной лицензии, если количество подключений превышает $COUNT$
