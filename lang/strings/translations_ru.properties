backgroundSessionInactivityTimeout=Таймаут бездействия фонового процесса оболочки
backgroundSessionInactivityTimeoutDescription=Количество секунд, по истечении которых будут закрыты фоновые сеансы оболочки, если они не использовались.\n\nПо умолчанию XPipe оставляет соединения оболочки с удалёнными системами открытыми в фоновом режиме, чтобы позже использовать их повторно и ускорить работу. Если хочешь, чтобы они своевременно закрывались автоматически, можешь установить этот параметр.
