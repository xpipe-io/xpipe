rdpClientDescription=Программа-клиент RDP, которую нужно запускать при установке соединений RDP.\n\nОбрати внимание, что разные клиенты имеют разные возможности и уровень интеграции. Некоторые клиенты не поддерживают автоматическую передачу паролей, поэтому тебе всё равно придётся вводить их при запуске.
