windowOpacityDescription=Изменяет прозрачность окна, чтобы было видно, что происходит в фоновом режиме.
useSystemFont=Используй системный шрифт
openDataDir=Каталог данных хранилища
openDataDirButton=Открытый каталог данных
openDataDirDescription=Если хочешь синхронизировать дополнительные файлы, например SSH-ключи, между системами вместе с репозиторием Git, можешь поместить их в каталог хранения данных. Пути к файлам, указанным в этом каталоге, будут автоматически адаптированы на любой синхронизированной системе.
