macOsKeychain=брелок macOS
customLibrary=Пользовательская библиотека
unsyncedIdentityTitle=Несинхронизированная идентичность
unsyncedIdentityContent=Это соединение помечено для синхронизации между несколькими системами, но выбранный тобой идентификатор доступен только локально. Это приведёт к отсутствию идентификатора на других системах.\n\nТы можешь либо преобразовать этот локальный идентификатор в синхронизируемый, либо преобразовать его в мульти-идентификатор, чтобы переключаться между несколькими локальными идентификаторами на каждой синхронизированной системе.
rdpDock=Закрепить окно
rdpDockDescription=Если эта опция включена, любое открытое окно RDP будет прикреплено к встроенному окну удалённого рабочего стола с вкладками.
