useExternalNetcatForProxies=Используй внешне установленный исполняемый файл netcat для прокси-серверов
useExternalNetcatForProxiesDescription=Если возможно, используй локально установленный исполняемый файл netcat для проксирования SSH-соединений вместо встроенной функции прокси. Для этого нужно установить ncat в Windows и nc в других операционных системах.
