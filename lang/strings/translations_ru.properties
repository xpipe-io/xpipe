eulaDescription=Прочитай Лицензионное соглашение с конечным пользователем для приложения XPipe
thirdPartyDescription=Посмотреть лицензии с открытым исходным кодом сторонних библиотек
enableGitStorage=Включить синхронизацию
#custom
gitSync=Синхронизация git
enableGitStorageDescription=Если эта функция включена, XPipe создаст репозиторий Git для локального хранилища и будет фиксировать в нём все изменения. Имей в виду, что для этого нужно установить Git, и это может замедлить загрузку и сохранение данных.\n\nВсе категории, которые нужно синхронизировать, нужно явно пометить как синхронизируемые.
storageGitRemote=URL для удалённой синхронизации
storageGitRemoteDescription=Если этот параметр включен, XPipe будет автоматически загружать все изменения при запуске и отправлять их в удалённый репозиторий при сохранении.\n\nЭто позволяет тебе использовать один хранилище для нескольких установок XPipe. Поддерживаются URL-адреса по протоколам HTTP и SSH, а также локальные каталоги.
vault=Хранилище
vaultAccess=Доступ к хранилищу
workspaceLockDescription=Позволяет установить собственный пароль для шифрования любой конфиденциальной информации, хранящейся в XPipe.\n\nЭто повышает уровень безопасности, так как обеспечивает дополнительный уровень шифрования твоей конфиденциальной информации. После этого при запуске XPipe тебе будет предложено ввести пароль.
useSystemFontDescription=Определяет, использовать ли системный шрифт по умолчанию или шрифт Inter, который входит в состав XPipe.
