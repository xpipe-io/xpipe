dontAutomaticallyStartVmSshServer=Не запускать SSH-сервер для виртуальных машин автоматически, когда это нужно
dontAutomaticallyStartVmSshServerDescription=Любое подключение через оболочку к виртуальной машине, работающей в гипервизоре, осуществляется через SSH. XPipe может автоматически запускать установленный SSH-сервер, когда это нужно. Если ты не хочешь этого по соображениям безопасности, просто отключи эту функцию с помощью этого параметра.
#custom
confirmGitShareTitle=Синхронизация git
confirmGitShareContent=Хочешь добавить выбранный файл в свой репозиторий Git Vault? При этом зашифрованная версия файла будет скопирована в твой Git Vault, а изменения — зафиксированы. После этого у тебя будет доступ к этому файлу на всех синхронизированных компьютерах.
gitShareFileTooltip=Добавь файл в каталог данных git vault, чтобы он синхронизировался автоматически.\n\nЭто действие можно использовать только в том случае, если git vault включен в настройках.
performanceMode=Режим работы
performanceModeDescription=Отключает все визуальные эффекты, которые не нужны, чтобы повысить производительность приложения.
dontAcceptNewHostKeys=Не принимать новые ключи хоста SSH автоматически
dontAcceptNewHostKeysDescription=По умолчанию XPipe автоматически принимает ключи хостов из систем, для которых в твоём SSH-клиенте ещё не сохранены известные ключи. Однако, если какой-либо из известных ключей хоста изменился, программа откажется подключаться, пока ты не примешь новый ключ.\n\nОтключение этой функции позволяет проверять все ключи хостов, даже если изначально конфликта нет.
#custom
uiScale=Шкала масштаба пользовательского интерфейса
uiScaleDescription=Пользовательское значение масштабирования, которое можно настроить независимо от общесистемного масштаба экрана. Значения указываются в процентах, так что, например, значение 150 приведёт к масштабированию интерфейса на 150%.
editorProgram=Программа-редактор
editorProgramDescription=Текстовый редактор по умолчанию, который используется при редактировании любых текстовых данных.
