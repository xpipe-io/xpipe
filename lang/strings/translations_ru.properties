passwordManagerCommandDescription=Пользовательская команда, которую нужно запустить для получения паролей. При вызове этой команды заметка $KEY будет заменена ключом пароля, заключённым в кавычки. Эта команда должна запустить твой менеджер паролей из командной строки, чтобы вывести исходный пароль или учетные данные в формате JSON в стандартный вывод.
