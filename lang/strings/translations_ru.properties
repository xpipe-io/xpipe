requireDoubleClickForConnections=Требуется двойной щелчок для установки соединений
requireDoubleClickForConnectionsDescription=Если эта опция включена, тебе нужно дважды щелкнуть по соединениям, чтобы запустить их. Это удобно, если ты привык дважды щелкать по объектам.
