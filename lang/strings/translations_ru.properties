userDeletionContent=Хочешь удалить этого пользователя хранилища? При этом все данные будут заново зашифрованы с использованием ключа хранилища по умолчанию. Это займет некоторое время.
roleDeletionTitle=Удаление роли
roleDeletionContent=Хочешь удалить эту роль хранилища? Это приведёт к повторному шифрованию всех идентификаторов, доступных только для этой роли, и секретов подключения, а также может сделать недоступными некоторые записи, которые всё ещё используют эту роль. Это займёт некоторое время.
