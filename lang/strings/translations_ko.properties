backgroundSessionInactivityTimeout=셸 비활성 타임아웃 배경
backgroundSessionInactivityTimeoutDescription=사용되지 않은 백그라운드 셸 세션을 종료하는 데 걸리는 시간(초).\n\n기본적으로 XPipe는 나중에 재사용하고 작업 속도를 높이기 위해 원격 시스템과의 셸 연결을 백그라운드에서 열어 둡니다. 이러한 연결을 적시에 자동으로 종료하려면 이 옵션을 설정할 수 있습니다.
