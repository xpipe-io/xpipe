categoryConfirmAllModificationsDescription=연결이나 파일 시스템에 대한 모든 종류의 변경 사항을 먼저 확인하십시오. 이를 통해 중요한 시스템에서 실수로 인한 작업이 발생하는 것을 방지할 수 있습니다.
