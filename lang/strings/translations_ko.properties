passwordManagerMappingDescription=JSON 데이터는 모든 키-값 항목을 저장할 수 있으므로, XPipe가 사용자 이름, 비밀번호, SSH 키와 같은 개별 항목을 찾을 수 있도록 키-값 매핑을 정의해야 합니다. 필요한 경우 개별 신원 정보별로 기본 매핑을 재정의할 수 있습니다.
passwordManagerCommand=사용자 정의 명령어
passwordManagerCommandDescription=비밀번호를 가져오기 위해 실행할 사용자 정의 명령어. 호출 시 자리 표시자 문자열 $KEY는 따옴표로 묶인 비밀번호 키로 대체됩니다. 이 명령어는 비밀번호 관리자 CLI를 호출하여 원본 비밀번호나 자격 증명을 JSON 형식으로 표준 출력(stdout)에 출력해야 합니다.
chooseTemplate=템플릿 선택
keePassXcPlaceholder=KeePassXC 항목 URL
terminalEnvironment=터미널 환경
terminalEnvironmentDescription=터미널 사용자 지정을 위해 로컬 Linux 기반 WSL 환경의 기능을 사용하고자 하는 경우, 이를 터미널 환경으로 설정할 수 있습니다.\n\n이 경우 사용자 정의 터미널 초기화 명령어 및 터미널 멀티플렉서 구성은 모두 이 WSL 배포판에서 실행됩니다.
terminalInitScript=터미널 초기화 스크립트
terminalInitScriptDescription=연결이 시작되기 전에 터미널 환경에서 실행할 명령어입니다. 이를 사용하여 시작 시 터미널 환경을 구성할 수 있습니다.
terminalMultiplexer=터미널 멀티플렉서
terminalMultiplexerDescription=터미널의 탭 기능을 대체하기 위해 사용하는 터미널 멀티플렉서입니다. 이 기능은 탭 처리와 같은 특정 터미널 처리 특성을 멀티플렉서 기능으로 대체합니다.\n\n시스템에 해당 멀티플렉서 실행 파일이 설치되어 있어야 합니다.
terminalMultiplexerWindowsDescription=터미널의 탭 기능을 대체하여 사용할 수 있는 터미널 멀티플렉서입니다. 이 기능은 탭 처리와 같은 특정 터미널 처리 특성을 멀티플렉서 기능으로 대체합니다.\n\nWindows에서 WSL 터미널 환경을 사용해야 하며, WSL 시스템에 멀티플렉서 실행 파일이 설치되어 있어야 합니다.
terminalAlwaysPauseOnExit=종료 시 항상 일시 정지
terminalAlwaysPauseOnExitDescription=이 기능이 활성화되어 있으면, 터미널 세션을 종료할 때마다 세션을 다시 시작할지 아니면 종료할지 묻는 메시지가 항상 표시됩니다. 비활성화된 경우, XPipe는 오류로 인해 종료되는 연결 실패 시에만 해당 메시지를 표시합니다.
querying=쿼리 실행 중...
queryFailed=쿼리 결과, 유용한 비밀 정보는 발견되지 않았습니다
