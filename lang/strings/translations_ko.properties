confirmGitShareTitle=Git 동기화
confirmGitShareContent=선택한 파일을 Git Vault 저장소에 추가하시겠습니까? 이렇게 하면 파일의 암호화된 버전이 Git Vault에 복사되고 변경 사항이 커밋됩니다. 그러면 동기화된 모든 데스크톱에서 해당 파일에 액세스할 수 있게 됩니다.
gitShareFileTooltip=파일을 git vault 데이터 디렉터리에 추가하면 자동으로 동기화됩니다.\n\n이 작업은 설정에서 git vault가 활성화된 경우에만 사용할 수 있습니다.
