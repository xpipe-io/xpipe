downloadDialogContent=파일이 사용자의 로컬 컴퓨터에 다운로드되었습니다. 이제 왼쪽 하단의 다운로드 상자에서 파일을 드래그 앤 드롭하여 사용자의 기본 데스크톱 환경 및 애플리케이션으로 옮길 수 있습니다.
syncInProgressTitle=동기화 진행 중
syncInProgressContent=현재 변경 사항이 저장 및 동기화되고 있습니다. 작업이 완료되면 원격 서버에서도 변경 사항을 확인할 수 있습니다.
