browseCertificateStoreDescription=.pem 형식의 승인된 사용자 지정 TLS 인증서를 관리하려면 인증서 저장소 디렉터리를 엽니다. 인증서는 필요할 때 자동으로 추가되고 사용자의 확인을 거치므로, 이곳에서 수동으로 인증서를 추가할 필요는 없습니다.
