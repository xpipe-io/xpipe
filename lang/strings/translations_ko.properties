copyId=API ID 복사
requireDoubleClickForConnections=연결 시 더블 클릭 필요
requireDoubleClickForConnectionsDescription=이 기능이 활성화되어 있으면, 연결을 실행하려면 해당 연결을 두 번 클릭해야 합니다. 이 기능은 항목을 두 번 클릭하는 데 익숙한 사용자에게 유용합니다.
