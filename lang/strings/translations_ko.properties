addWorkspaceDescription=새 작업 공간 생성 대화 상자 열기
workspaceManagement=작업 공간 관리
workspaceManagementDescription=작업 공간은 XPipe를 실행하기 위한 개별적인 구성입니다. 각 작업 공간에는 모든 데이터가 로컬에 저장되는 데이터 디렉터리가 있습니다. 여기에는 연결 데이터, 설정 등이 포함됩니다.\n\n동기화 기능을 사용하는 경우, 각 작업 공간을 서로 다른 Git 저장소와 동기화하도록 선택할 수도 있습니다.
workspaceName=작업 공간 이름
workspaceNameDescription=작업 공간의 표시 이름
workspacePath=작업 공간 경로
workspacePathDescription=작업 공간 데이터 디렉터리의 위치
workspaceCreationAlertTitle=작업 공간 생성
developerForceSshTty=SSH TTY 강제 설정
developerForceSshTtyDescription=모든 SSH 연결에서 pty를 할당하도록 하여, stderr이 누락되었을 때와 pty에 대한 지원 여부를 테스트합니다.
developerDisableSshTunnelGateways=SSH 게이트웨이 터널링 비활성화
developerDisableSshTunnelGatewaysDescription=게이트웨이에는 터널 세션을 사용하지 말고, 대신 시스템에 직접 연결하십시오.
ttyWarning=이 연결은 pty/tty를 강제 할당했으며 별도의 stderr 스트림을 제공하지 않습니다.\n\n이로 인해 몇 가지 문제가 발생할 수 있습니다.\n\n가능하다면, 연결 명령어가 pty를 할당하지 않도록 설정하는 방법을 검토해 보십시오.
xshellSetup=Xshell 설정
termiusSetup=Termius 설정
tryPtbDescription=XPipe 개발자 빌드에서 새로운 기능을 미리 체험해 보세요
#custom
confirmVaultUnencryptTitle=저장소 암호화 해제 확인
#custom
confirmVaultUnencryptContent=정말 고급 저장소 암호화를 비활성화하시겠습니까? 이렇게 하면 저장된 데이터에 대한 추가 암호화가 제거되고 기존 데이터를 덮어쓰게 됩니다.
enableHttpApi=HTTP API 활성화
enableHttpApiDescription=이 API를 활성화하여 외부 프로그램이 XPipe 데몬을 호출하여 관리되는 연결에 대한 작업을 수행할 수 있도록 합니다.
chooseCustomIcon=사용자 지정 아이콘 선택
