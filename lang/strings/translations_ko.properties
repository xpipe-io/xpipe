gitPasswordDescription=인증에 사용할 비밀번호 또는 개인 액세스 토큰. 비밀번호가 필요한지, 개인 액세스 토큰이 필요한지는 Git 원격 제공자에 따라 다릅니다. 이 설정은 로컬 Git CLI 클라이언트에 이미 구성된 기본 자격 증명을 재정의합니다.
