clipboardNoticeTitle=비밀번호가 복사되었습니다
clipboardNoticeContent=대상 애플리케이션이 비밀번호를 직접 전달하는 기능을 지원하지 않으므로, 비밀번호가 클립보드에 저장되어 붙여넣을 수 있도록 되어 있습니다. 향후에는 이 과정이 자동으로 처리될 예정입니다. 화면 오른쪽 하단에서 이에 대한 클립보드 표시기를 확인할 수 있습니다.
sftpNoticeTitle=대용량 파일 전송
sftpNoticeContent=전송하려는 파일의 용량이 상당히 큽니다. 현재 세션은 원시 SSH를 기반으로 하고 있어, 최적의 전송 속도를 보장하지 않습니다. 전송 속도를 높여야 한다면, 파일 탐색기의 마우스 오른쪽 버튼 메뉴에서 해당 시스템에 대한 SFTP 세션을 여는 방법을 확인해 보시기 바랍니다.
hideVaultEntryNames=Git Vault 항목 이름 숨기기
hideVaultEntryNamesDescription=git sync가 활성화된 경우, 모든 README 파일 및 커밋 메시지에서 연결 이름 및 기타 정보를 모두 제거합니다. 이 옵션을 사용하면 암호화된 볼트 내용의 구조를 파악할 수 없게 됩니다.
disableHardwareAcceleration=하드웨어 가속 비활성화
disableHardwareAccelerationDescription=렌더링 시 그래픽 카드 사용을 비활성화하고 소프트웨어 렌더링 파이프라인만 사용합니다.\n\n이로 인해 성능이 크게 저하되지만, 그래픽 카드 드라이버에 문제가 있는 경우 렌더링을 수행할 수 있는 유일한 방법일 수 있습니다.
disableRdpWindowsSecurityWarning=RDP 보안 경고 비활성화
disableRdpWindowsSecurityWarningDescription=새 세션을 시작할 때마다 서명되지 않은 .rdp 파일에 대한 새로운 Windows 경고가 표시되지 않도록 합니다.\n\n이 작업은 레지스트리 키를 변경하여 Windows RDP 클라이언트를 이전 동작으로 되돌립니다. 이 작업을 수행하면 관리자 권한 상승 팝업이 표시됩니다.
rdpWindowsSecurityWarningDialogTitle=RDP 보안 경고
rdpWindowsSecurityWarningDialogContent=Windows 빌드 26200부터, Windows는 내용과 관계없이 서명되지 않은 RDP 파일이 실행될 때마다 항상 경고 메시지를 표시합니다.\n\n설정 메뉴에서 이 경고 메시지를 비활성화할 수 있습니다.
openSettings=설정 열기
openSettingsDescription=해당 설정 항목으로 이동
toggleSizeLock=크기 고정 토글
useExternalNetcatForProxies=프록시용으로 외부에서 설치된 netcat 실행 파일을 사용
useExternalNetcatForProxiesDescription=가능하다면 내장된 프록시 기능 대신 로컬에 설치된 netcat 실행 파일을 사용하여 SSH 연결을 프록시하십시오. 이를 위해서는 Windows의 경우 ncat이, 다른 운영 체제의 경우 nc가 설치되어 있어야 합니다.
