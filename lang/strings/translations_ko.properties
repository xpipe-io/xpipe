gitUsername=사용자 지정 Git 사용자 이름
gitUsernameDescription=Git 원격 저장소에 인증할 사용자 계정. 기본적으로 XPipe는 현재 설정된 Git CLI의 인증 정보를 사용합니다.\n\n이 설정은 로컬 Git CLI 클라이언트에 이미 설정된 기본 인증 정보를 재정의합니다.
