httpProxyDescription=XPipe 및 기타 외부 도구에서 전송하는 모든 종류의 HTTP 요청에 사용할 프록시입니다.\n\n프록시가 TLS 트래픽을 복호화하는 경우, 연결이 수립되면 XPipe 내부 인증서 저장소에 사용자 지정 인증서를 추가하라는 메시지가 표시됩니다. 테스트 버튼을 사용하여 연결 상태를 확인할 수 있습니다.
