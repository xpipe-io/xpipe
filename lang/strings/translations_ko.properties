enableGitStorageDescription=이 기능이 활성화되면 XPipe는 로컬 볼트용 Git 저장소를 초기화하고, 변경 사항을 해당 저장소에 커밋합니다. 이 기능을 사용하려면 Git이 설치되어 있어야 하며, 로딩 및 저장 작업 속도가 느려질 수 있습니다.\n\n동기화해야 할 카테고리는 반드시 '동기화됨'으로 명시적으로 표시해야 합니다.
storageGitRemote=원격 동기화 URL
storageGitRemoteDescription=이 옵션이 설정되면, XPipe는 파일을 불러올 때 변경 사항을 자동으로 가져오고, 저장할 때 변경 사항을 원격 저장소로 푸시합니다.\n\n이를 통해 여러 XPipe 설치 환경에서 볼트를 공유할 수 있습니다. HTTP 및 SSH URL은 물론 로컬 디렉토리도 지원합니다.
#custom
vault=저장소
vaultAccess=볼트 접근
workspaceLockDescription=XPipe에 저장된 모든 민감한 정보를 암호화하기 위해 사용자 지정 비밀번호를 설정합니다.\n\n이를 통해 저장된 민감한 정보에 대한 추가적인 암호화 계층이 제공되므로 보안성이 강화됩니다. 이후 XPipe가 시작될 때 비밀번호 입력을 요청받게 됩니다.
useSystemFontDescription=기본 시스템 글꼴을 사용할지, 아니면 XPipe에 포함된 Inter 글꼴을 사용할지를 설정합니다.
windowOptions=창 옵션
saveWindowLocation=창 위치 저장
saveWindowLocationDescription=창의 좌표가 저장되어 재시작 시 복원될지 여부를 제어합니다.
startupShutdown=시작 / 종료
showChildrenConnectionsInParentCategory=상위 카테고리 내 하위 카테고리 표시
showChildrenConnectionsInParentCategoryDescription=특정 상위 카테고리가 선택되었을 때, 하위 카테고리에 속한 모든 연결을 포함할지 여부를 설정합니다.\n\n이 기능을 비활성화하면, 카테고리는 하위 폴더를 포함하지 않고 직접적인 내용만 표시하는 기존의 폴더와 유사한 방식으로 작동합니다.
condenseConnectionDisplay=연결 표시 축소
condenseConnectionDisplayDescription=연결 목록을 더 간결하게 표시할 수 있도록 모든 최상위 연결이 차지하는 수직 공간을 줄이십시오.
openConnectionSearchWindowOnConnectionCreation=연결 생성 시 연결 검색 창 열기
openConnectionSearchWindowOnConnectionCreationDescription=새로운 셸 연결을 추가할 때 사용 가능한 하위 연결을 검색하는 창을 자동으로 열지 여부를 설정합니다.
system=시스템
application=애플리케이션
storage=저장소
runOnStartup=시작 시 실행
closeBehaviour=종료 시 동작
closeBehaviourDescription=XPipe의 메인 창이 닫힐 때 XPipe가 어떻게 동작해야 하는지를 제어합니다.
language=언어
languageDescription=사용할 표시 언어입니다. 번역 내용은 커뮤니티의 기여를 통해 지속적으로 개선되고 있습니다. GitHub에 번역 수정 사항을 제출하여 번역 작업에 기여할 수 있습니다.
lightTheme=라이트 테마
darkTheme=다크 테마
exit=XPipe 종료
continueInBackground=백그라운드에서 계속 실행
minimizeToTray=트레이로 최소화
closeBehaviourAlertTitle=닫기 동작 설정
closeBehaviourAlertTitleHeader=창을 닫을 때 수행할 작업을 선택하십시오. 응용 프로그램이 종료되면 활성 연결이 모두 종료됩니다.
startupBehaviour=시작 시 동작
startupBehaviourDescription=XPipe가 시작될 때 데스크톱 애플리케이션의 기본 동작을 제어합니다.
clearCachesAlertTitle=캐시 지우기
clearCachesAlertContent=모든 XPipe 캐시를 지우시겠습니까? 이 작업을 수행하면 사용자 경험을 개선하기 위해 저장된 모든 캐시 데이터가 삭제됩니다.
startGui=GUI 시작
startInTray=시스템 트레이에서 시작
startInBackground=백그라운드에서 시작
clearCaches=캐시 지우기 ...
clearCachesDescription=모든 캐시 데이터 삭제
cancel=취소
notAnAbsolutePath=절대 경로가 아님
notADirectory=디렉터리가 아님
notAnEmptyDirectory=비어 있지 않은 디렉터리
automaticallyCheckForUpdates=업데이트 확인
automaticallyCheckForUpdatesDescription=이 기능이 활성화되면, XPipe가 실행 중일 때 일정 시간이 지나면 새로운 릴리스 정보가 자동으로 가져옵니다. 단, 업데이트 설치는 여전히 사용자가 직접 확인해야 합니다.
developerMode=개발자 모드
developerModeDescription=이 기능을 활성화하면 개발에 유용한 다양한 추가 옵션을 사용할 수 있습니다.
editor=편집기
custom=사용자 정의
passwordManager=비밀번호 관리자
externalPasswordManager=외부 비밀번호 관리 도구
passwordManagerDescription=연동할 로컬에 설치된 비밀번호 관리자.\n\n비밀번호 관리자가 설치되어 있다면, XPipe가 직접 비밀 정보를 관리할 필요 없이 해당 관리자에서 비밀 정보를 가져오도록 XPipe를 구성할 수 있습니다.
passwordManagerTest=비밀번호 관리자 테스트
passwordManagerTestDescription=비밀번호 관리자 연동 기능이 정상적으로 작동하는지 확인하십시오. 비밀번호 관리자의 항목을 참조할 때는 올바른 식별자 형식을 사용해야 합니다.
preferTerminalTabs=새 탭을 여는 것을 선호합니다
preferTerminalTabsDescription=XPipe가 새 창 대신 사용자가 선택한 터미널에서 새 탭을 열도록 시도할지 여부를 제어합니다. 모든 터미널이 탭 기능을 지원하는 것은 아닙니다.
customRdpClientCommand=사용자 정의 명령어
customRdpClientCommandDescription=사용자 지정 RDP 클라이언트를 시작하기 위해 실행해야 하는 명령어입니다.\n\n호출 시 자리 표시자 문자열 $FILE은 따옴표로 묶인 절대 .rdp 파일 이름으로 대체됩니다. 실행 파일 경로에 공백이 포함된 경우 따옴표로 묶어야 합니다.
customEditorCommand=사용자 정의 편집기 명령어
customEditorCommandDescription=사용자 정의 편집기를 시작하기 위해 실행해야 하는 명령어.\n\n호출 시 자리 표시자 문자열 $FILE은 따옴표로 묶인 절대 파일 이름으로 대체됩니다. 편집기 실행 파일 경로에 공백이 포함된 경우, 반드시 따옴표로 묶어 주십시오.
encryptAllVaultData=볼트 내 모든 데이터를 암호화합니다
encryptAllVaultDataDescription=이 옵션을 활성화하면, 볼트 연결 데이터 내의 비밀 정보뿐만 아니라 데이터의 모든 부분이 사용자 볼트 암호화 키로 암호화됩니다. 이를 통해 볼트에서 기본적으로 암호화되지 않는 사용자 이름, 호스트 이름 등과 같은 다른 매개변수에 대한 보안 계층이 추가됩니다.\n\n이 옵션을 사용하면 더 이상 원본 변경 내용을 확인할 수 없고 이진 변경 내용만 볼 수 있게 되므로, Git 볼트 기록 및 차이 분석 정보가 무용지물이 됩니다.
#custom
vaultSecurity=저장소 보안
developerDisableUpdateVersionCheck=버전 업데이트 확인 비활성화
developerDisableUpdateVersionCheckDescription=업데이트 검사기가 업데이트를 검색할 때 버전 번호를 무시할지 여부를 제어합니다.
shellCommandTest=셸 명령어 테스트
shellCommandTestDescription=XPipe가 내부적으로 사용하는 셸 세션에서 명령을 실행합니다.
terminal=터미널
terminalType=터미널 에뮬레이터
terminalConfiguration=터미널 설정
terminalCustomization=터미널 사용자 지정
editorConfiguration=편집기 설정
defaultApplication=기본 애플리케이션
initialSetup=초기 설정
terminalTypeDescription=셸 연결을 열 때 사용되는 기본 터미널입니다.\n\n터미널마다 지원하는 기능의 수준이 다르며, 각 터미널은 '권장' 또는 '권장하지 않음'으로 표시됩니다. 권장 터미널을 사용할 때 사용자 경험이 가장 우수합니다.
customTerminalCommand=사용자 정의 터미널 명령어
customTerminalCommandDescription=지정된 명령을 사용하여 사용자 지정 터미널을 열기 위해 실행해야 할 명령입니다.\n\nXPipe는 터미널에서 실행할 임시 런처 셸 스크립트를 생성합니다. 사용자가 지정한 명령 내의 자리 표시자 문자열 $CMD는 호출 시 실제 런처 스크립트로 대체됩니다. 터미널 실행 파일 경로에 공백이 포함된 경우 반드시 따옴표로 묶어 주십시오.
clearTerminalOnInit=초기화 시 터미널 지우기
clearTerminalOnInitDescription=이 기능이 활성화되면, XPipe는 새로운 터미널 세션이 시작될 때마다 'clear' 명령을 실행하여 터미널 세션 시작 과정에서 출력된 불필요한 내용을 제거합니다.
dontCachePasswords=입력 요청된 비밀번호는 캐시에 저장하지 마십시오
dontCachePasswordsDescription=이 설정은 XPipe가 조회된 비밀번호를 내부적으로 캐시하여 현재 세션에서 다시 입력할 필요가 없도록 할지 여부를 제어합니다.\n\n이 기능이 비활성화된 경우, 시스템에서 자격 증명을 요구할 때마다 표시되는 자격 증명을 매번 다시 입력해야 합니다.
denyTempScriptCreation=임시 스크립트 생성을 거부
denyTempScriptCreationDescription=XPipe는 일부 기능을 구현하기 위해, 간단한 명령을 쉽게 실행할 수 있도록 대상 시스템에 임시 셸 스크립트를 생성하기도 합니다. 이러한 스크립트에는 민감한 정보가 포함되어 있지 않으며, 순전히 구현 목적으로만 생성됩니다.\n\n이 동작이 비활성화되면, XPipe는 원격 시스템에 임시 파일을 생성하지 않습니다. 이 옵션은 파일 시스템의 모든 변경 사항이 모니터링되는 고보안 환경에서 유용합니다. 이 옵션이 비활성화되면 셸 환경 및 스크립트와 같은 일부 기능이 의도한 대로 작동하지 않을 수 있습니다.
disableCertutilUse=Windows에서 certutil 사용 비활성화
useLocalFallbackShell=로컬 대체 셸 사용
useLocalFallbackShellDescription=로컬 작업을 처리하기 위해 다른 로컬 셸로 전환합니다. Windows에서는 PowerShell이, 다른 시스템에서는 Bourne 셸이 사용됩니다.\n\n이 옵션은 일반적인 로컬 기본 셸이 비활성화되었거나 어느 정도 오작동하는 경우에 사용할 수 있습니다. 다만 이 옵션을 활성화하면 일부 기능이 예상대로 작동하지 않을 수 있습니다.
disableCertutilUseDescription=cmd.exe에는 몇 가지 단점과 버그가 있어, cmd.exe는 비-ASCII 입력을 처리하지 못하므로 base64 입력값을 해독하는 데 certutil을 사용하여 임시 셸 스크립트를 생성합니다. XPipe는 이를 위해 PowerShell을 사용할 수도 있지만, 이 경우 처리 속도가 더 느려집니다.\n\n이 설정은 Windows 시스템에서 특정 기능을 구현하기 위해 certutil을 사용하는 것을 비활성화하고, 대신 PowerShell로 대체합니다. 일부 안티바이러스 프로그램은 certutil 사용을 차단하므로, 이 설정이 해당 프로그램의 호환성을 높이는 데 도움이 될 수 있습니다.
