gitVault=Git 저장소
fileBrowser=파일 탐색기
confirmAllDeletions=모든 삭제를 확인하십시오
confirmAllDeletionsDescription=모든 삭제 작업에 대해 확인 대화 상자를 표시할지 여부입니다. 기본적으로 디렉터리 삭제 시에만 확인이 필요합니다.
yesterday=어제
green=녹색
yellow=노란색
blue=파란색
red=빨강
cyan=시안
purple=보라색
asktextAlertTitle=프롬프트
fileWriteSudoTitle=Sudo 파일 쓰기
fileWriteSudoContent=쓰려고 하는 파일에 대해 현재 사용자에게는 쓰기 권한이 없습니다. sudo를 사용하여 루트 권한으로 이 파일에 쓰기를 진행하시겠습니까? 이 경우 기존 자격 증명을 사용하거나 프롬프트를 통해 자동으로 루트 권한으로 전환됩니다.
dontAllowTerminalRestart=터미널 재시작을 허용하지 않음
dontAllowTerminalRestartDescription=기본적으로 터미널 세션은 터미널 내에서 종료된 후에도 다시 시작할 수 있습니다. 이를 허용하기 위해 XPipe는 터미널에서 전송된 세션을 다시 시작하라는 외부 요청을 수락합니다.\n\nXPipe는 터미널이나 이 호출이 어디서 오는지에 대해 어떠한 제어권도 가지고 있지 않으므로, 악의적인 로컬 애플리케이션도 이 기능을 이용하여 XPipe를 통해 연결을 시작할 수 있습니다. 이 기능을 비활성화하면 이러한 상황을 방지할 수 있습니다.
openDocumentation=문서 열기
openDocumentationDescription=이 문제와 관련하여 XPipe 문서 페이지를 방문해 주세요
renameAll=모두 이름 변경
logging=로깅
enableTerminalLogging=터미널 로깅 활성화
enableTerminalLoggingDescription=모든 터미널 세션에 대해 클라이언트 측 로깅을 활성화합니다. 터미널 세션의 모든 입출력 내용은 세션 로그 파일에 기록됩니다. 단, 비밀번호 입력 요청과 같은 민감한 정보는 기록되지 않습니다.
terminalLoggingDirectory=터미널 세션 로그
terminalLoggingDirectoryDescription=모든 로그 파일은 로컬 시스템의 XPipe 데이터 디렉터리에 저장됩니다.
openSessionLogs=세션 로그 열기
sessionLogging=터미널 로깅
sessionActive=이 연결에 대해 백그라운드 세션이 실행 중입니다.\n\n이 세션을 수동으로 중지하려면 상태 표시기를 클릭하십시오.
skipValidation=검증 건너뛰기
scriptsIntroHeader=스크립트에 대하여
scriptsIntroContent=셸 초기화 시, 파일 브라우저에서, 또는 필요에 따라 스크립트를 실행할 수 있습니다. XPipe 내에서 직접 스크립트를 작성하거나, 로컬 시스템 또는 원격 Git 저장소에서 기존 스크립트를 가져올 수 있습니다.
scriptsIntroBottomHeader=스크립트 사용
scriptsIntroBottomContent=시작할 수 있는 다양한 샘플 스크립트가 있습니다. 개별 스크립트의 편집 버튼을 클릭하면 해당 스크립트가 어떻게 구현되었는지 확인할 수 있습니다. 스크립트를 실행하거나 메뉴에 표시하려면 먼저 활성화해야 하며, 이를 위한 토글 버튼이 각 스크립트에 마련되어 있습니다.
scriptsIntroBottomButton=시작하기
scriptSourcesIntroHeader=스크립트 소스
scriptSourcesIntroContent=사용자 정의 스크립트 소스를 추가하여 셸 스크립트 전체 모음에 즉시 액세스할 수 있습니다. 로컬 소스와 원격 Git 저장소 모두 소스로 지원됩니다. 소스에서 감지된 모든 스크립트는 자동으로 사용할 수 있게 됩니다.
scriptSourcesIntroButton=소스 추가...
checkForSecurityUpdates=보안 업데이트 확인
checkForSecurityUpdatesDescription=XPipe는 일반 기능 업데이트와 별도로 잠재적인 보안 업데이트를 확인할 수 있습니다. 이 기능이 활성화되면, 일반 업데이트 확인이 비활성화된 경우에도 최소한 중요한 보안 업데이트에 대해서는 설치가 권장됩니다.\n\n이 설정을 비활성화하면 외부 버전 확인이 수행되지 않으며, 보안 업데이트에 대한 알림도 받지 않게 됩니다.
clickToDock=터미널을 도킹하려면 클릭하세요
terminalStarting=터미널 시작을 기다리고 있습니다...
pinTab=핀 탭
unpinTab=탭 고정 해제
pinned=고정됨
enableConnectionHubTerminalDocking=터미널 창을 연결 허브에 도킹
enableConnectionHubTerminalDockingDescription=연결 허브에서 터미널 창을 XPipe 애플리케이션 창에 도킹하여 어느 정도 통합된 터미널 환경을 시뮬레이션할 수 있습니다. 이렇게 도킹된 터미널 창은 XPipe에 의해 관리되어 항상 도킹 영역에 맞게 조정됩니다.
enableFileBrowserTerminalDocking=파일 브라우저 터미널 도킹 활성화
enableFileBrowserTerminalDockingDescription=파일 브라우저에서 터미널 창을 XPipe 애플리케이션 창에 도킹하여 어느 정도 통합된 터미널 환경을 시뮬레이션할 수 있습니다. 이렇게 도킹된 터미널 창은 XPipe에 의해 관리되어 항상 도킹 영역에 맞게 조정됩니다.
downloadsDirectory=사용자 지정 다운로드 디렉터리
downloadsDirectoryDescription='다운로드 폴더로 이동' 버튼을 클릭했을 때 다운로드된 파일을 저장할 사용자 지정 디렉터리입니다. 기본적으로 XPipe는 사용자의 다운로드 디렉터리를 사용합니다.
pinLocalMachineOnStartup=시작 시 ‘로컬 컴퓨터’ 탭 고정
pinLocalMachineOnStartupDescription=로컬 컴퓨터 탭을 자동으로 열고 고정합니다. 이 기능은 로컬 컴퓨터와 원격 파일 시스템을 동시에 열어둔 상태로 파일 탐색기를 분할하여 자주 사용하는 경우에 유용합니다.
terminalErrorDescription=이 오류는 치명적이며, 이를 해결하지 않으면 XPipe를 계속 실행할 수 없습니다.
groupName=그룹 이름
chmodPermissions=새로운 권한
editFilesWithDoubleClick=더블 클릭으로 파일 편집
editFilesWithDoubleClickDescription=이 기능이 활성화되면 파일을 더블클릭하면 컨텍스트 메뉴가 표시되지 않고 바로 텍스트 편집기에서 파일이 열립니다.
censorMode=검열 모드
censorModeDescription=호스트 이름, 사용자 이름, 연결 이름 등의 정보를 모자이크 처리합니다.\n\nXPipe의 스크린샷을 찍거나 화면을 공유할 때 정보 유출을 방지하고자 할 때 유용합니다.
addIdentity=신원 ...
identities=식별자
addMacro=작업 ...
identitiesIntroHeader=신원에 관하여
identitiesIntroContent=사용자 이름, 비밀번호, 키의 일반적인 조합을 재사용하는 경우, 재사용 가능한 신원을 생성하는 것이 합리적일 수 있습니다. 이렇게 하면 새 연결을 추가할 때 해당 신원을 빠르게 참조할 수 있습니다.
identitiesIntroBottomHeader=신원 공유
identitiesIntroBottomContent=신원 정보를 로컬에 추가하거나, 해당 기능이 활성화된 경우 Git 저장소와도 동기화할 수 있습니다. 이를 통해 여러 시스템 간 및 다른 팀원들과 신원 정보를 선택적으로 공유할 수 있습니다.
identitiesIntroBottomButton=설정 동기화
identitiesIntroButton=ID 생성
userName=사용자 이름
vaultAuth=기본 금고 암호화
userAuth=개인 사용자 암호문구
roleAuth=역할 기반 접근 제어
team=팀
teamSettings=팀 설정
#custom
teamVaults=팀 저장소
#custom
vaultTypeNameDefault=기본 저장소
#custom
vaultTypeNamePersonal=개인 저장소
#custom
vaultTypeNameTeam=팀 저장소
teamVaultsDescription=팀 볼트를 사용하면 여러 사용자와 역할이 공유 볼트에 안전하게 액세스할 수 있습니다. 연결 및 신원 정보를 모든 사용자와 공유하도록 설정하거나, 각 사용자와 역할에 고유한 키로 암호화하여 개별 사용자와 역할만 사용할 수 있도록 구성할 수 있습니다. 다른 볼트 사용자는 해당 키에 대한 접근 권한이 없는 경우, 개인 및 역할 기반 연결 및 신원 정보에 접근할 수 없습니다.
vaultTypeContentDefault=현재 사용자 및 사용자 지정 암호가 설정되지 않은 기본 볼트를 사용하고 있습니다. 비밀 정보는 로컬 볼트 키로 암호화됩니다.\n\n볼트 사용자 계정을 생성하여 개인 볼트로 업그레이드할 수 있습니다. 이렇게 하면 볼트 비밀 정보를 본인만의 개인 암호로 암호화할 수 있으며, 볼트 잠금을 해제하려면 매번 로그인할 때마다 이 암호를 입력해야 합니다.
#custom
vaultTypeContentPersonal=현재 사용자를 위해 개인 저장소를 사용하고 있습니다. 비밀은 개인 비밀번호로 암호화되어 있습니다. 볼트 사용자를 추가하여 팀 볼트로 업그레이드할 수 있습니다.
vaultTypeContentTeam=현재 팀 볼트를 사용하고 있으며, 이를 통해 여러 사용자가 공유 볼트에 안전하게 액세스할 수 있습니다. 연결 및 신원 정보를 개인 키나 역할 키로 암호화하여 모든 사용자와 공유하거나, 본인이나 특정 역할의 사용자만 사용할 수 있도록 구성할 수 있습니다. 다른 볼트 사용자는 해당 키에 대한 접근 권한이 없는 경우, 귀하의 개인 및 역할 기반 연결 및 신원에 접근할 수 없습니다.
roleManagement=역할 관리
roleManagementEmpty=역할 관리
roleManagementDescription=기존 볼트 역할을 관리하거나 새로운 역할을 생성할 수 있습니다. 각 볼트 역할에는 고유한 비밀 키가 있으며, 이 키는 해당 역할에만 허용되고 다른 역할에는 허용되지 않아야 하는 연결 및 신원을 암호화하는 데 사용됩니다.
roleManagementEmptyDescription=기존 볼트 역할을 관리하거나 새로운 역할을 생성할 수 있습니다. 각 볼트 역할에는 고유한 비밀 키가 있으며, 이 키는 해당 역할에만 제공되어야 하고 다른 역할에는 제공되어서는 안 되는 연결 및 신원을 암호화하는 데 사용됩니다.\n\n프로페셔널 플랜에서는 팀을 위한 역할 기반 계정이 지원됩니다.
userManagement=사용자 관리
userManagementEmpty=사용자 관리
userManagementDescription=기존 볼트 사용자를 관리하거나 새 사용자를 생성하세요. 볼트 사용자는 연결 및 신원을 암호화하는 데 사용되는 고유한 암호를 가지고 있습니다.
userManagementEmptyDescription=기존 볼트 사용자를 관리하거나 새 사용자를 생성하세요. 볼트 사용자는 연결 및 신원을 암호화하는 데 사용되는 고유한 암호를 가지고 있습니다. 개인 키로 연결 및 신원을 암호화할 수 있도록 본인 명의의 사용자를 생성하세요.
userIntroHeader=사용자 관리
userIntroContent=시작하려면 본인 명의의 첫 번째 사용자 계정을 생성하세요. 이렇게 하면 이 작업 공간을 비밀번호로 잠글 수 있습니다.
addReusableIdentity=재사용 가능한 ID 추가
users=사용자
syncVault=볼트 동기화
syncVaultDescription=여러 시스템 간에 볼트를 동기화하려면, 이 볼트에 대한 Git 동기화 기능을 활성화하십시오.
enableGitSync=Git 동기화 활성화
browseVault=볼트 데이터
browseVaultDescription=사용자 본연의 파일 관리자를 통해 볼트 디렉터리를 직접 확인해 볼 수 있습니다. 단, 외부에서 파일을 수정하는 것은 권장되지 않으며, 다양한 문제를 일으킬 수 있다는 점에 유의하십시오.
browseVaultButton=볼트 둘러보기
vaultUsers=Vault 사용자
createHeapDump=힙 덤프 생성
createHeapDumpDescription=메모리 사용량 문제를 해결하기 위해 메모리 내용을 파일에 덤프하기
initializingApp=연결 불러오기
checkingLicense=라이선스 확인
