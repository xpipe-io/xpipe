gpgSyncDialogTitle=GPG와의 동기화
gpgSyncDialogContent=git에 대해 GPG 서명이 활성화되어 있습니다. 이로 인해 동기화 작업 속도가 느려지므로, 변경 사항이 많을 경우 동기화하는 데 평소보다 시간이 조금 더 걸릴 수 있습니다.
