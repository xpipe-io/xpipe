categoryDontAllowScriptsDescription=변경을 방지하기 위해 이 범주에 속한 시스템에서 명령어 실행 및 기타 작업을 모두 비활성화하십시오. 이렇게 하면 모든 스크립트 기능, 셸 환경 명령어, 프롬프트 등이 비활성화됩니다.
