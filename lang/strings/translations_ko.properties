hashicorpVaultMapping=기본 키 매핑
hashicorpVaultMappingDescription=볼트는 기본적으로 임의의 암호화된 데이터를 키-값 항목으로 저장할 수 있으므로, XPipe가 사용자 이름, 비밀번호, SSH 키와 같은 개별 항목을 찾을 수 있도록 키에 대한 매핑을 정의해야 합니다. 필요한 경우 개별 신원 정보별로 기본 매핑을 재정의할 수 있습니다.
