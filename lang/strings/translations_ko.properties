unsyncedIdentityTitle=동기화되지 않은 ID
unsyncedIdentityContent=이 연결은 여러 시스템 간에 동기화되도록 설정되어 있지만, 선택한 ID는 로컬 전용입니다. 이로 인해 다른 시스템에서는 해당 ID가 누락될 수 있습니다.\n\n이 로컬 ID를 동기화된 ID로 변환하거나, 각 동기화된 시스템에서 여러 로컬 ID 간에 전환할 수 있도록 다중 ID로 변환할 수 있습니다.
