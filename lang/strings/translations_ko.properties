apiKeyDescription=XPipe 데몬 API 요청을 인증하는 데 사용되는 API 키입니다. 인증 방법에 대한 자세한 내용은 일반 API 문서를 참조하십시오.
disableApiAuthentication=API 인증 비활성화
disableApiAuthenticationDescription=모든 필수 인증 방법을 비활성화하여 인증되지 않은 요청도 처리되도록 합니다.\n\n인증 비활성화는 개발 목적으로만 사용해야 합니다.
api=API
storeIntroImportContent=다른 시스템에서 이미 XPipe를 사용하고 계신가요? 원격 Git 저장소를 통해 여러 시스템에 걸쳐 기존 연결 정보를 동기화할 수 있습니다. 아직 설정이 완료되지 않았다면 나중에 언제든지 동기화할 수도 있습니다.
storeIntroImportButton=연결 동기화...
