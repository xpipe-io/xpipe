terminalPromptConfig=설정 파일
terminalPromptConfigDescription=프롬프트에 적용할 사용자 정의 구성 파일입니다. 이 구성 파일은 터미널이 초기화될 때 대상 시스템에 자동으로 설정되며, 기본 프롬프트 구성으로 사용됩니다.\n\n각 시스템의 기존 기본 구성 파일을 사용하려면 이 필드를 비워 두면 됩니다.
