all=전체
terminalPrompt=터미널 프롬프트
terminalPromptDescription=원격 터미널에서 사용할 터미널 프롬프트 도구입니다. 터미널 프롬프트를 활성화하면 터미널 세션을 열 때 대상 시스템에서 프롬프트 도구가 자동으로 설정 및 구성됩니다.\n\n이 기능은 시스템에 존재하는 기존 프롬프트 설정이나 프로필 파일을 변경하지 않습니다. 원격 시스템에서 프롬프트가 설정되는 동안 처음 터미널을 로드하는 데 시간이 다소 더 소요될 수 있습니다. 프롬프트를 올바르게 표시하려면 터미널에 추가 글꼴이 필요할 수 있습니다.
